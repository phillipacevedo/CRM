  // Source clients from matters via the shared helper — same universe as the
  // time-entry picker, so the two lists can't drift.
  const [trust, matters] = await Promise.all([
    api('/api/trust').catch(() => ({ entries: [], balances: [] })),
    api('/api/matters?status=active').catch(() => []),
  ]);
  if (isStaleRender(v)) return;
  const clients = clientsFromMattersList(matters).map(c => ({ id: c.id, full_name: c.name }));
  const actions = $('#topbar-actions');
  actions.innerHTML = '';
  actions.appendChild(el('button', { class: 'btn btn-primary btn-sm', onclick: () => openTrustForm(clients) }, '+ Trust transaction'));

  state.viewState.trust ||= { search: '', balSort: 'balance', balDir: 'desc', txSort: 'date', txDir: 'desc' };
  const tv = state.viewState.trust;

  const balances = trust.balances || [];
  const entries  = trust.entries  || [];
  const totalBal = balances.reduce((s, b) => s + Number(b.balance || 0), 0);

  mount.innerHTML = '';
  mount.appendChild(el('div', { class: 'grid grid-3 mb-16' }, [
    el('div', { class: 'stat-card' }, [ el('div', { class: 'stat-label' }, 'Total trust balance'), el('div', { class: 'stat-value' }, fmt.money(totalBal)) ]),
    el('div', { class: 'stat-card' }, [ el('div', { class: 'stat-label' }, 'Clients with funds'), el('div', { class: 'stat-value' }, String(balances.filter(b => b.balance > 0).length)) ]),
    el('div', { class: 'stat-card' }, [ el('div', { class: 'stat-label' }, 'Transactions'), el('div', { class: 'stat-value' }, String(entries.length)) ]),
  ]));

  // Combobox: typing filters the dropdown of client names, Tab fills the top match,
  // Arrow keys navigate, Enter selects (filters only), clicking an item both
  // filters the view and opens the full client detail modal.
  // Clients come from active matters (aligned with the time-entry picker).
  const clientOpts = clientsFromMattersList(matters);
  let dropdownIdx = -1;

  const searchInput = el('input', {
    type: 'text',
    role: 'combobox',
    autocomplete: 'off',
    spellcheck: 'false',
    placeholder: 'Search client, reference, kind, notes…',
    value: tv.search,
    style: 'width:100%;padding:8px 32px 8px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:14px',
  });
  const clearBtn = el('button', {
    type: 'button',
    title: 'Clear search',
    'aria-label': 'Clear search',
    style: 'position:absolute;top:50%;right:8px;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--gray-bg);color:var(--text-muted);font-size:14px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0',
    onmousedown: (e) => { e.preventDefault(); },
    onclick: () => { tv.search = ''; searchInput.value = ''; dropdownIdx = -1; dropdown.style.display = 'none'; updateRightAffix(); renderBody(); searchInput.focus(); },
  }, '×');
  const caretBtn = el('button', {
    type: 'button',
    title: 'Show clients',
    'aria-label': 'Show clients',
    style: 'position:absolute;top:50%;right:8px;transform:translateY(-50%);width:20px;height:20px;background:transparent;color:var(--text-muted);font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0',
    onmousedown: (e) => {
      // Prevent the input from blurring; toggle dropdown manually.
      e.preventDefault();
      if (dropdown.style.display === 'block') {
        dropdown.style.display = 'none';
      } else {
        searchInput.focus();
        dropdownIdx = -1;
        renderDropdown();
      }
    },
  }, '▾');
  const updateRightAffix = () => {
    const hasText = !!searchInput.value;
    clearBtn.style.display = hasText ? 'flex' : 'none';
    caretBtn.style.display = hasText ? 'none' : 'flex';
  };
  const dropdown = el('div', {
    style: 'position:absolute;top:100%;left:0;right:0;margin-top:2px;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow-md);max-height:260px;overflow-y:auto;z-index:50;display:none',
  });
  const comboWrap = el('div', { style: 'position:relative;flex:1;min-width:200px' }, [searchInput, clearBtn, caretBtn, dropdown]);
  updateRightAffix();

  function matches() {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) return clientOpts.slice(0, 50);
    const starts = [], contains = [];
    for (const c of clientOpts) {
      const ln = c.name.toLowerCase();
      if (ln.startsWith(q)) starts.push(c);
      else if (ln.includes(q)) contains.push(c);
    }
    return [...starts, ...contains].slice(0, 50);
  }

  function highlightItems() {
    [...dropdown.children].forEach((child, j) => {
      child.style.background = j === dropdownIdx ? 'var(--gold-bg)' : '';
    });
  }

  function renderDropdown() {
    const list = matches();
    dropdown.innerHTML = '';
    if (list.length === 0) { dropdown.style.display = 'none'; return; }
    if (dropdownIdx >= list.length) dropdownIdx = list.length - 1;
    list.forEach((c, i) => {
      const item = el('div', {
        style: 'padding:8px 12px;cursor:pointer;font-size:14px;' + (i === dropdownIdx ? 'background:var(--gold-bg)' : ''),
        onmousedown: (e) => { e.preventDefault(); selectItem(c); },
        // Don't call renderDropdown here — replacing the node the mouse is over
        // restarts mouseenter, eating the following mousedown.
        onmouseenter: () => { dropdownIdx = i; highlightItems(); },
      }, c.name);
      dropdown.appendChild(item);
    });
    dropdown.style.display = 'block';
  }

  function selectItem(c) {
    tv.search = c.name;
    searchInput.value = c.name;
    dropdown.style.display = 'none';
    dropdownIdx = -1;
    updateRightAffix();
    renderBody();
  }

  searchInput.addEventListener('input', () => {
    tv.search = searchInput.value;
    dropdownIdx = -1;
    updateRightAffix();
    renderDropdown();
    renderBody();
  });
  searchInput.addEventListener('focus', () => { dropdownIdx = -1; renderDropdown(); });
  searchInput.addEventListener('blur', () => { setTimeout(() => { dropdown.style.display = 'none'; }, 150); });
  searchInput.addEventListener('keydown', (e) => {
    const list = matches();
    if (e.key === 'Tab' && list.length > 0) {
      e.preventDefault();
      selectItem(list[dropdownIdx >= 0 ? dropdownIdx : 0]);
      return;
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (list.length === 0) return;
      dropdownIdx = (dropdownIdx + 1) % list.length;
      highlightItems();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (list.length === 0) return;
      dropdownIdx = dropdownIdx <= 0 ? list.length - 1 : dropdownIdx - 1;
      highlightItems();
    } else if (e.key === 'Enter') {
      if (list.length > 0 && dropdownIdx >= 0) {
        e.preventDefault();
        selectItem(list[dropdownIdx]);
      }
    } else if (e.key === 'Escape') {
      dropdown.style.display = 'none';
      dropdownIdx = -1;
    }
  });

  const filterStrip = el('div', { class: 'row mb-16', style: 'gap:8px;flex-wrap:wrap;align-items:center' }, [comboWrap]);
  mount.appendChild(filterStrip);

  const bodyWrap = el('div', {});
  mount.appendChild(bodyWrap);

  function renderBody() {
    bodyWrap.innerHTML = '';

    // ── Balances by client (sortable, filtered by search) ──
    const q = tv.search.trim().toLowerCase();
    const balFiltered = q
      ? balances.filter(b => (b.client_name || '').toLowerCase().includes(q))
      : balances.slice();
    const balSorted = balFiltered.sort((a, b) => {
      const keyA = tv.balSort === 'client' ? (a.client_name || '').toLowerCase() : Number(a.balance || 0);
      const keyB = tv.balSort === 'client' ? (b.client_name || '').toLowerCase() : Number(b.balance || 0);
      const cmp = keyA < keyB ? -1 : keyA > keyB ? 1 : 0;
      return tv.balDir === 'asc' ? cmp : -cmp;
    });
    const balArrow = (k) => tv.balSort === k ? (tv.balDir === 'asc' ? ' ▲' : ' ▼') : '';
    const balTh = (key, label, cls) => el('th', {
      class: cls, style: 'cursor:pointer;user-select:none',
      onclick: () => {
        if (tv.balSort === key) tv.balDir = tv.balDir === 'asc' ? 'desc' : 'asc';
        else { tv.balSort = key; tv.balDir = key === 'balance' ? 'desc' : 'asc'; }
        renderBody();
      },
    }, label + balArrow(key));

    // ── Transactions list (filtered by same search + sortable) ──
    let txRows = entries.slice();
    if (q) {
      txRows = txRows.filter(t =>
        (t.client_name || '').toLowerCase().includes(q) ||
        (t.reference  || '').toLowerCase().includes(q) ||
        (t.notes      || '').toLowerCase().includes(q) ||
        (t.kind       || '').toLowerCase().includes(q)
      );
    }
    const txKey = {
      date:   t => t.occurred_at || '',
      client: t => (t.client_name || '').toLowerCase(),
      kind:   t => t.kind || '',
      amount: t => Number(t.amount || 0),
      reference: t => (t.reference || '').toLowerCase(),
    }[tv.txSort] || (t => t.occurred_at || '');
    txRows.sort((a, b) => {
      const av = txKey(a), bv = txKey(b);
      const cmp = av < bv ? -1 : av > bv ? 1 : 0;
      return tv.txDir === 'asc' ? cmp : -cmp;
    });
    const txArrow = (k) => tv.txSort === k ? (tv.txDir === 'asc' ? ' ▲' : ' ▼') : '';
    const txTh = (key, label, cls) => el('th', {
      class: cls, style: 'cursor:pointer;user-select:none',
      onclick: () => {
        if (tv.txSort === key) tv.txDir = tv.txDir === 'asc' ? 'desc' : 'asc';
        else { tv.txSort = key; tv.txDir = key === 'amount' || key === 'date' ? 'desc' : 'asc'; }
        renderBody();
      },
    }, label + txArrow(key));

    bodyWrap.appendChild(el('div', { class: 'grid grid-2' }, [
      el('div', { class: 'card' }, [
        el('h3', {}, 'Balances by client' + (q ? ` (${balSorted.length})` : '')),
        balances.length === 0 ? el('div', { class: 'empty' }, 'No trust balances.') :
        balSorted.length === 0 ? el('div', { class: 'empty' }, 'No clients match the search.') :
          el('table', { class: 'data' }, [
            el('thead', {}, el('tr', {}, [ balTh('client', 'Client'), balTh('balance', 'Balance', 'num') ])),
            el('tbody', {}, balSorted.map(b => el('tr', {
              title: 'Click to filter by this client',
              style: 'cursor:pointer',
              onclick: () => {
                tv.search = b.client_name || '';
                searchInput.value = tv.search;
                updateRightAffix();
                renderBody();
              },
            }, [
              el('td', {}, b.client_name || '—'),
              el('td', { class: 'num', style: b.balance < 0 ? 'color:var(--red)' : '' }, fmt.money(b.balance)),
            ]))),
          ]),
      ]),
      el('div', { class: 'card' }, [
        el('h3', {}, 'Transactions' + (q ? ` (${txRows.length})` : '')),
        txRows.length === 0 ? el('div', { class: 'empty' },
          entries.length === 0 ? 'No entries.' : 'No transactions match the search.') :
          el('div', { style: 'max-height:500px;overflow:auto' }, el('table', { class: 'data' }, [
            el('thead', {}, el('tr', {}, [
              txTh('date', 'Date'),
              txTh('client', 'Client'),
              txTh('kind', 'Kind'),
              txTh('reference', 'Reference'),
              txTh('amount', 'Amount', 'num'),
            ])),
            el('tbody', {}, txRows.map(t => el('tr', { title: t.notes || '' }, [
              el('td', {}, fmt.date(t.occurred_at)),
              el('td', {}, t.client_name || '—'),
              el('td', {}, t.kind),
              el('td', {}, t.reference || '—'),
              el('td', { class: 'num', style: 'font-weight:600;' + (t.amount < 0 ? 'color:var(--red)' : 'color:var(--green)') }, fmt.money(t.amount)),
            ]))),
          ])),
      ]),
    ]));
  }

  renderBody();
}

function openTrustForm(clients) {
  const body = el('div', {}, [
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Kind'),
        el('select', { name: 'kind' }, ['deposit','withdrawal','transfer-to-operating','fee-applied','refund'].map(k => el('option', { value: k }, k))) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Amount ($)'), el('input', { name: 'amount', type: 'number', step: '0.01' }) ]),
    ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Client *'),
      el('select', { name: 'clientContactId', required: '' }, [ el('option', { value: '' }, '— choose —'), ...clients.map(c => el('option', { value: c.id }, c.full_name)) ]) ]),
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Date'), el('input', { name: 'occurredAt', type: 'date', value: todayDateInput() }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Reference (check #, wire)'), el('input', { name: 'reference' }) ]),
    ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Notes'), el('textarea', { name: 'notes' }) ]),
  ]);
  const save = async () => {
    const d = {}; $$('input, select, textarea', body).forEach(i => d[i.name] = i.value);
    d.amount = parseFloat(d.amount) || 0;
    if (!d.amount) return toast('Amount required', true);
    if (!d.clientContactId) return toast('Client required — every IOLTA entry must be paired with a client', true);
    const c = clients.find(x => x.id === d.clientContactId);
    if (c) d.clientName = c.full_name;
    if (d.occurredAt) d.occurredAt = new Date(d.occurredAt).toISOString();
    await api('/api/trust', { method: 'POST', body: d });
    toast('Posted'); closeModal(); navigate('trust');
  };
  openModal('Trust transaction', body, el('div', {}, [
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: save }, 'Post'),
  ]));
}

    el('thead', {}, el('tr', {}, [

      ]),
      el('td', {}, u.email ? el('a', { href: 'mailto:' + u.email }, u.email) : '—'),
      el('td', {}, ROLE_LABELS[u.role] || u.role),
      seeRates ? el('td', { class: 'num' }, fmt.money(u.defaultRate || 0)) : null,
      seeRates ? el('td', { class: 'num' }, u.discountRate != null ? fmt.money(u.discountRate) : '—') : null,

      canEdit ? el('td', {}, el('button', { class: 'btn btn-ghost btn-sm', onclick: () => editUserModal(u, seats.roles) }, 'Edit')) : null,
    ]))),
  ]));
}

// ─────────────────────────────────────────────────────────────────────────
// SETTINGS (profile, firm info, pipeline stages — team moved to its own tab)
// ─────────────────────────────────────────────────────────────────────────
async function renderSettings(mount, v) {
  if (isStaleRender(v)) return;
  mount.innerHTML = '';

  // Tab bar — Profile is always visible; Firm/Team/Invoices/Payments are admin-only.
  const tabs = [{ id: 'profile', label: 'Profile' }];
  if (can('manageFirm'))  tabs.push({ id: 'firm', label: 'Firm' });
  if (can('manageUsers')) tabs.push({ id: 'team', label: 'Team' });
  if (can('manageFirm'))  tabs.push({ id: 'invoices', label: 'Invoices' });
  if (can('manageFirm'))  tabs.push({ id: 'payments', label: 'Payments' });

  state.viewState.settingsTab ||= 'profile';
  if (!tabs.find(t => t.id === state.viewState.settingsTab)) state.viewState.settingsTab = tabs[0].id;
  const active = state.viewState.settingsTab;

  const tabBar = el('div', { class: 'settings-tabs' },
    tabs.map(t => el('button', {
      class: t.id === active ? 'active' : '',
      onclick: () => { state.viewState.settingsTab = t.id; renderSettings(mount, ++state._renderVersion); },
    }, t.label))
  );
  mount.appendChild(tabBar);

  const panel = el('div');
  mount.appendChild(panel);

  if (active === 'profile') await renderSettingsProfile(panel);
  else if (active === 'firm')     renderSettingsFirm(panel);
  else if (active === 'team')     await renderSettingsTeam(panel);
  else if (active === 'invoices') renderSettingsInvoices(panel);
  else if (active === 'payments') await renderSettingsPayments(panel);
}

                    placeholder: cfg.mercuryTokenMasked ? 'Leave blank to keep existing' : 'secret-token:...' }),
    ]),

  mount.appendChild(el('div', { class: 'card mb-24' }, [

      el('button', {
        class: 'btn btn-primary btn-sm',
        ...(kekMissing ? { disabled: 'disabled' } : {}),
        onclick: async () => {
          const body = {
            stripePublishable:         $('#pm-stripe-pub').value.trim(),
            stripeSecretKey:           $('#pm-stripe-sk').value || undefined,
            stripeWebhookSecret:       $('#pm-stripe-wh').value || undefined,
            mercuryToken:              $('#pm-merc-tok').value || undefined,
            mercuryOperatingAccountId: $('#pm-merc-op').value.trim(),
            mercuryTrustAccountId:     $('#pm-merc-tr').value.trim(),
            achEnabled:  $('#pm-ach').checked,
            cardEnabled: $('#pm-card').checked,
          };
          // Only send secret fields if user typed something. Empty string means "leave existing".

          if (!body.stripeWebhookSecret) delete body.stripeWebhookSecret;
          if (!body.mercuryToken)        delete body.mercuryToken;
          await api('/api/firm/payments', { method: 'PUT', body });
          toast('Saved');
          mount.innerHTML = '';
          await renderSettingsPayments(mount);
        },
      }, 'Save'),
      el('button', {
        class: 'btn btn-ghost btn-sm',
        style: 'margin-left:8px',
        ...(kekMissing ? { disabled: 'disabled' } : {}),
        onclick: async () => {

          try {
            const r = await api('/api/firm/payments/test', { method: 'POST' });
            testOut.innerHTML = '';
            testOut.appendChild(el('div', {}, [
              el('strong', {}, 'Stripe: '),
              r.stripe.ok
                ? el('span', { style: 'color:#1a7a3a' }, 'OK' + (r.stripe.displayName ? ' — ' + r.stripe.displayName : '') + (r.stripe.accountId ? ' (' + r.stripe.accountId + ')' : ''))
                : el('span', { style: 'color:#a02020' }, r.stripe.error || 'Failed'),
            ]));
            testOut.appendChild(el('div', {}, [
              el('strong', {}, 'Mercury: '),
              r.mercury.ok
                ? el('span', { style: 'color:#1a7a3a' }, 'OK — ' + r.mercury.accountCount + ' account(s) visible')
                : el('span', { style: 'color:#a02020' }, r.mercury.error || 'Failed'),
            ]));
            // If Mercury returned accounts, render a hint list so the user can copy the right IDs.
            const acctBox = $('#pm-merc-accts');
            if (acctBox && r.mercury.ok && Array.isArray(r.mercury.accounts)) {
              acctBox.innerHTML = '';
              acctBox.appendChild(el('div', { style: 'margin-top:8px;font-weight:600;color:var(--text)' }, 'Mercury accounts visible:'));
              r.mercury.accounts.forEach(a => {
                acctBox.appendChild(el('div', { style: 'font-family:monospace;font-size:12px' },
                  (a.name || '(unnamed)') + (a.kind ? ' [' + a.kind + ']' : '') + ' — ' + a.id));
              });
            }
          } catch (e) {
            testOut.textContent = 'Test failed: ' + e.message;
          }
        },
      }, 'Test connection'),
    ]),
    testOut,
  ]));
}

function renderAppearanceCard(mount, profile) {
  const presets = window.THEME_PRESETS;
  const initial = (profile && profile.theme) || { preset: 'navy' };
  // Mutable selection — preset key plus (for custom) primary/accent.
  const sel = {
    preset:  initial.preset || 'navy',
    primary: initial.primary || presets.navy.primary,
    accent:  initial.accent  || presets.navy.accent,
  };

  const card = el('div', { class: 'card mb-24' });
  card.appendChild(el('h3', {}, 'Appearance'));
  card.appendChild(el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:12px' },
    'Choose a color scheme that matches your brand. Selections apply only to your view — each teammate can pick their own.'));

  const grid = el('div', { class: 'theme-grid' });
  card.appendChild(grid);

  // Preset swatches + a "Custom" tile at the end.
  const tiles = [
    ...Object.entries(presets).map(([key, p]) => ({ key, label: p.label, primary: p.primary, accent: p.accent })),
    { key: 'custom', label: 'Custom…', primary: sel.primary, accent: sel.accent },
  ];
  const tileEls = {};
  for (const t of tiles) {
    const tile = el('button', {
      type: 'button',
      class: 'theme-swatch' + (sel.preset === t.key ? ' active' : ''),
      onclick: () => choose(t.key),
    }, [
      el('div', { class: 'tsw-bars' }, [
        el('div', { class: 'tsw-bar', 'data-role': 'primary', style: `background:${t.primary}` }),
        el('div', { class: 'tsw-bar', 'data-role': 'accent',  style: `background:${t.accent}` }),
      ]),
      el('div', { class: 'tsw-label' }, t.label),
    ]);
    tileEls[t.key] = tile;
    grid.appendChild(tile);
  }

  // Custom color inputs (visible only when Custom is active).
  const customRow = el('div', { id: 'pf-theme-custom', class: 'form-row', style: 'margin-top:12px;' + (sel.preset === 'custom' ? '' : 'display:none') }, [
    el('div', { class: 'field' }, [
      el('label', {}, 'Primary color'),
      el('input', { type: 'color', id: 'pf-theme-primary', value: sel.primary,
        oninput: e => { sel.primary = e.target.value; updateCustomTile(); persist(); } }),
      el('div', { style: 'font-size:11.5px;color:var(--text-muted);margin-top:4px' }, 'Sidebar, headings, primary buttons.'),
    ]),
    el('div', { class: 'field' }, [
      el('label', {}, 'Accent color'),
      el('input', { type: 'color', id: 'pf-theme-accent', value: sel.accent,
        oninput: e => { sel.accent = e.target.value; updateCustomTile(); persist(); } }),
      el('div', { style: 'font-size:11.5px;color:var(--text-muted);margin-top:4px' }, 'Active nav, hover highlights.'),
    ]),
  ]);
  card.appendChild(customRow);

  mount.appendChild(card);

  function updateCustomTile() {
    const tile = tileEls.custom;
    if (!tile) return;
    const bars = tile.querySelectorAll('.tsw-bar');
    if (bars[0]) bars[0].style.background = sel.primary;
    if (bars[1]) bars[1].style.background = sel.accent;
  }

  function choose(key) {
    sel.preset = key;
    customRow.style.display = key === 'custom' ? '' : 'none';
    Object.entries(tileEls).forEach(([k, e]) => e.classList.toggle('active', k === key));
    persist();
  }

  // Apply + persist (debounced for the color picker, which fires rapidly).
  let saveTimer = null;
  function persist() {
    const theme = sel.preset === 'custom'
      ? { preset: 'custom', primary: sel.primary, accent: sel.accent }
      : { preset: sel.preset };
    window.applyTheme(theme);
    try { localStorage.setItem('crm.theme', JSON.stringify(theme)); } catch {}
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      const latest = await api('/api/me/profile').catch(() => state._profile || {});
      await api('/api/me/profile', { method: 'PUT', body: { ...latest, theme } }).catch(() => {});
      state._profile = { ...(latest || {}), theme };
    }, 300);
  }
}

      toast('Saved');
    } }, 'Save stages'),
  ]));

  const savedCats = state.firm.expenseCategories || [];
  mount.appendChild(el('div', { class: 'card mb-24' }, [
    el('h3', {}, 'Expense categories'),
    el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:10px' }, 'Categories shown in the expense form. One per line: "id | label". Leave blank to use defaults.'),
    el('textarea', { id: 'expense-cats-ta', style: 'width:100%;min-height:140px;font-family:monospace' },
      savedCats.length ? savedCats.map(c => `${c.id} | ${c.label}`).join('\n') : defaultCatLines),
    el('button', { class: 'btn btn-primary btn-sm mt-16', onclick: async () => {
      const lines = $('#expense-cats-ta').value.split('\n').map(l => l.trim()).filter(Boolean);
      const cats = lines.map(l => {
        const [id, label] = l.split('|').map(s => s.trim());
        return { id: id || label.toLowerCase().replace(/\s+/g,'-'), label: label || id };
      });
      await api('/api/firm', { method: 'PUT', body: { expenseCategories: cats } });
      state.firm.expenseCategories = cats;
      toast('Saved');
    } }, 'Save categories'),
  ]));

  const dupResultsSlot = el('div', { id: 'dup-results', style: 'margin-top:12px' });
  mount.appendChild(el('div', { class: 'card mb-24' }, [
    el('h3', {}, 'Find duplicates'),
    el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:12px' }, 'Contacts that share the same email address.'),
    el('button', { class: 'btn btn-primary btn-sm', id: 'find-dups-btn', onclick: async () => {
      const btn = $('#find-dups-btn');
      btn.disabled = true;
      const groups = await api('/api/contacts/duplicates').catch(() => []);
      btn.disabled = false;
      dupResultsSlot.innerHTML = '';
      if (!groups.length) {
        dupResultsSlot.appendChild(el('div', { style: 'font-size:13px;color:var(--text-muted)' }, 'No duplicates found.'));
        return;
      }
      groups.forEach(g => {
        const groupEl = el('div', { style: 'border:1px solid var(--border);border-radius:6px;padding:12px;margin-top:12px' }, [
          el('div', { style: 'font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px' }, g.email),

              el('div', { style: 'font-size:11px;color:var(--text-muted)' }, [contact.type, contact.company_name].filter(Boolean).join(' · ')),

            ),

      const data = await api('/api/admin/backups').catch(() => null);

      const list = $('#backups-list');

      if (!data) { meta.textContent = 'Could not load backups.'; return; }

      meta.textContent = 'Last successful backup: ' + fmt(data.lastSuccessAt)
        + (data.lastError ? '  ·  Last error: ' + data.lastError : '');
      list.innerHTML = '';
      if (!data.backups.length) {
        list.appendChild(el('div', { style: 'font-size:13px;color:var(--text-muted)' }, 'No backups yet. The first will run automatically within an hour, or click "Backup now".'));

        el('thead', {}, el('tr', {}, [

          $('#audit-from').value = ''; $('#audit-to').value = '';

      auditState.entityType = $('#audit-entity-type')?.value || '';
      auditState.from       = $('#audit-from')?.value || '';
      auditState.to         = $('#audit-to')?.value || '';
    }

    function fmtAuditAt(iso) { return iso ? new Date(iso.replace(' ', 'T') + 'Z').toLocaleString() : '—'; }
    function safeParse(s) { if (!s) return null; try { return JSON.parse(s); } catch(e) { return s; } }
    function renderJsonCell(label, val) {
      if (val == null) return null;
      const summary = el('summary', { style: 'cursor:pointer;font-size:11px;color:var(--text-muted)' }, label);
      const pre = el('pre', { style: 'white-space:pre-wrap;font-family:monospace;font-size:11px;background:var(--bg-subtle,#f6f7f8);padding:6px;border-radius:4px;margin:4px 0 0;max-height:200px;overflow:auto' },
        typeof val === 'string' ? val : JSON.stringify(val, null, 2));
      return el('details', {}, [summary, pre]);
    }

    async function refreshAudit() {
      const qs = new URLSearchParams();
      if (auditState.actor)      qs.set('actor',      auditState.actor);
      if (auditState.action)     qs.set('action',     auditState.action);
      if (auditState.entityType) qs.set('entityType', auditState.entityType);
      if (auditState.from)       qs.set('from',       auditState.from);
      if (auditState.to)         qs.set('to',         auditState.to);
      qs.set('limit',  auditState.limit);
      qs.set('offset', auditState.offset);
      const data = await api('/api/audit-log?' + qs.toString()).catch(() => null);
      const meta  = $('#audit-meta');
      const list  = $('#audit-list');
      const pager = $('#audit-pager');
      if (!meta || !list || !pager) return;
      if (!data) { meta.textContent = 'Could not load audit log.'; return; }

      // Populate filter dropdowns on first load (and keep current value)
      const actionSel = $('#audit-action');
      const entitySel = $('#audit-entity-type');
      if (actionSel && actionSel.options.length <= 1) {
        data.actions.forEach(a => actionSel.appendChild(el('option', { value: a }, a)));
        if (auditState.action) actionSel.value = auditState.action;
      }
      if (entitySel && entitySel.options.length <= 1) {
        data.entityTypes.forEach(t => entitySel.appendChild(el('option', { value: t }, t)));
        if (auditState.entityType) entitySel.value = auditState.entityType;
      }

      const start = data.rows.length ? auditState.offset + 1 : 0;
      const end   = auditState.offset + data.rows.length;
      meta.textContent = data.total
        ? `Showing ${start}–${end} of ${data.total}`
        : 'No entries match these filters.';

      list.innerHTML = '';
      if (!data.rows.length) return;
      const table = el('table', { class: 'data', style: 'width:100%;font-size:13px' }, [
        el('thead', {}, el('tr', {}, [
          el('th', { style: 'text-align:left;width:160px' }, 'When'),
          el('th', { style: 'text-align:left;width:180px' }, 'Actor'),
          el('th', { style: 'text-align:left' }, 'Action'),
          el('th', { style: 'text-align:left' }, 'Entity'),
          el('th', { style: 'text-align:left' }, 'Change'),
        ])),
        el('tbody', {}, data.rows.map(r => el('tr', {}, [
          el('td', { style: 'white-space:nowrap' }, fmtAuditAt(r.at)),
          el('td', {}, r.actor_email || '—'),
          el('td', { style: 'font-family:monospace;font-size:12px' }, r.action),
          el('td', { style: 'font-size:12px' }, r.entity_type + (r.entity_id ? ' · ' + r.entity_id : '')),
          el('td', {}, [
            renderJsonCell('before', safeParse(r.before_json)),
            renderJsonCell('after',  safeParse(r.after_json)),
          ].filter(Boolean)),
        ]))),
      ]);
      list.appendChild(table);

      pager.innerHTML = '';
      const hasPrev = auditState.offset > 0;
      const hasNext = end < data.total;
      pager.appendChild(el('button', { class: 'btn btn-ghost btn-sm', disabled: hasPrev ? null : 'disabled',
        onclick: () => { if (!hasPrev) return; auditState.offset = Math.max(0, auditState.offset - auditState.limit); refreshAudit(); } }, '← Prev'));
      pager.appendChild(el('button', { class: 'btn btn-ghost btn-sm', disabled: hasNext ? null : 'disabled',
        onclick: () => { if (!hasNext) return; auditState.offset += auditState.limit; refreshAudit(); } }, 'Next →'));
    }
    refreshAudit();
  }

  if (can('manageFirm')) {
    const inboundOn  = !!state.firm.inboundEmailConfigured;
    const inboundAddr = state.firm.inboundEmailAddress || '';
    const webhookUrl  = window.location.origin + '/api/webhooks/inbound-email';
    mount.appendChild(el('div', { class: 'card mb-24' }, [
      el('h3', {}, [

        }, inboundOn ? 'Enabled' : 'Not configured'),
      ]),
      el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:12px' },
        'BCC this address on outgoing emails to auto-create an interaction log entry for any matched CRM contact.'),
      ...(inboundOn ? [
        el('div', { style: 'margin-bottom:12px' }, [
          el('label', { style: 'font-size:12px;font-weight:600;display:block;margin-bottom:4px' }, 'BCC address'),
          el('div', { style: 'display:flex;gap:8px;align-items:center' }, [
            el('input', { id: 'inbound-addr-display', readonly: 'readonly', value: inboundAddr,
              style: 'flex:1;font-family:monospace;font-size:13px;background:var(--bg-muted,#f8fafc)' }),
            el('button', { class: 'btn btn-ghost btn-sm', onclick: () => {
              navigator.clipboard.writeText(inboundAddr).then(() => toast('Copied!')).catch(() => {
                const inp = $('#inbound-addr-display'); inp.select(); document.execCommand('copy'); toast('Copied!');
              });

        el('div', { style: 'margin-bottom:12px' }, [

// Opens a fullscreen editor that renders a paper-like mock invoice with
// every customizable label as a contenteditable span. Edits happen in place
// on the "page" — no separate toolbar column. Saving writes the label map
// to firm.settings; actual PDFs are still generated server-side by pdfkit,
// so the mockup is a faithful look-alike rather than a byte-perfect render.
function openInvoiceLayoutEditor(baseSettings) {
  const saved = state.firm.settings || {};
  const working = { ...DEFAULT_INVOICE_LABELS, ...(saved.labels || {}) };
  const accent    = baseSettings.accentColor || '#1e3a5f';
  const logoText  = baseSettings.invoiceLogoText || (state.firm?.name || '').toUpperCase() || 'YOUR FIRM';
  const remitName = baseSettings.remitPayeeName || state.firm?.name || 'Your Firm LLP';
  const firmAddr  = baseSettings.address || '';
  const remitAddr = baseSettings.remitAddress || firmAddr || '1 Firm Way\nNew York, NY 10001';
  const wire = {
    beneficiaryName:    baseSettings.wireBeneficiaryName    || remitName,
    beneficiaryAddress: baseSettings.wireBeneficiaryAddress || remitAddr,
    accountNumber:      baseSettings.wireAccountNumber      || '000000000',
    routingNumber:      baseSettings.wireRoutingNumber      || '000000000',
    bankName:           baseSettings.wireBankName           || 'Bank of Example, N.A.',
    bankAddress:        baseSettings.wireBankAddress        || '100 Bank Plaza\nNew York, NY 10005',
  };
  const footerText = baseSettings.invoiceFooterText || 'INVOICES ARE PAYABLE UPON RECEIPT';

  // Sample data — mirrors /api/invoices/preview
  const year  = new Date().getFullYear();
  const today = new Date();
  const longDate  = (d) => d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  const shortDate = (d) => `${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(2)}`;
  const dMinus = (n) => { const x = new Date(today); x.setDate(x.getDate() - n); return x; };
  const s = {
    invoiceNumber: `INV-${year}-SAMPLE`,
    issuedLong:    longDate(today),
    client:        ['Acme Holdings, Inc.', '1209 Orange Street', 'Wilmington, DE 19801', 'ap@acmeholdings.example'],
    matterId:      'SAMPLE',
    matterDesc:    'General Corporate Advisory Services',
    servicesTotal: 2025,
    costsTotal:    250,
    subtotal:      2275,
    total:         2275,
    outstanding:   850,
    timeEntries: [
      { date: shortDate(dMinus(14)), tk: 'Jane Doe', desc: 'Draft and revise stock purchase agreement; circulate issues list to client.', hours: 3.50, rate: 450, amount: 1575 },
      { date: shortDate(dMinus(10)), tk: 'Jane Doe', desc: 'Telephone conference with client regarding due diligence findings and next steps.', hours: 1.00, rate: 450, amount:  450 },
    ],
    expenses: [
      { desc: 'Delaware franchise tax filing fee', amount: 175 },
      { desc: 'Courier delivery (overnight)',      amount:  75 },
    ],
  };
  s.totalDue   = s.total + s.outstanding;
  s.totalHours = s.timeEntries.reduce((a, e) => a + e.hours, 0);
  const fm = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // Editable label span. Paste strips formatting; Enter blurs instead of
  // inserting a newline, because none of these labels are multi-line.
  const lbl = (key, extraCls) => {
    const span = el('span', {
      class: 'inv-lbl' + (extraCls ? ' ' + extraCls : ''),
      contenteditable: 'true',
      spellcheck: 'false',
      'data-label-key': key,
      title: 'Click to edit — ' + key,
    }, working[key] || '');
    span.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text');
      document.execCommand('insertText', false, text);
    });
    span.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); span.blur(); }
    });
    return span;
  };

  // Multi-line editable block — used for the custom text block.
  // Unlike lbl(), Enter inserts a newline and content is read via innerText.
  const multiLbl = (key) => {
    const span = el('span', {
      class: 'inv-lbl inv-custom-text-lbl',
      contenteditable: 'true',
      spellcheck: 'false',
      'data-label-key': key,
      'data-multiline': '1',
      'data-empty': working[key] ? '0' : '1',
      'data-placeholder': 'Click to add payment instructions, firm tagline, or notes…',
      title: 'Click to edit — ' + key,
    }, working[key] || '');
    span.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text');
      document.execCommand('insertText', false, text);
    });
    span.addEventListener('input', () => {
      span.setAttribute('data-empty', span.textContent.trim() ? '0' : '1');
    });
    return span;
  };

  const readLabels = () => {
    const out = {};
    overlay.querySelectorAll('[data-label-key]').forEach(n => {
      out[n.dataset.labelKey] = n.dataset.multiline
        ? (n.innerText || '').trim()
        : (n.textContent || '').replace(/\s+/g, ' ').trim();
    });
    return out;
  };

  const resetAll = () => {
    if (!confirm('Reset all labels back to defaults? Unsaved changes will be lost.')) return;
    overlay.querySelectorAll('[data-label-key]').forEach(n => {
      const def = DEFAULT_INVOICE_LABELS[n.dataset.labelKey] || '';
      n.textContent = def;
      if (n.dataset.multiline) n.setAttribute('data-empty', def ? '0' : '1');
    });
  };

  const close = () => overlay.remove();

  // Font family stacks — the PDF renderer maps each to the nearest PDFKit
  // builtin (Helvetica / Times / Courier) since those are the only families
  // guaranteed to render without bundling TTF files.
  const FONT_STACKS = {
    helvetica: `'Helvetica Neue', Helvetica, Arial, sans-serif`,
    arial:     `Arial, Helvetica, sans-serif`,
    verdana:   `Verdana, Geneva, sans-serif`,
    trebuchet: `'Trebuchet MS', Tahoma, sans-serif`,
    times:     `'Times New Roman', Times, serif`,
    georgia:   `Georgia, 'Times New Roman', serif`,
    palatino:  `'Palatino Linotype', Palatino, 'Book Antiqua', serif`,
    garamond:  `Garamond, 'EB Garamond', 'Times New Roman', serif`,
    courier:   `'Courier New', Courier, monospace`,
    monaco:    `Monaco, Consolas, 'Courier New', monospace`,
  };
  const FONT_LABELS = {
    helvetica: 'Helvetica',  arial: 'Arial',  verdana: 'Verdana',  trebuchet: 'Trebuchet MS',
    times: 'Times New Roman', georgia: 'Georgia', palatino: 'Palatino', garamond: 'Garamond',
    courier: 'Courier New',   monaco: 'Monaco',
  };
  // Legacy settings from earlier iterations:
  const normalizeFont = (f) => {
    if (f === 'serif') return 'times';
    if (f === 'sans')  return 'helvetica';
    return FONT_STACKS[f] ? f : 'helvetica';
  };
  // Global default family — used when a label has no per-label override.
  let currentFont = normalizeFont(baseSettings.invoiceFontFamily);
  const applyFont = (f) => {
    f = normalizeFont(f);
    currentFont = f;
    const body = overlay.querySelector('.inv-editor-body');
    if (body) body.style.setProperty('--inv-font', FONT_STACKS[f]);
  };

  // Per-label style overrides: { [key]: { family?, size?, color? } }. Applied
  // as inline styles on the corresponding contenteditable spans in the mockup,
  // and passed to the PDF renderer via firmSettings.labelStyles.
  const labelStyles = JSON.parse(JSON.stringify(baseSettings.labelStyles || {}));
  const isHexColor = (v) => typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v);
  const normalizeStyle = (key) => {
    const s = labelStyles[key];
    if (!s) return;
    if (s.family != null && !FONT_STACKS[s.family]) delete s.family;
    if (s.size != null) {
      const n = Number(s.size);
      if (!Number.isFinite(n) || n <= 0) delete s.size;
      else s.size = n;
    }
    if (s.color != null && !isHexColor(s.color)) delete s.color;
    if (!s.family && s.size == null && !s.color) delete labelStyles[key];
  };
  // Apply one label's styles to all matching spans in the mockup.
  const applyLabelStyleToDom = (key) => {
    const s = labelStyles[key] || {};
    overlay.querySelectorAll(`[data-label-key="${key}"]`).forEach(span => {
      span.style.fontFamily = s.family ? FONT_STACKS[s.family] : '';
      span.style.fontSize   = s.size   ? (s.size + 'pt')       : '';
      span.style.color      = s.color  ? s.color               : '';
    });
  };
  // Apply all stored label styles (called once on open).
  const applyAllLabelStyles = () => {
    Object.keys(labelStyles).forEach(applyLabelStyleToDom);
  };

  // Live logo scale — multiplier (0.5–2.0), default 1.0. Drives --inv-logo-scale.
  const clampScale = (n) => Math.max(0.5, Math.min(2.0, Number(n) || 1));
  let currentLogoScale = clampScale(baseSettings.invoiceLogoScale);
  const applyLogoScale = (n) => {
    currentLogoScale = clampScale(n);
    const body = overlay.querySelector('.inv-editor-body');
    if (body) body.style.setProperty('--inv-logo-scale', String(currentLogoScale));
    const slider = overlay.querySelector('#inv-logo-size');
    if (slider && Number(slider.value) !== currentLogoScale) slider.value = String(currentLogoScale);
    const readout = overlay.querySelector('.inv-logo-group .sz');
    if (readout) readout.textContent = Math.round(currentLogoScale * 100) + '%';
  };

  // Live "Invoice" title scale — independent of the logo. Drives --inv-title-scale,
  // which only affects .inv-title and .inv-title-sm so the heading can be tuned
  // without disturbing the logo or other text. Persisted as invoiceTitleScale.
  let currentTitleScale = clampScale(baseSettings.invoiceTitleScale);
  const applyTitleScale = (n) => {
    currentTitleScale = clampScale(n);
    const body = overlay.querySelector('.inv-editor-body');
    if (body) body.style.setProperty('--inv-title-scale', String(currentTitleScale));
    const slider = overlay.querySelector('#inv-title-size');
    if (slider && Number(slider.value) !== currentTitleScale) slider.value = String(currentTitleScale);
    const readout = overlay.querySelector('.inv-title-group .sz');
    if (readout) readout.textContent = Math.round(currentTitleScale * 100) + '%';
  };

  // Live logo state — null = no change, {data, mime} = new upload, false = remove-on-save.
  let logoPending = null;
  const logoSrc = () => {
    if (logoPending && logoPending !== false) return 'data:' + logoPending.mime + ';base64,' + logoPending.data;
    if (logoPending === false) return null;
    return state.firm?.hasLogo ? ('/api/firm/logo?t=' + (state.firm._logoCacheBust || Date.now())) : null;
  };
  const renderLogos = () => {
    const src = logoSrc();
    overlay.querySelectorAll('.inv-logo-slot').forEach(slot => {
      slot.innerHTML = '';
      const isShort = slot.classList.contains('short');
      if (src) {
        slot.appendChild(el('img', { src, alt: 'Firm logo', onerror: (e) => { e.target.remove(); slot.appendChild(el('span', { class: 'inv-logo' + (isShort ? ' short-text' : ''), style: isShort ? 'font-size:14px' : '' }, logoText)); } }));
      } else {
        slot.appendChild(el('span', { class: 'inv-logo', style: isShort ? 'font-size:14px' : '' }, logoText));
      }
    });
    // Update the header thumbnail too.
    const thumb = overlay.querySelector('.inv-logo-group .thumb');
    if (thumb) {
      thumb.innerHTML = '';
      if (src) thumb.appendChild(el('img', { src, onerror: (e) => { e.target.remove(); thumb.textContent = 'NO\nLOGO'; } }));
      else thumb.textContent = 'NO\nLOGO';
    }
    // Toggle the Remove button visibility based on whether a logo is currently showing.
    const removeBtn = overlay.querySelector('.inv-logo-group .mini-btn.danger');
    if (removeBtn) removeBtn.style.display = src ? '' : 'none';
  };
  const pickLogo = () => {
    const fileIn = overlay.querySelector('#inv-logo-file-picker');
    if (fileIn) fileIn.click();
  };
  const removeLogo = () => {
    logoPending = false;
    renderLogos();
  };

  // Live accent color — updates the mockup via CSS var and is persisted on save.
  let currentAccent = accent;
  const applyAccent = (c) => {
    if (!/^#[0-9a-fA-F]{6}$/.test(c)) return;
    currentAccent = c;
    const body = overlay.querySelector('.inv-editor-body');
    if (body) body.style.setProperty('--inv-accent', c);
    const picker = overlay.querySelector('#inv-accent-picker');
    if (picker && picker.value !== c) picker.value = c;
    overlay.querySelectorAll('.inv-swatch').forEach(s => {
      s.classList.toggle('active', s.dataset.color.toLowerCase() === c.toLowerCase());
    });
    // Theme-derived per-label color suggestions follow the accent.
    renderLabelColorSwatches();
  };

  // Color helpers — hex ↔ HSL conversion, used to derive theme-aware
  // per-label color suggestions from the current accent color.
  const hexToHsl = (hex) => {
    const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    if (!m) return null;
    const r = parseInt(m[1], 16) / 255;
    const g = parseInt(m[2], 16) / 255;
    const b = parseInt(m[3], 16) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    let h = 0, s = 0;
    const l = (mx + mn) / 2;
    if (mx !== mn) {
      const d = mx - mn;
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      switch (mx) {
        case r: h = ((g - b) / d) + (g < b ? 6 : 0); break;
        case g: h = ((b - r) / d) + 2; break;
        case b: h = ((r - g) / d) + 4; break;
      }
      h *= 60;
    }
    return { h, s: s * 100, l: l * 100 };
  };
  const hslToHex = (h, s, l) => {
    s = Math.max(0, Math.min(100, s)) / 100;
    l = Math.max(0, Math.min(100, l)) / 100;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let r, g, b;
    if      (h < 60)  [r, g, b] = [c, x, 0];
    else if (h < 120) [r, g, b] = [x, c, 0];
    else if (h < 180) [r, g, b] = [0, c, x];
    else if (h < 240) [r, g, b] = [0, x, c];
    else if (h < 300) [r, g, b] = [x, 0, c];
    else              [r, g, b] = [c, 0, 0];
    const to = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
    return '#' + to(r) + to(g) + to(b);
  };
  const themeSuggestions = () => {
    const hsl = hexToHsl(currentAccent) || { h: 220, s: 50, l: 30 };
    const out = [
      { name: 'Default',  color: null },                                          // clear override
      { name: 'Accent',   color: currentAccent },
      { name: 'Darker',   color: hslToHex(hsl.h, hsl.s, Math.max(8,  hsl.l - 18)) },
      { name: 'Lighter',  color: hslToHex(hsl.h, hsl.s, Math.min(88, hsl.l + 22)) },
      { name: 'Muted',    color: hslToHex(hsl.h, Math.max(10, hsl.s - 35), Math.min(70, hsl.l + 10)) },
      { name: 'Black',    color: '#111111' },
      { name: 'Slate',    color: '#4a4f57' },
      { name: 'Gold',     color: '#b08a2a' },
    ];
    return out;
  };

  // Per-block layout overrides — { [blockId]: { dx, dy, w, h } }. Only blocks
  // tagged with `data-block-id` participate. Drag mutates dx/dy in this map;
  // CSS resize:both mutates the element's inline width/height directly, which
  // we sample on save via collectBlockLayout(). The PDF renderer doesn't yet
  // honor these — they apply to the on-screen editor preview only.
  const blockLayout = JSON.parse(JSON.stringify(baseSettings.blockLayout || {}));
  let designMode = false;

  // Block visibility — which optional sections to hide in preview + PDF.
  // Default: custom text block hidden; all others visible.
  const hiddenBlocks = new Set(
    Array.isArray(baseSettings.hiddenBlocks) ? baseSettings.hiddenBlocks : ['p1-custom-text']
  );
  const BLOCK_OPTIONS = [
    { id: 'p2-services',   label: 'Professional Services detail (page 2)' },
    { id: 'p2-timekeeper', label: 'Timekeeper summary (page 2)' },
    { id: 'p3-costs',      label: 'Costs page (page 3)' },
    { id: 'p4-wire',       label: 'Wire/ACH instructions (page 4)' },
    { id: 'p1-custom-text',label: 'Custom text block (page 1)' },
  ];

  const applyBlockLayout = () => {
    overlay.querySelectorAll('[data-block-id]').forEach(node => {
      const lay = blockLayout[node.dataset.blockId];
      if (!lay) return;
      const dx = Number(lay.dx) || 0, dy = Number(lay.dy) || 0;
      node.style.transform = (dx || dy) ? `translate(${dx}px, ${dy}px)` : '';
      if (lay.w) node.style.width  = lay.w + 'px';
      if (lay.h) node.style.height = lay.h + 'px';
    });
  };

  const collectBlockLayout = () => {
    const out = {};
    overlay.querySelectorAll('[data-block-id]').forEach(node => {
      const id = node.dataset.blockId;
      const stored = blockLayout[id] || {};
      const entry = {};
      if (stored.dx) entry.dx = stored.dx;
      if (stored.dy) entry.dy = stored.dy;
      if (node.style.width)  entry.w = parseFloat(node.style.width);
      if (node.style.height) entry.h = parseFloat(node.style.height);
      if (entry.dx || entry.dy || entry.w || entry.h) out[id] = entry;
    });
    return out;
  };

  // Drag delegation — only fires inside the editor body when design mode is on.
  // Skips clicks on the bottom-right resize-handle area so the browser's native
  // CSS `resize:both` corner can grab the mousedown.
  const onBlockMouseDown = (ev) => {
    if (!designMode) return;
    if (ev.button !== 0) return;
    if (ev.target.closest('input, select, button, textarea')) return;
    const node = ev.target.closest('[data-block-id]');
    if (!node) return;
    const rect = node.getBoundingClientRect();
    const inResizeCorner = (rect.right - ev.clientX < 16) && (rect.bottom - ev.clientY < 16);
    if (inResizeCorner) return;
    ev.preventDefault();
    const id = node.dataset.blockId;
    const lay = blockLayout[id] = blockLayout[id] || {};
    const startX = ev.clientX, startY = ev.clientY;
    const baseDx = Number(lay.dx) || 0, baseDy = Number(lay.dy) || 0;
    node.classList.add('inv-dragging');
    const move = (e) => {
      lay.dx = baseDx + (e.clientX - startX);
      lay.dy = baseDy + (e.clientY - startY);
      node.style.transform = `translate(${lay.dx}px, ${lay.dy}px)`;
    };
    const up = () => {
      node.classList.remove('inv-dragging');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  };

  const setDesignMode = (on) => {
    designMode = !!on;
    const body = overlay.querySelector('.inv-editor-body');
    if (body) body.classList.toggle('inv-design-mode', designMode);
    const btn = overlay.querySelector('#inv-design-toggle');
    if (btn) {
      btn.textContent = designMode ? 'Exit design mode' : 'Design mode';
      btn.classList.toggle('btn-primary', designMode);
      btn.classList.toggle('btn-ghost',  !designMode);
    }
    if (designMode) hideFontPanel(true);
  };

  const resetBlockLayout = () => {
    if (!Object.keys(blockLayout).length) { toast('No block positions to reset'); return; }
    if (!confirm('Reset all moved/resized blocks to their default positions?')) return;
    Object.keys(blockLayout).forEach(k => delete blockLayout[k]);
    overlay.querySelectorAll('[data-block-id]').forEach(node => {
      node.style.transform = '';
      node.style.width = '';
      node.style.height = '';
    });
  };

  const applyBlockVisibility = () => {
    overlay.querySelectorAll('[data-vis-id]').forEach(node => {
      node.classList.toggle('inv-block-hidden', hiddenBlocks.has(node.dataset.visId));
    });
    BLOCK_OPTIONS.forEach(opt => {
      const cb = overlay.querySelector(`[data-vis-cb="${opt.id}"]`);
      if (cb) cb.checked = !hiddenBlocks.has(opt.id);
    });
  };

  const save = async () => {
    try {
      const labels = readLabels();
      // Strip empty style entries so labelStyles stays tidy on disk.
      Object.keys(labelStyles).forEach(normalizeStyle);
      const newSettings = { ...(state.firm.settings || {}), ...baseSettings,
        accentColor: currentAccent,
        invoiceFontFamily: currentFont,
        invoiceLogoScale: currentLogoScale,
        invoiceTitleScale: currentTitleScale,
        labels,
        labelStyles,
        blockLayout: collectBlockLayout(),
        hiddenBlocks: [...hiddenBlocks] };
      await api('/api/firm', { method: 'PUT', body: { settings: newSettings } });
      state.firm.settings = newSettings;
      if (logoPending && logoPending !== false) {
        await api('/api/firm/logo', { method: 'POST', body: { mimeType: logoPending.mime, dataBase64: logoPending.data } });
        state.firm.hasLogo = true;
        state.firm._logoCacheBust = Date.now();
      } else if (logoPending === false) {
        await api('/api/firm/logo', { method: 'DELETE' });
        state.firm.hasLogo = false;
      }
      toast('Invoice layout saved');
      close();
      navigate('settings');
    } catch (e) { /* api() already surfaces the error via toast */ }
  };

  const openRealPdf = async () => {
    try {
      Object.keys(labelStyles).forEach(normalizeStyle);
      const body = { settings: { ...baseSettings,
        accentColor: currentAccent,
        invoiceFontFamily: currentFont,
        invoiceLogoScale: currentLogoScale,
        invoiceTitleScale: currentTitleScale,
        labels: readLabels(),
        labelStyles,
        blockLayout: collectBlockLayout() } };
      if (logoPending && logoPending !== false) body.logo = { mimeType: logoPending.mime, dataBase64: logoPending.data };
      else if (logoPending === false) body.logo = null;
      const res = await fetch('/api/invoices/preview', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) { toast('Preview failed (' + res.status + ')'); return; }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) { toast('Preview failed: ' + (e.message || 'network error')); }
  };

  // Short header used on pages 2–4.
  const shortHeader = (blockId) => el('div', blockId ? { 'data-block-id': blockId } : {}, [
    el('div', { class: 'inv-header-row' }, [
      el('div', { class: 'inv-logo-slot short' }, [
        el('span', { class: 'inv-logo', style: 'font-size:14px' }, logoText),
      ]),
      el('div', {}, [
        el('div', { class: 'inv-title-sm' }, [ lbl('invoiceHeading') ]),
        el('div', { class: 'inv-fake-muted', style: 'text-align:right;margin-top:2px' }, `${s.invoiceNumber}  ·  ${s.issuedLong}`),
      ]),
    ]),
    el('div', { class: 'inv-divider-thin' }),
  ]);

  // ── Page 1: Cover + Billing Summary ─────────────────────────────────────
  const page1 = el('div', { class: 'inv-page' }, [
    el('div', { class: 'inv-header-row', 'data-block-id': 'p1-header' }, [
      el('div', { class: 'inv-logo-slot' }, [
        el('span', { class: 'inv-logo' }, logoText),
      ]),
      el('div', { class: 'inv-title' }, [ lbl('invoiceHeading') ]),
    ]),
    el('div', { class: 'inv-divider' }),
    el('div', { style: 'display:flex;justify-content:space-between;gap:24px;align-items:flex-start' }, [
      el('div', { class: 'inv-client inv-fake', 'data-block-id': 'p1-client' }, s.client.join('\n')),
      el('div', { class: 'inv-meta', 'data-block-id': 'p1-meta' }, [
        el('div', { class: 'num' }, [ lbl('invoiceNumberLabel'), ' ', el('span', { class: 'inv-fake' }, s.invoiceNumber) ]),
        el('div', { class: 'num' }, [ lbl('matterNumberLabel'), ' ', el('span', { class: 'inv-fake' }, s.matterId) ]),
        el('div', { class: 'inv-fake-muted' }, s.issuedLong),
      ]),
    ]),
    el('div', { class: 'inv-section-title', 'data-block-id': 'p1-summary-title' }, [ lbl('billingSummaryTitle') ]),
    el('div', { class: 'inv-subtitle', 'data-block-id': 'p1-subtitle' }, [
      lbl('servicesSubtitlePrefix'), ' ',
      el('span', { class: 'inv-fake' }, s.issuedLong),
    ]),
    el('table', { class: 'inv-table' }, [
      el('thead', {}, el('tr', {}, [
        el('th', {}, [ lbl('colMatter') ]),
        el('th', {}, [ lbl('colDescription') ]),
        el('th', { class: 'right' }, [ lbl('colFees') ]),
        el('th', { class: 'right' }, [ lbl('colCosts') ]),
        el('th', { class: 'right' }, [ lbl('colTotal') ]),
      ])),
      el('tbody', {}, [
        el('tr', {}, [
          el('td', { class: 'inv-fake' }, s.matterId),
          el('td', { class: 'inv-fake' }, s.matterDesc),
          el('td', { class: 'right inv-fake' }, fm(s.servicesTotal)),
          el('td', { class: 'right inv-fake' }, fm(s.costsTotal)),
          el('td', { class: 'right inv-fake' }, fm(s.subtotal)),
        ]),
        el('tr', { class: 'inv-totals-row' }, [
          el('td', { colspan: 2 }, [ lbl('colTotal') ]),
          el('td', { class: 'right inv-fake' }, fm(s.servicesTotal)),
          el('td', { class: 'right inv-fake' }, fm(s.costsTotal)),
          el('td', { class: 'right inv-fake' }, fm(s.subtotal)),
        ]),
      ]),
    ]),
    el('div', { class: 'inv-custom-text', 'data-vis-id': 'p1-custom-text', 'data-block-id': 'p1-custom-text' }, [
      multiLbl('customTextBlock'),
    ]),
    el('div', { class: 'inv-payment-note', 'data-block-id': 'p1-payment-note' }, [ lbl('paymentDetailsNote') ]),
  ]);

  // ── Page 2: Professional Services ───────────────────────────────────────
  const page2 = el('div', { class: 'inv-page', 'data-vis-id': 'p2-services' }, [
    shortHeader('p2-header'),
    el('div', { class: 'inv-section-title left', 'data-block-id': 'p2-services-title' }, [
      lbl('professionalServicesTitle'), ' — ',
      el('span', { class: 'inv-fake' }, s.matterDesc),
    ]),
    el('table', { class: 'inv-table' }, [
      el('thead', {}, el('tr', {}, [
        el('th', {}, [ lbl('colDate') ]),
        el('th', {}, [ lbl('colTimekeeper') ]),
        el('th', {}, [ lbl('colDescription') ]),
        el('th', { class: 'right' }, [ lbl('colHours') ]),
        el('th', { class: 'right' }, [ lbl('colRate') ]),
        el('th', { class: 'right' }, [ lbl('colAmount') ]),

        el('td', { colspan: 3, class: 'right' }, [ lbl('totalServicesLabel') ]),
        el('td', { class: 'right inv-fake' }, s.totalHours.toFixed(2)),
        el('td', {}, ''),
        el('td', { class: 'right inv-fake' }, fm(s.servicesTotal)),
      ])),
    ]),
    el('div', { 'data-vis-id': 'p2-timekeeper' }, [
      el('div', { class: 'inv-section-title left', style: 'margin-top:20px', 'data-block-id': 'p2-timekeeper-title' }, [ lbl('summaryByTimekeeperTitle') ]),
      el('table', { class: 'inv-table' }, [
        el('thead', {}, el('tr', {}, [
          el('th', {}, [ lbl('colTimekeeper') ]),
          el('th', { class: 'right' }, [ lbl('colHours') ]),
          el('th', { class: 'right' }, [ lbl('colAmount') ]),
        ])),
        el('tbody', {}, [ el('tr', {}, [
          el('td', { class: 'inv-fake' }, 'Jane Doe'),
          el('td', { class: 'right inv-fake' }, s.totalHours.toFixed(2)),
          el('td', { class: 'right inv-fake' }, fm(s.servicesTotal)),
        ]) ]),
        el('tfoot', {}, el('tr', {}, [
          el('td', { class: 'right' }, [ lbl('colTotal') ]),
          el('td', { class: 'right inv-fake' }, s.totalHours.toFixed(2)),
          el('td', { class: 'right inv-fake' }, fm(s.servicesTotal)),
        ])),
      ]),
    ]),
  ]);

  // ── Page 3: Costs ───────────────────────────────────────────────────────
  const page3 = el('div', { class: 'inv-page', 'data-vis-id': 'p3-costs' }, [
    shortHeader('p3-header'),
    el('div', { class: 'inv-section-title left', 'data-block-id': 'p3-costs-title' }, [
      lbl('costsTitle'), ' — ',
      el('span', { class: 'inv-fake' }, s.matterDesc),
    ]),
    el('table', { class: 'inv-table' }, [
      el('thead', {}, el('tr', {}, [
        el('th', {}, [ lbl('colDescription') ]),
        el('th', { class: 'right' }, [ lbl('colAmount') ]),
      ])),
      el('tbody', {}, s.expenses.map(x => el('tr', {}, [
        el('td', { class: 'inv-fake' }, x.desc),
        el('td', { class: 'right inv-fake' }, fm(x.amount)),
      ]))),
      el('tfoot', {}, el('tr', {}, [
        el('td', { class: 'right' }, [ lbl('totalCostsLabel') ]),
        el('td', { class: 'right inv-fake' }, fm(s.costsTotal)),
      ])),
    ]),
  ]);

  // ── Page 4: Remittance ──────────────────────────────────────────────────
  const wireRow = (key, value) => el('div', { class: 'inv-wire-row', 'data-block-id': 'p4-' + key }, [
    el('div', { class: 'k' }, [ lbl(key) ]),
    el('div', { class: 'v inv-fake' }, value || '—'),
  ]);
  const page4 = el('div', { class: 'inv-page' }, [
    shortHeader('p4-header'),
    el('div', { class: 'inv-section-title', 'data-block-id': 'p4-remittance-title' }, [ lbl('remittanceTitle') ]),
    el('div', { class: 'inv-bal', 'data-block-id': 'p4-current-due' }, [
      el('span', {}, [ lbl('currentDueLabel') ]),
      el('span', { class: 'inv-fake' }, fm(s.total)),
    ]),
    el('div', { class: 'inv-bal', 'data-block-id': 'p4-outstanding' }, [
      el('span', {}, [ lbl('outstandingLabel') ]),
      el('span', { class: 'inv-fake' }, fm(s.outstanding)),
    ]),
    el('div', { class: 'inv-bal emph', 'data-block-id': 'p4-total-due' }, [
      el('span', {}, [ lbl('totalBalanceDueLabel') ]),
      el('span', {}, fm(s.totalDue)),
    ]),
    el('div', { class: 'inv-block-heading', 'data-block-id': 'p4-checks-heading' }, [ lbl('checksPayableLabel') ]),
    el('div', { class: 'inv-fake', style: 'padding-left:14px;white-space:pre-line', 'data-block-id': 'p4-checks-info' }, `${remitName}\n${remitAddr}`),
    el('div', { 'data-vis-id': 'p4-wire' }, [
      el('div', { class: 'inv-block-heading', 'data-block-id': 'p4-wire-heading' }, [ lbl('wireHeadingLabel') ]),
      wireRow('wireBeneficiaryNameLabel',    wire.beneficiaryName),
      wireRow('wireBeneficiaryAddressLabel', wire.beneficiaryAddress),
      wireRow('wireAccountNumberLabel',      wire.accountNumber),
      wireRow('wireRoutingNumberLabel',      wire.routingNumber),
      wireRow('wireBankNameLabel',           wire.bankName),
      wireRow('wireBankAddressLabel',        wire.bankAddress),
    ]),
    el('div', { class: 'inv-block-heading', 'data-block-id': 'p4-notes-heading' }, [ lbl('notesHeadingLabel') ]),
    el('div', { class: 'inv-fake', style: 'padding-left:14px', 'data-block-id': 'p4-notes-info' }, 'Sample invoice for preview purposes only.'),
    el('div', { class: 'inv-footer', 'data-block-id': 'p4-footer' }, footerText),
  ]);

  const presets = [
    { name: 'Navy',     color: '#1e3a5f' },
    { name: 'Forest',   color: '#2f5d3e' },
    { name: 'Burgundy', color: '#7a1f2b' },
    { name: 'Charcoal', color: '#333333' },
    { name: 'Teal',     color: '#0d6b6b' },
    { name: 'Plum',     color: '#4a2a5e' },
    { name: 'Copper',   color: '#a0522d' },
  ];
  const logoFileInput = el('input', {
    id: 'inv-logo-file-picker', type: 'file', accept: 'image/png,image/jpeg',
    style: 'display:none',
    onchange: async (e) => {
      const f = e.target.files[0]; if (!f) return;
      e.target.value = '';
      if (!['image/png','image/jpeg','image/jpg'].includes(f.type)) { toast('PNG or JPEG only', true); return; }
      // Large logos are resized + re-encoded in the browser so they fit the
      // invoice layout and the server's size cap. Shows a hint while working
      // since canvas re-encoding can take a beat on big images.
      const willCompress = f.size > 1.5 * 1024 * 1024;
      if (willCompress) toast('Compressing logo…');
      try {
        logoPending = await compressLogoForUpload(f);
        renderLogos();
        if (willCompress) toast('Logo compressed');
      } catch (err) {
        toast(err.message || 'Could not load logo', true);
      }
    },
  });
  const logoGroup = el('div', { class: 'inv-logo-group', title: 'Firm logo (PNG/JPEG — large files are resized to fit)' }, [
    el('span', { class: 'lab' }, 'Logo'),
    el('div', { class: 'thumb' }),
    el('button', { type: 'button', class: 'mini-btn', onclick: pickLogo }, 'Upload'),
    el('button', { type: 'button', class: 'mini-btn danger', onclick: removeLogo }, 'Remove'),
    el('div', { class: 'size-wrap', title: 'Logo size' }, [
      el('input', {
        id: 'inv-logo-size', type: 'range',
        min: '0.5', max: '2', step: '0.05',
        value: String(currentLogoScale),
        oninput: (e) => applyLogoScale(e.target.value),
      }),
      el('span', { class: 'sz' }, Math.round(currentLogoScale * 100) + '%'),
    ]),
    logoFileInput,
  ]);

  // Independent slider for the "Invoice" heading. Reuses the .inv-logo-group
  // pill styling for visual consistency with the logo control.
  const titleGroup = el('div', { class: 'inv-logo-group inv-title-group', title: 'Size of the "Invoice" heading text' }, [
    el('span', { class: 'lab' }, 'Title'),
    el('div', { class: 'size-wrap', title: 'Invoice heading size' }, [
      el('input', {
        id: 'inv-title-size', type: 'range',
        min: '0.5', max: '2', step: '0.05',
        value: String(currentTitleScale),
        oninput: (e) => applyTitleScale(e.target.value),
      }),
      el('span', { class: 'sz' }, Math.round(currentTitleScale * 100) + '%'),
    ]),
  ]);

  // Floating font editor — appears when any contenteditable label gets focus.
  // Has two sections: Default font (global), and Selected label (per-label).
  let focusedLabelKey = null;

  const defaultFontSelect = el('select', {
    id: 'inv-default-font',
    onchange: (e) => applyFont(e.target.value),
  }, Object.keys(FONT_STACKS).map(k => el('option', {
    value: k,
    ...(k === currentFont ? { selected: 'selected' } : {}),
    style: `font-family:${FONT_STACKS[k]}`,
  }, FONT_LABELS[k])));

  const labelFamilySelect = el('select', {
    id: 'inv-label-font',
    onchange: (e) => {
      if (!focusedLabelKey) return;
      labelStyles[focusedLabelKey] = labelStyles[focusedLabelKey] || {};
      const v = e.target.value;
      if (v === '') delete labelStyles[focusedLabelKey].family;
      else labelStyles[focusedLabelKey].family = v;
      normalizeStyle(focusedLabelKey);
      applyLabelStyleToDom(focusedLabelKey);
    },
  }, [
    el('option', { value: '' }, 'Use default'),
    ...Object.keys(FONT_STACKS).map(k => el('option', {
      value: k, style: `font-family:${FONT_STACKS[k]}`,
    }, FONT_LABELS[k])),
  ]);

  const labelSizeInput = el('input', {
    id: 'inv-label-size', type: 'number', min: '4', max: '72', step: '0.5',
    placeholder: 'default',
    oninput: (e) => {
      if (!focusedLabelKey) return;
      labelStyles[focusedLabelKey] = labelStyles[focusedLabelKey] || {};
      const v = e.target.value;
      if (v === '') delete labelStyles[focusedLabelKey].size;
      else labelStyles[focusedLabelKey].size = Number(v);
      normalizeStyle(focusedLabelKey);
      applyLabelStyleToDom(focusedLabelKey);
    },
  });

  const setLabelColor = (color) => {
    if (!focusedLabelKey) return;
    labelStyles[focusedLabelKey] = labelStyles[focusedLabelKey] || {};
    if (color == null || color === '') delete labelStyles[focusedLabelKey].color;
    else if (isHexColor(color))        labelStyles[focusedLabelKey].color = color;
    normalizeStyle(focusedLabelKey);
    applyLabelStyleToDom(focusedLabelKey);
    refreshColorSwatchActive();
    if (labelColorPicker && color) labelColorPicker.value = color;
    if (labelColorSample) {
      labelColorSample.style.color = (labelStyles[focusedLabelKey] || {}).color || '';
    }
  };

  const labelColorPicker = el('input', {
    id: 'inv-label-color', type: 'color', value: currentAccent,
    title: 'Custom color',
    oninput: (e) => setLabelColor(e.target.value),
  });

  const labelColorRow = el('div', { class: 'color-row' }, []);
  const renderLabelColorSwatches = () => {
    if (!labelColorRow) return;
    labelColorRow.innerHTML = '';
    themeSuggestions().forEach(p => {
      const sw = el('button', {
        type: 'button',
        class: 'lbl-swatch' + (p.color == null ? ' none' : ''),
        'data-color': p.color || '',
        title: p.name + (p.color ? ' — ' + p.color : ''),
        style: p.color ? `background:${p.color}` : '',
        onclick: () => setLabelColor(p.color),
      });
      labelColorRow.appendChild(sw);
    });
    labelColorRow.appendChild(labelColorPicker);
    refreshColorSwatchActive();
  };
  const refreshColorSwatchActive = () => {
    const cur = focusedLabelKey ? (labelStyles[focusedLabelKey] || {}).color || '' : '';
    labelColorRow.querySelectorAll('.lbl-swatch').forEach(sw => {
      const c = sw.dataset.color || '';
      sw.classList.toggle('active', c.toLowerCase() === cur.toLowerCase());
    });
  };
  const labelColorSample = null; // assigned later via refreshLabelPanel preview

  const resetLabelBtn = el('button', {
    type: 'button', class: 'btn btn-ghost btn-sm',
    onclick: () => {
      if (!focusedLabelKey) return;
      delete labelStyles[focusedLabelKey];
      applyLabelStyleToDom(focusedLabelKey);
      labelFamilySelect.value = '';
      labelSizeInput.value = '';
      refreshColorSwatchActive();
    },
  }, 'Reset this label');

  const fontPanel = el('div', { class: 'inv-font-panel', 'data-open': '0' }, [
    el('div', { class: 'hdr' }, [
      el('div', { class: 'ttl' }, 'Text'),
      el('button', {
        type: 'button', class: 'close', title: 'Close', onclick: () => hideFontPanel(true),
      }, '×'),
    ]),
    el('div', { class: 'section' }, [
      el('div', { class: 'section-ttl' }, 'Default font'),
      el('div', { class: 'field' }, [
        el('label', { for: 'inv-default-font' }, 'Family'),
        defaultFontSelect,
      ]),
      el('div', { class: 'hint' }, 'Used for every label without its own override.'),
    ]),
    el('div', { class: 'section label-section', id: 'inv-label-section' }, [
      el('div', { class: 'section-ttl' }, [
        'This label ',
        el('span', { id: 'inv-font-target', class: 'tgt' }, ''),
      ]),
      el('div', { class: 'field' }, [
        el('label', { for: 'inv-label-font' }, 'Family'),
        labelFamilySelect,
      ]),
      el('div', { class: 'field' }, [
        el('label', { for: 'inv-label-size' }, 'Size (pt)'),
        labelSizeInput,
      ]),
      el('div', { class: 'field' }, [
        el('label', {}, 'Color'),
        labelColorRow,
      ]),
      el('div', { class: 'preview' }, [
        el('div', { id: 'inv-font-preview', class: 'sample' }, 'The quick brown fox'),
      ]),
      resetLabelBtn,
    ]),
    el('div', { class: 'hint', style: 'margin-top:10px' }, 'Click any label on the page to edit it. Preview actual PDF to verify.'),
  ]);

  const refreshLabelPanel = (key) => {
    focusedLabelKey = key;
    const sec = overlay.querySelector('#inv-label-section');
    const tgt = overlay.querySelector('#inv-font-target');
    const sample = overlay.querySelector('#inv-font-preview');
    if (!key) {
      if (sec) sec.style.display = 'none';
      return;
    }
    if (sec) sec.style.display = '';
    if (tgt) tgt.textContent = `· ${key}`;
    const s = labelStyles[key] || {};
    labelFamilySelect.value = s.family || '';
    labelSizeInput.value    = s.size != null ? String(s.size) : '';
    if (labelColorPicker) labelColorPicker.value = s.color || currentAccent;
    refreshColorSwatchActive();
    if (sample) {
      const span = overlay.querySelector(`[data-label-key="${key}"]`);
      sample.textContent = (span?.textContent || '').trim() || 'The quick brown fox';
      sample.style.fontFamily = s.family ? FONT_STACKS[s.family] : FONT_STACKS[currentFont];
      sample.style.fontSize   = s.size   ? (s.size + 'pt')       : '';
      sample.style.color      = s.color  ? s.color               : '';
    }
  };

  let fontPanelHideTimer = null;
  const showFontPanel = (labelEl) => {
    clearTimeout(fontPanelHideTimer);
    fontPanel.dataset.open = '1';
    refreshLabelPanel(labelEl?.dataset?.labelKey || null);
  };
  const hideFontPanel = (immediate) => {
    clearTimeout(fontPanelHideTimer);
    if (immediate) { fontPanel.dataset.open = '0'; return; }
    fontPanelHideTimer = setTimeout(() => { fontPanel.dataset.open = '0'; }, 180);
  };

  const blocksPanel = el('div', { class: 'inv-blocks-panel', 'data-open': '0' }, [
    el('div', { class: 'hdr' }, [
      el('div', { class: 'ttl' }, 'Show / hide sections'),
      el('button', { type: 'button', class: 'close', title: 'Close', onclick: () => { blocksPanel.dataset.open = '0'; } }, '×'),
    ]),
    ...BLOCK_OPTIONS.map(opt => {
      const cb = el('input', { type: 'checkbox', 'data-vis-cb': opt.id,
        ...(hiddenBlocks.has(opt.id) ? {} : { checked: 'checked' }) });
      cb.addEventListener('change', () => {
        if (cb.checked) hiddenBlocks.delete(opt.id);
        else hiddenBlocks.add(opt.id);
        applyBlockVisibility();
      });
      return el('label', { class: 'block-row' }, [cb, el('span', { class: 'lbl' }, opt.label)]);
    }),
    el('div', { class: 'hint' }, 'Hidden sections are omitted from both the preview and the generated PDF. Sections with no data (no expenses, no time entries) are always omitted regardless.'),
  ]);
  const toggleBlocksPanel = () => {
    const open = blocksPanel.dataset.open === '1';
    blocksPanel.dataset.open = open ? '0' : '1';
    if (!open) hideFontPanel(true);
  };

  const colorGroup = el('div', { class: 'inv-color-group', title: 'Accent color' }, [
    el('span', { class: 'lab' }, 'Color'),
    ...presets.map(p => el('button', {
      type: 'button',
      class: 'inv-swatch',
      'data-color': p.color,
      style: `background:${p.color}`,
      title: p.name,
      onclick: () => applyAccent(p.color),
    })),
    el('input', {
      id: 'inv-accent-picker',
      type: 'color',
      value: accent,
      title: 'Custom color',
      oninput: (e) => applyAccent(e.target.value),
    }),
  ]);

  const overlay = el('div', { class: 'inv-editor-overlay' }, [
    el('div', { class: 'inv-editor-header' }, [
      el('div', {}, [
        el('h3', {}, 'Invoice layout editor'),
        el('div', { class: 'hint' }, 'Click any highlighted label to edit it in place. Toggle Design mode to drag or resize blocks.'),
      ]),
      el('div', { class: 'actions' }, [
        logoGroup,
        titleGroup,
        colorGroup,
        el('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: toggleBlocksPanel }, 'Blocks'),
        el('button', {
          id: 'inv-design-toggle', type: 'button',
          class: 'btn btn-ghost btn-sm',
          title: 'Drag blocks to move them, drag the bottom-right corner to resize',
          onclick: () => setDesignMode(!designMode),
        }, 'Design mode'),
        el('button', { class: 'btn btn-ghost btn-sm', onclick: resetBlockLayout, title: 'Clear all moved/resized block positions' }, 'Reset block layout'),
        el('button', { class: 'btn btn-ghost btn-sm', onclick: openRealPdf }, 'Preview actual PDF'),
        el('button', { class: 'btn btn-ghost btn-sm', onclick: resetAll }, 'Reset to defaults'),
        el('button', { class: 'btn btn-ghost btn-sm', onclick: close }, 'Cancel'),
        el('button', { class: 'btn btn-primary btn-sm', onclick: save }, 'Save layout'),
      ]),
    ]),
    el('div', { class: 'inv-editor-body', style: `--inv-accent:${accent}`, onmousedown: onBlockMouseDown }, [
      page1, page2, page3, page4,
    ]),
    fontPanel,
    blocksPanel,
  ]);

  // Show the panel when a label gains focus; hide shortly after it blurs,
  // unless focus moves into the panel (so the user can click controls).
  overlay.addEventListener('focusin', (e) => {
    const tgt = e.target;
    if (tgt && tgt.classList && tgt.classList.contains('inv-lbl')) {
      showFontPanel(tgt);
      blocksPanel.dataset.open = '0';
    } else if (fontPanel.contains(tgt)) {
      clearTimeout(fontPanelHideTimer);
    }
  });
  overlay.addEventListener('focusout', (e) => {
    const next = e.relatedTarget;
    if (next && (next.classList?.contains('inv-lbl') || fontPanel.contains(next))) return;
    hideFontPanel(false);
  });

  document.body.appendChild(overlay);
  // Initialize active-swatch highlight if the current accent matches a preset.
  overlay.querySelectorAll('.inv-swatch').forEach(sw => {
    sw.classList.toggle('active', sw.dataset.color.toLowerCase() === accent.toLowerCase());
  });
  applyFont(currentFont);
  applyLogoScale(currentLogoScale);
  applyTitleScale(currentTitleScale);
  applyAllLabelStyles();
  applyBlockLayout();
  applyBlockVisibility();
  renderLabelColorSwatches();
  refreshLabelPanel(null);
  renderLogos();
}

function changePasswordModal() {
  const body = el('div', {}, [
    el('div', { class: 'field' }, [ el('label', {}, 'Current password'), el('input', { id: 'cp-cur', type: 'password' }) ]),
    el('div', { class: 'field' }, [ el('label', {}, 'New password (min 8)'), el('input', { id: 'cp-new', type: 'password' }) ]),
  ]);
  openModal('Change password', body, el('div', {}, [
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: async () => {
      try {
        await api('/api/auth/change-password', { method: 'POST', body: { currentPassword: $('#cp-cur').value, newPassword: $('#cp-new').value } });
      } catch(e) {
        console.error('Password change failed:', e);
        return;
      }
      toast('Password updated'); closeModal();
    } }, 'Update'),
  ]));
}

      el('div', { class: 'field' }, [ el('label', {}, 'Role'),

          value: u.discountRate != null ? u.discountRate : '',
          placeholder: 'optional' }) ]) : null,
    ]),
    el('div', { class: 'checkbox-row' }, [
      el('input', { type: 'checkbox', id: 'eu-admin', ...(u.isAdmin ? { checked: 'checked' } : {}) }),
      el('label', { for: 'eu-admin' }, 'Admin'),
    ]),
    el('div', { class: 'checkbox-row' }, [
      el('input', { type: 'checkbox', id: 'eu-active', ...(u.active ? { checked: 'checked' } : {}) }),
      el('label', { for: 'eu-active' }, 'Active'),
    ]),
    el('div', { class: 'checkbox-row' }, [
      el('input', { type: 'checkbox', id: 'eu-dt-sub', ...(u.dtSubscriber ? { checked: 'checked' } : {}) }),
      el('label', { for: 'eu-dt-sub' }, 'DealTracker subscriber — shows DT matter linking in matter form'),
    ]),
  ]);
  openModal('Edit team member — ' + u.email, body, el('div', {}, [
    el('button', { class: 'btn btn-ghost btn-sm', onclick: async () => {
      await api('/api/seats/' + encodeURIComponent(u.email) + '/reset-password', { method: 'POST' });
      toast('Reset email sent');
    } }, 'Send reset email'),
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: async () => {
      const body = {
        firstName: $('#eu-first').value, lastName: $('#eu-last').value,
        role: $('#eu-role').value, active: $('#eu-active').checked,
        dtSubscriber: $('#eu-dt-sub').checked,
      };
      if ($('#eu-rate'))     body.defaultRate  = parseFloat($('#eu-rate').value) || 0;
      if ($('#eu-discount')) body.discountRate = $('#eu-discount').value === '' ? null : parseFloat($('#eu-discount').value);
      await api('/api/seats/' + encodeURIComponent(u.email), { method: 'PUT', body });
      if (u.email !== state.me.email) {
        await api('/api/seats/' + encodeURIComponent(u.email), { method: 'PATCH', body: { isAdmin: $('#eu-admin').checked } });
      }
      toast('Saved'); closeModal(); state._users = null; navigate(state.currentView || 'team');
    } }, 'Save'),
  ]));
}

// ── Start ─────────────────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
