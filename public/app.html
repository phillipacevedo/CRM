function openExpenseForm(existing, matters) {
  const isNew = !existing, e = existing || {};
  const locked = !isNew && e.status === 'billed';
  const pendingFiles = [];

  const fileInput = el('input', { type: 'file', accept: RECEIPT_ACCEPT, multiple: 'multiple',
    style: 'display:none' });
  const dropZone = el('div', {
    style: 'border:2px dashed var(--border);border-radius:8px;padding:18px;text-align:center;color:var(--text-muted);margin-top:4px;cursor:pointer;transition:background-color .15s,border-color .15s',
  }, 'Drop PDF or photo receipts here, or click to browse');
  dropZone.addEventListener('click', () => fileInput.click());
  const dzActive = () => { dropZone.style.borderColor = 'var(--accent, #2563eb)'; dropZone.style.backgroundColor = 'rgba(37,99,235,0.06)'; };
  const dzReset  = () => { dropZone.style.borderColor = 'var(--border)'; dropZone.style.backgroundColor = ''; };

  const pendingListEl = el('div', { style: 'margin-top:6px;font-size:12px;color:var(--text-muted)' });
  const extractBtn = el('button', {
    class: 'btn btn-ghost btn-sm',
    style: 'margin-top:8px;display:none',
    onclick: async (ev) => { ev.preventDefault(); await runExtract(); },
  }, 'Read receipt to autofill');
  const renderPending = () => {
    pendingListEl.innerHTML = '';
    extractBtn.style.display = pendingFiles.length ? 'inline-block' : 'none';
    if (!pendingFiles.length) return;
    pendingFiles.forEach((f, idx) => {
      pendingListEl.appendChild(el('div', { style: 'display:flex;align-items:center;gap:6px' }, [
        el('span', {}, `• ${f.name} (${fmtBytes(f.size)})`),
        el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { pendingFiles.splice(idx, 1); renderPending(); } }, 'Remove'),
      ]));
    });
  };
  const isReadableReceipt = (f) => /^application\/pdf$/i.test(f.type) || /^image\/(jpeg|png|gif|webp)$/i.test(f.type);

  const addFiles = (files) => {
    files.forEach(f => pendingFiles.push(f));
    renderPending();
    const firstReadable = files.find(isReadableReceipt);
    if (firstReadable) maybeAutoExtract(firstReadable);
  };

  const maybeAutoExtract = (file) => {
    if (extractBtn.disabled) return;
    const amountIn = body.querySelector('input[name="amount"]');
    if (amountIn && amountIn.value) return;
    runExtract(file);
  };

  fileInput.addEventListener('change', () => {
    const files = [...fileInput.files];
    fileInput.value = '';
    addFiles(files);
  });

  const addDropHandlers = (target) => {
    if (locked) return;
    target.addEventListener('dragover', (ev) => { ev.preventDefault(); dzActive(); });
    target.addEventListener('dragleave', (ev) => { if (ev.target === target) dzReset(); });
    target.addEventListener('drop', (ev) => {
      ev.preventDefault(); dzReset();
      const files = [...(ev.dataTransfer?.files || [])].filter(f =>
        /^application\/pdf$/i.test(f.type) || /^image\//i.test(f.type));
      if (!files.length) { toast('Only PDF and image files are supported', true); return; }
      addFiles(files);
    });
  };

  const runExtract = async (fileArg) => {
    const file = fileArg || pendingFiles[0];
    if (!file) return;
    if (!isReadableReceipt(file)) return toast('Receipt reading supports PDF, JPEG, PNG, GIF, and WebP only', true);
    extractBtn.disabled = true;
    const original = extractBtn.textContent;
    extractBtn.textContent = 'Reading receipt…';
    try {
      const dataBase64 = await readFileAsBase64(file);
      const r = await api('/api/expenses/extract', {
        method: 'POST',
        body: { filename: file.name, mimeType: file.type, dataBase64 },
      });
      const amountIn = body.querySelector('input[name="amount"]');
      const descIn   = body.querySelector('input[name="description"]');
      const dateIn   = body.querySelector('input[name="date"]');
      const catSel   = body.querySelector('select[name="category"]');
      if (r.amount != null && amountIn && !amountIn.value) amountIn.value = r.amount;
      if (r.description && descIn && !descIn.value) descIn.value = r.description;
      if (r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && dateIn) dateIn.value = r.date;
      if (r.category && catSel && [...catSel.options].some(o => o.value === r.category)) catSel.value = r.category;
      toast('Autofilled from receipt — review before saving');
    } catch { /* api() already showed a toast */ }
    finally { extractBtn.disabled = false; extractBtn.textContent = original; }
  };

  const attachmentListEl = el('div', { style: 'margin-top:6px' });
  const attachmentSection = el('div', { class: 'field' }, [
    el('label', {}, 'Receipts (PDF or photo, up to 10 MB each)'),
    locked ? el('div', { style: 'font-size:12px;color:var(--text-muted)' }, 'Expense is billed — receipts are read-only.') : dropZone,
    fileInput,
    extractBtn,
    pendingListEl,
    isNew
      ? el('div', { style: 'margin-top:6px;font-size:12px;color:var(--text-muted)' }, 'Files will upload after you save.')
      : attachmentListEl,
  ]);

  // Two-step Client → Matter picker (same widget the time form uses), so the
  // user picks a client first and then sees only matters for that client.
  const picker = clientMatterPicker(matters, { selectedMatterId: e.matter_id || null });

  const body = el('div', {}, [
    picker,
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Date'), el('input', { name: 'date', type: 'date', value: toDateInput(e.date) || todayDateInput() }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Category'),
        el('select', { name: 'category' }, (state.firm?.expenseCategories?.length ? state.firm.expenseCategories : EXPENSE_CATEGORIES).map(c =>
          el('option', { value: c.id, ...((e.category||'other') === c.id ? { selected: 'selected' } : {}) }, c.label))) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Amount ($)'), el('input', { name: 'amount', type: 'number', step: '0.01', value: e.amount || '' }) ]),
    ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Description'), el('input', { name: 'description', value: e.description || '' }) ]),
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field checkbox-row', style: 'padding-top:24px' }, [
        el('input', { type: 'checkbox', name: 'billable', id: 'exp-billable', ...(e.billable !== 0 ? { checked: 'checked' } : {}) }),
        el('label', { for: 'exp-billable' }, 'Billable to client'),
      ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Markup (e.g. 0.10 for 10%)'),
        el('input', { name: 'markupPct', type: 'number', step: '0.01', value: e.markup_pct || 0 }) ]),
    ]),
    attachmentSection,
  ]);

  addDropHandlers(dropZone);
  addDropHandlers(body);

  if (!isNew) {
    api(`/api/expenses/${e.id}/attachments`)
      .then(rows => renderAttachmentList(attachmentListEl, e.id, rows, locked))
      .catch(() => {});
  }

  const uploadAll = async (expenseId) => {
    for (const f of pendingFiles) {
      try { await uploadReceipt(expenseId, f); }
      catch (err) { toast(err.message || `Upload failed: ${f.name}`, true); }
    }
  };

  const save = async () => {
    const d = {};
    // Pull non-picker fields generically; matterId comes from the picker's
    // canonical state so we don't depend on which select happens to be visible.
    $$('select[name=category], input[name=date], input[name=amount], input[name=description], input[name=billable], input[name=markupPct]', body)
      .forEach(i => { d[i.name] = i.type === 'checkbox' ? i.checked : i.value; });
    d.matterId = picker.getValues().matterId;
    d.amount = parseFloat(d.amount) || 0;
    d.markupPct = parseFloat(d.markupPct) || 0;
    if (!d.matterId || !d.amount) return toast('Matter and amount required', true);
    let saved;
    if (isNew) saved = await api('/api/expenses', { method: 'POST', body: d });
    else       saved = await api('/api/expenses/' + e.id, { method: 'PUT', body: d });
    if (pendingFiles.length) await uploadAll(saved.id);
    toast('Saved'); closeModal(); navigate('expenses');
  };

  openModal(isNew ? 'New expense' : 'Edit expense', body, el('div', {}, [
    !isNew ? el('button', { class: 'btn btn-danger btn-sm', onclick: async () => { if (!confirm('Delete?')) return; await api('/api/expenses/' + e.id, { method: 'DELETE' }); toast('Deleted'); closeModal(); navigate('expenses'); } }, 'Delete') : null,
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: save }, 'Save'),
  ]));
}

async function renderInvoices(mount, v) {
  // include closed/on-hold so historical invoices still show their matter
  const matters = await api('/api/matters').catch(() => []);
  if (isStaleRender(v)) return;

  const profile = state._profile = state._profile || {};
  const saved = profile.invoiceView || {};
  const view = {
    subTab:   saved.subTab   || 'list',     // 'list' | 'wip'
    clientSearch: saved.clientSearch || '',
    matterSearch: saved.matterSearch || '',
    sortKey:  saved.sortKey  || 'client',
    sortDir:  saved.sortDir  || 'asc',
    wipBucket: saved.wipBucket || '',       // '' | '0-30' | '31-60' | '61-90' | '90+'
    wipClientSearch: saved.wipClientSearch || '',
    wipMatterSearch: saved.wipMatterSearch || '',
    wipSortKey: saved.wipSortKey || 'age',
    wipSortDir: saved.wipSortDir || 'desc',
  };
  // Debounced persist using the cached profile — avoids the GET-then-PUT round
  // trip on every click and coalesces rapid changes (sort + tab) into one write.
  let persistTimer = null;
  const persist = () => {
    state._profile = { ...(state._profile || {}), invoiceView: view };
    clearTimeout(persistTimer);
    persistTimer = setTimeout(() => {
      api('/api/me/profile', { method: 'PUT', body: state._profile }).catch(() => {});
    }, 250);
  };

  const actions = $('#topbar-actions');
  actions.innerHTML = '';
  actions.appendChild(el('button', { class: 'btn btn-primary btn-sm',
    onclick: () => openInvoiceForm(matters.filter(m => m.status === 'active')) }, '+ Generate invoice'));

  mount.innerHTML = '';

  const tabs = [
    { id: 'list', label: 'Invoices' },
    { id: 'wip',  label: 'Unbilled WIP' },
  ];
  if (!tabs.find(t => t.id === view.subTab)) view.subTab = 'list';

  // Render both sub-panels into separate containers and toggle visibility on
  // tab click. First visit lazy-loads the panel; subsequent switches are
  // DOM-only (no re-fetch of matters/profile/invoices).
  const tabBar = el('div', { class: 'settings-tabs' });
  const listPanel = el('div');
  const wipPanel  = el('div');
  mount.appendChild(tabBar);
  mount.appendChild(listPanel);
  mount.appendChild(wipPanel);

  const loaded = { list: false, wip: false };
  // WIP panel calls this after generating an invoice so the list re-fetches
  // on next visit instead of showing a stale cached table.
  const invalidateList = () => { loaded.list = false; listPanel.innerHTML = ''; };

  const showSubTab = async (id) => {
    view.subTab = id;
    persist();
    [...tabBar.children].forEach(btn => btn.classList.toggle('active', btn.dataset.tabid === id));
    listPanel.style.display = id === 'list' ? '' : 'none';
    wipPanel.style.display  = id === 'wip'  ? '' : 'none';
    if (id === 'list' && !loaded.list) {
      loaded.list = true;
      await renderInvoicesListPanel(listPanel, matters, view, persist);
    } else if (id === 'wip' && !loaded.wip) {
      loaded.wip = true;
      await renderUnbilledWipPanel(wipPanel, matters, view, persist, invalidateList);
    }
  };

  for (const t of tabs) {
    tabBar.appendChild(el('button', {
      'data-tabid': t.id,
      onclick: () => showSubTab(t.id),
    }, t.label));
  }

  await showSubTab(view.subTab);
}

async function renderInvoicesListPanel(mount, matters, view, persist) {
  const invoices = await api('/api/invoices').catch(() => []);

  state.viewState.invoices ||= {};
  const iv = state.viewState.invoices;
  iv.selection ||= new Set();
  // Drop selections for invoices no longer in the dataset (deleted, etc.)
  const allInvIds = invoices.map(inv => inv.id);
  for (const id of [...iv.selection]) if (!allInvIds.includes(id)) iv.selection.delete(id);

  // Distinct client names from invoice history (what's actually billable).
  // Drives the client typeahead suggestions; filtering is substring on name so
  // partial typing also narrows the table without requiring a pick.
  const clientNameSet = new Set();
  for (const inv of invoices) if (inv.client_name) clientNameSet.add(inv.client_name);
  const clientItems = [...clientNameSet]
    .sort((a, b) => a.localeCompare(b))
    .map(n => ({ label: n }));

  // Matter suggestions scope to the matters whose client matches the current
  // client search, so the matter list naturally narrows as a client is typed.
  const buildMatterItems = () => {
    const cq = (view.clientSearch || '').trim().toLowerCase();
    const src = cq
      ? matters.filter(m => (m.client_name || '').toLowerCase().includes(cq))
      : matters;
    const seen = new Set(), items = [];
    for (const m of src) {
      const n = m.name || '';
      if (!n || seen.has(n)) continue;
      seen.add(n);
      items.push({ label: n });
    }
    return items.sort((a, b) => a.label.localeCompare(b.label));
  };

  const matterName = (id) => matters.find(m => m.id === id)?.name || '';
  const matterNo   = (id) => fmtMatterFullId(matters.find(m => m.id === id));

  const computeVisibleRows = () => {
    const cq = (view.clientSearch || '').trim().toLowerCase();
    const mq = (view.matterSearch || '').trim().toLowerCase();
    const matterNameById = (id) => (matters.find(m => m.id === id)?.name || '').toLowerCase();
    let rows = invoices.slice();
    if (cq) rows = rows.filter(r => (r.client_name || '').toLowerCase().includes(cq));
    if (mq) rows = rows.filter(r => matterNameById(r.matter_id).includes(mq));
    return rows;
  };

  const refreshToolbar = () => {
    const slot = mount.querySelector('#inv-toolbar');
    if (!slot) return;
    slot.innerHTML = '';
    const tb = selectionToolbar({
      count: iv.selection.size,
      label: 'invoice',
      onClear: () => { iv.selection.clear(); refreshToolbar(); renderTable(); },
      onExport: () => {
        const picked = invoices.filter(inv => iv.selection.has(inv.id));
        const headers = ['Invoice #','Client','Matter no.','Matter','Issued','Due','Total','Paid','Status'];
        const data = picked.map(inv => [
          inv.number || inv.id, inv.client_name || '',
          matterNo(inv.matter_id) || '', matterName(inv.matter_id) || '',
          inv.issued_at || '', inv.due_at || '',
          Number(inv.total || 0).toFixed(2), Number(inv.amount_paid || 0).toFixed(2),
          inv.status || '',
        ]);
        csvDownload('invoices-' + todayYmd() + '.csv', headers, data);
      },
      onDelete: can('manageBilling') ? async () => {
        const n = iv.selection.size;
        if (!confirm('Delete ' + n + ' invoice' + (n === 1 ? '' : 's') + '? Only draft invoices can be deleted; sent/paid will be skipped.')) return;
        const ids = [...iv.selection];
        const r = await bulkApiDelete('/api/invoices', ids);
        iv.selection.clear();
        toast(r.ok + ' deleted' + (r.errors.length ? ' · ' + r.errors.length + ' failed (non-draft)' : ''),
              r.errors.length > 0);
        navigate('invoices');
      } : null,
      extraActions: (can('manageBilling') && state.firm.smtpConfigured) ? [
        {
          label: 'Send reminders',
          onclick: async () => {
            const picked = invoices.filter(inv => iv.selection.has(inv.id) && inv.status === 'sent');
            if (!picked.length) return toast('No "sent" invoices in selection — reminders only go to sent invoices', true);
            if (!confirm('Send payment reminders for ' + picked.length + ' invoice' + (picked.length === 1 ? '' : 's') + '?\n\nEach reminder will be logged as an interaction.')) return;
            let sent = 0, failed = 0;
            for (const inv of picked) {
              try { await api('/api/invoices/' + inv.id + '/reminder', { method: 'POST' }); sent++; }
              catch { failed++; }
            }
            iv.selection.clear(); refreshToolbar(); renderTable();
            toast(sent + ' reminder' + (sent === 1 ? '' : 's') + ' sent' + (failed ? ' · ' + failed + ' failed' : ''), failed > 0);
          },
        },
      ] : [],
    });
    if (tb) slot.appendChild(tb);
  };

  const renderTable = () => {
    const table = mount.querySelector('table.data');
    if (table) table.remove();
    const empty = mount.querySelector('.empty');
    if (empty) empty.remove();

    let rows = computeVisibleRows();
    const visibleIds = rows.map(r => r.id);

    const keyFn = {
      number: r => (r.number || r.id).toLowerCase(),
      client: r => (r.client_name || '').toLowerCase(),
      matter: r => matterName(r.matter_id).toLowerCase(),
      issued: r => r.issued_at || '',
      due:    r => r.due_at || '',
      total:  r => r.total || 0,
      status: r => r.status || '',
    };
    const primary = keyFn[view.sortKey] || keyFn.client;
    rows.sort((a, b) => {
      const av = primary(a), bv = primary(b);
      let cmp = av < bv ? -1 : av > bv ? 1 : 0;
      if (cmp === 0 && view.sortKey === 'client') cmp = keyFn.matter(a) < keyFn.matter(b) ? -1 : keyFn.matter(a) > keyFn.matter(b) ? 1 : 0;
      if (cmp === 0) cmp = (b.issued_at || '').localeCompare(a.issued_at || '');
      return view.sortDir === 'desc' ? -cmp : cmp;
    });

    if (rows.length === 0) {
      mount.appendChild(el('div', { class: 'card empty' },
        invoices.length === 0
          ? 'No invoices yet. Generate one from billable time or a flat-fee matter.'
          : 'No invoices match the current filter.'));
      return;
    }

    const arrow = (k) => view.sortKey === k ? (view.sortDir === 'asc' ? ' ▲' : ' ▼') : '';
    const sortableTh = (key, label, cls) => el('th', {
      class: cls, style: 'cursor:pointer;user-select:none',
      onclick: () => {
        if (view.sortKey === key) view.sortDir = view.sortDir === 'asc' ? 'desc' : 'asc';
        else { view.sortKey = key; view.sortDir = 'asc'; }
        persist(); renderTable();
      },
    }, label + arrow(key));

    const onSel = () => { refreshToolbar(); };

    mount.appendChild(el('table', { class: 'data' }, [
      el('thead', {}, el('tr', {}, [
        headerSelectCell(visibleIds, iv.selection, onSel),
        sortableTh('number', 'Invoice #'),
        sortableTh('client', 'Client'),
        sortableTh('matter', 'Matter'),
        sortableTh('issued', 'Issued'),
        sortableTh('due',    'Due'),
        sortableTh('total',  'Total', 'num'),
        sortableTh('status', 'Status'),
        el('th', {}, ''),
      ])),
      el('tbody', {}, rows.map(inv => el('tr', {}, [
        rowSelectCell(inv.id, iv.selection, onSel),
        el('td', {}, el('strong', {}, inv.number || inv.id.slice(0,8))),
        el('td', {}, inv.client_name || '—'),
        el('td', {}, (() => {
          const name = matterName(inv.matter_id);
          const no   = matterNo(inv.matter_id);
          if (!name && !no) return '—';
          return el('div', {}, [
            no ? el('div', { style: 'font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;color:var(--text-muted)' }, no) : null,
            el('div', {}, name || ''),
          ]);
        })()),
        el('td', {}, fmt.date(inv.issued_at)),
        el('td', {}, fmt.date(inv.due_at)),
        el('td', { class: 'num' }, fmt.money(inv.total)),
        el('td', {}, el('span', { class: 'badge badge-status-' + inv.status }, inv.status)),
        el('td', {}, [
          el('a', { class: 'btn btn-ghost btn-sm', href: '/api/invoices/' + inv.id + '/pdf', target: '_blank' }, 'PDF'),
          ' ',
          el('button', { class: 'btn btn-ghost btn-sm', onclick: () => openInvoiceDetail(inv.id) }, 'View'),
        ]),
      ]))),
    ]));
  };

  const matterSlot = el('div', { style: 'flex:1;min-width:200px;position:relative' });
  const buildMatterCombo = () => comboSearch({
    items: buildMatterItems(),
    placeholder: 'All matters — type to search…',
    initial: view.matterSearch || '',
    onChange: (val) => { view.matterSearch = val; persist(); renderTable(); },
  });
  matterSlot.appendChild(buildMatterCombo());

  const clientCombo = comboSearch({
    items: clientItems,
    placeholder: 'All clients — type to search…',
    initial: view.clientSearch || '',
    onChange: (val) => {
      view.clientSearch = val;
      persist();
      // Rebuild matter combo so its suggestions narrow to matters of the typed client
      matterSlot.innerHTML = '';
      matterSlot.appendChild(buildMatterCombo());
      renderTable();
    },
  });

  const filterStrip = el('div', { class: 'row mb-16', style: 'gap:8px;flex-wrap:wrap;align-items:center' }, [
    el('label', { style: 'font-size:12px;color:var(--text-muted)' }, 'Client'),
    clientCombo,
    el('label', { style: 'font-size:12px;color:var(--text-muted);margin-left:8px' }, 'Matter'),
    matterSlot,
    el('div', { class: 'spacer' }),
    (view.clientSearch || view.matterSearch) ? el('button', {
      class: 'btn btn-ghost btn-sm',
      onclick: () => {
        view.clientSearch = ''; view.matterSearch = ''; persist();
        mount.innerHTML = '';
        renderInvoicesListPanel(mount, matters, view, persist);
      },
    }, 'Clear filters') : null,
  ]);
  mount.appendChild(filterStrip);
  mount.appendChild(el('div', { id: 'inv-toolbar' }));
  renderTable();
  refreshToolbar();
}

async function renderUnbilledWipPanel(mount, matters, view, persist, onInvoiceGenerated) {
  mount.innerHTML = '';
  const data = await api('/api/reports/unbilled-wip').catch(() => ({ rows: [], summary: {}, totals: { matters: 0, amount: 0 } }));
  const allRows = data.rows || [];
  const summary = data.summary || {};
  const totals  = data.totals  || { matters: 0, amount: 0 };

  if (allRows.length === 0) {
    mount.appendChild(el('div', { class: 'card empty' },
      'No unbilled work in progress. Every billable time entry and expense has been invoiced.'));
    return;
  }

  const buckets = ['0-30', '31-60', '61-90', '90+'];
  const bucketTone = {
    '0-30':  { color: 'var(--text-muted)', accent: 'var(--border)' },
    '31-60': { color: 'var(--navy)',       accent: 'var(--border)' },
    '61-90': { color: '#a06b00',           accent: '#f0c75e' },
    '90+':   { color: 'var(--red)',        accent: 'var(--red)' },
  };
  const bucketLabel = {
    '0-30': '0–30 days', '31-60': '31–60 days', '61-90': '61–90 days', '90+': '90+ days',
  };

  // Bucket summary cards. Click a card to filter; click the active one to clear.
  const cards = el('div', { class: 'grid grid-4 mb-16' },
    buckets.map(b => {
      const s = summary[b] || { count: 0, amount: 0 };
      const isActive = view.wipBucket === b;
      const tone = bucketTone[b];
      return el('div', {
        class: 'stat-card',
        style: 'cursor:pointer;user-select:none;border-left:4px solid ' + tone.accent +
               (isActive ? ';outline:2px solid var(--gold);outline-offset:-2px' : ''),
        onclick: () => {
          view.wipBucket = isActive ? '' : b;
          persist();
          mount.innerHTML = '';
          renderUnbilledWipPanel(mount, matters, view, persist, onInvoiceGenerated);
        },
      }, [
        el('div', { class: 'stat-label' }, bucketLabel[b]),
        el('div', { class: 'stat-value', style: 'color:' + tone.color }, fmt.money(s.amount)),
        el('div', { class: 'stat-sub' }, s.count + (s.count === 1 ? ' matter' : ' matters')),
      ]);
    }));
  mount.appendChild(cards);

  // Typeable client/matter search. Drives substring filtering on the WIP rows
  // and only re-renders the table on each keystroke so the input keeps focus.
  const wipClientItems = [...new Set(allRows.map(r => r.client_name).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b))
    .map(n => ({ label: n }));
  const buildWipMatterItems = () => {
    const cq = (view.wipClientSearch || '').trim().toLowerCase();
    const src = cq ? allRows.filter(r => (r.client_name || '').toLowerCase().includes(cq)) : allRows;
    return [...new Set(src.map(r => r.matter_name).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b))
      .map(n => ({ label: n }));
  };

  const matterSlot = el('div', { style: 'flex:1;min-width:200px;position:relative' });
  const buildMatterCombo = () => comboSearch({
    items: buildWipMatterItems(),
    placeholder: 'All matters — type to search…',
    initial: view.wipMatterSearch || '',
    onChange: (val) => { view.wipMatterSearch = val; persist(); renderTable(); },
  });
  matterSlot.appendChild(buildMatterCombo());

  const clientCombo = comboSearch({
    items: wipClientItems,
    placeholder: 'All clients — type to search…',
    initial: view.wipClientSearch || '',
    onChange: (val) => {
      view.wipClientSearch = val;
      persist();
      matterSlot.innerHTML = '';
      matterSlot.appendChild(buildMatterCombo());
      renderTable();
    },
  });

  const searchStrip = el('div', { class: 'row mb-12', style: 'gap:8px;flex-wrap:wrap;align-items:center' }, [
    el('label', { style: 'font-size:12px;color:var(--text-muted)' }, 'Client'),
    clientCombo,
    el('label', { style: 'font-size:12px;color:var(--text-muted);margin-left:8px' }, 'Matter'),
    matterSlot,
    el('div', { class: 'spacer' }),
    (view.wipClientSearch || view.wipMatterSearch) ? el('button', {
      class: 'btn btn-ghost btn-sm',
      onclick: () => {
        view.wipClientSearch = ''; view.wipMatterSearch = ''; persist();
        mount.innerHTML = '';
        renderUnbilledWipPanel(mount, matters, view, persist, onInvoiceGenerated);
      },
    }, 'Clear search') : null,
  ]);
  mount.appendChild(searchStrip);

  const filterStrip = el('div', { class: 'row mb-16', style: 'gap:8px;flex-wrap:wrap;align-items:center' }, [
    el('div', { style: 'font-size:13px;color:var(--text-muted)' },
      'Firm-wide unbilled WIP: ' + fmt.money(totals.amount) + ' across ' + totals.matters + (totals.matters === 1 ? ' matter' : ' matters')),
    el('div', { class: 'spacer' }),
    view.wipBucket ? el('span', { class: 'badge', style: 'background:var(--cream);color:var(--navy)' }, 'Bucket: ' + bucketLabel[view.wipBucket]) : null,
    view.wipBucket ? el('button', {
      class: 'btn btn-ghost btn-sm',
      onclick: () => {
        view.wipBucket = ''; persist();
        mount.innerHTML = '';
        renderUnbilledWipPanel(mount, matters, view, persist, onInvoiceGenerated);
      },
    }, 'Clear filter') : null,
  ]);
  mount.appendChild(filterStrip);

  const matterNo = (id) => fmtMatterFullId(matters.find(m => m.id === id));
  const keyFn = {
    client: r => (r.client_name || '').toLowerCase(),
    matter: r => (r.matter_name || '').toLowerCase(),
    oldest: r => r.oldest_entry_date || '',
    age:    r => r.days_since_oldest || 0,
    hours:  r => r.time_hours || 0,
    timeAmt:    r => r.time_amount || 0,
    expenseAmt: r => r.expense_amount || 0,
    total:  r => r.total_amount || 0,
  };

  const generateInvoice = async (matterId, matterName) => {
    if (!confirm('Generate an invoice for "' + matterName + '"?\n\nAll draft billable time and expenses on this matter will be added.')) return;
    try {
      const r = await api('/api/invoices', { method: 'POST', body: { matterId, issuedAt: new Date().toISOString().slice(0, 10) } });
      toast('Invoice ' + (r.number || '') + ' created');
      if (typeof onInvoiceGenerated === 'function') onInvoiceGenerated();
      mount.innerHTML = '';
      renderUnbilledWipPanel(mount, matters, view, persist, onInvoiceGenerated);
    } catch (e) {
      toast(e.message || 'Could not generate invoice', true);
    }
  };

  // Slot for the table so search/sort changes can re-render rows in place
  // without rebuilding the search inputs (which would steal focus mid-typing).
  const tableSlot = el('div');
  mount.appendChild(tableSlot);

  function renderTable() {
    tableSlot.innerHTML = '';

    const cq = (view.wipClientSearch || '').trim().toLowerCase();
    const mq = (view.wipMatterSearch || '').trim().toLowerCase();
    let filtered = view.wipBucket ? allRows.filter(r => r.bucket === view.wipBucket) : allRows.slice();
    if (cq) filtered = filtered.filter(r => (r.client_name || '').toLowerCase().includes(cq));
    if (mq) filtered = filtered.filter(r => (r.matter_name || '').toLowerCase().includes(mq));

    const primary = keyFn[view.wipSortKey] || keyFn.age;
    filtered.sort((a, b) => {
      const av = primary(a), bv = primary(b);
      let cmp = av < bv ? -1 : av > bv ? 1 : 0;
      if (cmp === 0) cmp = (b.days_since_oldest || 0) - (a.days_since_oldest || 0);
      return view.wipSortDir === 'desc' ? -cmp : cmp;
    });

    if (filtered.length === 0) {
      tableSlot.appendChild(el('div', { class: 'card empty' },
        (cq || mq) ? 'No matters match the current search.' : 'No matters in this bucket.'));
      return;
    }

    const arrow = (k) => view.wipSortKey === k ? (view.wipSortDir === 'asc' ? ' ▲' : ' ▼') : '';
    const sortableTh = (key, label, cls) => el('th', {
      class: cls, style: 'cursor:pointer;user-select:none',
      onclick: () => {
        if (view.wipSortKey === key) view.wipSortDir = view.wipSortDir === 'asc' ? 'desc' : 'asc';
        else { view.wipSortKey = key; view.wipSortDir = (key === 'client' || key === 'matter' || key === 'oldest') ? 'asc' : 'desc'; }
        persist();
        renderTable();
      },
    }, label + arrow(key));

    tableSlot.appendChild(el('table', { class: 'data' }, [
      el('thead', {}, el('tr', {}, [
        sortableTh('client',     'Client'),
        sortableTh('matter',     'Matter'),
        sortableTh('oldest',     'Oldest entry'),
        sortableTh('age',        'Age', 'num'),
        sortableTh('hours',      'Hours', 'num'),
        sortableTh('timeAmt',    'Time', 'num'),
        sortableTh('expenseAmt', 'Expenses', 'num'),
        sortableTh('total',      'Total', 'num'),
        el('th', {}, ''),
      ])),
      el('tbody', {}, filtered.map(r => {
        const tone = bucketTone[r.bucket];
        const isFlat = r.billing_type === 'flat';
        const isClosed = r.matter_status === 'closed';
        return el('tr', { style: 'border-left:3px solid ' + tone.accent }, [
          el('td', {}, r.client_name || '—'),
          el('td', {}, (() => {
            const no = matterNo(r.matter_id);
            return el('div', {}, [
              no ? el('div', { style: 'font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;color:var(--text-muted)' }, no) : null,
              el('div', {}, [
                r.matter_name || '—',
                isFlat   ? el('span', { class: 'badge', style: 'margin-left:6px;background:var(--cream);color:var(--navy);font-size:10px' }, 'flat fee') : null,
                isClosed ? el('span', { class: 'badge badge-status-closed', style: 'margin-left:6px;font-size:10px' }, 'closed') : null,
              ]),
            ]);
          })()),
          el('td', {}, fmt.date(r.oldest_entry_date)),
          el('td', { class: 'num', style: 'color:' + tone.color + ';font-weight:600' }, r.days_since_oldest + 'd'),
          el('td', { class: 'num' }, r.time_hours ? r.time_hours.toFixed(1) : '—'),
          el('td', { class: 'num' }, r.time_amount ? fmt.money(r.time_amount) : '—'),
          el('td', { class: 'num' }, r.expense_amount ? fmt.money(r.expense_amount) : '—'),
          el('td', { class: 'num' }, el('strong', {}, fmt.money(r.total_amount))),
          el('td', {}, isFlat
            ? el('span', { style: 'font-size:12px;color:var(--text-muted)' }, 'Bill from matter')
            : el('button', { class: 'btn btn-primary btn-sm', onclick: () => generateInvoice(r.matter_id, r.matter_name) }, 'Generate invoice')),
        ]);
      })),
    ]));
  }

  renderTable();
}

function openInvoiceForm(matters) {
  const hourlyMatters = matters.filter(m => m.billing_type === 'hourly' || m.billing_type === 'flat');
  const picker = clientMatterPicker(hourlyMatters);
  const body = el('div', {}, [
    picker,
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Issue date'), el('input', { name: 'issuedAt', type: 'date', value: todayDateInput() }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Due date'), el('input', { name: 'dueAt', type: 'date' }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Tax rate (e.g. 0.08)'), el('input', { name: 'taxRate', type: 'number', step: '0.001', value: '0' }) ]),
    ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Notes'), el('textarea', { name: 'notes' }) ]),
  ]);
  const generate = async () => {
    const d = {};
    $$('input[name=issuedAt], input[name=dueAt], input[name=taxRate], textarea[name=notes]', body).forEach(i => d[i.name] = i.value);
    const { matterId } = picker.getValues();
    d.matterId = matterId;
    d.taxRate = parseFloat(d.taxRate) || 0;
    if (!d.matterId) return toast('Choose a matter', true);
    const r = await api('/api/invoices', { method: 'POST', body: d });
    toast('Invoice ' + (r.number || '') + ' created');
    closeModal();
    navigate('invoices');
  };
  openModal('Generate invoice', body, el('div', {}, [
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: generate }, 'Generate'),
  ]));
}

async function openInvoiceDetail(id) {
  const inv = await api('/api/invoices/' + id);
  // Server inlines matter_number + client_number on the invoice payload so we
  // can render the firm-internal "{client#}-{matter#}" identifier without a
  // second round-trip.
  const matterFullId = fmtMatterFullId({
    matter_number: inv.matter_number,
    client_number: inv.client_number,
  });
  const matterIdent = matterFullId
    ? matterFullId + (inv.matter_name ? ' · ' + inv.matter_name : '')
    : '';
  const writedown = Number(inv.amount_writedown || 0);   // signed
  const paid      = Number(inv.amount_paid || 0);
  const netBilled = +(Number(inv.total || 0) + writedown).toFixed(2);
  const balance   = +(netBilled - paid).toFixed(2);
  const refresh = () => { closeModal(); openInvoiceDetail(id); };
  const payments    = inv.payments    || [];
  const adjustments = inv.adjustments || [];
  const settled = inv.status === 'paid' || inv.status === 'void' || balance <= 0.005;

  const summaryCell = (label, value, tone, sub) => el('div', {}, [
    el('div', { style: 'font-size:11px;color:var(--text-light);text-transform:uppercase;letter-spacing:.4px' }, label),
    el('div', { style: 'font-weight:600;font-size:15px' + (tone ? ';color:var(--' + tone + ')' : '') }, value),
    sub ? el('div', { style: 'font-size:11px;color:var(--text-muted);margin-top:2px' }, sub) : null,
  ]);

  const body = el('div', {}, [
    el('div', { class: 'grid grid-3 mb-12' }, [
      el('div', {}, [
        el('div', { style: 'font-size:11px;color:var(--text-light);text-transform:uppercase' }, 'Client'),
        inv.client_contact_id
          ? el('button', { style: 'font-weight:600;color:var(--blue);background:none;border:none;padding:0;cursor:pointer;text-align:left', onclick: () => { closeModal(); openContact(inv.client_contact_id); } }, inv.client_name || '—')
          : el('div', { style: 'font-weight:600' }, inv.client_name || '—'),
        (matterIdent && inv.matter_id)
          ? el('button', { style: 'font-size:12px;color:var(--blue);background:none;border:none;padding:0;cursor:pointer;text-align:left;display:block;margin-top:2px', onclick: async () => {
              const matters = state.matters || await api('/api/matters');
              const m = matters.find(x => x.id === inv.matter_id);
              if (m) { closeModal(); openMatterForm(m); }
            } }, matterIdent)
          : matterIdent ? el('div', { style: 'font-size:12px;color:var(--text-muted);margin-top:2px' }, matterIdent) : null,
      ]),
      el('div', {}, [
        el('div', { style: 'font-size:11px;color:var(--text-light);text-transform:uppercase' }, 'Issued'),
        el('div', { style: 'font-weight:600' }, fmt.date(inv.issued_at)),
      ]),
      el('div', {}, [
        el('div', { style: 'font-size:11px;color:var(--text-light);text-transform:uppercase' }, 'Status'),
        el('div', {}, el('span', { class: 'badge badge-status-' + inv.status }, inv.status)),
      ]),
    ]),
    el('div', { class: 'card mb-16' }, [
      el('div', { class: 'grid grid-4', style: 'gap:16px' }, [
        summaryCell('Gross billed', fmt.money(inv.total)),
        summaryCell('Write-downs', writedown === 0 ? '—' : fmt.money(-writedown), writedown < 0 ? 'red' : null,
          writedown !== 0 ? 'net adj. ' + fmt.money(writedown) : null),
        summaryCell('Cash received', fmt.money(paid)),
        summaryCell('Balance due', fmt.money(balance), balance > 0.005 && inv.status !== 'void' ? 'red' : 'green',
          inv.status === 'void' ? 'voided' : (settled ? 'settled' : 'open')),
      ]),
    ]),

    el('table', { class: 'data mb-16' }, [
      el('thead', {}, el('tr', {}, [ el('th', {}, 'Description'), el('th', { class: 'num' }, 'Qty'), el('th', { class: 'num' }, 'Rate'), el('th', { class: 'num' }, 'Amount') ])),
      el('tbody', {}, inv.lines.map(l => el('tr', {}, [
        el('td', {}, l.description),
        el('td', { class: 'num' }, String(l.quantity)),
        el('td', { class: 'num' }, fmt.money(l.rate)),
        el('td', { class: 'num' }, fmt.money(l.amount)),
      ]))),
    ]),

    // ── Payments ────────────────────────────────────────────────
    el('div', { class: 'card mb-12' }, [
      el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px' }, [
        el('strong', {}, 'Payments'),
        (can('manageBilling') && inv.status !== 'void' && balance > 0.005)
          ? el('button', { class: 'btn btn-primary btn-sm', onclick: () => openRecordPaymentForm(inv, refresh) }, '+ Record payment')
          : null,
      ]),
      payments.length === 0
        ? el('div', { class: 'empty', style: 'padding:8px' }, 'No payments recorded.')
        : el('table', { class: 'data' }, [
            el('thead', {}, el('tr', {}, [
              el('th', {}, 'Date'), el('th', {}, 'Method'), el('th', { class: 'num' }, 'Amount'),
              el('th', {}, 'Reference'), el('th', {}, 'Status'), el('th', {}, ''),
            ])),
            el('tbody', {}, payments.map(p => el('tr', {
              style: p.status === 'refunded' ? 'opacity:0.55;text-decoration:line-through' : '',
            }, [
              el('td', {}, fmt.date(p.occurred_at)),
              el('td', {}, p.method || '—'),
              el('td', { class: 'num' }, fmt.money(p.amount)),
              el('td', {}, p.reference || p.notes || '—'),
              el('td', {}, p.status),
              el('td', {}, (can('manageBilling') && p.status === 'succeeded' && !p.stripe_payment_intent_id)
                ? el('button', { class: 'btn btn-ghost btn-sm', onclick: async () => {
                    if (!confirm('Reverse this payment?' + (p.method === 'trust' ? '\nThe trust ledger entry will be reversed too.' : ''))) return;
                    try {
                      await api('/api/invoices/' + id + '/payments/' + p.id, { method: 'DELETE' });
                      toast('Payment reversed'); refresh();
                    } catch {}
                  } }, 'Reverse')
                : null),
            ]))),
          ]),
    ]),

    // ── Adjustments (write-downs / write-ups) ───────────────────
    el('div', { class: 'card mb-12' }, [
      el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px' }, [
        el('strong', {}, 'Write-downs & adjustments'),
        (can('manageBilling') && inv.status !== 'void')
          ? el('button', { class: 'btn btn-ghost btn-sm', onclick: () => openRecordAdjustmentForm(inv, refresh) }, '+ Record write-down')
          : null,
      ]),
      adjustments.length === 0
        ? el('div', { class: 'empty', style: 'padding:8px' }, 'No adjustments.')
        : el('table', { class: 'data' }, [
            el('thead', {}, el('tr', {}, [
              el('th', {}, 'Date'), el('th', {}, 'Kind'), el('th', { class: 'num' }, 'Amount'),
              el('th', {}, 'Reason'), el('th', {}, 'By'), el('th', {}, ''),
            ])),
            el('tbody', {}, adjustments.map(a => el('tr', {}, [
              el('td', {}, fmt.date(a.occurred_at)),
              el('td', {}, a.kind),
              el('td', { class: 'num', style: a.amount < 0 ? 'color:var(--red)' : 'color:var(--green)' }, fmt.money(a.amount)),
              el('td', {}, a.reason || '—'),
              el('td', {}, a.created_by || '—'),
              el('td', {}, can('manageBilling')
                ? el('button', { class: 'btn btn-ghost btn-sm', onclick: async () => {
                    if (!confirm('Delete this adjustment?')) return;
                    try {
                      await api('/api/invoices/' + id + '/adjustments/' + a.id, { method: 'DELETE' });
                      toast('Adjustment removed'); refresh();
                    } catch {}
                  } }, 'Delete')
                : null),
            ]))),
          ]),
    ]),

    el('div', { class: 'row mt-16', style: 'gap:12px' }, [
      el('div', { style: 'font-size:11px;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;font-weight:700' }, 'Status'),
      el('div', { class: 'btn-group' }, ['draft','sent','paid','void'].map(s => el('button', {
        class: inv.status === s ? 'active' : '',
        onclick: async () => {
          if (s === 'void' && !confirm('Void this invoice? This cannot be undone. Billed time entries will be released back to draft.')) return;
          await api('/api/invoices/' + id + '/status', { method: 'PATCH', body: { status: s } });
          toast('Marked ' + s); closeModal(); navigate('invoices');
        },
      }, s[0].toUpperCase() + s.slice(1)))),
      el('div', { class: 'spacer' }),
    ]),
  ]);
  openModal('Invoice ' + (inv.number || ''), body, el('div', {}, [
    inv.status === 'draft' ? el('button', { class: 'btn btn-danger btn-sm', onclick: async () => { if (!confirm('Delete draft?')) return; await api('/api/invoices/' + id, { method: 'DELETE' }); toast('Deleted'); closeModal(); navigate('invoices'); } }, 'Delete') : null,
    el('div', { class: 'spacer' }),
    inv.status === 'draft' ? el('button', { class: 'btn btn-ghost btn-sm', onclick: () => openInvoiceEdit(id) }, 'Edit') : null,
    (can('manageBilling') && inv.status !== 'void' && balance > 0.005)
      ? el('button', { class: 'btn btn-ghost btn-sm', onclick: () => copyPayLinkForInvoice(id) }, 'Pay link')
      : null,
    (can('manageBilling') && inv.status === 'sent' && balance > 0.005 && state.firm.smtpConfigured && inv.client_contact_id)
      ? el('button', { class: 'btn btn-ghost btn-sm', onclick: async (e) => {
          const btn = e.currentTarget;
          if (!confirm('Send a payment reminder to the client?\n\nA copy will be logged as an interaction.')) return;
          btn.disabled = true; btn.textContent = 'Sending…';
          try {
            const r = await api('/api/invoices/' + id + '/reminder', { method: 'POST' });
            toast('Reminder sent to ' + r.sentTo);
            btn.disabled = false; btn.textContent = 'Send reminder';
          } catch (err) {
            toast(err.message || 'Failed to send reminder', true);
            btn.disabled = false; btn.textContent = 'Send reminder';
          }
        }}, 'Send reminder')
      : null,
    el('a', { class: 'btn btn-gold btn-sm', href: '/api/invoices/' + id + '/pdf', target: '_blank' }, 'Download PDF'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: closeModal }, 'Close'),
  ]), true);
}

// Modal: record a manual payment against an invoice. Methods cover the legal
// reality — checks, wires, ACH, cash, plus 'trust' which simultaneously posts
// a fee-applied trust_ledger row server-side.
function openRecordPaymentForm(inv, onSaved) {
  const writedown = Number(inv.amount_writedown || 0);
  const balance = +(Number(inv.total || 0) + writedown - Number(inv.amount_paid || 0)).toFixed(2);
  const methods = [
    ['check', 'Check'],
    ['wire',  'Wire'],
    ['ach',   'ACH'],
    ['cash',  'Cash'],
    ['trust', 'Apply from trust'],
    ['manual','Other / manual'],
  ];
  const body = el('div', {}, [
    el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:12px' },
      'Invoice ' + (inv.number || inv.id) + ' · Balance due ' + fmt.money(balance)),
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [
        el('label', {}, 'Amount'),
        el('input', { name: 'amount', type: 'number', step: '0.01', min: '0', max: String(balance), value: balance.toFixed(2) }),
      ]),
      el('div', { class: 'field' }, [
        el('label', {}, 'Date received'),
        el('input', { name: 'occurredAt', type: 'date', value: todayDateInput() }),
      ]),
      el('div', { class: 'field' }, [
        el('label', {}, 'Method'),
        el('select', { name: 'method' }, methods.map(([v, l]) => el('option', { value: v }, l))),
      ]),
    ]),
    el('div', { class: 'field' }, [
      el('label', {}, 'Reference (check #, wire confirmation, etc.)'),
      el('input', { name: 'reference', type: 'text', placeholder: 'e.g. Check #1042' }),
    ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Notes'), el('textarea', { name: 'notes' }) ]),
  ]);
  const save = async () => {
    const get = (n) => body.querySelector('[name=' + n + ']');
    const amount = parseFloat(get('amount').value);
    if (!Number.isFinite(amount) || amount <= 0) return toast('Enter an amount', true);
    try {
      await api('/api/invoices/' + inv.id + '/payments', { method: 'POST', body: {
        amount,
        occurredAt: get('occurredAt').value ? new Date(get('occurredAt').value).toISOString() : undefined,
        method:    get('method').value,
        reference: get('reference').value || null,
        notes:     get('notes').value || null,
      }});
      toast('Payment recorded');
      closeModal();
      if (onSaved) onSaved();
    } catch {}
  };
  openModal('Record payment', body, el('div', {}, [
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: save }, 'Save payment'),
  ]));
}

// Modal: record a write-down or write-up. The amount input is always positive —
// the kind dropdown determines the sign server-side. Default is writedown
// since it's the dominant case (courtesy discounts, bad debt).
function openRecordAdjustmentForm(inv, onSaved) {
  const balance = +(Number(inv.total || 0) + Number(inv.amount_writedown || 0) - Number(inv.amount_paid || 0)).toFixed(2);
  const kinds = [
    ['writedown','Write-down'],
    ['courtesy', 'Courtesy discount'],
    ['bad_debt', 'Bad debt'],
    ['writeup',  'Write-up (increase)'],
  ];
  const body = el('div', {}, [
    el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:12px' },
      'Invoice ' + (inv.number || inv.id) + ' · Balance due ' + fmt.money(balance)),
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [
        el('label', {}, 'Amount (positive)'),
        el('input', { name: 'amount', type: 'number', step: '0.01', min: '0' }),
      ]),
      el('div', { class: 'field' }, [
        el('label', {}, 'Kind'),
        el('select', { name: 'kind' }, kinds.map(([v, l]) => el('option', { value: v }, l))),
      ]),
      el('div', { class: 'field' }, [
        el('label', {}, 'Date'),
        el('input', { name: 'occurredAt', type: 'date', value: todayDateInput() }),
      ]),
    ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Reason'),
      el('input', { name: 'reason', type: 'text', placeholder: 'e.g. Negotiated reduction' }) ]),
  ]);
  const save = async () => {
    const get = (n) => body.querySelector('[name=' + n + ']');
    const amount = parseFloat(get('amount').value);
    if (!Number.isFinite(amount) || amount <= 0) return toast('Enter an amount', true);
    try {
      await api('/api/invoices/' + inv.id + '/adjustments', { method: 'POST', body: {
        amount,
        kind: get('kind').value,
        occurredAt: get('occurredAt').value ? new Date(get('occurredAt').value).toISOString() : undefined,
        reason: get('reason').value || null,
      }});
      toast('Adjustment recorded');
      closeModal();
      if (onSaved) onSaved();
    } catch {}
  };
  openModal('Record write-down', body, el('div', {}, [
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: save }, 'Save adjustment'),

}

// Copies a pay link for the invoice to the clipboard. Reuses an unused,
// unexpired link if one already exists so reloads don't pile up dead links.
async function copyPayLinkForInvoice(id) {
  let url = null;
  try {
    const existing = await api('/api/invoices/' + id + '/payment-links').catch(() => []);
    const live = (existing || []).find(l => !l.used_at && !l.expired);
    if (live) {
      url = live.url;
    } else {
      const r = await api('/api/invoices/' + id + '/payment-link', { method: 'POST', body: { expiresInDays: 30 } });
      url = r.url;
    }
  } catch {
    // api() already surfaced the error via toast.
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    toast('Pay link copied');
  } catch {
    // Fallback for browsers without clipboard permission.
    window.prompt('Copy this pay link:', url);
  }
}

async function openInvoiceEdit(id) {
  const inv = await api('/api/invoices/' + id);
  if (inv.status !== 'draft') { toast('Only draft invoices can be edited', true); return; }
  const currentTaxRate = inv.subtotal > 0 ? +(inv.tax / inv.subtotal).toFixed(4) : 0;

      el('td', { class: 'num' }, qtyIn),
      el('td', { class: 'num' }, rateIn),

  const body = el('div', {}, [

      el('div', { class: 'field' }, [ el('label', {}, 'Due date'), el('input', { name: 'dueAt', type: 'date', value: toDate(inv.due_at) }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Tax rate (e.g. 0.08)'), taxInput ]),
    ]),
    el('table', { class: 'data' }, [
      el('thead', {}, el('tr', {}, [ el('th', {}, 'Description'), el('th', { class: 'num' }, 'Qty'), el('th', { class: 'num' }, 'Rate'), el('th', { class: 'num' }, 'Amount') ])),

function svgEl(tag, attrs, children) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, String(v)));
  if (children) [].concat(children).filter(Boolean).forEach(c => e.appendChild(c));
  return e;
}

// Horizontal bar chart — buckets: [{label, value, color?}]
function svgHbarChart(buckets) {
  const W = 480, rowH = 38, padV = 6, labelW = 84, valW = 80, barPad = 10;
  const barW = W - labelW - valW - barPad;
  const H = buckets.length * rowH + padV * 2;
  const total = buckets.reduce((s, b) => s + b.value, 0);
  const fallbacks = ['#4f86c6','#f59e0b','#ef4444','#6b7280','#10b981','#8b5cf6'];
  const svg = svgEl('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, style: 'display:block;max-width:100%;overflow:visible' });
  buckets.forEach((b, i) => {
    const y = padV + i * rowH;
    const pct = total > 0 ? b.value / total : 0;
    const color = b.color || fallbacks[i % fallbacks.length];
    const lbl = svgEl('text', { x: labelW - 6, y: y + rowH / 2 + 4, 'font-size': '12', 'text-anchor': 'end', fill: '#555' });
    lbl.textContent = b.label;
    svg.appendChild(lbl);
    svg.appendChild(svgEl('rect', { x: labelW, y: y + 6, width: barW, height: rowH - 12, rx: 3, fill: '#f0f0f0' }));
    if (pct > 0.002) {
      svg.appendChild(svgEl('rect', { x: labelW, y: y + 6, width: Math.max(4, barW * pct), height: rowH - 12, rx: 3, fill: color }));
    }
    const val = svgEl('text', { x: labelW + barW + barPad, y: y + rowH / 2 + 4, 'font-size': '12', 'font-weight': '600', fill: '#333' });
    val.textContent = b.value > 0 ? fmt.money(b.value) : '—';
    svg.appendChild(val);
  });
  return svg;
}

// Stacked vertical bar chart — periods: string[], getData(label) -> {stacks:[{value,color}]}
function svgVbarChart(periods, getData, opts = {}) {
  if (!periods.length) return el('div', { class: 'empty' }, 'No data');
  const W = Math.max(400, periods.length * 52 + 80);
  const H = opts.height || 180;
  const padL = 58, padR = 8, padT = 12, padB = 32;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const colW = chartW / periods.length;
  const barW = Math.min(colW * 0.55, 34);
  const totals = periods.map(p => getData(p).stacks.reduce((s, st) => s + st.value, 0));
  const maxVal = Math.max(...totals, 1);
  const svg = svgEl('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, style: 'display:block;min-width:' + W + 'px;overflow:visible' });
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const val = maxVal * i / steps;
    const y = padT + chartH - chartH * i / steps;
    svg.appendChild(svgEl('line', { x1: padL, y1: y, x2: padL + chartW, y2: y, stroke: '#e5e7eb', 'stroke-width': '1' }));
    const lbl = svgEl('text', { x: padL - 4, y: y + 4, 'font-size': '10', 'text-anchor': 'end', fill: '#999' });
    lbl.textContent = val >= 1000 ? '$' + Math.round(val / 1000) + 'k' : '$' + Math.round(val);
    svg.appendChild(lbl);
  }
  periods.forEach((p, i) => {
    const d = getData(p);
    const cx = padL + i * colW + colW / 2;
    const x = cx - barW / 2;
    let stackY = padT + chartH;
    d.stacks.forEach(st => {
      if (st.value <= 0) return;
      const bh = Math.max(2, (st.value / maxVal) * chartH);
      stackY -= bh;
      svg.appendChild(svgEl('rect', { x, y: stackY, width: barW, height: bh, rx: 2, fill: st.color || '#4f86c6' }));
    });
    const xlbl = svgEl('text', { x: cx, y: padT + chartH + 14, 'font-size': '10', 'text-anchor': 'middle', fill: '#777' });
    xlbl.textContent = p;
    svg.appendChild(xlbl);
  });
  return svg;
}

function makeCombobox(initOptions, selectedValue, onChange, placeholder) {
  let options = initOptions;
  let currentValue = selectedValue;
  let filtered = [...options];
  let highlightIdx = -1;

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = placeholder || '';
  input.style.cssText = 'width:100%;box-sizing:border-box';

  const dropdown = document.createElement('div');
  dropdown.style.cssText = 'position:absolute;left:0;right:0;background:#fff;border:1px solid #d1d5db;border-radius:6px;max-height:220px;overflow-y:auto;z-index:2000;box-shadow:0 4px 12px rgba(0,0,0,.12);display:none';

  const wrap = document.createElement('div');
  wrap.style.position = 'relative';
  wrap.appendChild(input);
  wrap.appendChild(dropdown);

  const labelOf = (val) => { const o = options.find(o => o.value === val); return o ? o.label : ''; };
  const setDisplay = (val) => { input.value = labelOf(val); };
  setDisplay(currentValue);

  const updateHighlight = () => {
    [...dropdown.children].forEach((item, i) => { item.style.background = i === highlightIdx ? '#f3f4f6' : ''; });
  };

  const renderDrop = () => {
    dropdown.innerHTML = '';
    filtered.forEach((opt, i) => {
      const item = document.createElement('div');
      item.style.cssText = 'padding:6px 10px;cursor:pointer;font-size:13px';
      item.textContent = opt.label || '—';
      item.addEventListener('mouseover', () => { highlightIdx = i; updateHighlight(); });
      item.addEventListener('mousedown', e => { e.preventDefault(); pick(opt.value); });
      dropdown.appendChild(item);
    });
    dropdown.style.display = filtered.length ? 'block' : 'none';
  };

  const pick = (val) => {
    currentValue = val;
    setDisplay(val);
    dropdown.style.display = 'none';
    highlightIdx = -1;
    onChange(val);
  };

  input.addEventListener('focus', () => {
    input.select();
    filtered = [...options];
    highlightIdx = -1;
    renderDrop();
  });
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase();
    filtered = options.filter(o => !q || o.label.toLowerCase().includes(q));
    highlightIdx = -1;
    renderDrop();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { highlightIdx = Math.min(highlightIdx + 1, filtered.length - 1); updateHighlight(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { highlightIdx = Math.max(highlightIdx - 1, 0); updateHighlight(); e.preventDefault(); }
    else if (e.key === 'Enter') { if (highlightIdx >= 0 && filtered[highlightIdx]) pick(filtered[highlightIdx].value); e.preventDefault(); }
    else if (e.key === 'Escape') { setDisplay(currentValue); dropdown.style.display = 'none'; }
  });
  input.addEventListener('blur', () => { setTimeout(() => { setDisplay(currentValue); dropdown.style.display = 'none'; }, 200); });

  return {
    el: wrap,
    getValue: () => currentValue,
    setValue: (val) => { currentValue = val; setDisplay(val); },
    setOptions: (opts) => { options = opts; filtered = [...opts]; },
  };
}

async function renderCashflow(mount, v) {
  const view = (state._profile && state._profile.cashflowView) || {};
  const today = new Date();
  const defaultFrom = new Date(today.getFullYear(), today.getMonth() - 11, 1).toISOString().slice(0, 10);
  const defaultTo   = today.toISOString().slice(0, 10);
  const params = {
    from:          view.from          || defaultFrom,
    to:            view.to            || defaultTo,
    granularity:   view.granularity   || 'month',
    clientId:      view.clientId      || '',
    matterId:      view.matterId      || '',
    attorneyEmail: view.attorneyEmail || '',
    attorneyRole:  view.attorneyRole  || 'originating',
    subTab:        view.subTab        || 'activity',
  };

  const persist = () => {
    if (!state._profile) state._profile = {};
    state._profile.cashflowView = { ...params };
    clearTimeout(renderCashflow._pt);
    renderCashflow._pt = setTimeout(() => api('/api/me/profile', { method: 'PUT', body: state._profile }).catch(() => {}), 400);
  };

  const [seatsData, clients, allMatters] = await Promise.all([
    api('/api/seats').catch(() => ({ users: [] })),
    api('/api/contacts?type=client').catch(() => []),
    api('/api/matters').catch(() => []),
  ]);
  if (isStaleRender(v)) return;

  const attorneys = ((seatsData && seatsData.users) || [])
    .filter(u => ['Admin','Partner','Associate'].includes(u.role));

  const buildMatterOpts = () => {
    const ms = (allMatters || []).filter(m => !params.clientId || String(m.contact_id) === String(params.clientId));
    return [
      { value: '', label: 'All matters' },
      ...ms.map(m => ({ value: String(m.id), label: (fmtMatterFullId(m) || '') + (m.description ? ' — ' + m.description : '') })),
    ];
  };

  const clientOpts = [
    { value: '', label: 'All clients' },
    ...(clients || []).map(c => ({ value: String(c.id), label: c.full_name })),
  ];

  const fromInput  = el('input', { type: 'date', value: params.from, onchange: e => { params.from = e.target.value; persist(); panelRefresh(); } });
  const toInput    = el('input', { type: 'date', value: params.to,   onchange: e => { params.to   = e.target.value; persist(); panelRefresh(); } });
  const granSel    = el('select', { onchange: e => { params.granularity = e.target.value; persist(); panelRefresh(); } },
    ['day','month','year'].map(g => el('option', { value: g, ...(params.granularity === g ? { selected: '' } : {}) }, g[0].toUpperCase() + g.slice(1))));

  const clientCombo = makeCombobox(clientOpts, params.clientId, val => {
    params.clientId = val; params.matterId = '';
    matterCombo.setValue('');
    matterCombo.setOptions(buildMatterOpts());
    persist(); panelRefresh();
  }, 'All clients');

  const matterCombo = makeCombobox(buildMatterOpts(), params.matterId, val => {
    params.matterId = val; persist(); panelRefresh();
  }, 'All matters');

  const attySel = el('select', { onchange: e => { params.attorneyEmail = e.target.value; persist(); panelRefresh(); } }, [
    el('option', { value: '' }, 'All attorneys'),
    ...attorneys.map(u => el('option', { value: u.email, ...(params.attorneyEmail === u.email ? { selected: '' } : {}) }, u.name || u.email)),
  ]);
  const attyRoleSel = el('select', { onchange: e => { params.attorneyRole = e.target.value; persist(); panelRefresh(); } }, [
    el('option', { value: 'originating', ...(params.attorneyRole === 'originating' ? { selected: '' } : {}) }, 'Originating'),
    el('option', { value: 'billing',     ...(params.attorneyRole === 'billing'     ? { selected: '' } : {}) }, 'Billing'),
  ]);

  const filterStrip = el('div', { class: 'card mb-16', style: 'padding:12px 16px' }, [
    el('div', { class: 'row', style: 'gap:10px;flex-wrap:wrap;align-items:flex-end' }, [
      el('div', { class: 'field', style: 'margin:0' }, [ el('label', {}, 'From'),     fromInput ]),
      el('div', { class: 'field', style: 'margin:0' }, [ el('label', {}, 'To'),       toInput ]),
      el('div', { class: 'field', style: 'margin:0' }, [ el('label', {}, 'Group by'), granSel ]),
      el('div', { class: 'field', style: 'margin:0;min-width:170px' }, [ el('label', {}, 'Client'),   clientCombo.el ]),
      el('div', { class: 'field', style: 'margin:0;min-width:170px' }, [ el('label', {}, 'Matter'),   matterCombo.el ]),
      el('div', { class: 'field', style: 'margin:0;min-width:150px' }, [ el('label', {}, 'Attorney'), attySel ]),
      el('div', { class: 'field', style: 'margin:0' },                 [ el('label', {}, 'Role'),     attyRoleSel ]),
      el('div', { class: 'spacer' }),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => {
        params.from = defaultFrom; params.to = defaultTo; params.granularity = 'month';
        params.clientId = ''; params.matterId = ''; params.attorneyEmail = ''; params.attorneyRole = 'originating';
        persist();
        fromInput.value = params.from; toInput.value = params.to; granSel.value = 'month';
        clientCombo.setValue(''); matterCombo.setValue(''); matterCombo.setOptions(buildMatterOpts());
        attySel.value = ''; attyRoleSel.value = 'originating';
        panelRefresh();
      } }, 'Reset'),
    ]),
  ]);

  const panelSlot = el('div', {});
  let panelRefresh = () => {};

  const buildQs = () => {
    const p = new URLSearchParams();
    if (params.from) p.set('from', params.from);
    if (params.to)   p.set('to',   params.to);
    p.set('granularity', params.granularity);
    if (params.clientId)      p.set('clientId',      params.clientId);
    if (params.matterId)      p.set('matterId',       params.matterId);
    if (params.attorneyEmail) { p.set('attorneyEmail', params.attorneyEmail); p.set('attorneyRole', params.attorneyRole); }
    return p.toString();
  };

  const subTabDefs = [
    { key: 'activity',       label: 'Activity',        fn: renderCashflowActivityPanel },
    { key: 'aging',          label: 'AR Aging',         fn: renderCashflowAgingPanel },
    { key: 'receipts',       label: 'Cash Receipts',    fn: renderCashflowReceiptsPanel },
    { key: 'origination',    label: 'Origination',      fn: renderCashflowOriginationPanel },
    { key: 'reconciliation', label: 'Reconciliation',   fn: renderCashflowReconciliationPanel },
  ];

  const tabBar = el('div', { class: 'settings-tabs' });
  subTabDefs.forEach(t => {
    const btn = el('button', {
      class: params.subTab === t.key ? 'active' : '',
      onclick: () => {
        params.subTab = t.key; persist();
        [...tabBar.children].forEach(b => b.classList.toggle('active', b === btn));
        panelSlot.innerHTML = '';
        panelRefresh = () => t.fn(panelSlot, buildQs);
        panelRefresh();
      },
    }, t.label);
    tabBar.appendChild(btn);
  });

  const activeDef = subTabDefs.find(t => t.key === params.subTab) || subTabDefs[0];
  panelRefresh = () => activeDef.fn(panelSlot, buildQs);
  panelRefresh();

  mount.innerHTML = '';
  mount.appendChild(filterStrip);
  mount.appendChild(tabBar);
  mount.appendChild(panelSlot);
}

async function renderCashflowActivityPanel(slot, buildQs) {
  slot.innerHTML = '<div class="empty" style="padding:24px"><span class="loader"></span></div>';
  let data;
  try { data = await api('/api/reports/cashflow?' + buildQs()); }
  catch { slot.innerHTML = '<div class="empty">Could not load activity data.</div>'; return; }

  const t = data.totals || {};
  const periods = data.periods || [];
  const gran = data.granularity || 'month';

  const periodLabel = p => {
    if (gran === 'year') return p;
    if (gran === 'month') {
      const [y, m] = p.split('-');
      return new Date(Number(y), Number(m) - 1, 1).toLocaleString('en-US', { month: 'short', year: '2-digit' });
    }
    return fmt.date(p);
  };

  const stat = (label, value, sub, tone) => el('div', { class: 'stat-card' }, [
    el('div', { class: 'stat-label' }, label),
    el('div', { class: 'stat-value', style: tone ? 'color:var(--' + tone + ')' : '' }, value),
    sub ? el('div', { style: 'font-size:11px;color:var(--text-muted);margin-top:2px' }, sub) : null,
  ]);

  const statsRow = el('div', { class: 'grid grid-4 mb-16' });
  statsRow.appendChild(stat('Billed (gross)',  fmt.money(t.billed_gross || 0)));
  statsRow.appendChild(stat('Write-downs',     fmt.money(t.writedowns   || 0), null, t.writedowns > 0 ? 'red' : null));
  statsRow.appendChild(stat('Cash received',   fmt.money(t.cash_received || 0)));
  statsRow.appendChild(stat('Realization',
    t.realization_rate == null ? '—' : Math.round(t.realization_rate * 100) + '%',
    'cash ÷ net billed (' + fmt.money(t.net_billed || 0) + ')'));

  const chartCard = el('div', { class: 'card mb-16' }, [
    el('div', { style: 'font-weight:600;margin-bottom:12px' }, 'Billed vs. Cash received by period'),
  ]);
  if (periods.length > 0) {
    const wrap = el('div', { style: 'overflow-x:auto' });
    wrap.appendChild(svgVbarChart(
      periods.map(r => periodLabel(r.period)),
      p => {
        const r = periods.find(row => periodLabel(row.period) === p) || {};
        return { stacks: [
          { value: r.cash_received || 0, color: '#4f86c6' },
          { value: Math.max(0, (r.billed_gross || 0) - (r.cash_received || 0)), color: '#c7d9f0' },
        ]};
      },
      { height: 200 }
    ));

          m.replace('_', ' '),

    el('div', { style: 'font-weight:600;margin-bottom:12px' }, 'By payment method'),
  ]);
  if (methodEntries.length) {

      label: m.replace('_', ' '), value: v, color: CASHFLOW_METHOD_COLORS[m] || CASHFLOW_METHOD_COLORS.other,

// Parse OFX/QFX file text into transaction rows (client-side, no library needed)
function parseOFX(text) {
  const blocks = [];
  // Try XML format first (<STMTTRN>...</STMTTRN>)
  const xmlRe = /<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi;
  let m;
  while ((m = xmlRe.exec(text)) !== null) blocks.push(m[1]);
  // Fall back to SGML (no closing tags — delimit by next <STMTTRN> or end marker)
  if (!blocks.length) {
    const sgmlRe = /<STMTTRN>([\s\S]*?)(?=<STMTTRN>|<\/BANKTRANLIST>|<LEDGERBAL>|<\/OFX>)/gi;
    while ((m = sgmlRe.exec(text)) !== null) blocks.push(m[1]);
  }
  return blocks.map(b => {
    const get = tag => { const r = new RegExp('<' + tag + '>([^<\\r\\n]+)', 'i').exec(b); return r ? r[1].trim() : null; };
    const fitid  = get('FITID');
    const dtraw  = (get('DTPOSTED') || get('DTAVAIL') || '').replace(/\[.*/, '');
    const amt    = parseFloat(get('TRNAMT') || '0');
    const ds     = dtraw.slice(0, 8);
    const posted = ds.length === 8 ? ds.slice(0,4) + '-' + ds.slice(4,6) + '-' + ds.slice(6,8) : null;
    return {
      id:          fitid ? 'ofx_' + fitid : null,
      posted_at:   posted,
      amount:      isNaN(amt) ? 0 : amt,
      counterparty: get('NAME') || get('PAYEE') || null,
      memo:        get('MEMO') || null,
    };
  }).filter(t => t.id && t.posted_at);
}

async function renderCashflowReconciliationPanel(slot) {
  slot.innerHTML = '<div class="empty" style="padding:24px"><span class="loader"></span></div>';
  let data;
  try { data = await api('/api/bank/transactions'); }
  catch { slot.innerHTML = '<div class="empty">Could not load bank transactions.</div>'; return; }

  const allTxns    = data.transactions || [];
  const lastSynced = data.lastSyncedAt;

  // State
  let showAll      = false;
  let selectedTxId = null;
  let payments     = [];

  const render = () => {
    slot.innerHTML = '';

    // ── Controls row ──────────────────────────────────────────────────
    const controls = el('div', { style: 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px' }, [
      el('button', { class: 'btn btn-primary btn-sm', id: 'recon-sync-btn', onclick: async () => {
        const btn = $('#recon-sync-btn');
        btn.disabled = true; btn.textContent = 'Syncing…';
        try {
          const r = await api('/api/bank/sync', { method: 'POST' });
          toast('Synced ' + r.fetched + ' transactions');
          data = await api('/api/bank/transactions');
          allTxns.length = 0; allTxns.push(...(data.transactions || []));
          render();
        } catch(e) {
          toast('Sync failed — check Mercury credentials');
          btn.disabled = false; btn.textContent = 'Sync Mercury';
        }
      }}, 'Sync Mercury'),
      el('div', { style: 'font-size:12px;color:var(--text-muted)' },
        lastSynced ? 'Last synced ' + fmt.date(lastSynced) : 'Not synced yet'),
      el('label', { style: 'display:flex;align-items:center;gap:6px;font-size:13px;margin-left:auto;cursor:pointer' }, [
        el('input', { type: 'checkbox', ...(showAll ? { checked: 'checked' } : {}), onchange: e => { showAll = e.target.checked; selectedTxId = null; render(); } }),
        'Show reconciled',
      ]),
      // OFX import
      (() => {
        const fileIn = el('input', { type: 'file', accept: '.ofx,.qfx,.OFX,.QFX', style: 'display:none' });
        fileIn.onchange = async () => {
          const file = fileIn.files[0];
          if (!file) return;
          const text = await file.text();
          const parsed = parseOFX(text);
          if (!parsed.length) { toast('No transactions found in file'); return; }
          const role = prompt('Account type for this import?\n"operating" or "trust"', 'operating');
          if (!role) return;
          const r = await api('/api/bank/import', { method: 'POST', body: { transactions: parsed, accountRole: role.trim().toLowerCase() } });
          toast('Imported ' + r.inserted + ' new of ' + r.total + ' transactions');
          data = await api('/api/bank/transactions');
          allTxns.length = 0; allTxns.push(...(data.transactions || []));
          render();
        };
        const btn = el('button', { class: 'btn btn-ghost btn-sm', onclick: () => fileIn.click() }, 'Import OFX/QFX');
        const wrap = el('span'); wrap.appendChild(fileIn); wrap.appendChild(btn);
        return wrap;
      })(),
    ]);
    slot.appendChild(controls);

    const txns = showAll ? allTxns : allTxns.filter(t => !t.reconciled_payment_id);
    if (!txns.length) {
      slot.appendChild(el('div', { class: 'empty' }, showAll ? 'No bank transactions. Sync Mercury or import an OFX file.' : 'All transactions reconciled.'));
      return;
    }

    // ── Transaction table ─────────────────────────────────────────────
    const unrecCount = allTxns.filter(t => !t.reconciled_payment_id).length;
    slot.appendChild(el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:8px' },
      unrecCount + ' unreconciled · ' + allTxns.length + ' total'));

    const tbody = el('tbody');
    txns.forEach(tx => {
      const isSelected = tx.id === selectedTxId;
      const isReconc   = !!tx.reconciled_payment_id;
      const row = el('tr', {
        style: isSelected ? 'background:var(--blue-light, #e8f0fe);cursor:pointer' : (isReconc ? 'opacity:.65;cursor:default' : 'cursor:pointer'),
        onclick: () => {
          if (isReconc) return;
          selectedTxId = isSelected ? null : tx.id;
          render();
        },
      }, [
        el('td', {}, fmt.date(tx.posted_at)),
        el('td', {}, tx.counterparty || tx.memo || '—'),
        el('td', { class: 'num', style: 'font-weight:500;color:' + (tx.amount >= 0 ? 'var(--green)' : 'var(--red)') },
          (tx.amount >= 0 ? '+' : '') + fmt.money(tx.amount)),
        el('td', {}, tx.account_role || '—'),
        el('td', { style: 'font-size:11px' },
          isReconc
            ? el('span', { style: 'color:var(--green)' }, '✓ Inv #' + (tx.invoice_number || '?') + (tx.client_name ? ' · ' + tx.client_name : ''))
            : el('span', { style: 'color:var(--text-muted)' }, '—')
        ),
        el('td', { style: 'text-align:right' },
          isReconc
            ? el('button', { class: 'btn btn-ghost btn-sm', style: 'font-size:11px', onclick: async e => {
                e.stopPropagation();
                if (!confirm('Clear reconciliation for this transaction?')) return;
                await api('/api/bank/transactions/' + tx.id + '/unreconcile', { method: 'PATCH' });
                toast('Cleared');
                data = await api('/api/bank/transactions');
                allTxns.length = 0; allTxns.push(...(data.transactions || []));
                render();
              }}, 'Clear')
            : el('button', { class: 'btn btn-ghost btn-sm', style: 'font-size:11px', onclick: async e => {
                e.stopPropagation();
                selectedTxId = tx.id;
                render();
                // Load payments and scroll to picker
                await loadPaymentPicker(tx);
              }}, 'Match')
        ),
      ]);
      tbody.appendChild(row);
    });
    slot.appendChild(el('div', { class: 'card mb-16', style: 'overflow-x:auto' }, [
      el('table', { class: 'data' }, [
        el('thead', {}, el('tr', {}, [
          el('th', {}, 'Date'), el('th', {}, 'Description'), el('th', { class: 'num' }, 'Amount'),
          el('th', {}, 'Account'), el('th', {}, 'Reconciled to'), el('th'),
        ])),
        tbody,
      ]),
    ]));

    // ── Payment picker (shown when a tx is selected) ───────────────────
    if (selectedTxId) {
      const selTx = allTxns.find(t => t.id === selectedTxId);
      const pickerCard = el('div', { class: 'card', id: 'payment-picker-card' }, [
        el('div', { style: 'font-weight:600;margin-bottom:4px' }, 'Match to an invoice payment'),
        el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:12px' },
          'Showing unreconciled payments. Closest amount matches listed first.'),
        el('div', { id: 'payment-picker-body' }, [ el('div', { class: 'empty' }, el('span', { class: 'loader' })) ]),
      ]);
      slot.appendChild(pickerCard);
      loadPaymentPicker(selTx);
    }
  };

  const loadPaymentPicker = async (tx) => {
    if (!payments.length) {
      try { payments = await api('/api/bank/unreconciled-payments'); }
      catch { payments = []; }
    }
    const body = $('#payment-picker-body');
    if (!body) return;
    body.innerHTML = '';
    if (!payments.length) {
      body.appendChild(el('div', { class: 'empty' }, 'No unreconciled invoice payments found.'));
      return;
    }
    // Sort by closeness to tx amount
    const sorted = [...payments].sort((a, b) => Math.abs(Math.abs(Number(a.amount)) - Math.abs(tx.amount)) - Math.abs(Math.abs(Number(b.amount)) - Math.abs(tx.amount)));
    const tbody = el('tbody');
    sorted.slice(0, 50).forEach(p => {
      tbody.appendChild(el('tr', {}, [
        el('td', {}, fmt.date(p.occurred_at)),
        el('td', {}, p.client_name || '—'),
        el('td', {}, p.invoice_number ? 'Inv #' + p.invoice_number : '—'),
        el('td', { class: 'num' }, fmt.money(p.amount)),
        el('td', {}, (p.method || '').replace('_', ' ')),
        el('td', { style: 'text-align:right' }, [
          el('button', { class: 'btn btn-primary btn-sm', onclick: async () => {
            await api('/api/bank/transactions/' + tx.id + '/reconcile', { method: 'PATCH', body: { paymentId: p.id } });
            toast('Matched');
            selectedTxId = null;
            payments = [];
            data = await api('/api/bank/transactions');
            allTxns.length = 0; allTxns.push(...(data.transactions || []));
            render();
          }}, 'Match'),
        ]),
      ]));
    });
    body.appendChild(el('table', { class: 'data' }, [
      el('thead', {}, el('tr', {}, [
        el('th', {}, 'Date'), el('th', {}, 'Client'), el('th', {}, 'Invoice'),
        el('th', { class: 'num' }, 'Amount'), el('th', {}, 'Method'), el('th'),
      ])),
      tbody,
    ]));
  };

  render();
}
