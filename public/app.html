// ── Day View — focus on one date with week-strip nav ────────────────────
function fmtHourLabel(h) {
  if (h === 0) return '12 AM';
  if (h === 12) return '12 PM';
  return h < 12 ? `${h} AM` : `${h - 12} PM`;
}

function renderTimeDay(mount, weekEntries, matters, tv) {
  const day = tv.day;
  const dayEntries = weekEntries.filter(t => t.date === day);
  const sum = dayEntries.reduce((a, t) => { a.min += t.minutes; if (t.billable) a.bill += t.minutes; return a; }, { min: 0, bill: 0 });

  // Week strip — 7 cells, each with day label and total hours
  const ws = weekStartSunday(day);
  const dayHeaders = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const minutesByDate = weekEntries.reduce((a, t) => { a[t.date] = (a[t.date] || 0) + t.minutes; return a; }, {});
  const today = todayYmd();
  const stripMax = Math.max(1, ...Object.values(minutesByDate));
  const stripCells = Array.from({ length: 7 }, (_, i) => {
    const d = shiftDay(ws, i);
    const mins = minutesByDate[d] || 0;
    const isSelected = d === day;
    const isToday = d === today;
    const intensity = mins / stripMax;
    const dayNum = parseInt(d.slice(8, 10), 10);
    const monthShort = new Date(d + 'T00:00:00Z').toLocaleDateString(undefined, { month: 'short', timeZone: 'UTC' });
    return el('button', {
      class: 'btn',
      style: `flex:1;min-width:0;padding:8px 4px;border:1px solid ${isSelected ? 'var(--accent,#2563eb)' : 'var(--border)'};border-radius:6px;background:${isSelected ? 'rgba(37,99,235,0.12)' : `rgba(37,99,235,${0.04 + intensity * 0.18})`};cursor:pointer;text-align:center;${isToday ? 'outline:2px dashed var(--accent,#2563eb);outline-offset:-3px;' : ''}`,
      onclick: () => { tv.day = d; navigate('time'); },
    }, [
      el('div', { style: 'font-size:11px;color:var(--text-muted);font-weight:500' }, dayHeaders[i]),
      el('div', { style: `font-size:18px;font-weight:600;color:${isSelected ? 'var(--accent,#2563eb)' : 'var(--text)'}` }, String(dayNum)),
      el('div', { style: 'font-size:10px;color:var(--text-muted)' }, monthShort),
      el('div', { style: 'font-size:11px;font-weight:600;margin-top:3px;color:var(--text)' }, mins ? (mins/60).toFixed(1) + ' hr' : '—'),
    ]);
  });

  mount.appendChild(el('div', { style: 'display:flex;gap:6px;margin-bottom:16px' }, stripCells));
  mount.appendChild(el('h3', { style: 'margin:0 0 12px;font-size:18px' }, dayLabel(day)));
  mount.appendChild(timeStatCards(sum.min, sum.bill, dayEntries.length));

  // Untimed entries (no start_time) — listed above the schedule.
  // Draft rows can be click-edited or dragged onto the schedule to assign a start time.
  const untimed = dayEntries.filter(t => !t.start_time);
  const timed   = dayEntries.filter(t => t.start_time);
  const draggableUntimed = [];  // { row, entry } pairs wired up below, after grid/helpers exist
  if (untimed.length) {
    mount.appendChild(el('div', { class: 'card mb-16' }, [
      el('div', { style: 'font-weight:600;margin-bottom:4px' }, 'Untimed entries'),
      el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:8px' },
        'Drag a row onto the schedule below to assign a start time. Click to edit.'),
      el('table', { class: 'data' }, [
        el('thead', {}, el('tr', {}, [ el('th', {}, 'User'), el('th', {}, 'Matter'), el('th', { class: 'num' }, 'Hours'), el('th', {}, 'Description'), el('th', {}, 'Status') ])),
        el('tbody', {}, untimed.map(t => {
          const matter = matters.find(m => m.id === t.matter_id);
          const row = el('tr', {}, [
            el('td', {}, userShortName(t.user_email)),
            el('td', {}, matter?.name || '—'),
            el('td', { class: 'num' }, (t.minutes/60).toFixed(2)),
            el('td', {}, t.description || '—'),
            el('td', {}, el('span', { class: 'badge badge-status-' + t.status }, t.status)),
          ]);
          row.style.cursor = 'grab';
          row.style.userSelect = 'none';
          draggableUntimed.push({ row, entry: t });
          return row;
        })),
      ]),
    ]));
  }

  // Hourly schedule grid — 6 AM to 10 PM by default
  const HOUR_START = 6, HOUR_END = 22, ROW_HEIGHT = 48, GUTTER = 60;
  const totalHours = HOUR_END - HOUR_START;
  const gridHeight = totalHours * ROW_HEIGHT;

  const grid = el('div', {
    style: `position:relative;height:${gridHeight}px;border:1px solid var(--border);border-radius:6px;background:#fff;overflow:hidden`,
  });

  // Hour labels + visual row borders (no click handlers — click goes to scheduleArea below)
  for (let h = HOUR_START; h < HOUR_END; h++) {
    const top = (h - HOUR_START) * ROW_HEIGHT;
    grid.appendChild(el('div', {
      style: `position:absolute;top:${top}px;left:0;width:${GUTTER}px;height:${ROW_HEIGHT}px;padding:4px 8px;font-size:11px;color:var(--text-muted);border-top:1px solid var(--border);background:var(--gray-bg);box-sizing:border-box;pointer-events:none`,
    }, fmtHourLabel(h)));
    grid.appendChild(el('div', {
      style: `position:absolute;top:${top}px;left:${GUTTER}px;right:0;height:${ROW_HEIGHT}px;border-top:1px solid var(--border);pointer-events:none`,
    }));
  }

  // Half-hour separator lines
  for (let h = HOUR_START; h < HOUR_END; h++) {
    const top = (h - HOUR_START) * ROW_HEIGHT + ROW_HEIGHT / 2;
    grid.appendChild(el('div', {
      style: `position:absolute;top:${top}px;left:${GUTTER}px;right:0;height:0;border-top:1px dashed var(--border);pointer-events:none`,
    }));
  }

  // Click-or-drag area: covers the schedule region (under entry blocks, over hour borders).
  // A plain click opens a 15-min entry at that time; drag to size a longer block.
  const scheduleArea = el('div', {
    style: `position:absolute;top:0;left:${GUTTER}px;right:0;height:${gridHeight}px;cursor:pointer;z-index:0`,
    title: 'Click to add a 15-min entry, or drag to size',
  });
  grid.appendChild(scheduleArea);

  const minutesToTimeStr = (m) => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
  const yToMinutes = (y) => HOUR_START * 60 + Math.round((y / ROW_HEIGHT) * 4) * 15; // snap to 15-min
  const clampMin = (m) => Math.max(HOUR_START * 60, Math.min(HOUR_END * 60, m));

  let dragStart = null;
  let ghostEl = null;
  const removeGhost = () => { if (ghostEl) { ghostEl.remove(); ghostEl = null; } };
  const drawGhost = (startMin, endMin) => {
    removeGhost();
    const top = ((startMin - HOUR_START * 60) / 60) * ROW_HEIGHT;
    const height = Math.max(2, ((endMin - startMin) / 60) * ROW_HEIGHT - 2);
    ghostEl = el('div', {
      style: `position:absolute;top:${top}px;left:calc(${GUTTER}px + 2px);right:2px;height:${height}px;background:rgba(37,99,235,0.22);border:2px dashed var(--accent,#2563eb);border-radius:4px;pointer-events:none;z-index:5;padding:4px 8px;font-size:12px;color:var(--accent,#2563eb);font-weight:600;box-sizing:border-box;overflow:hidden`,
    }, `${minutesToTimeStr(startMin)} – ${minutesToTimeStr(endMin)} · ${((endMin-startMin)/60).toFixed(2)} hr`);
    grid.appendChild(ghostEl);
  };

  // Ghost drag supports both directions: starting point is the mousedown;
  // start/end are derived as min/max of anchor and current cursor.
  const computeRange = (ev) => {
    const rect = scheduleArea.getBoundingClientRect();
    const cur = clampMin(yToMinutes(ev.clientY - rect.top));
    let startMin = Math.min(dragStart, cur);
    let endMin   = Math.max(dragStart, cur);
    if (endMin - startMin < 15) {
      // Single-click or tiny drag: grow 15 min downward if possible, else upward
      if (startMin + 15 <= HOUR_END * 60) endMin = startMin + 15;
      else startMin = endMin - 15;
    }
    return { startMin, endMin };
  };
  const onMove = (ev) => {
    if (dragStart == null) return;
    const { startMin, endMin } = computeRange(ev);
    drawGhost(startMin, endMin);
  };
  const onUp = (ev) => {
    if (dragStart == null) return;
    const { startMin, endMin } = computeRange(ev);
    dragStart = null;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    removeGhost();
    openTimeForm(null, matters, {
      date: day,
      startTime: minutesToTimeStr(startMin),
      hours: ((endMin - startMin) / 60).toFixed(2),
    });
  };

  scheduleArea.addEventListener('mousedown', (ev) => {
    if (ev.button !== 0) return;
    ev.preventDefault();
    const rect = scheduleArea.getBoundingClientRect();
    dragStart = clampMin(yToMinutes(ev.clientY - rect.top));
    drawGhost(dragStart, Math.min(dragStart + 15, HOUR_END * 60));
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Today's now-line
  const nowDate = new Date();
  if (day === todayYmd()) {
    const nowHour = nowDate.getHours() + nowDate.getMinutes() / 60;
    if (nowHour >= HOUR_START && nowHour < HOUR_END) {
      const nowTop = (nowHour - HOUR_START) * ROW_HEIGHT;
      grid.appendChild(el('div', {
        style: `position:absolute;top:${nowTop}px;left:${GUTTER - 4}px;right:0;height:0;border-top:2px solid #ef4444;pointer-events:none;z-index:2`,
      }));
    }
  }

  // Render timed entries as positioned blocks
  // Color-code per user (deterministic hash to a hue)
  const userHue = (email) => {
    let h = 0; for (const c of email) h = (h * 31 + c.charCodeAt(0)) | 0;
    return Math.abs(h) % 360;
  };
  // Group overlapping entries into columns so they don't fully cover each other
  const sortedTimed = [...timed].sort((a, b) => (a.start_time || '').localeCompare(b.start_time || ''));
  const minutesFromStart = (t) => {
    const [hh, mm] = t.start_time.split(':').map(Number);
    return hh * 60 + mm;
  };
  const minutesEnd = (t) => minutesFromStart(t) + t.minutes;
  // Greedy column assignment
  const blocks = sortedTimed.map(t => ({ t, col: 0, cols: 1 }));
  const active = []; // [{end, col}]
  blocks.forEach(b => {
    const start = minutesFromStart(b.t);
    // free up columns
    for (let i = active.length - 1; i >= 0; i--) if (active[i].end <= start) active.splice(i, 1);
    const usedCols = new Set(active.map(a => a.col));
    let col = 0;
    while (usedCols.has(col)) col++;
    b.col = col;
    active.push({ end: minutesEnd(b.t), col });
  });
  // Compute overall column count for each cluster
  const maxCols = blocks.reduce((m, b) => Math.max(m, b.col + 1), 1);
  blocks.forEach(b => { b.cols = maxCols; });

  blocks.forEach(({ t, col, cols }) => {
    const startMin = minutesFromStart(t);
    const startHour = startMin / 60;
    if (startHour >= HOUR_END) return;
    const top = Math.max(0, (startHour - HOUR_START) * ROW_HEIGHT);
    const visibleMin = Math.min(t.minutes, (HOUR_END * 60) - startMin);
    const height = Math.max(20, (visibleMin / 60) * ROW_HEIGHT - 2);
    const widthPct = 100 / cols;
    const leftPct = col * widthPct;
    const hue = userHue(t.user_email);
    const matter = matters.find(m => m.id === t.matter_id);
    const block = el('div', {
      style: `position:absolute;top:${top}px;left:calc(${GUTTER}px + ${leftPct}% + 2px);width:calc(${widthPct}% - 4px);height:${height}px;background:hsl(${hue} 70% 92%);border-left:3px solid hsl(${hue} 60% 50%);border-radius:4px;padding:4px 6px;font-size:11px;cursor:grab;overflow:hidden;box-sizing:border-box;z-index:1;user-select:none`,
      title: `${userShortName(t.user_email)} — ${(t.minutes/60).toFixed(2)} hr — ${t.description || ''}`,
    }, [
      el('div', { style: 'font-weight:600;color:#1a2332' }, `${t.start_time} · ${(t.minutes/60).toFixed(2)} hr`),
      el('div', { style: 'color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, userShortName(t.user_email) + ' · ' + (matter?.name || '—')),
      height > 50 ? el('div', { style: 'color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, t.description || '') : null,
    ]);

    // Every block is click-and-drag. Mousedown starts a drag; a 4px threshold
    // distinguishes drag from click-to-edit. The server is the source of truth
    // on whether the edit/move is permitted (e.g. billed entries are locked) —
    // on rejection we toast and revert.
    block.addEventListener('mousedown', (ev) => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      ev.stopPropagation();
      const mouseDownY = ev.clientY;
      const origTop = top;
      const blockHeightMin = t.minutes;
      const snapPx = ROW_HEIGHT / 4;
      const maxTop = (HOUR_END - HOUR_START) * ROW_HEIGHT - (blockHeightMin / 60) * ROW_HEIGHT;
      let moved = false;
      block.style.cursor = 'grabbing';
      block.style.zIndex = '10';
      block.style.opacity = '0.85';

      const onDragMove = (e) => {
        const dy = e.clientY - mouseDownY;
        if (Math.abs(dy) > 4) moved = true;
        const snappedDy = Math.round(dy / snapPx) * snapPx;
        const newTop = Math.max(0, Math.min(maxTop, origTop + snappedDy));
        block.style.top = newTop + 'px';
      };
      const onDragUp = async () => {
        document.removeEventListener('mousemove', onDragMove);
        document.removeEventListener('mouseup', onDragUp);
        block.style.cursor = 'grab';
        block.style.zIndex = '1';
        block.style.opacity = '1';
        if (!moved) {
          openTimeForm(t, matters);
          return;
        }
        const finalTop = parseFloat(block.style.top);
        const newStartMin = Math.round((HOUR_START * 60 + (finalTop / ROW_HEIGHT) * 60) / 15) * 15;
        const newStartTime = minutesToTimeStr(newStartMin);
        if (newStartTime === t.start_time) { block.style.top = origTop + 'px'; return; }
        const scroller = document.querySelector('.content');
        const savedScroll = scroller ? scroller.scrollTop : window.scrollY;
        try {
          await api('/api/time/' + t.id, { method: 'PUT', body: { startTime: newStartTime } });
          toast('Moved to ' + newStartTime);
          await navigate('time');
          if (scroller) scroller.scrollTop = savedScroll;
          else window.scrollTo(0, savedScroll);
        } catch (err) {
          block.style.top = origTop + 'px';
        }
      };
      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', onDragUp);
    });

    grid.appendChild(block);
  });

  mount.appendChild(el('div', { style: 'font-weight:600;margin:8px 0' }, 'Schedule'));
  mount.appendChild(el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:8px' }, 'Click an empty slot to add a time entry (or drag to size). Click a block to edit, or drag it to reschedule.'));
  mount.appendChild(grid);

  // Wire drag-to-schedule on untimed rows now that scheduleArea + helpers exist
  for (const { row, entry } of draggableUntimed) {
    row.addEventListener('mousedown', (ev) => {
      if (ev.button !== 0) return;
      // Let clicks on buttons/links inside the row behave normally
      if (ev.target.closest('button, a, input, select, textarea')) return;
      ev.preventDefault();
      const mouseDownY = ev.clientY;
      let dragging = false;
      const durationMin = entry.minutes;
      const clampStart = (m) => Math.max(HOUR_START * 60, Math.min(HOUR_END * 60 - durationMin, m));
      const onMove = (e) => {
        const dy = e.clientY - mouseDownY;
        if (!dragging && Math.abs(dy) < 4) return;
        dragging = true;
        const rect = scheduleArea.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const xOver = e.clientX >= rect.left && e.clientX <= rect.right;
        if (!xOver || y < 0 || y > gridHeight) { removeGhost(); return; }
        const startMin = clampStart(yToMinutes(y));
        drawGhost(startMin, startMin + durationMin);
      };
      const onUp = async (e) => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if (!dragging) {
          // Treat as click → open edit
          openTimeForm(entry, matters);
          return;
        }
        const rect = scheduleArea.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const xOver = e.clientX >= rect.left && e.clientX <= rect.right;
        removeGhost();
        if (!xOver || y < 0 || y > gridHeight) return; // released outside the grid = no-op
        const startMin = Math.round(clampStart(yToMinutes(y)) / 15) * 15;
        const newStartTime = minutesToTimeStr(startMin);
        const scroller = document.querySelector('.content');
        const savedScroll = scroller ? scroller.scrollTop : window.scrollY;
        try {
          await api('/api/time/' + entry.id, { method: 'PUT', body: { startTime: newStartTime } });
          toast('Scheduled at ' + newStartTime);
          await navigate('time');
          if (scroller) scroller.scrollTop = savedScroll;
          else window.scrollTo(0, savedScroll);
        } catch (err) {
          toast('Could not schedule entry', true);
        }
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }
}

// ── Month View — focus on one month with year-strip nav ─────────────────
function renderTimeMonth(mount, yearEntries, matters, tv) {
  const month = tv.month;
  const year = parseInt(month.split('-')[0], 10);
  const monthEntries = yearEntries.filter(t => t.date.startsWith(month + '-'));
  const sum = monthEntries.reduce((a, t) => { a.min += t.minutes; if (t.billable) a.bill += t.minutes; return a; }, { min: 0, bill: 0 });

  // Year strip — 12 month cells
  const todayMonth = todayYmm();
  const minutesByMonth = yearEntries.reduce((a, t) => { const k = t.date.slice(0, 7); a[k] = (a[k] || 0) + t.minutes; return a; }, {});
  const stripMax = Math.max(1, ...Object.values(minutesByMonth));
  const stripCells = Array.from({ length: 12 }, (_, i) => {
    const m = `${year}-${String(i + 1).padStart(2, '0')}`;
    const mins = minutesByMonth[m] || 0;
    const isSelected = m === month;
    const isCurrent = m === todayMonth;
    const intensity = mins / stripMax;
    return el('button', {
      class: 'btn',
      style: `flex:1;min-width:0;padding:8px 4px;border:1px solid ${isSelected ? 'var(--accent,#2563eb)' : 'var(--border)'};border-radius:6px;background:${isSelected ? 'rgba(37,99,235,0.12)' : `rgba(37,99,235,${0.04 + intensity * 0.18})`};cursor:pointer;text-align:center;${isCurrent ? 'outline:2px dashed var(--accent,#2563eb);outline-offset:-3px;' : ''}`,
      onclick: () => { tv.month = m; navigate('time'); },
    }, [
      el('div', { style: `font-size:13px;font-weight:600;color:${isSelected ? 'var(--accent,#2563eb)' : 'var(--text)'}` }, shortMonthLabel(m)),
      el('div', { style: 'font-size:11px;font-weight:600;margin-top:3px;color:var(--text-muted)' }, mins ? (mins/60).toFixed(1) + ' hr' : '—'),
    ]);
  });

  // Year nav
  const prevYearBtn = el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.month = `${year - 1}-${month.split('-')[1]}`; navigate('time'); } }, '← ' + (year - 1));
  const nextYearBtn = el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.month = `${year + 1}-${month.split('-')[1]}`; navigate('time'); } }, (year + 1) + ' →');
  mount.appendChild(el('div', { class: 'row mb-12', style: 'align-items:center;gap:8px' }, [
    prevYearBtn,
    el('strong', { style: 'font-size:14px' }, String(year)),
    nextYearBtn,
  ]));
  mount.appendChild(el('div', { style: 'display:flex;gap:6px;margin-bottom:16px' }, stripCells));

  mount.appendChild(el('h3', { style: 'margin:0 0 12px;font-size:18px' }, monthLabel(month)));
  mount.appendChild(timeStatCards(sum.min, sum.bill, monthEntries.length));

  if (monthEntries.length === 0) { mount.appendChild(el('div', { class: 'card empty' }, 'No time this month.')); return; }

  // Per-user breakdown for this month
  const byUser = {};
  monthEntries.forEach(t => {
    byUser[t.user_email] ||= { min: 0, bill: 0, count: 0 };
    byUser[t.user_email].min += t.minutes;
    if (t.billable) byUser[t.user_email].bill += t.minutes;
    byUser[t.user_email].count++;
  });
  const users = Object.entries(byUser).sort((a, b) => b[1].min - a[1].min);
  mount.appendChild(el('div', { class: 'card mb-16' }, [
    el('div', { style: 'font-weight:600;margin-bottom:10px' }, 'By user'),
    el('table', { class: 'data' }, [
      el('thead', {}, el('tr', {}, [ el('th', {}, 'User'), el('th', { class: 'num' }, 'Hours'), el('th', { class: 'num' }, 'Billable'), el('th', { class: 'num' }, 'Entries') ])),
      el('tbody', {}, users.map(([email, v]) => el('tr', {}, [
        el('td', {}, userShortName(email)),
        el('td', { class: 'num' }, (v.min/60).toFixed(2)),
        el('td', { class: 'num' }, (v.bill/60).toFixed(2)),
        el('td', { class: 'num' }, String(v.count)),
      ]))),
    ]),
  ]));

  // Full month calendar grid — click any in-month day to drill into Day View
  mount.appendChild(el('div', { style: 'font-weight:600;margin:0 0 10px' }, 'Calendar · click a day to open Day View'));
  renderMonthCalendarGrid(mount, yearEntries, matters, month, tv);
}

function renderMonthCalendarGrid(mount, entries, matters, month, tv) {
  const { first, last } = monthBounds(month);
  // Aggregate by date
  const byDate = {};
  entries.forEach(t => {
    byDate[t.date] ||= { minutes: 0, billable: 0, byUser: {}, items: [] };
    byDate[t.date].minutes += t.minutes;
    if (t.billable) byDate[t.date].billable += t.minutes;
    byDate[t.date].byUser[t.user_email] = (byDate[t.date].byUser[t.user_email] || 0) + t.minutes;
    byDate[t.date].items.push(t);
  });

  // Build the grid: pad with leading days from prev month and trailing days from next month
  // so every cell shows a date number (off-month cells are visually grayed out below).
  const leading = first.getUTCDay(); // 0=Sun
  const daysInMonth = last.getUTCDate();
  const gridStart = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth(), 1 - leading));
  const totalDays = leading + daysInMonth;
  const trailing = (7 - (totalDays % 7)) % 7;
  const gridLen = totalDays + trailing;
  const cells = [];
  for (let i = 0; i < gridLen; i++) {
    const d = new Date(Date.UTC(gridStart.getUTCFullYear(), gridStart.getUTCMonth(), gridStart.getUTCDate() + i));
    const ds = ymd(d);
    const inMonth = d.getUTCFullYear() === first.getUTCFullYear() && d.getUTCMonth() === first.getUTCMonth();
    cells.push({ date: ds, inMonth });
  }

  const todayStr = ymd(new Date());
  const inMonthMins = Object.entries(byDate)
    .filter(([d]) => d >= ymd(first) && d <= ymd(last))
    .map(([, v]) => v.minutes);
  const maxMins = Math.max(1, ...inMonthMins);
  const fmtH = (m) => (m/60).toFixed(1) + ' hr';

  const dayCell = ({ date, inMonth }) => {
    const data = byDate[date];
    const isToday = date === todayStr;
    const intensity = data && inMonth ? data.minutes / maxMins : 0;
    const bg = inMonth
      ? (data ? `rgba(37,99,235,${0.06 + intensity * 0.22})` : '#fff')
      : '#f4f5f7';
    const baseColor = inMonth ? 'var(--text-muted)' : '#b0b4bb';
    const numColor = isToday ? 'var(--accent,#2563eb)' : (inMonth ? 'var(--text)' : '#b0b4bb');
    const dayNum = parseInt(date.slice(8, 10), 10);
    const usersInCell = data ? Object.entries(data.byUser).sort((a,b) => b[1] - a[1]).slice(0, 3) : [];
    return el('div', {
      style: `border:1px solid var(--border);min-height:88px;padding:6px;cursor:${inMonth ? 'pointer' : 'default'};background:${bg};${isToday ? 'outline:2px solid var(--accent,#2563eb);outline-offset:-2px;' : ''}${inMonth ? '' : 'opacity:0.85;'}`,
      onclick: inMonth ? () => { tv.mode = 'day'; tv.day = date; navigate('time'); } : null,
    }, [
      el('div', { style: 'display:flex;justify-content:space-between;font-size:12px;color:' + baseColor }, [
        el('span', { style: `color:${numColor};${isToday ? 'font-weight:700' : ''}` }, String(dayNum)),
        data && inMonth ? el('strong', { style: 'color:var(--text)' }, fmtH(data.minutes)) : null,
      ]),
      ...(inMonth ? usersInCell.map(([email, mins]) => el('div', {
        style: 'font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px',
      }, `${userShortName(email)} · ${(mins/60).toFixed(1)}`)) : []),
      data && inMonth && Object.keys(data.byUser).length > 3
        ? el('div', { style: 'font-size:10px;color:var(--text-muted)' }, `+${Object.keys(data.byUser).length - 3} more`)
        : null,
    ]);
  };

  const dayHeaders = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  mount.appendChild(el('div', { style: 'display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--border);padding:2px;border-radius:6px' }, [
    ...dayHeaders.map(d => el('div', { style: 'background:var(--gray-bg);padding:6px;text-align:center;font-size:12px;font-weight:600;color:var(--text-muted)' }, d)),
    ...cells.map(dayCell),
  ]));
}

// ─────────────────────────────────────────────────────────────────────────
// CLIENT → MATTER PICKER (shared)
// Renders two cascading selects: pick Client, then Matter filtered to that client.
// If the chosen client has zero active matters, shows an inline "Run conflict check
// & open matter" shortcut so the user can unblock themselves without leaving the form.
// Returns an element carrying hidden inputs named `clientId` and `matterId`, plus a
// `refresh(newMatters, preselectMatterId)` method the caller can invoke after a new
// matter is added elsewhere.
// ─────────────────────────────────────────────────────────────────────────
// Single source of truth for "who are our clients?" across time and trust.
// Reduces a matters array to unique clients — skipping matters whose client was
// deleted (client_contact_id is null). Time and Trust both call this to avoid
// list drift.
function clientsFromMattersList(matters) {
  const map = new Map();
  for (const m of matters) {
    if (!m.client_contact_id) continue;
    if (!map.has(m.client_contact_id)) {
      map.set(m.client_contact_id, { id: m.client_contact_id, name: m.client_name || '(no name)' });
    }
  }
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
}

// Text-input combobox: type to filter, Tab fills the top (or highlighted) match,
// Enter/click selects, Arrow keys navigate, Esc closes. Returns a wrapper div.
function comboInput({ items, initialLabel = '', placeholder = '', name, onSelect }) {
  let filterQ = '';
  let idx = -1;
  const input = el('input', {
    type: 'text',
    name: name || null,
    autocomplete: 'off',
    spellcheck: 'false',
    placeholder,
    value: initialLabel,
    style: 'width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:14px',
  });
  const dropdown = el('div', {
    style: 'position:absolute;top:100%;left:0;right:0;margin-top:2px;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow-md);max-height:220px;overflow-y:auto;z-index:50;display:none',
  });
  const wrap = el('div', { style: 'position:relative' }, [input, dropdown]);

  function matches() {
    const q = filterQ.trim().toLowerCase();
    if (!q) return items.slice(0, 100);
    const starts = [], contains = [];
    for (const it of items) {
      const l = it.label.toLowerCase();
      if (l.startsWith(q)) starts.push(it);
      else if (l.includes(q)) contains.push(it);
    }
    return [...starts, ...contains].slice(0, 100);
  }
  function renderList() {
    const list = matches();
    dropdown.innerHTML = '';
    if (list.length === 0) { dropdown.style.display = 'none'; return; }
    if (idx >= list.length) idx = list.length - 1;
    list.forEach((it, i) => {
      const row = el('div', {
        style: 'padding:8px 12px;cursor:pointer;font-size:14px;' + (i === idx ? 'background:var(--gold-bg)' : ''),
        onmousedown: (e) => { e.preventDefault(); select(it); },
        onmouseenter: () => { idx = i; renderList(); },
      }, it.label);
      dropdown.appendChild(row);
    });
    dropdown.style.display = 'block';
  }
  function select(item) {
    input.value = item.label;
    filterQ = '';
    dropdown.style.display = 'none';
    idx = -1;
    onSelect(item);
  }
  input.addEventListener('input', () => { filterQ = input.value; idx = -1; renderList(); });
  input.addEventListener('focus', () => { filterQ = ''; idx = -1; renderList(); });
  input.addEventListener('blur', () => { setTimeout(() => { dropdown.style.display = 'none'; }, 150); });
  input.addEventListener('keydown', (e) => {
    const list = matches();
    if (e.key === 'Tab' && list.length > 0) { e.preventDefault(); select(list[idx >= 0 ? idx : 0]); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); if (list.length) { idx = (idx + 1) % list.length; renderList(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (list.length) { idx = idx <= 0 ? list.length - 1 : idx - 1; renderList(); } }
    else if (e.key === 'Enter') { if (list.length && idx >= 0) { e.preventDefault(); select(list[idx]); } }
    else if (e.key === 'Escape') { dropdown.style.display = 'none'; idx = -1; }
  });
  return wrap;
}

function clientMatterPicker(initialMatters, opts = {}) {
  const root = el('div', { class: 'client-matter-picker' }, []);
  // Only matters with a real client — keeps this picker's client list identical
  // to the Trust picker (both use clientsFromMattersList).
  let matters = initialMatters.filter(m => m.client_contact_id);
  let clientId = null;
  let matterId = opts.selectedMatterId || null;
  if (matterId) {
    const m = matters.find(x => x.id === matterId);
    if (m) clientId = m.client_contact_id;
  }

  function render() {
    root.innerHTML = '';
    const clients = clientsFromMattersList(matters);
    // Default: preselect first client if none chosen yet
    if (!clientId && clients.length) clientId = clients[0].id;
    const clientMatters = matters
      .filter(m => m.client_contact_id === clientId)
      .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    if (!clientMatters.find(m => m.id === matterId)) matterId = clientMatters[0]?.id || null;

    const clientCurrent = clients.find(c => c.id === clientId);
    const clientCombo = comboInput({
      items: clients.map(c => ({ id: c.id, label: c.name })),
      initialLabel: clientCurrent?.name || '',
      placeholder: 'Type to search clients…',
      name: 'clientId',
      onSelect: (item) => { clientId = item.id; matterId = null; render(); if (opts.onChange) opts.onChange({ clientId, matterId }); },
    });

    const matterCurrent = clientMatters.find(m => m.id === matterId);
    const matterField = clientMatters.length
      ? comboInput({
          items: clientMatters.map(m => ({ id: m.id, label: m.name })),
          initialLabel: matterCurrent?.name || '',
          placeholder: 'Type to search matters…',
          name: 'matterId',
          onSelect: (item) => { matterId = item.id; if (opts.onChange) opts.onChange({ clientId, matterId }); },
        })
      : el('input', { type: 'hidden', name: 'matterId', value: '' });

    root.appendChild(el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Client'), clientCombo ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Matter'), matterField ]),
    ]));

    if (clientMatters.length === 0) {
      const client = clients.find(c => c.id === clientId);
      root.appendChild(noMattersBanner(client, (newMatter) => {
        matters = [newMatter, ...matters];
        matterId = newMatter.id;
        clientId = newMatter.client_contact_id || clientId;
        render();
        if (opts.onChange) opts.onChange({ clientId, matterId });
      }));
    }
  }

  root.refresh = (newMatters, preselectMatterId) => {
    matters = newMatters.filter(m => m.client_contact_id);
    if (preselectMatterId) {
      matterId = preselectMatterId;
      const m = matters.find(x => x.id === matterId);
      if (m) clientId = m.client_contact_id;
    }
    render();
  };
  root.getValues = () => ({ clientId, matterId });

  render();
  return root;
}

// Inline banner + flow for "this client has no matters — run a conflict check and open one".
// Stays inside the parent modal so we don't lose the caller's form state.
function noMattersBanner(client, onCreated) {
  const wrap = el('div', { class: 'card', style: 'background:var(--gold-bg);border:1px solid var(--gold);padding:12px;margin-top:8px' }, []);
  const renderCollapsed = () => {
    wrap.innerHTML = '';
    wrap.appendChild(el('div', { style: 'display:flex;align-items:center;gap:12px;flex-wrap:wrap' }, [
      el('div', { style: 'flex:1;min-width:200px;font-size:13px' },
        `No active matters for ${client?.name || 'this client'}. Open one to log time against.`),
      el('button', { class: 'btn btn-primary btn-sm', onclick: renderExpanded }, 'Run conflict check & open matter'),
    ]));
  };
  const renderExpanded = () => {
    wrap.innerHTML = '';
    const conflictOut = el('div', { style: 'margin-top:8px' });
    const ccText = el('textarea', {
      style: 'width:100%;min-height:70px;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px',
      placeholder: 'Names, companies, adverse parties — one per line',
    }, client?.name || '');
    let ccData = null;
    const ackWrap = el('div', { style: 'margin-top:6px' });
    const nameIn = el('input', { placeholder: 'e.g. Formation — Delaware LLC', style: 'width:100%' });
    const billIn = el('select', { style: 'width:100%' }, [
      el('option', { value: 'hourly' }, 'Hourly'),
      el('option', { value: 'flat' },   'Flat fee'),
      el('option', { value: 'contingency' }, 'Contingency'),
    ]);
    const runCheck = async () => {
      const q = ccText.value.trim();
      if (!q) return toast('Enter names/companies to check', true);
      ccData = await runConflictCheck(q, { context: 'time-matter-shortcut' });
      conflictOut.innerHTML = '';
      const { wrap: resultEl } = buildConflictResults(ccData);
      conflictOut.appendChild(resultEl);
      ackWrap.innerHTML = '';
      const total = ccData.results.reduce((s, r) => s + r.hits, 0);
      if (total > 0) {
        ackWrap.appendChild(el('div', { class: 'checkbox-row' }, [
          el('input', { type: 'checkbox', id: 'cm-ack' }),

        clientContactId: client.id, clientName: client.name,
        name: nameIn.value.trim(), billingType: billIn.value,
      }});
      if (ccData.logId) {
        await api('/api/conflict-checks/' + ccData.logId, { method: 'PATCH',
          body: { notes: `Linked to new matter: ${created.name} (${client.name})` } }).catch(() => {});

      toast('Matter opened: ' + created.name);

    };
    wrap.appendChild(el('div', {}, [
      el('div', { style: 'font-weight:600;font-size:13px;margin-bottom:6px' }, 'Conflict check'),
      ccText,
      el('div', { style: 'margin-top:6px' }, el('button', { class: 'btn btn-ghost btn-sm', onclick: runCheck }, 'Run check')),
      conflictOut,
      ackWrap,
      el('div', { style: 'margin-top:12px;display:grid;grid-template-columns:2fr 1fr;gap:8px' }, [
        el('div', { class: 'field' }, [ el('label', {}, 'Matter name'), nameIn ]),
        el('div', { class: 'field' }, [ el('label', {}, 'Billing type'), billIn ]),
      ]),
      el('div', { style: 'margin-top:8px;display:flex;gap:8px' }, [
        el('button', { class: 'btn btn-ghost btn-sm', onclick: renderCollapsed }, 'Cancel'),
        el('button', { class: 'btn btn-primary btn-sm', onclick: createMatter }, 'Create matter'),

    ]));
  };
  renderCollapsed();
  return wrap;
}

const Timer = { state: null, interval: null };

async function initTimer() {
  try { Timer.state = await api('/api/timer'); } catch(e) { Timer.state = null; }
  renderTimerPill();
  // Tick every 1s to update the clock; refetch from server every 30s for drift correction.
  clearInterval(Timer.interval);
  Timer.interval = setInterval(() => {
    if (Timer.state?.running) {
      Timer.state.elapsedSeconds = (Timer.state.elapsedSeconds || 0) + 1;
      renderTimerPill(true);  // lightweight re-render
    }
  }, 1000);
  setInterval(refreshTimer, 30000);
}

async function refreshTimer() {
  try { Timer.state = await api('/api/timer'); renderTimerPill(); } catch(e) {}
}

function fmtClock(sec) {
  const s = Math.max(0, Math.floor(sec));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
  return `${m}:${String(r).padStart(2,'0')}`;
}

function renderTimerPill(clockOnly=false) {
  const w = $('#timer-widget');
  if (!w) return;
  const t = Timer.state;
  if (!t || !t.matterId) {
    w.innerHTML = '';
    w.appendChild(el('button', { class: 'timer-pill', onclick: openTimerStartModal }, [
      el('span', { class: 'dot' }),
      el('span', {}, '⏱ Start timer'),
    ]));
    return;
  }
  if (clockOnly && w.querySelector('.t-clock')) {
    w.querySelector('.t-clock').textContent = fmtClock(t.elapsedSeconds || 0);
    return;
  }
  w.innerHTML = '';
  const pill = el('div', { class: 'timer-pill ' + (t.running ? 'running' : 'paused') }, [
    el('span', { class: 'dot' }),
    el('span', { class: 't-clock' }, fmtClock(t.elapsedSeconds || 0)),
    el('span', { class: 't-meta', title: (t.clientName||'') + ' — ' + (t.matterName||'') },
      (t.clientName ? t.clientName + ' · ' : '') + (t.matterName || '')),
    t.running
      ? el('button', { class: 't-btn', title: 'Pause', onclick: async () => { Timer.state = await api('/api/timer/pause', { method: 'POST' }); renderTimerPill(); } }, '⏸')
      : el('button', { class: 't-btn', title: 'Resume', onclick: async () => { Timer.state = await api('/api/timer/resume', { method: 'POST' }); renderTimerPill(); } }, '▶'),
    el('button', { class: 't-btn', title: 'Stop & save', onclick: openTimerStopModal }, '■'),
    el('button', { class: 't-btn', title: 'Edit / switch matter', onclick: openTimerEditModal }, '⚙'),
  ]);
  w.appendChild(pill);
}

async function renderExpenses(mount) {
  const [expenses, matters] = await Promise.all([api('/api/expenses'), api('/api/matters?status=active')]);
  const actions = $('#topbar-actions');
  actions.innerHTML = '';
  actions.appendChild(el('button', { class: 'btn btn-primary btn-sm', onclick: () => openExpenseForm(null, matters) }, '+ New expense'));

  const totals = expenses.reduce((a, e) => {
    a.all += Number(e.amount);
    if (e.billable) a.billable += Number(e.amount);
    if (e.status === 'draft' && e.billable) a.unbilled += Number(e.amount);

  }, { all: 0, billable: 0, unbilled: 0 });

  mount.innerHTML = '';
  mount.appendChild(el('div', { class: 'grid grid-3 mb-16' }, [
    el('div', { class: 'stat-card' }, [ el('div', { class: 'stat-label' }, 'Total'), el('div', { class: 'stat-value' }, fmt.money(totals.all)) ]),
    el('div', { class: 'stat-card' }, [ el('div', { class: 'stat-label' }, 'Billable'), el('div', { class: 'stat-value' }, fmt.money(totals.billable)) ]),
    el('div', { class: 'stat-card' }, [ el('div', { class: 'stat-label' }, 'Unbilled billable'), el('div', { class: 'stat-value' }, fmt.money(totals.unbilled)), el('div', { class: 'stat-sub' }, 'Added to next invoice for the matter') ]),
  ]));

  const selected = new Set();
  const bulkBar = el('div', { class: 'row mb-12', style: 'gap:8px;align-items:center;display:none' });
  const updateBulkBar = () => {
    bulkBar.innerHTML = '';
    if (selected.size === 0) { bulkBar.style.display = 'none'; return; }
    bulkBar.style.display = 'flex';
    bulkBar.appendChild(el('span', { style: 'font-size:13px' }, `${selected.size} selected`));
    bulkBar.appendChild(el('div', { class: 'spacer' }));
    bulkBar.appendChild(el('button', { class: 'btn btn-ghost btn-sm', onclick: () => {
      selected.clear();
      $$('input[data-exp-cb]', mount).forEach(cb => { cb.checked = false; });
      const sa = $('#exp-select-all', mount); if (sa) { sa.checked = false; sa.indeterminate = false; }
      updateBulkBar();
    } }, 'Clear'));
    bulkBar.appendChild(el('button', { class: 'btn btn-danger btn-sm', onclick: async () => {
      const ids = [...selected];
      const billed = expenses.filter(e => ids.includes(e.id) && e.status === 'billed').length;
      const msg = billed > 0
        ? `Delete ${ids.length - billed} expense${ids.length - billed === 1 ? '' : 's'}? ${billed} billed expense${billed === 1 ? '' : 's'} will be skipped.`
        : `Delete ${ids.length} expense${ids.length === 1 ? '' : 's'}?`;
      if (!confirm(msg)) return;
      let ok = 0, fail = 0;
      for (const id of ids) {
        try { await api('/api/expenses/' + id, { method: 'DELETE' }); ok++; }
        catch { fail++; }
      }
      toast(`Deleted ${ok}${fail ? `, ${fail} failed` : ''}`);
      navigate('expenses');
    } }, `Delete ${selected.size}`));
  };
  mount.appendChild(bulkBar);

  const headerCb = el('input', { type: 'checkbox', id: 'exp-select-all',
    title: 'Select all', onchange: (ev) => {
      const checked = ev.target.checked;
      $$('input[data-exp-cb]', mount).forEach(cb => {
        cb.checked = checked;
        const id = cb.getAttribute('data-exp-cb');
        if (checked) selected.add(id); else selected.delete(id);
      });
      updateBulkBar();
    },
  });

  mount.appendChild(el('table', { class: 'data' }, [
    el('thead', {}, el('tr', {}, [
      el('th', { style: 'width:32px' }, headerCb),
      el('th', {}, 'Date'), el('th', {}, 'Matter / client'), el('th', {}, 'Category'),
      el('th', {}, 'Description'), el('th', { class: 'num' }, 'Amount'),

      const cat = EXPENSE_CATEGORIES.find(c => c.id === e.category)?.label || e.category;
      const receiptCell = e.receipt_count > 0
        ? el('span', { title: `${e.receipt_count} receipt${e.receipt_count === 1 ? '' : 's'} attached` }, `📎 ${e.receipt_count}`)
        : '—';
      const cb = el('input', { type: 'checkbox', 'data-exp-cb': e.id,
        onclick: (ev) => ev.stopPropagation(),
        onchange: (ev) => {
          if (ev.target.checked) selected.add(e.id); else selected.delete(e.id);
          const sa = $('#exp-select-all', mount);

            sa.checked = selected.size === expenses.length;
            sa.indeterminate = selected.size > 0 && selected.size < expenses.length;
          }
          updateBulkBar();

        el('td', {}, m ? (m.name + (m.client_name ? ' · ' + m.client_name : '')) : '—'),
        el('td', {}, cat),
        el('td', {}, e.description || '—'),
        el('td', { class: 'num' }, fmt.money(e.amount)),
        el('td', {}, e.billable ? '✓' : '—'),
        el('td', {}, receiptCell),
        el('td', {}, el('span', { class: 'badge badge-status-' + e.status }, e.status)),
      ]);
    })),
  ]));
}

const RECEIPT_ACCEPT = 'application/pdf,image/jpeg,image/png,image/gif,image/webp,image/heic,image/heif';
const RECEIPT_MAX_BYTES = 10 * 1024 * 1024;

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = String(r.result || '');
      const i = s.indexOf(',');
      resolve(i >= 0 ? s.slice(i + 1) : s);
    };
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

async function uploadReceipt(expenseId, file) {
  if (file.size > RECEIPT_MAX_BYTES) throw new Error(`${file.name}: file too large (max 10 MB)`);
  const dataBase64 = await readFileAsBase64(file);
  return api(`/api/expenses/${expenseId}/attachments`, {
    method: 'POST',
    body: { filename: file.name, mimeType: file.type || 'application/octet-stream', dataBase64 },
  });
}

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

function renderAttachmentList(listEl, expenseId, attachments, locked) {

        style: 'flex:1;text-decoration:none;color:var(--accent)' }, a.filename),
      el('span', { style: 'font-size:12px;color:var(--text-muted)' }, fmtBytes(a.size)),

        class: 'btn btn-ghost btn-sm' }, 'Download'),
      locked ? null : el('button', { class: 'btn btn-danger btn-sm', onclick: async () => {

    ]);

  });
}

function openExpenseForm(existing, matters) {
  const isNew = !existing, e = existing || {};
  const locked = !isNew && e.status === 'billed';
  const pendingFiles = [];

  const fileInput = el('input', { type: 'file', accept: RECEIPT_ACCEPT, multiple: 'multiple',
    style: 'display:none' });
  const dropZone = el('div', {
    style: 'border:2px dashed var(--border);border-radius:8px;padding:18px;text-align:center;color:var(--text-muted);margin-top:4px;cursor:pointer;transition:background-color .15s,border-color .15s',
  }, 'Drop PDF or photo receipts here, or click to browse');
  dropZone.addEventListener('click', () => fileInput.click());
  const dzActive = () => { dropZone.style.borderColor = 'var(--accent, #2563eb)'; dropZone.style.backgroundColor = 'rgba(37,99,235,0.06)'; };
  const dzReset  = () => { dropZone.style.borderColor = 'var(--border)'; dropZone.style.backgroundColor = ''; };

  const pendingListEl = el('div', { style: 'margin-top:6px;font-size:12px;color:var(--text-muted)' });
  const extractBtn = el('button', {
    class: 'btn btn-ghost btn-sm',
    style: 'margin-top:8px;display:none',
    onclick: async (ev) => { ev.preventDefault(); await runExtract(); },
  }, 'Read receipt to autofill');
  const renderPending = () => {
    pendingListEl.innerHTML = '';
    extractBtn.style.display = pendingFiles.length ? 'inline-block' : 'none';
    if (!pendingFiles.length) return;
    pendingFiles.forEach((f, idx) => {
      pendingListEl.appendChild(el('div', { style: 'display:flex;align-items:center;gap:6px' }, [
        el('span', {}, `• ${f.name} (${fmtBytes(f.size)})`),
        el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { pendingFiles.splice(idx, 1); renderPending(); } }, 'Remove'),
      ]));
    });
  };
  const isReadableReceipt = (f) => /^application\/pdf$/i.test(f.type) || /^image\/(jpeg|png|gif|webp)$/i.test(f.type);

  const addFiles = (files) => {
    files.forEach(f => pendingFiles.push(f));
    renderPending();
    const firstReadable = files.find(isReadableReceipt);
    if (firstReadable) maybeAutoExtract(firstReadable);
  };

  const maybeAutoExtract = (file) => {
    if (extractBtn.disabled) return;
    const amountIn = body.querySelector('input[name="amount"]');
    if (amountIn && amountIn.value) return;
    runExtract(file);
  };

  fileInput.addEventListener('change', () => {
    const files = [...fileInput.files];
    fileInput.value = '';
    addFiles(files);
  });

  const addDropHandlers = (target) => {
    if (locked) return;
    target.addEventListener('dragover', (ev) => { ev.preventDefault(); dzActive(); });
    target.addEventListener('dragleave', (ev) => { if (ev.target === target) dzReset(); });
    target.addEventListener('drop', (ev) => {
      ev.preventDefault(); dzReset();
      const files = [...(ev.dataTransfer?.files || [])].filter(f =>
        /^application\/pdf$/i.test(f.type) || /^image\//i.test(f.type));
      if (!files.length) { toast('Only PDF and image files are supported', true); return; }
      addFiles(files);
    });
  };

  const runExtract = async (fileArg) => {
    const file = fileArg || pendingFiles[0];
    if (!file) return;
    if (!isReadableReceipt(file)) return toast('Receipt reading supports PDF, JPEG, PNG, GIF, and WebP only', true);
    extractBtn.disabled = true;
    const original = extractBtn.textContent;
    extractBtn.textContent = 'Reading receipt…';
    try {
      const dataBase64 = await readFileAsBase64(file);
      const r = await api('/api/expenses/extract', {
        method: 'POST',
        body: { filename: file.name, mimeType: file.type, dataBase64 },
      });
      const amountIn = body.querySelector('input[name="amount"]');
      const descIn   = body.querySelector('input[name="description"]');
      const dateIn   = body.querySelector('input[name="date"]');
      const catSel   = body.querySelector('select[name="category"]');
      if (r.amount != null && amountIn && !amountIn.value) amountIn.value = r.amount;
      if (r.description && descIn && !descIn.value) descIn.value = r.description;
      if (r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && dateIn) dateIn.value = r.date;
      if (r.category && catSel && [...catSel.options].some(o => o.value === r.category)) catSel.value = r.category;
      toast('Autofilled from receipt — review before saving');
    } catch { /* api() already showed a toast */ }
    finally { extractBtn.disabled = false; extractBtn.textContent = original; }
  };

  const attachmentListEl = el('div', { style: 'margin-top:6px' });
  const attachmentSection = el('div', { class: 'field' }, [
    el('label', {}, 'Receipts (PDF or photo, up to 10 MB each)'),
    locked ? el('div', { style: 'font-size:12px;color:var(--text-muted)' }, 'Expense is billed — receipts are read-only.') : dropZone,
    fileInput,
    extractBtn,
    pendingListEl,
    isNew
      ? el('div', { style: 'margin-top:6px;font-size:12px;color:var(--text-muted)' }, 'Files will upload after you save.')
      : attachmentListEl,
  ]);

  const body = el('div', {}, [
    el('div', { class: 'field' }, [ el('label', {}, 'Matter (for a client)'),
      el('select', { name: 'matterId' }, matters.map(m =>
        el('option', { value: m.id, ...(e.matter_id === m.id ? { selected: 'selected' } : {}) }, m.name + (m.client_name ? ` — ${m.client_name}` : '')))) ]),
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Date'), el('input', { name: 'date', type: 'date', value: e.date || new Date().toISOString().slice(0,10) }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Category'),
        el('select', { name: 'category' }, EXPENSE_CATEGORIES.map(c =>
          el('option', { value: c.id, ...((e.category||'other') === c.id ? { selected: 'selected' } : {}) }, c.label))) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Amount ($)'), el('input', { name: 'amount', type: 'number', step: '0.01', value: e.amount || '' }) ]),
    ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Description'), el('input', { name: 'description', value: e.description || '' }) ]),
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field checkbox-row', style: 'padding-top:24px' }, [
        el('input', { type: 'checkbox', name: 'billable', id: 'exp-billable', ...(e.billable !== 0 ? { checked: 'checked' } : {}) }),
        el('label', { for: 'exp-billable' }, 'Billable to client'),
      ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Markup (e.g. 0.10 for 10%)'),
        el('input', { name: 'markupPct', type: 'number', step: '0.01', value: e.markup_pct || 0 }) ]),
    ]),
    attachmentSection,
  ]);

  addDropHandlers(dropZone);
  addDropHandlers(body);

  if (!isNew) {
    api(`/api/expenses/${e.id}/attachments`)
      .then(rows => renderAttachmentList(attachmentListEl, e.id, rows, locked))
      .catch(() => {});
  }

  const uploadAll = async (expenseId) => {
    for (const f of pendingFiles) {
      try { await uploadReceipt(expenseId, f); }
      catch (err) { toast(err.message || `Upload failed: ${f.name}`, true); }
    }
  };

  const save = async () => {
    const d = {};
    $$('select[name], input[name]', body).forEach(i => { d[i.name] = i.type === 'checkbox' ? i.checked : i.value; });
    d.amount = parseFloat(d.amount) || 0;
    d.markupPct = parseFloat(d.markupPct) || 0;
    if (!d.matterId || !d.amount) return toast('Matter and amount required', true);
    let saved;
    if (isNew) saved = await api('/api/expenses', { method: 'POST', body: d });
    else       saved = await api('/api/expenses/' + e.id, { method: 'PUT', body: d });
    if (pendingFiles.length) await uploadAll(saved.id);
    toast('Saved'); closeModal(); navigate('expenses');
  };

  openModal(isNew ? 'New expense' : 'Edit expense', body, el('div', {}, [
    !isNew ? el('button', { class: 'btn btn-danger btn-sm', onclick: async () => { if (!confirm('Delete?')) return; await api('/api/expenses/' + e.id, { method: 'DELETE' }); toast('Deleted'); closeModal(); navigate('expenses'); } }, 'Delete') : null,
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: save }, 'Save'),
  ]));
}

async function renderInvoices(mount) {
  const [invoices, matters, profile] = await Promise.all([
    api('/api/invoices'),
    api('/api/matters'),  // include closed/on-hold so historical invoices still show their matter
    api('/api/me/profile').catch(() => ({})),
  ]);
  const actions = $('#topbar-actions');
  actions.innerHTML = '';
  actions.appendChild(el('button', { class: 'btn btn-primary btn-sm',
    onclick: () => openInvoiceForm(matters.filter(m => m.status === 'active')) }, '+ Generate invoice'));

  // Persisted filter + sort state (per-user, via /api/me/profile.invoiceView)
  const saved = profile.invoiceView || {};
  const view = {
    clientId: saved.clientId || '',
    matterId: saved.matterId || '',
    sortKey:  saved.sortKey  || 'client',
    sortDir:  saved.sortDir  || 'asc',
  };
  const persist = async () => {
    const latest = await api('/api/me/profile').catch(() => ({}));
    await api('/api/me/profile', { method: 'PUT', body: { ...latest, invoiceView: view } }).catch(() => {});
  };

  mount.innerHTML = '';

  // Build client list from the invoices (not matters) — what's actually billable history
  const clientMap = new Map();
  for (const inv of invoices) {
    const cid = inv.client_contact_id || '__none__';
    if (!clientMap.has(cid)) clientMap.set(cid, inv.client_name || '(no client)');
  }
  const clientOptions = [...clientMap.entries()].sort((a, b) => a[1].localeCompare(b[1]));
  const clientMatters = () => (view.clientId
    ? matters.filter(m => (m.client_contact_id || '__none__') === view.clientId)
    : matters);

  const renderTable = () => {
    const table = mount.querySelector('table.data');
    if (table) table.remove();
    const empty = mount.querySelector('.empty');
    if (empty) empty.remove();

    let rows = invoices.slice();
    if (view.clientId) rows = rows.filter(r => (r.client_contact_id || '__none__') === view.clientId);
    if (view.matterId) rows = rows.filter(r => r.matter_id === view.matterId);

    const matterName = (id) => matters.find(m => m.id === id)?.name || '';
    const keyFn = {
      number: r => (r.number || r.id).toLowerCase(),
      client: r => (r.client_name || '').toLowerCase(),
      matter: r => matterName(r.matter_id).toLowerCase(),
      issued: r => r.issued_at || '',
      due:    r => r.due_at || '',
      total:  r => r.total || 0,
      status: r => r.status || '',
    };
    const primary = keyFn[view.sortKey] || keyFn.client;
    rows.sort((a, b) => {
      const av = primary(a), bv = primary(b);
      let cmp = av < bv ? -1 : av > bv ? 1 : 0;
      if (cmp === 0 && view.sortKey === 'client') cmp = keyFn.matter(a) < keyFn.matter(b) ? -1 : keyFn.matter(a) > keyFn.matter(b) ? 1 : 0;
      if (cmp === 0) cmp = (b.issued_at || '').localeCompare(a.issued_at || '');
      return view.sortDir === 'desc' ? -cmp : cmp;
    });

    if (rows.length === 0) {
      mount.appendChild(el('div', { class: 'card empty' },
        invoices.length === 0
          ? 'No invoices yet. Generate one from billable time or a flat-fee matter.'
          : 'No invoices match the current filter.'));
      return;
    }

    const arrow = (k) => view.sortKey === k ? (view.sortDir === 'asc' ? ' ▲' : ' ▼') : '';
    const sortableTh = (key, label, cls) => el('th', {
      class: cls, style: 'cursor:pointer;user-select:none',
      onclick: () => {
        if (view.sortKey === key) view.sortDir = view.sortDir === 'asc' ? 'desc' : 'asc';
        else { view.sortKey = key; view.sortDir = 'asc'; }
        persist(); renderTable();
      },
    }, label + arrow(key));

    mount.appendChild(el('table', { class: 'data' }, [
      el('thead', {}, el('tr', {}, [
        sortableTh('number', 'Invoice #'),
        sortableTh('client', 'Client'),
        sortableTh('matter', 'Matter'),
        sortableTh('issued', 'Issued'),
        sortableTh('due',    'Due'),
        sortableTh('total',  'Total', 'num'),
        sortableTh('status', 'Status'),
        el('th', {}, ''),
      ])),
      el('tbody', {}, rows.map(inv => el('tr', {}, [
        el('td', {}, el('strong', {}, inv.number || inv.id.slice(0,8))),
        el('td', {}, inv.client_name || '—'),
        el('td', {}, matterName(inv.matter_id) || '—'),
        el('td', {}, fmt.date(inv.issued_at)),
        el('td', {}, fmt.date(inv.due_at)),
        el('td', { class: 'num' }, fmt.money(inv.total)),
        el('td', {}, el('span', { class: 'badge badge-status-' + inv.status }, inv.status)),
        el('td', {}, [
          el('a', { class: 'btn btn-ghost btn-sm', href: '/api/invoices/' + inv.id + '/pdf', target: '_blank' }, 'PDF'),
          ' ',
          el('button', { class: 'btn btn-ghost btn-sm', onclick: () => openInvoiceDetail(inv.id) }, 'View'),
        ]),
      ]))),
    ]));
  };

  const renderMatterSelect = () => {
    const ms = clientMatters();
    return el('select', {
      id: 'inv-filter-matter',
      onchange: (e) => { view.matterId = e.target.value; persist(); renderTable(); },
    }, [
      el('option', { value: '' }, 'All matters'),
      ...ms.map(m => el('option', { value: m.id, ...(view.matterId === m.id ? { selected: 'selected' } : {}) },
        m.name + (m.client_name && !view.clientId ? ` — ${m.client_name}` : ''))),
    ]);
  };

  const filterStrip = el('div', { class: 'row mb-16', style: 'gap:8px;flex-wrap:wrap;align-items:center' }, [
    el('label', { style: 'font-size:12px;color:var(--text-muted)' }, 'Client'),
    el('select', {
      onchange: (e) => {
        view.clientId = e.target.value;
        // If current matter doesn't belong to new client, clear it
        if (view.matterId) {
          const m = matters.find(x => x.id === view.matterId);
          const cid = m?.client_contact_id || '__none__';
          if (view.clientId && cid !== view.clientId) view.matterId = '';
        }
        persist();
        const slot = filterStrip.querySelector('#inv-filter-matter-slot');
        slot.innerHTML = ''; slot.appendChild(renderMatterSelect());
        renderTable();
      },
    }, [
      el('option', { value: '' }, 'All clients'),
      ...clientOptions.map(([id, name]) => el('option', { value: id, ...(view.clientId === id ? { selected: 'selected' } : {}) }, name)),
    ]),
    el('label', { style: 'font-size:12px;color:var(--text-muted);margin-left:8px' }, 'Matter'),
    el('span', { id: 'inv-filter-matter-slot' }, renderMatterSelect()),
    el('div', { class: 'spacer' }),
    (view.clientId || view.matterId) ? el('button', {
      class: 'btn btn-ghost btn-sm',
      onclick: () => { view.clientId = ''; view.matterId = ''; persist(); renderInvoices(mount); },
    }, 'Clear filters') : null,
  ]);
  mount.appendChild(filterStrip);
  renderTable();
}

function openInvoiceForm(matters) {
  const hourlyMatters = matters.filter(m => m.billing_type === 'hourly' || m.billing_type === 'flat');
  const picker = clientMatterPicker(hourlyMatters);
  const body = el('div', {}, [
    picker,
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Issue date'), el('input', { name: 'issuedAt', type: 'date', value: new Date().toISOString().slice(0,10) }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Due date'), el('input', { name: 'dueAt', type: 'date' }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Tax rate (e.g. 0.08)'), el('input', { name: 'taxRate', type: 'number', step: '0.001', value: '0' }) ]),
    ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Notes'), el('textarea', { name: 'notes' }) ]),
  ]);
  const generate = async () => {
    const d = {};
    $$('input[name=issuedAt], input[name=dueAt], input[name=taxRate], textarea[name=notes]', body).forEach(i => d[i.name] = i.value);
    const { matterId } = picker.getValues();
    d.matterId = matterId;
    d.taxRate = parseFloat(d.taxRate) || 0;
    if (!d.matterId) return toast('Choose a matter', true);
    const r = await api('/api/invoices', { method: 'POST', body: d });
    toast('Invoice ' + (r.number || '') + ' created');
    closeModal();
    navigate('invoices');
  };
  openModal('Generate invoice', body, el('div', {}, [
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: generate }, 'Generate'),
  ]));
}

async function openInvoiceEdit(id) {
  const inv = await api('/api/invoices/' + id);
  if (inv.status !== 'draft') { toast('Only draft invoices can be edited', true); return; }
  const currentTaxRate = inv.subtotal > 0 ? +(inv.tax / inv.subtotal).toFixed(4) : 0;

  const toDate = (s) => (s || '').slice(0, 10);
  const lineRows = inv.lines.map(l => ({ ...l }));

  const totalsEl = el('div', { style: 'text-align:right;font-size:13px;color:var(--text-muted)' });
  const recalc = () => {
    let subtotal = 0;
    lineRows.forEach(l => { subtotal += Number(l.amount) || 0; });
    const rate = parseFloat(taxInput.value);
    const taxRate = Number.isFinite(rate) ? rate : 0;
    const tax = subtotal * taxRate;
    const total = subtotal + tax;
    totalsEl.innerHTML = '';
    totalsEl.appendChild(el('div', {}, 'Subtotal: ' + fmt.money(subtotal)));
    totalsEl.appendChild(el('div', {}, 'Tax: ' + fmt.money(tax)));
    totalsEl.appendChild(el('div', { style: 'font-weight:700;color:var(--text)' }, 'Total: ' + fmt.money(total)));
  };

  const taxInput = el('input', { name: 'taxRate', type: 'number', step: '0.001', min: '0', value: String(currentTaxRate), oninput: recalc });

  const lineTbody = el('tbody', {}, lineRows.map((l, idx) => {
    const qtyIn = el('input', {
      type: 'number', step: '0.01', value: String(l.quantity ?? 0),
      style: 'width:80px;text-align:right',
      oninput: (e) => { l.quantity = parseFloat(e.target.value) || 0; l.amount = +(l.quantity * (Number(l.rate) || 0)).toFixed(2); amtIn.value = l.amount.toFixed(2); recalc(); },
    });
    const rateIn = el('input', {
      type: 'number', step: '0.01', value: String(l.rate ?? 0),
      style: 'width:100px;text-align:right',
      oninput: (e) => { l.rate = parseFloat(e.target.value) || 0; l.amount = +((Number(l.quantity) || 0) * l.rate).toFixed(2); amtIn.value = l.amount.toFixed(2); recalc(); },
    });
    const amtIn = el('input', {
      type: 'number', step: '0.01', value: String((Number(l.amount) || 0).toFixed(2)),
      style: 'width:110px;text-align:right',
      oninput: (e) => { l.amount = parseFloat(e.target.value) || 0; recalc(); },
    });
    const descIn = el('input', {
      type: 'text', value: l.description || '', style: 'width:100%',
      oninput: (e) => { l.description = e.target.value; },
    });
    return el('tr', {}, [
      el('td', {}, descIn),
      el('td', { class: 'num' }, qtyIn),
      el('td', { class: 'num' }, rateIn),
      el('td', { class: 'num' }, amtIn),
    ]);
  }));

  const body = el('div', {}, [
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Issue date'), el('input', { name: 'issuedAt', type: 'date', value: toDate(inv.issued_at) }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Due date'), el('input', { name: 'dueAt', type: 'date', value: toDate(inv.due_at) }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Tax rate (e.g. 0.08)'), taxInput ]),
    ]),
    el('table', { class: 'data' }, [
      el('thead', {}, el('tr', {}, [ el('th', {}, 'Description'), el('th', { class: 'num' }, 'Qty'), el('th', { class: 'num' }, 'Rate'), el('th', { class: 'num' }, 'Amount') ])),
      lineTbody,
    ]),
    el('div', { class: 'mt-16' }, totalsEl),
    el('div', { class: 'field mt-16' }, [ el('label', {}, 'Notes'), el('textarea', { name: 'notes' }, inv.notes || '') ]),
  ]);
  recalc();

  const save = async () => {
    const issuedAt = body.querySelector('input[name=issuedAt]').value;
    const dueAt    = body.querySelector('input[name=dueAt]').value;
    const notes    = body.querySelector('textarea[name=notes]').value;
    const taxRate  = parseFloat(taxInput.value);
    await api('/api/invoices/' + id, {
      method: 'PATCH',
      body: {
        issuedAt, dueAt, notes,
        taxRate: Number.isFinite(taxRate) ? taxRate : 0,
        lines: lineRows.map(l => ({ id: l.id, description: l.description, quantity: Number(l.quantity) || 0, rate: Number(l.rate) || 0, amount: Number(l.amount) || 0 })),
      },
    });
    toast('Invoice updated');
    closeModal();
    navigate('invoices');
  };

  openModal('Edit invoice ' + (inv.number || ''), body, el('div', {}, [
    el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { closeModal(); openInvoiceDetail(id); } }, 'Cancel'),
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-primary btn-sm', onclick: save }, 'Save'),
  ]), true);
}

async function renderTrust(mount) {
  // Source clients from matters via the shared helper — same universe as the
  // time-entry picker, so the two lists can't drift.
  const [trust, matters] = await Promise.all([api('/api/trust'), api('/api/matters?status=active')]);
  const clients = clientsFromMattersList(matters).map(c => ({ id: c.id, full_name: c.name }));
  const actions = $('#topbar-actions');
  actions.innerHTML = '';
  actions.appendChild(el('button', { class: 'btn btn-primary btn-sm', onclick: () => openTrustForm(clients) }, '+ Trust transaction'));

  state._trustView ||= { search: '', balSort: 'balance', balDir: 'desc', txSort: 'date', txDir: 'desc' };
  const tv = state._trustView;

  const balances = trust.balances || [];
  const entries  = trust.entries  || [];
  const totalBal = balances.reduce((s, b) => s + Number(b.balance || 0), 0);

  mount.innerHTML = '';
  mount.appendChild(el('div', { class: 'grid grid-3 mb-16' }, [
    el('div', { class: 'stat-card' }, [ el('div', { class: 'stat-label' }, 'Total trust balance'), el('div', { class: 'stat-value' }, fmt.money(totalBal)) ]),
    el('div', { class: 'stat-card' }, [ el('div', { class: 'stat-label' }, 'Clients with funds'), el('div', { class: 'stat-value' }, String(balances.filter(b => b.balance > 0).length)) ]),
    el('div', { class: 'stat-card' }, [ el('div', { class: 'stat-label' }, 'Transactions'), el('div', { class: 'stat-value' }, String(entries.length)) ]),
  ]));

  // Combobox: typing filters the dropdown of client names, Tab fills the top match,
  // Arrow keys navigate, Enter selects (filters only), clicking an item both
  // filters the view and opens the full client detail modal.
  // Clients come from active matters (aligned with the time-entry picker).
  const clientOpts = clientsFromMattersList(matters);
  let dropdownIdx = -1;

  const searchInput = el('input', {
    type: 'text',
    role: 'combobox',
    autocomplete: 'off',
    spellcheck: 'false',
    placeholder: 'Search client, reference, kind, notes…',
    value: tv.search,
    style: 'width:100%;padding:8px 32px 8px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:14px',
  });
  const clearBtn = el('button', {
    type: 'button',
    title: 'Clear search',
    'aria-label': 'Clear search',
    style: 'position:absolute;top:50%;right:8px;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--gray-bg);color:var(--text-muted);font-size:14px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0',
    onmousedown: (e) => { e.preventDefault(); },
    onclick: () => { tv.search = ''; searchInput.value = ''; dropdownIdx = -1; dropdown.style.display = 'none'; updateRightAffix(); renderBody(); searchInput.focus(); },
  }, '×');
  const caretBtn = el('button', {
    type: 'button',
    title: 'Show clients',
    'aria-label': 'Show clients',
    style: 'position:absolute;top:50%;right:8px;transform:translateY(-50%);width:20px;height:20px;background:transparent;color:var(--text-muted);font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0',
    onmousedown: (e) => {
      // Prevent the input from blurring; toggle dropdown manually.
      e.preventDefault();
      if (dropdown.style.display === 'block') {
        dropdown.style.display = 'none';
      } else {
        searchInput.focus();
        dropdownIdx = -1;
        renderDropdown();
      }
    },
  }, '▾');
  const updateRightAffix = () => {
    const hasText = !!searchInput.value;
    clearBtn.style.display = hasText ? 'flex' : 'none';
    caretBtn.style.display = hasText ? 'none' : 'flex';
  };
  const dropdown = el('div', {
    style: 'position:absolute;top:100%;left:0;right:0;margin-top:2px;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow-md);max-height:260px;overflow-y:auto;z-index:50;display:none',
  });
  const comboWrap = el('div', { style: 'position:relative;flex:1;min-width:200px' }, [searchInput, clearBtn, caretBtn, dropdown]);
  updateRightAffix();

  function matches() {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) return clientOpts.slice(0, 50);
    const starts = [], contains = [];
    for (const c of clientOpts) {
      const ln = c.name.toLowerCase();
      if (ln.startsWith(q)) starts.push(c);
      else if (ln.includes(q)) contains.push(c);
    }
    return [...starts, ...contains].slice(0, 50);
  }

  function highlightItems() {
    [...dropdown.children].forEach((child, j) => {
      child.style.background = j === dropdownIdx ? 'var(--gold-bg)' : '';
    });
  }

  function renderDropdown() {
    const list = matches();
    dropdown.innerHTML = '';
    if (list.length === 0) { dropdown.style.display = 'none'; return; }
    if (dropdownIdx >= list.length) dropdownIdx = list.length - 1;
    list.forEach((c, i) => {
      const item = el('div', {
        style: 'padding:8px 12px;cursor:pointer;font-size:14px;' + (i === dropdownIdx ? 'background:var(--gold-bg)' : ''),
        onmousedown: (e) => { e.preventDefault(); selectItem(c); },
        // Don't call renderDropdown here — replacing the node the mouse is over
        // restarts mouseenter, eating the following mousedown.
        onmouseenter: () => { dropdownIdx = i; highlightItems(); },
      }, c.name);
      dropdown.appendChild(item);
    });
    dropdown.style.display = 'block';
  }

  function selectItem(c) {
    tv.search = c.name;
    searchInput.value = c.name;
    dropdown.style.display = 'none';
    dropdownIdx = -1;
    updateRightAffix();
    renderBody();
  }

  searchInput.addEventListener('input', () => {
    tv.search = searchInput.value;
    dropdownIdx = -1;
    updateRightAffix();
    renderDropdown();
    renderBody();
  });
  searchInput.addEventListener('focus', () => { dropdownIdx = -1; renderDropdown(); });
  searchInput.addEventListener('blur', () => { setTimeout(() => { dropdown.style.display = 'none'; }, 150); });
  searchInput.addEventListener('keydown', (e) => {
    const list = matches();
    if (e.key === 'Tab' && list.length > 0) {
      e.preventDefault();
      selectItem(list[dropdownIdx >= 0 ? dropdownIdx : 0]);
      return;
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (list.length === 0) return;
      dropdownIdx = (dropdownIdx + 1) % list.length;
      highlightItems();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (list.length === 0) return;
      dropdownIdx = dropdownIdx <= 0 ? list.length - 1 : dropdownIdx - 1;
      highlightItems();
    } else if (e.key === 'Enter') {
      if (list.length > 0 && dropdownIdx >= 0) {
        e.preventDefault();
        selectItem(list[dropdownIdx]);
      }
    } else if (e.key === 'Escape') {
      dropdown.style.display = 'none';
      dropdownIdx = -1;
    }
  });

  const filterStrip = el('div', { class: 'row mb-16', style: 'gap:8px;flex-wrap:wrap;align-items:center' }, [comboWrap]);
  mount.appendChild(filterStrip);

  const bodyWrap = el('div', {});
  mount.appendChild(bodyWrap);

  function renderBody() {
    bodyWrap.innerHTML = '';

    // ── Balances by client (sortable, filtered by search) ──
    const q = tv.search.trim().toLowerCase();
    const balFiltered = q
      ? balances.filter(b => (b.client_name || '').toLowerCase().includes(q))
      : balances.slice();
    const balSorted = balFiltered.sort((a, b) => {
      const keyA = tv.balSort === 'client' ? (a.client_name || '').toLowerCase() : Number(a.balance || 0);
      const keyB = tv.balSort === 'client' ? (b.client_name || '').toLowerCase() : Number(b.balance || 0);
      const cmp = keyA < keyB ? -1 : keyA > keyB ? 1 : 0;
      return tv.balDir === 'asc' ? cmp : -cmp;
    });
    const balArrow = (k) => tv.balSort === k ? (tv.balDir === 'asc' ? ' ▲' : ' ▼') : '';
    const balTh = (key, label, cls) => el('th', {
      class: cls, style: 'cursor:pointer;user-select:none',
      onclick: () => {
        if (tv.balSort === key) tv.balDir = tv.balDir === 'asc' ? 'desc' : 'asc';
        else { tv.balSort = key; tv.balDir = key === 'balance' ? 'desc' : 'asc'; }
        renderBody();
      },
    }, label + balArrow(key));

    // ── Transactions list (filtered by same search + sortable) ──
    let txRows = entries.slice();
    if (q) {
      txRows = txRows.filter(t =>
        (t.client_name || '').toLowerCase().includes(q) ||
        (t.reference  || '').toLowerCase().includes(q) ||
        (t.notes      || '').toLowerCase().includes(q) ||
        (t.kind       || '').toLowerCase().includes(q)
      );
    }
    const txKey = {
      date:   t => t.occurred_at || '',
      client: t => (t.client_name || '').toLowerCase(),
      kind:   t => t.kind || '',
      amount: t => Number(t.amount || 0),
      reference: t => (t.reference || '').toLowerCase(),
    }[tv.txSort] || (t => t.occurred_at || '');
    txRows.sort((a, b) => {
      const av = txKey(a), bv = txKey(b);
      const cmp = av < bv ? -1 : av > bv ? 1 : 0;
      return tv.txDir === 'asc' ? cmp : -cmp;
    });
    const txArrow = (k) => tv.txSort === k ? (tv.txDir === 'asc' ? ' ▲' : ' ▼') : '';
    const txTh = (key, label, cls) => el('th', {
      class: cls, style: 'cursor:pointer;user-select:none',
      onclick: () => {
        if (tv.txSort === key) tv.txDir = tv.txDir === 'asc' ? 'desc' : 'asc';
        else { tv.txSort = key; tv.txDir = key === 'amount' || key === 'date' ? 'desc' : 'asc'; }
        renderBody();
      },
    }, label + txArrow(key));

    bodyWrap.appendChild(el('div', { class: 'grid grid-2' }, [
      el('div', { class: 'card' }, [
        el('h3', {}, 'Balances by client' + (q ? ` (${balSorted.length})` : '')),
        balances.length === 0 ? el('div', { class: 'empty' }, 'No trust balances.') :
        balSorted.length === 0 ? el('div', { class: 'empty' }, 'No clients match the search.') :
          el('table', { class: 'data' }, [
            el('thead', {}, el('tr', {}, [ balTh('client', 'Client'), balTh('balance', 'Balance', 'num') ])),
            el('tbody', {}, balSorted.map(b => el('tr', {
              title: 'Click to filter by this client',
              style: 'cursor:pointer',
              onclick: () => {
                tv.search = b.client_name || '';
                searchInput.value = tv.search;
                updateRightAffix();
                renderBody();
              },
            }, [
              el('td', {}, b.client_name || '—'),
              el('td', { class: 'num', style: b.balance < 0 ? 'color:var(--red)' : '' }, fmt.money(b.balance)),
            ]))),
          ]),
      ]),
      el('div', { class: 'card' }, [
        el('h3', {}, 'Transactions' + (q ? ` (${txRows.length})` : '')),
        txRows.length === 0 ? el('div', { class: 'empty' },
          entries.length === 0 ? 'No entries.' : 'No transactions match the search.') :
          el('div', { style: 'max-height:500px;overflow:auto' }, el('table', { class: 'data' }, [
            el('thead', {}, el('tr', {}, [
              txTh('date', 'Date'),
              txTh('client', 'Client'),
              txTh('kind', 'Kind'),
              txTh('reference', 'Reference'),
              txTh('amount', 'Amount', 'num'),
            ])),
            el('tbody', {}, txRows.map(t => el('tr', { title: t.notes || '' }, [
              el('td', {}, fmt.date(t.occurred_at)),
              el('td', {}, t.client_name || '—'),
              el('td', {}, t.kind),
              el('td', {}, t.reference || '—'),
              el('td', { class: 'num', style: 'font-weight:600;' + (t.amount < 0 ? 'color:var(--red)' : 'color:var(--green)') }, fmt.money(t.amount)),
            ]))),
          ])),
      ]),
    ]));
  }

  renderBody();
}

function openTrustForm(clients) {
  const body = el('div', {}, [
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Kind'),
        el('select', { name: 'kind' }, ['deposit','withdrawal','transfer-to-operating','fee-applied','refund'].map(k => el('option', { value: k }, k))) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Amount ($)'), el('input', { name: 'amount', type: 'number', step: '0.01' }) ]),
    ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Client *'),
      el('select', { name: 'clientContactId', required: '' }, [ el('option', { value: '' }, '— choose —'), ...clients.map(c => el('option', { value: c.id }, c.full_name)) ]) ]),
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Date'), el('input', { name: 'occurredAt', type: 'date', value: new Date().toISOString().slice(0,10) }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Reference (check #, wire)'), el('input', { name: 'reference' }) ]),
    ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Notes'), el('textarea', { name: 'notes' }) ]),
  ]);
  const save = async () => {
    const d = {}; $$('input, select, textarea', body).forEach(i => d[i.name] = i.value);
    d.amount = parseFloat(d.amount) || 0;
    if (!d.amount) return toast('Amount required', true);
    if (!d.clientContactId) return toast('Client required — every IOLTA entry must be paired with a client', true);
    const c = clients.find(x => x.id === d.clientContactId);
    if (c) d.clientName = c.full_name;
    if (d.occurredAt) d.occurredAt = new Date(d.occurredAt).toISOString();
    await api('/api/trust', { method: 'POST', body: d });
    toast('Posted'); closeModal(); navigate('trust');
  };
  openModal('Trust transaction', body, el('div', {}, [
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: save }, 'Post'),
  ]));
}

// ─────────────────────────────────────────────────────────────────────────
// SETTINGS (profile, firm info, pipeline stages — team moved to its own tab)
