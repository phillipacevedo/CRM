async function buildClientFinancialSummary(clientId) {
  const [matters, invoices, trust] = await Promise.all([
    api('/api/matters?clientId=' + encodeURIComponent(clientId)).catch(() => []),
    api('/api/invoices?clientId=' + encodeURIComponent(clientId)).catch(() => []),
    api('/api/trust?clientId=' + encodeURIComponent(clientId)).catch(() => ({ entries: [], balances: [] })),
  ]);
  const timeByMatter = await Promise.all(matters.map(m =>
    api('/api/time?matterId=' + encodeURIComponent(m.id)).catch(() => [])));
  const allTime = timeByMatter.flat();

  const unbilled  = allTime.filter(t => t.status === 'draft' && t.billable);
  const billedTE  = allTime.filter(t => t.status === 'billed');
  const unbilledMin = unbilled.reduce((s, t) => s + Number(t.minutes || 0), 0);
  const unbilledAmt = unbilled.reduce((s, t) => s + (Number(t.minutes || 0) / 60) * Number(t.rate || 0), 0);
  const billedMin   = billedTE.reduce((s, t) => s + Number(t.minutes || 0), 0);

  const liveInvoices = invoices.filter(i => i.status !== 'void');
  const totalInvoiced = liveInvoices.reduce((s, i) => s + Number(i.total || 0), 0);
  const totalPaid     = liveInvoices.reduce((s, i) => s + Number(i.amount_paid || 0), 0);
  // amount_writedown is signed (negative for writedowns). For the AR calc we
  // add it to total to get the net billed; for the stat tile we show the
  // absolute writedown amount. Realization = totalPaid / (gross + adjustments).
  const totalAdjustments = liveInvoices.reduce((s, i) => s + Number(i.amount_writedown || 0), 0);
  const totalWritedowns  = Math.max(0, -totalAdjustments);
  const netBilled        = +(totalInvoiced + totalAdjustments).toFixed(2);
  const realization      = netBilled > 0 ? Math.round((totalPaid / netBilled) * 100) : null;
  const openInv       = invoices.filter(i => ['draft','sent'].includes(i.status));
  const outstanding   = openInv.reduce((s, i) =>
    s + (Number(i.total || 0) + Number(i.amount_writedown || 0) - Number(i.amount_paid || 0)), 0);
  const lastPayment = liveInvoices
    .filter(i => i.status === 'paid')
    .map(i => i.updated_at || i.issued_at)
    .sort()
    .pop();

  const trustEntries = trust.entries || [];
  const trustBalance = trustEntries.reduce((s, e) => s + Number(e.amount || 0), 0);
  const lastDeposit = trustEntries
    .filter(e => e.kind === 'deposit')
    .map(e => e.occurred_at)
    .sort()
    .pop();

  const openMatters   = matters.filter(m => m.status === 'active').length;
  const closedMatters = matters.filter(m => m.status === 'closed').length;

  const stat = (label, value, sub, tone) => el('div', { class: 'stat-card' }, [
    el('div', { class: 'stat-label' }, label),
    el('div', { class: 'stat-value', style: tone ? `color:var(--${tone})` : '' }, value),
    sub ? el('div', { style: 'font-size:11.5px;color:var(--text-muted);margin-top:2px' }, sub) : null,
  ]);

  const trustTone = trustBalance < 0 ? 'red' : trustBalance > 0 ? 'green' : null;
  const arTone = outstanding > 0 ? 'red' : null;

  return el('div', {}, [
    el('h3', { style: 'font-size:13px;font-weight:700;color:var(--navy);margin:0 0 10px' }, 'Financial summary'),
    el('div', { class: 'grid grid-3 mb-12' }, [
      stat('Unbilled WIP', fmt.money(unbilledAmt), fmt.hours(unbilledMin) + ' · ' + unbilled.length + ' entr' + (unbilled.length === 1 ? 'y' : 'ies')),
      stat('Outstanding A/R', fmt.money(outstanding), openInv.length + ' open invoice' + (openInv.length === 1 ? '' : 's'), arTone),
      stat('Trust balance', fmt.money(trustBalance), lastDeposit ? 'Last deposit ' + fmt.date(lastDeposit) : (trustEntries.length ? trustEntries.length + ' entries' : 'no activity'), trustTone),
    ]),
    el('div', { class: 'grid grid-3 mb-12' }, [
      stat('Billed (gross)', fmt.money(totalInvoiced), liveInvoices.length + ' invoice' + (liveInvoices.length === 1 ? '' : 's')),
      stat('Write-downs', fmt.money(totalWritedowns), totalAdjustments === 0 ? 'none' : 'net adj. ' + fmt.money(-totalAdjustments), totalWritedowns > 0 ? 'red' : null),
      stat('Cash received', fmt.money(totalPaid), lastPayment ? 'Last paid ' + fmt.date(lastPayment) : '—'),
    ]),
    el('div', { class: 'grid grid-3 mb-16' }, [
      stat('Net billed', fmt.money(netBilled), 'gross less write-downs'),
      stat('Realization', realization == null ? '—' : realization + '%', netBilled > 0 ? 'cash ÷ net billed' : 'no billed activity'),
      stat('Billed time', fmt.hours(billedMin), openMatters + ' open matter' + (openMatters === 1 ? '' : 's') + (closedMatters ? ' · ' + closedMatters + ' closed' : '')),
    ]),
    matters.length ? el('div', { class: 'card mb-16' }, [
      el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px' }, [
        el('strong', {}, 'Matters'),
        el('span', { style: 'color:var(--text-muted);font-size:12px' }, matters.length + ' total'),
      ]),
      el('table', { class: 'data' }, [
        el('thead', {}, el('tr', {}, [
          el('th', { style: 'width:90px' }, 'No.'),
          el('th', {}, 'Matter'), el('th', {}, 'Billing'), el('th', {}, 'Opened'), el('th', {}, 'Status'),
        ])),
        el('tbody', {}, matters.map(m => el('tr', {}, [
          el('td', {}, el('span', { style: 'font-family:ui-monospace,SFMono-Regular,monospace;font-size:12.5px;color:var(--text-muted)' }, fmtMatterNumber(m.matter_number) || '—')),
          el('td', {}, m.name),
          el('td', {}, m.billing_type + (m.billing_type === 'flat' && m.flat_fee ? ' · ' + fmt.money(m.flat_fee) : '')),
          el('td', {}, fmt.date(m.opened_at)),
          el('td', {}, el('span', { class: 'badge badge-status-' + m.status }, m.status)),
        ]))),
      ]),
    ]) : el('div', { class: 'card empty mb-16' }, 'No matters yet.'),
    invoices.length ? el('div', { class: 'card mb-16' }, [
      el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px' }, [
        el('strong', {}, 'Invoice history'),
        el('span', { style: 'color:var(--text-muted);font-size:12px' }, invoices.length + ' total · showing ' + Math.min(invoices.length, 10)),
      ]),
      el('table', { class: 'data' }, [
        el('thead', {}, el('tr', {}, [
          el('th', {}, '#'), el('th', {}, 'Issued'), el('th', { class: 'num' }, 'Total'),
          el('th', { class: 'num' }, 'Write-down'), el('th', { class: 'num' }, 'Paid'),
          el('th', { class: 'num' }, 'Balance'), el('th', {}, 'Status'), el('th', {}, ''),
        ])),
        el('tbody', {}, invoices.slice(0, 10).map(i => {
          const wd = Number(i.amount_writedown || 0);
          const bal = +(Number(i.total || 0) + wd - Number(i.amount_paid || 0)).toFixed(2);
          return el('tr', {}, [
            el('td', {}, i.number || '—'),
            el('td', {}, fmt.date(i.issued_at)),
            el('td', { class: 'num' }, fmt.money(i.total)),
            el('td', { class: 'num', style: wd < 0 ? 'color:var(--red)' : '' }, wd === 0 ? '—' : fmt.money(-wd)),
            el('td', { class: 'num' }, fmt.money(i.amount_paid || 0)),
            el('td', { class: 'num', style: bal > 0 && i.status !== 'void' ? 'color:var(--red);font-weight:600' : '' }, fmt.money(bal)),
            el('td', {}, el('span', { class: 'badge badge-status-' + i.status }, i.status)),
            el('td', {}, el('button', { class: 'btn btn-ghost btn-sm', onclick: () => openInvoiceDetail(i.id) }, 'View')),
          ]);
        })),
      ]),
    ]) : null,
    trustEntries.length ? el('div', { class: 'card mb-16' }, [
      el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px' }, [
        el('strong', {}, 'Trust activity (IOLTA)'),
        el('span', { style: 'color:var(--text-muted);font-size:12px' }, trustEntries.length + ' total · showing ' + Math.min(trustEntries.length, 10)),
      ]),
      el('table', { class: 'data' }, [
        el('thead', {}, el('tr', {}, [
          el('th', {}, 'Date'), el('th', {}, 'Kind'), el('th', {}, 'Amount'), el('th', {}, 'Reference'),
        ])),
        el('tbody', {}, trustEntries.slice(0, 10).map(t => el('tr', {}, [
          el('td', {}, fmt.date(t.occurred_at)),
          el('td', {}, t.kind),
          el('td', { style: 'color:' + (Number(t.amount) < 0 ? 'var(--red)' : 'var(--green)') }, fmt.money(t.amount)),
          el('td', {}, t.reference || t.notes || '—'),
        ]))),
      ]),
    ]) : null,
  ]);
}

async function openInteractionForm(contactId, existing) {
  const isNew = !existing?.id;
  const occurredDefault = existing?.occurred_at
    ? new Date(existing.occurred_at).toISOString().slice(0, 16)
    : new Date().toISOString().slice(0, 16);
  const body = el('div', {}, [
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Type'),
        el('select', { name: 'kind' }, ['call','email','meeting','note','task'].map(k =>
          el('option', { value: k, ...((existing?.kind || 'call') === k ? { selected: 'selected' } : {}) }, k))) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Occurred at'), el('input', { name: 'occurredAt', type: 'datetime-local', value: occurredDefault }) ]),
    ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Subject'), el('input', { name: 'subject', value: existing?.subject || '' }) ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Notes'), el('textarea', { name: 'body', style: 'min-height:140px' }, existing?.body || '') ]),
  ]);
  const save = async () => {
    const data = { contactId };
    $$('input, select, textarea', body).forEach(i => data[i.name] = i.value);
    if (data.occurredAt) data.occurredAt = new Date(data.occurredAt).toISOString();
    if (isNew) {
      await api('/api/interactions', { method: 'POST', body: data });
      toast('Interaction logged');
    } else {
      await api('/api/interactions/' + existing.id, { method: 'PUT', body: data });
      toast('Interaction updated');
    }
    closeModal();
    openContact(contactId);
  };
  const footer = el('div', {}, [
    !isNew ? el('button', { class: 'btn btn-danger btn-sm', onclick: async () => {
      if (!confirm('Delete this interaction?')) return;
      await api('/api/interactions/' + existing.id, { method: 'DELETE' });
      toast('Deleted'); closeModal(); openContact(contactId);
    } }, 'Delete') : null,
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: save }, isNew ? 'Log' : 'Save'),
  ]);
  openModal(isNew ? 'Log interaction' : 'Edit interaction', body, footer);
}

      el('label', {}, 'CC'),
      el('input', { id: 'compose-cc', type: 'email', placeholder: 'optional' }),
    ]),
    el('div', { class: 'field' }, [
      el('label', {}, 'Subject'),
      el('input', { id: 'compose-subject', placeholder: 'Subject' }),
    ]),
    el('div', { class: 'field' }, [
      el('label', {}, 'Message'),
      el('textarea', { id: 'compose-body', style: 'min-height:180px;width:100%', placeholder: 'Write your message…' }),

  const footer = el('div', {}, [
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-primary btn-sm', id: 'compose-send-btn', onclick: async () => {

        await api('/api/contacts/' + contactId + '/email', {
          method: 'POST',
          body: { to, cc: cc || undefined, subject, body },
        });
        toast('Email sent and logged');
        closeModal();
        openContact(contactId);
      } catch (err) {
        btn.disabled = false; btn.textContent = 'Send';
        toast(err.message || 'Failed to send', true);
      }
    }}, 'Send'),
  ]);

  openModal('Send email — ' + (contact.full_name || 'Contact'), formBody, footer);
}

// Reusable: runs a conflict check and returns a DOM element rendering the results.
// onClear: optional callback fired when all terms came back with zero hits.
function buildConflictResults(data, { onOpenContact } = {}) {
  const wrap = el('div', {});
  const total = data.results.reduce((s, r) => s + r.hits, 0);
  wrap.appendChild(el('div', {
    style: `padding:10px 14px;border-radius:6px;margin-bottom:12px;font-weight:600;font-size:13px;background:${total === 0 ? 'var(--green-bg)' : 'var(--red-bg)'};color:${total === 0 ? 'var(--green)' : 'var(--red)'}`
  }, total === 0 ? '✓ No matches — looks clear' : `⚠ ${total} potential conflict${total === 1 ? '' : 's'} — review carefully`));

  data.results.forEach(r => {
    const section = el('div', { style: 'margin-bottom:16px' }, [
      el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:6px' }, [
        el('strong', { style: 'color:var(--text)' }, `"${r.term}"`),
        document.createTextNode(` — ${r.hits} match${r.hits === 1 ? '' : 'es'}`),
      ]),
    ]);
    if (r.hits === 0) {
      section.appendChild(el('div', { style: 'color:var(--text-light);font-size:12.5px;padding-left:8px' }, 'Clear'));
    }
    r.contacts.forEach(c => section.appendChild(el('div', {
      class: 'cc-result',
      style: 'cursor:pointer',
      onclick: () => onOpenContact ? onOpenContact(c.id) : openContact(c.id),
    }, [
      el('strong', {}, c.full_name || '—'),
      document.createTextNode(' · '),
      el('span', { class: 'badge badge-' + c.type }, c.type),
      c.company_name ? el('div', { style: 'font-size:12px;color:var(--text-muted)' }, c.company_name) : null,
      c.owner_email ? el('div', { style: 'font-size:11.5px;color:var(--text-light)' }, 'Owner: ' + c.owner_email) : null,
    ])));
    r.matters.forEach(m => section.appendChild(el('div', { class: 'cc-result' }, [
      el('strong', {}, m.name),
      document.createTextNode(' (matter)'),
      m.client_name ? el('div', { style: 'font-size:12px;color:var(--text-muted)' }, 'Client: ' + m.client_name + ' · ' + m.status) : null,
    ])));
    wrap.appendChild(section);
  });
  return { wrap, totalHits: total };
}

async function runConflictCheck(query, opts = {}) {
  const q = (query || '').trim();
  if (!q) return { results: [], logId: null };
  const params = new URLSearchParams({ q });
  if (opts.context) params.set('context', opts.context);
  if (opts.relatedContactId) params.set('relatedContactId', opts.relatedContactId);
  if (opts.acknowledged) params.set('acknowledged', '1');
  if (opts.skipLog) params.set('log', '0');
  return await api('/api/conflict-check?' + params.toString());
}

// ─────────────────────────────────────────────────────────────────────────
// NEW CLIENT INTAKE (streamlined two-step flow)
// ─────────────────────────────────────────────────────────────────────────
async function startClientIntake(opts = {}) {
  // Step 1: conflict check. If precheckedData is passed (from the Conflict Check tab), skip the search UI.
  const state = {
    step: opts.precheckedData ? 2 : 1,
    query: opts.precheckedQuery || '',
    conflictData: opts.precheckedData || null,
    acknowledged: false,
    clientData: opts.clientData || {},
  };
  renderIntake();

  function renderIntake() {
    const stepBar = el('div', { class: 'row mb-16', style: 'gap:12px;font-size:12px;color:var(--text-muted)' }, [
      el('div', { style: 'font-weight:' + (state.step === 1 ? '700' : '500') + ';color:' + (state.step === 1 ? 'var(--navy)' : 'var(--text-muted)') }, '1. Conflict check'),
      el('div', {}, '›'),
      el('div', { style: 'font-weight:' + (state.step === 2 ? '700' : '500') + ';color:' + (state.step === 2 ? 'var(--navy)' : 'var(--text-muted)') }, '2. Client details'),
    ]);

    if (state.step === 1) {
      const body = el('div', {}, [
        stepBar,
        el('p', { style: 'color:var(--text-muted);font-size:13px;margin-bottom:12px' },
          'Before creating a new client, check for conflicts. Enter names, companies, and any adverse parties — one per line or comma-separated.'),
        el('textarea', {
          id: 'intake-cc',
          placeholder: 'Acme Corp\nJane Doe (client rep)\nOpposing: Big Law LLP',
          style: 'width:100%;min-height:100px;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13.5px',
          value: state.query,
        }),
        el('div', { id: 'intake-cc-out', style: 'margin-top:12px' }),
      ]);
      const run = async () => {
        const q = body.querySelector('#intake-cc').value.trim();
        if (!q) return toast('Enter names/companies to check', true);
        state.query = q;
        state.conflictData = await runConflictCheck(q, { context: 'client-intake' });
        const out = body.querySelector('#intake-cc-out');
        out.innerHTML = '';
        const { wrap } = buildConflictResults(state.conflictData);
        out.appendChild(wrap);
        if (state.conflictData.logId) {
          out.appendChild(el('div', { style: 'font-size:11.5px;color:var(--text-light);margin-top:6px' }, `Logged as ${state.conflictData.logId}`));
        }
        // Require acknowledgement checkbox before proceeding if there are hits
        const total = state.conflictData.results.reduce((s, r) => s + r.hits, 0);
        if (total > 0) {
          out.appendChild(el('div', { class: 'checkbox-row', style: 'margin-top:8px' }, [
            el('input', { type: 'checkbox', id: 'intake-ack' }),
            el('label', { for: 'intake-ack' }, 'I have reviewed the matches above and there is no disqualifying conflict.'),
          ]));
        }
      };
      const proceed = () => {
        if (!state.conflictData) return toast('Run the conflict check first', true);
        const total = state.conflictData.results.reduce((s, r) => s + r.hits, 0);
        if (total > 0 && !body.querySelector('#intake-ack')?.checked) return toast('Acknowledge conflict review first', true);
        // Pre-populate client name from the first term (heuristic)
        if (!state.clientData.companyName && !state.clientData.fullName) {
          const firstTerm = state.query.split(/[,\n]+/).map(s => s.trim()).filter(Boolean)[0];
          if (firstTerm) state.clientData.suggestedName = firstTerm;
        }
        state.step = 2;
        renderIntake();
      };
      openModal('New client intake', body, el('div', {}, [
        el('div', { class: 'spacer' }),
        el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
        el('button', { class: 'btn btn-ghost btn-sm', onclick: run }, 'Run check'),
        el('button', { class: 'btn btn-primary btn-sm', onclick: proceed }, 'Proceed to client →'),
      ]), true);
      setTimeout(() => body.querySelector('#intake-cc').focus(), 50);
      if (state.conflictData) setTimeout(run, 0);  // re-render results if returning from step 2
      return;
    }

    // Step 2: client details (reuses the same fields as openContactForm but trimmed + pre-filled)
    const suggested = state.clientData.suggestedName || '';
    state.kind ||= 'individual';

    const individualFields = el('div', {}, [
      el('div', { class: 'form-row' }, [
        el('div', { class: 'field' }, [ el('label', {}, 'First name'), el('input', { name: 'firstName' }) ]),
        el('div', { class: 'field' }, [ el('label', {}, 'Last name'),  el('input', { name: 'lastName' }) ]),
      ]),
    ]);
    const entityFields = el('div', {}, [
      el('div', { class: 'field' }, [ el('label', {}, 'Entity name'),
        el('input', { name: 'companyName', value: suggested }) ]),
      el('div', { style: 'border-top:1px dashed var(--border);margin:12px 0 10px;padding-top:10px;font-weight:600;color:var(--text-muted);font-size:11.5px;text-transform:uppercase;letter-spacing:0.5px' }, 'Main client contact'),
      el('div', { class: 'form-row' }, [
        el('div', { class: 'field' }, [ el('label', {}, 'Name'), el('input', { name: 'primaryContactName' }) ]),
        el('div', { class: 'field' }, [ el('label', {}, 'Title'), el('input', { name: 'primaryContactTitle' }) ]),
      ]),
      el('div', { class: 'form-row' }, [
        el('div', { class: 'field' }, [ el('label', {}, 'Email'), el('input', { name: 'primaryContactEmail', type: 'email' }) ]),
        el('div', { class: 'field' }, [ el('label', {}, 'Phone'), el('input', { name: 'primaryContactPhone' }) ]),
      ]),
    ]);

    const kindBtn = (id, label) => el('button', {
      type: 'button',
      class: state.kind === id ? 'active' : '',
      'data-kind': id,
      onclick: () => {
        state.kind = id;
        kindGroup.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.kind === id));
        individualFields.style.display = id === 'individual' ? '' : 'none';
        entityFields.style.display = id === 'entity' ? '' : 'none';
        const focusEl = id === 'individual'
          ? individualFields.querySelector('input[name=firstName]')
          : entityFields.querySelector('input[name=companyName]');
        focusEl?.focus();
      },
    }, label);
    const kindGroup = el('div', { class: 'btn-group', role: 'tablist', 'aria-label': 'Client kind', style: 'margin-bottom:14px' }, [
      kindBtn('individual', 'Individual'),
      kindBtn('entity', 'Entity'),
    ]);
    individualFields.style.display = state.kind === 'individual' ? '' : 'none';
    entityFields.style.display = state.kind === 'entity' ? '' : 'none';

    const body = el('div', {}, [
      stepBar,
      el('div', { style: 'padding:8px 12px;background:var(--green-bg);color:var(--green);border-radius:6px;margin-bottom:14px;font-size:12.5px;font-weight:600' },
        '✓ Conflict check complete'),
      kindGroup,
      individualFields,
      entityFields,
      el('div', { class: 'form-row' }, [
        el('div', { class: 'field' }, [ el('label', {}, 'Email'), el('input', { name: 'email', type: 'email' }) ]),
        el('div', { class: 'field' }, [ el('label', {}, 'Phone'), el('input', { name: 'phone' }) ]),
      ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Street address'), el('input', { name: 'address' }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Mailing address (if different)'), el('input', { name: 'mailingAddress' }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Default billing increment'),
        el('select', { name: 'billingIncrementMinutes' }, [
          el('option', { value: '' }, 'Firm default (' + firmDefaultIncLabel() + ')'),
          el('option', { value: '6' },  '0.1 hr (6 min)'),
          el('option', { value: '15' }, '0.25 hr (15 min)'),
        ]) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Tags (comma separated)'), el('input', { name: 'tags' }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Intake notes'),
        el('textarea', { name: 'notes' }, state.query ? `Conflict check run with terms:\n${state.query}\n` : '') ]),
    ]);

    const save = async () => {
      const d = { type: 'client' };
      $$('input, select, textarea', body).forEach(i => { d[i.name] = i.value; });
      d.tags = d.tags ? d.tags.split(',').map(s => s.trim()).filter(Boolean) : [];
      d.billingIncrementMinutes = d.billingIncrementMinutes ? parseInt(d.billingIncrementMinutes, 10) : null;
      // Drop fields from the hidden side so they don't leak into the saved record.
      if (state.kind === 'individual') {
        d.companyName = '';
        d.primaryContactName = ''; d.primaryContactTitle = '';
        d.primaryContactEmail = ''; d.primaryContactPhone = '';
      } else {
        d.firstName = ''; d.lastName = '';
      }
      if (state.kind === 'individual' && !d.firstName && !d.lastName) return toast('Enter a first or last name', true);
      if (state.kind === 'entity' && !d.companyName) return toast('Enter an entity name', true);
      const created = await api('/api/contacts', { method: 'POST', body: d });
      // Link the intake conflict-check log to this new client for traceability.
      if (state.conflictData?.logId) {
        await api('/api/conflict-checks/' + state.conflictData.logId, {
          method: 'PATCH',
          body: { notes: `Linked to new client: ${created.full_name || created.company_name || created.id}` }
        }).catch(() => {});
      }
      toast('Client created: ' + (created.full_name || created.company_name));
      closeModal();
      // Offer to create a matter immediately
      if (confirm('Create a matter for this client now?')) {
        openMatterForm({ client_contact_id: created.id, client_name: created.full_name });
      } else if (window.state?.currentView === 'contacts') navigate('contacts');
    };

    openModal('New client intake', body, el('div', {}, [
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { state.step = 1; renderIntake(); } }, '← Back'),
      el('div', { class: 'spacer' }),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
      el('button', { class: 'btn btn-primary btn-sm', onclick: save }, 'Create client'),
    ]), true);
  }
}

async function importTimeCsvModal() {
  const allMatters = await api('/api/matters');
  const matterByName = new Map();
  for (const m of allMatters) {
    const key = m.name.toLowerCase().trim();
    if (!matterByName.has(key)) matterByName.set(key, m);
  }

  let parsedRows = [];
  const importBtn = el('button', { class: 'btn btn-primary btn-sm', disabled: true,
    onclick: async () => {
      const valid = parsedRows.filter(r => r.valid);
      if (!valid.length) return;
      const rows = valid.map(r => ({
        matterId: r.matter.id, date: r.date, minutes: r.minutes,
        description: r.description, userEmail: r.userEmail || undefined, billable: r.billable,
      }));
      try {
        const result = await api('/api/time/import', { method: 'POST', body: { rows } });
        toast(`Imported ${result.inserted} time entr${result.inserted === 1 ? 'y' : 'ies'}` +
              (result.skipped ? ` (${result.skipped} skipped)` : ''));
        closeModal(); navigate('time');
      } catch (e) { toast('Import failed: ' + (e.message || 'error'), true); }
    }
  }, 'Import');

  const previewSlot = el('div', { style: 'margin-top:14px' });
  const showUser = can('manageBilling');

  function parseAndPreview(text) {
    previewSlot.innerHTML = '';
    parsedRows = [];
    importBtn.disabled = true;
    importBtn.textContent = 'Import';
    if (!text.trim()) return;
    const raw = parseCsv(text);
    if (!raw.length) { previewSlot.appendChild(el('p', { style: 'color:var(--text-muted);font-size:13px' }, 'No rows found.')); return; }

    parsedRows = raw.map((r, i) => {
      const errs = [];
      const matterName = (r.matter_name || r.matter || '').trim();
      if (!matterName) errs.push('matter_name required');
      const matter = matterName ? matterByName.get(matterName.toLowerCase()) : null;
      if (matterName && !matter) errs.push('matter not found');

      const date = (r.date || '').trim();
      if (!date) errs.push('date required');
      else if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) errs.push('date must be YYYY-MM-DD');

      let minutes = null;
      const minsRaw = (r.minutes || r.mins || '').trim();
      const hrsRaw  = (r.hours || '').trim();
      if (minsRaw) {
        const n = parseInt(minsRaw, 10);
        if (isNaN(n) || n <= 0) errs.push('minutes must be a positive integer');
        else minutes = n;
      } else if (hrsRaw) {
        const h = parseFloat(hrsRaw);
        if (isNaN(h) || h <= 0) errs.push('hours must be a positive number');
        else minutes = Math.round(h * 60);
      } else errs.push('minutes (or hours) required');

      const userEmail = (r.user_email || r.userEmail || '').trim().toLowerCase() || null;
      const billableRaw = (r.billable || '').trim().toLowerCase();
      const billable = !billableRaw || ['yes','y','true','1'].includes(billableRaw);
      const description = (r.description || r.desc || '').trim() || null;

      return { index: i, matterName, matter, date, minutes, userEmail, billable, description, errors: errs, valid: errs.length === 0 };
    });

    const validCount = parsedRows.filter(r => r.valid).length;
    importBtn.disabled = validCount === 0;
    importBtn.textContent = `Import ${validCount} row${validCount === 1 ? '' : 's'}`;

    const errorCount = parsedRows.length - validCount;
    previewSlot.appendChild(el('div', { style: 'font-size:13px;margin-bottom:8px' }, [
      el('span', { style: 'color:' + (validCount > 0 ? 'var(--success,#2d7a2d)' : 'var(--text-muted)') }, validCount + ' valid'),
      errorCount > 0 ? el('span', { style: 'color:var(--danger,#c0392b);margin-left:10px' }, errorCount + ' with errors') : null,
    ]));

    const hdrs = ['#', 'Date', 'Matter', ...(showUser ? ['User'] : []), 'Min', 'Billable', 'Description', 'Status'];
    const thead = el('thead', {}, [el('tr', {}, hdrs.map(h =>
      el('th', { style: 'text-align:left;padding:5px 8px;white-space:nowrap;border-bottom:1px solid var(--border);font-size:11px;background:var(--surface,#f8f8f8)' }, h)))]);
    const tbody = el('tbody', {}, parsedRows.map(row => {
      const errTxt = row.errors.join('; ');
      const cs = (bad) => 'padding:4px 8px;font-size:12px;' + (bad ? 'color:var(--danger,#c0392b)' : '');
      const dateErr = !row.date || !/^\d{4}-\d{2}-\d{2}$/.test(row.date);
      const cells = [
        el('td', { style: cs(false) }, String(row.index + 1)),
        el('td', { style: cs(dateErr) }, row.date || '—'),
        el('td', { style: cs(!row.matter) }, row.matterName || '—'),
        ...(showUser ? [el('td', { style: cs(false) }, row.userEmail || '(you)')] : []),
        el('td', { style: cs(row.minutes === null) }, row.minutes != null ? String(row.minutes) : '—'),
        el('td', { style: cs(false) }, row.billable ? 'yes' : 'no'),
        el('td', { style: 'padding:4px 8px;font-size:12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, row.description || ''),
        el('td', { style: 'padding:4px 8px;font-size:12px;' + (row.valid ? 'color:var(--success,#2d7a2d)' : 'color:var(--danger,#c0392b)') },
          row.valid ? '✓' : errTxt),
      ];
      return el('tr', { style: row.valid ? '' : 'background:rgba(220,0,0,0.03)' }, cells);
    }));
    previewSlot.appendChild(el('div', { style: 'overflow:auto;max-height:300px;border:1px solid var(--border);border-radius:6px' }, [
      el('table', { style: 'width:100%;border-collapse:collapse' }, [thead, tbody]),
    ]));
  }

  const fileInput = el('input', { type: 'file', id: 'time-csv-file', accept: '.csv,text/csv', style: 'font-size:13px' });
  const textarea  = el('textarea', { id: 'time-csv-text',
    style: 'width:100%;min-height:90px;font-family:monospace;font-size:11px;padding:8px;border:1px solid var(--border);border-radius:6px;resize:vertical',
    placeholder: 'matter_name,date,description,minutes,user_email,billable\nSmith v. Jones,2026-04-01,Research,90,,yes' });

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const text = await file.text();
    textarea.value = text;
    parseAndPreview(text);
  });
  textarea.addEventListener('input', (e) => parseAndPreview(e.target.value));

  const body = el('div', {}, [
    el('p', { style: 'color:var(--text-muted);font-size:13px;margin-bottom:10px' },
      'Required columns: matter_name, date (YYYY-MM-DD), minutes. Optional: description, user_email, billable (yes/no). Accepts hours instead of minutes.'),
    el('div', { style: 'display:flex;align-items:center;gap:10px;margin-bottom:6px' }, [fileInput]),
    el('div', { style: 'text-align:center;font-size:11px;color:var(--text-muted);margin-bottom:4px' }, '— or paste CSV below —'),
    textarea,
    previewSlot,
  ]);

  openModal('Import time entries from CSV', body, el('div', {}, [
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    importBtn,
  ]));
}

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const headers = splitCsvLine(lines[0]);
  return lines.slice(1).map(line => {
    const cells = splitCsvLine(line);
    const o = {};
    headers.forEach((h, i) => { o[h.trim()] = (cells[i] || '').trim(); });
    if (o.tags) o.tags = o.tags.split('|').map(s => s.trim()).filter(Boolean);
    return o;
  });
}
function splitCsvLine(line) {
  const out = []; let cur = ''; let inq = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"' && inq && line[i+1] === '"') { cur += '"'; i++; }
    else if (c === '"') inq = !inq;
    else if (c === ',' && !inq) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

// Parse a vCard text blob into an array of row objects matching the CSV
// importer's shape (firstName, lastName, fullName, email, phone, title,
// companyName, address, linkedin, notes).
function parseVcard(text) {
  if (!text) return [];
  // Strip BOM and unfold continuation lines (lines beginning with space/tab
  // are continuations of the previous logical line per RFC 6350).
  const raw = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const unfolded = raw.replace(/\n[ \t]/g, '');
  const lines = unfolded.split('\n');
  const cards = [];
  let cur = null;
  for (const line of lines) {
    const t = line.trim();
    if (!t) continue;
    if (/^BEGIN:VCARD$/i.test(t)) { cur = []; continue; }
    if (/^END:VCARD$/i.test(t)) {
      if (cur) cards.push(cur);
      cur = null;
      continue;
    }
    if (cur) cur.push(t);
  }

  const unescape = (v) => (v || '')
    .replace(/\\n/gi, '\n').replace(/\\,/g, ',').replace(/\\;/g, ';').replace(/\\\\/g, '\\');

  const decodeQP = (v) => {
    try {
      const bytes = [];
      for (let i = 0; i < v.length; i++) {
        if (v[i] === '=' && /[0-9A-Fa-f]{2}/.test(v.substr(i + 1, 2))) {
          bytes.push(parseInt(v.substr(i + 1, 2), 16));
          i += 2;
        } else {
          bytes.push(v.charCodeAt(i));
        }
      }
      return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
    } catch { return v; }
  };

  const rows = cards.map(props => {
    const row = {};
    const typePrefs = (typeList, wanted) => {
      const lower = typeList.map(t => t.toLowerCase());
      for (const w of wanted) if (lower.includes(w)) return true;
      return false;
    };
    let bestTel = null, bestTelScore = -1;
    let bestEmail = null, bestEmailScore = -1;
    let adr = null;

    for (const prop of props) {
      const colon = prop.indexOf(':');
      if (colon < 0) continue;
      const head = prop.slice(0, colon);
      let value = prop.slice(colon + 1);
      const segments = head.split(';');
      const name = segments[0].toUpperCase();
      const params = {};
      const types = [];
      for (let i = 1; i < segments.length; i++) {
        const seg = segments[i];
        const eq = seg.indexOf('=');
        if (eq < 0) {
          // vCard 2.1 bare param (e.g. TEL;CELL:...)
          types.push(seg);
        } else {
          const k = seg.slice(0, eq).toUpperCase();
          const v = seg.slice(eq + 1);
          params[k] = v;
          if (k === 'TYPE') v.split(',').forEach(s => types.push(s));
        }
      }
      if ((params.ENCODING || '').toUpperCase() === 'QUOTED-PRINTABLE') value = decodeQP(value);
      value = unescape(value);

      switch (name) {
        case 'FN':
          row.fullName = value.trim();
          break;
        case 'N': {
          const parts = value.split(';');
          row.lastName  = (parts[0] || '').trim();
          row.firstName = (parts[1] || '').trim();
          break;
        }
        case 'EMAIL': {
          const score = (typePrefs(types, ['pref']) ? 3 : 0) +
                        (typePrefs(types, ['work']) ? 2 : 0) +
                        (typePrefs(types, ['internet']) ? 1 : 0);
          if (score > bestEmailScore) { bestEmail = value.trim(); bestEmailScore = score; }
          break;
        }
        case 'TEL': {
          const score = (typePrefs(types, ['pref']) ? 4 : 0) +
                        (typePrefs(types, ['cell', 'mobile']) ? 3 : 0) +
                        (typePrefs(types, ['work']) ? 2 : 0) +
                        (typePrefs(types, ['voice']) ? 1 : 0);
          if (score > bestTelScore) { bestTel = value.trim(); bestTelScore = score; }
          break;
        }
        case 'ORG':
          row.companyName = value.split(';')[0].trim();
          break;
        case 'TITLE':
          row.title = value.trim();
          break;
        case 'ADR': {
          // ADR: pobox;ext;street;locality;region;postal;country
          const p = value.split(';').map(s => s.trim());
          const street = [p[1], p[2]].filter(Boolean).join(' ');
          const cityLine = [p[3], p[4]].filter(Boolean).join(', ');
          const line = [street, cityLine, p[5], p[6]].filter(Boolean).join(', ');
          if (line && (!adr || typePrefs(types, ['pref', 'work']))) adr = line;
          break;
        }
        case 'URL':
          if (!row.linkedin || /linkedin\.com/i.test(value)) row.linkedin = value.trim();
          break;
        case 'NOTE':
          row.notes = (row.notes ? row.notes + '\n' : '') + value.trim();
          break;
      }
    }

    if (bestEmail) row.email = bestEmail;
    if (bestTel) row.phone = bestTel;
    if (adr) row.address = adr;
    if (!row.fullName) {
      const combined = [row.firstName, row.lastName].filter(Boolean).join(' ').trim();
      row.fullName = combined || row.companyName || '';
    }
    return row;
  }).filter(r => r.fullName);

  return rows;
}

async function renderPipeline(mount, v) {
  const stages = state.firm.pipelineStages || [];
  const prospects = await api('/api/contacts?type=prospect');
  if (isStaleRender(v)) return;

  const actions = $('#topbar-actions');
  actions.innerHTML = '';
  if (can('editContacts')) {
    actions.appendChild(el('button', { class: 'btn btn-primary btn-sm', onclick: () => openContactForm({ type: 'prospect' }) }, '+ New prospect'));
  }

  // Stable, distinct color per stage for the header dot + card accent
  const stageColors = ['#1e3a5f','#4a5d7e','#7a6119','#3a6a1a','#8a3a3a','#3a2a8a','#1a6a7a','#6a3a6a'];
  const colorFor = (idx) => stageColors[idx % stageColors.length];

  const kanban = el('div', { class: 'kanban' });
  stages.forEach((stage, idx) => {
    const stageColor = colorFor(idx);
    const cards = prospects.filter(p => (p.pipeline_stage || stages[0].id) === stage.id);
    const col = el('div', { class: 'kanban-col', 'data-stage': stage.id,
      ondragover: (e) => { e.preventDefault(); col.classList.add('drag-over'); },
      ondragleave: () => col.classList.remove('drag-over'),
      ondrop: async (e) => {
        e.preventDefault(); col.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        if (!id) return;
        await api('/api/contacts/' + id + '/stage', { method: 'PATCH', body: { stage: stage.id } });
        navigate('pipeline');
      },
    }, [
      el('div', { class: 'kanban-col-header' }, [
        el('div', { class: 'title' }, [
          el('span', { class: 'dot', style: 'background:' + stageColor }),
          stage.label,
        ]),
        el('span', { class: 'count' }, String(cards.length)),
      ]),
      el('div', { class: 'kanban-cards' }, cards.length === 0
        ? [ el('div', { style: 'font-size:11.5px;color:var(--text-muted);padding:12px 6px;text-align:center;font-style:italic' }, 'Drop here') ]
        : cards.map(c => {
          const info = dueClassAndLabel(c.next_action_at);
          const accentCls = info && (info.cls === 'due-overdue' ? 'overdue' : (info.cls === 'due-today' ? 'soon' : ''));
          const tags = c.tags || [];
          const ownerShort = (c.owner_email || '').split('@')[0];
          return el('div', {
            class: 'kanban-card' + (accentCls ? ' ' + accentCls : ''),
            style: accentCls ? '' : 'border-left-color:' + stageColor,
            draggable: 'true',
            ondragstart: (e) => { e.dataTransfer.setData('text/plain', c.id); e.currentTarget.classList.add('dragging'); },
            ondragend: (e) => e.currentTarget.classList.remove('dragging'),
            onclick: () => openContact(c.id),
          }, [
            el('div', { class: 'card-head' }, [
              avatarEl(c),
              el('div', { class: 'name', title: c.full_name || '' }, c.full_name || '—'),
            ]),
            c.company_name ? el('div', { class: 'company', title: c.company_name }, c.company_name) : null,
            (info || ownerShort) ? el('div', { class: 'card-meta' }, [
              info ? el('span', { class: 'due-pill ' + info.cls, title: info.rel || '' }, [
                info.label,
                info.rel ? el('span', { style: 'opacity:.7' }, ' · ' + info.rel) : null,
              ]) : null,
              ownerShort ? el('span', { class: 'chip', title: c.owner_email }, ownerShort) : null,
            ]) : null,
            tags.length ? el('div', { class: 'card-tags' }, [
              ...tags.slice(0, 3).map(t => el('span', { class: 'tag' }, t)),
              tags.length > 3 ? el('span', { class: 'tag-more', title: tags.slice(3).join(', ') }, '+' + (tags.length - 3)) : null,
            ]) : null,
          ]);
        })),
    ]);
    kanban.appendChild(col);
  });

  mount.innerHTML = '';
  mount.appendChild(kanban);
}

async function renderMatters(mount, v) {

  state.viewState.matters ||= {};

        const r = await bulkApiDelete('/api/matters', ids);
        mv.selection.clear();
        toast(r.ok + ' deleted' + (r.errors.length ? ' · ' + r.errors.length + ' failed' : ''),

    tableSlot.innerHTML = '';
    tableSlot.appendChild(el('table', { class: 'data' }, [
      el('thead', {}, el('tr', {}, [

        el('th', {}, 'Status'), el('th', {}, 'Opened'), el('th', {}, ''),
      ])),
      el('tbody', {
        // Delegated row-click; ignore clicks routed through select cells / buttons.
        onclick: (e) => {
          if (e.target.closest('[data-row-action]')) return;
          const tr = e.target.closest('tr[data-matter-id]');
          if (!tr) return;
          const m = state.matters.find(x => x.id === tr.dataset.matterId);
          if (m) openMatterForm(m);
        },
      }, state.matters.map(m => el('tr', { 'data-matter-id': m.id }, [
        rowSelectCell(m.id, mv.selection, refresh),
        el('td', {}, el('span', { style: 'font-family:ui-monospace,SFMono-Regular,monospace;font-size:12.5px;color:var(--text-muted)' }, fmtMatterFullId(m) || '—')),
        el('td', {}, [ el('strong', {}, m.name), m.dt_matter_id ? el('div', { style: 'font-size:11px;color:var(--text-muted)' }, 'DT: ' + m.dt_matter_id) : null ]),
        el('td', {}, m.client_name || '—'),
        el('td', {}, [
          el('span', {}, m.billing_type),
          m.billing_type === 'flat' && m.flat_fee ? el('div', { style: 'font-size:11px;color:var(--text-muted)' }, fmt.money(m.flat_fee)) : null,
        ]),
        el('td', {}, el('span', { class: 'badge badge-status-' + m.status }, m.status)),
        el('td', {}, fmt.date(m.opened_at)),
        el('td', {}, ''),
      ]))),
    ]));
  };

  refresh();
}

      state.me.dtSubscriber ? (() => {
        const dtWrap  = el('div', { class: 'field' });
        dtWrap.appendChild(el('label', {}, 'DealTracker matter'));
        const dtBody  = el('div', { style: 'margin-top:4px' });

        dtWrap.appendChild(dtBody);
        dtWrap.appendChild(dtInput);

        const showLinked = (dtId, dtObj) => {
          dtInput.value = dtId;
          dtBody.innerHTML = '';
          dtBody.appendChild(el('div', { style: 'display:flex;align-items:center;gap:8px;flex-wrap:wrap' }, [
            el('span', { style: 'font-weight:500;color:var(--blue);font-size:13px' }, dtObj?.name || dtObj?.full_name || dtId),
            dtObj?.stage  ? el('span', { style: 'font-size:11px;color:var(--text-muted)' }, '· ' + dtObj.stage)  : null,
            dtObj?.status ? el('span', { class: 'badge badge-status-' + (dtObj.status === 'active' ? 'active' : 'closed') }, dtObj.status) : null,
            !isNew ? el('button', { class: 'btn btn-ghost btn-sm', style: 'font-size:11px', onclick: async e => {
              e.preventDefault();
              const btn = e.target; btn.disabled = true; btn.textContent = 'Syncing…';
              const r = await api('/api/matters/' + m.id + '/dt-sync', { method: 'POST' }).catch(() => null);
              if (r?.dt_data) { showLinked(r.dt_matter_id, r.dt_data); toast('Synced from DT'); }
              else { toast('DT sync failed', true); btn.disabled = false; btn.textContent = 'Sync'; }
            }}, 'Sync') : null,
            el('button', { class: 'btn btn-ghost btn-sm', style: 'font-size:11px;color:var(--red)', onclick: e => {
              e.preventDefault(); showUnlinked();
            }}, 'Unlink'),
          ]));
        };

        const showUnlinked = () => {
          dtInput.value = '';
          dtBody.innerHTML = '';
          const linkBtn = el('button', { class: 'btn btn-ghost btn-sm', onclick: async e => {
            e.preventDefault();
            linkBtn.disabled = true; linkBtn.textContent = 'Loading…';
            const data = await api('/api/dt/matters').catch(() => ({ clients: [] }));
            const clients = data.clients || [];
            dtBody.innerHTML = '';
            if (!clients.length) {
              dtBody.appendChild(el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:6px' }, 'DT unreachable. Enter ID manually:'));
              const manualIn = el('input', { style: 'width:100%', placeholder: 'DT matter ID' });
              manualIn.oninput = () => { dtInput.value = manualIn.value; };
              dtBody.appendChild(manualIn);
              return;
            }
            const searchIn = el('input', { placeholder: 'Search DT matters…', style: 'width:100%;margin-bottom:6px' });
            const listEl   = el('div', { style: 'max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;background:white' });
            const renderList = q => {
              listEl.innerHTML = '';
              (q ? clients.filter(c => (c.name || c.full_name || '').toLowerCase().includes(q.toLowerCase())) : clients)
                .slice(0, 30).forEach(c => {
                  const row = el('div', { style: 'padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px' }, c.name || c.full_name || String(c.id));
                  row.onmouseenter = () => { row.style.background = 'var(--gray-bg)'; };
                  row.onmouseleave = () => { row.style.background = ''; };
                  row.onclick = () => showLinked(String(c.id), c);
                  listEl.appendChild(row);
                });
              if (!listEl.children.length) listEl.appendChild(el('div', { style: 'padding:10px;color:var(--text-muted);font-size:12px' }, 'No matches'));
            };
            renderList('');
            searchIn.oninput = () => renderList(searchIn.value);
            dtBody.appendChild(searchIn);
            dtBody.appendChild(listEl);
          }}, 'Link to DT matter');
          dtBody.appendChild(linkBtn);
        };

        if (m.dt_matter_id) {
          const cached = m.dt_data ? (typeof m.dt_data === 'string' ? JSON.parse(m.dt_data) : m.dt_data) : null;
          showLinked(m.dt_matter_id, cached);
        } else { showUnlinked(); }
        return dtWrap;
      })() : el('input', { name: 'dtMatterId', type: 'hidden', value: m.dt_matter_id || '' }),
    ]),
    (() => {
      // Flat-fee field is only meaningful when billingType === 'flat'. Hide it
      // otherwise so the form clearly shows what will be billed; the save
      // handler also zeros flatFee when billing isn't flat to keep the DB
      // clean (the server adds any flat_fee > 0 to the invoice regardless of
      // billing type, so a stale value would silently bill on hourly matters).
      const initialFlat = (m.billing_type || 'hourly') === 'flat';
      const flatField = el('div', {
        class: 'field',
        style: initialFlat ? '' : 'display:none',
      }, [
        el('label', {}, 'Flat fee'),
        el('input', { name: 'flatFee', type: 'number', step: '0.01', value: m.flat_fee || 0,
          title: 'When > 0, this amount is always added to the matter’s next invoice in addition to any hourly time entries.' }),
      ]);
      return el('div', { class: 'form-row' }, [
        el('div', { class: 'field' }, [ el('label', {}, 'Billing type'),
          el('select', {
            name: 'billingType',
            onchange: (e) => { flatField.style.display = e.target.value === 'flat' ? '' : 'none'; },
          }, ['hourly','flat','contingency'].map(t =>
            el('option', { value: t, ...((m.billing_type||'hourly') === t ? { selected: 'selected' } : {}) }, t))) ]),
        flatField,
        el('div', { class: 'field' }, [ el('label', {}, 'Status'),
          el('select', { name: 'status' }, ['active','on-hold','closed'].map(s =>
            el('option', { value: s, ...((m.status||'active') === s ? { selected: 'selected' } : {}) }, s))) ]),
      ]);
    })(),
    el('div', { class: 'field' }, [
      el('label', {}, 'Billing increment (timer rounding)'),
      el('select', { name: 'billingIncrementMinutes' }, [
        el('option', { value: '', ...(!m.billing_increment_minutes ? { selected: 'selected' } : {}) }, 'Inherit from client or firm default'),
        el('option', { value: '6',  ...(m.billing_increment_minutes === 6  ? { selected: 'selected' } : {}) }, '0.1 hr (6 min)'),
        el('option', { value: '15', ...(m.billing_increment_minutes === 15 ? { selected: 'selected' } : {}) }, '0.25 hr (15 min)'),
      ]),
    ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Description'), el('textarea', { name: 'description' }, m.description || '') ]),
    !isNew && can('manageBilling') ? el('div', { id: 'matter-billing-wrap' }) : null,
    !isNew && can('manageBilling') ? el('div', { id: 'matter-recurring-wrap' }) : null,
    !isNew && can('viewRates') ? el('div', { id: 'matter-rates-wrap' }) : null,
    !isNew && can('manageBilling') ? el('div', { id: 'matter-invoices-wrap' }) : null,
    !isNew ? el('div', { id: 'matter-tasks-wrap' }) : null,
    !isNew ? el('div', { id: 'matter-docs-wrap' }) : null,
  ]);

  if (!isNew && can('manageBilling')) renderMatterBillingSummary(body.querySelector('#matter-billing-wrap'), m);
  if (!isNew && can('manageBilling')) renderMatterRecurring(body.querySelector('#matter-recurring-wrap'), m);
  if (!isNew && can('viewRates')) renderMatterRates(body.querySelector('#matter-rates-wrap'), m);
  if (!isNew && can('manageBilling')) renderMatterInvoices(body.querySelector('#matter-invoices-wrap'), m);
  if (!isNew) renderMatterTasks(body.querySelector('#matter-tasks-wrap'), m);
  if (!isNew) renderMatterDocuments(body.querySelector('#matter-docs-wrap'), m);

  const save = async () => {
    const d = {};
    $$('input, select, textarea', body).forEach(i => d[i.name] = i.value);
    d.flatFee = d.billingType === 'flat' ? (parseFloat(d.flatFee) || 0) : 0;
    d.billingIncrementMinutes = d.billingIncrementMinutes ? parseInt(d.billingIncrementMinutes, 10) : null;
    const client = contacts.find(c => c.id === d.clientContactId);
    if (client) d.clientName = client.full_name;
    if (!d.name.trim()) return toast('Name required', true);
    try {
      if (isNew) await api('/api/matters', { method: 'POST', body: d });
      else       await api('/api/matters/' + m.id, { method: 'PUT', body: d });
    } catch(e) {
      console.error('Matter save failed:', e);
      return;
    }
    toast('Saved'); closeModal();
    try { navigate('matters'); }
    catch(e) { console.error('Post-save navigate failed:', e); }
  };

  openModal(isNew ? 'New matter' : 'Edit matter', body, el('div', {}, [
    !isNew && can('manageBilling') ? el('button', { class: 'btn btn-danger btn-sm', onclick: async () => { if (!confirm('Delete matter and all its time entries?')) return; await api('/api/matters/' + m.id, { method: 'DELETE' }); toast('Deleted'); closeModal(); navigate('matters'); } }, 'Delete') : null,
    el('div', { class: 'spacer' }),
    !isNew && can('manageBilling') ? el('button', { class: 'btn btn-ghost btn-sm', onclick: async () => {
      if (!confirm('Generate an invoice for "' + (m.name || 'this matter') + '"?\n\nAll draft billable time and expenses on this matter will be included.')) return;
      try {
        const r = await api('/api/invoices', { method: 'POST', body: { matterId: m.id, issuedAt: new Date().toISOString().slice(0, 10) } });
        toast('Invoice ' + (r.number || '') + ' created');
        closeModal();
        navigate('invoices');
      } catch(e) { toast(e.message || 'Could not generate invoice', true); }
    }}, 'Generate invoice') : null,
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: save }, 'Save'),
  ]), true);
}

async function renderMatterBillingSummary(wrap, matter) {
  const [timeEntries, invoices, trust, expenses] = await Promise.all([
    api('/api/time?matterId='     + encodeURIComponent(matter.id)).catch(() => []),
    api('/api/invoices?matterId=' + encodeURIComponent(matter.id)).catch(() => []),
    api('/api/trust?matterId='    + encodeURIComponent(matter.id)).catch(() => ({ entries: [] })),
    api('/api/expenses?matterId=' + encodeURIComponent(matter.id)).catch(() => []),
  ]);

  const draftTime     = timeEntries.filter(t => t.status === 'draft' && t.billable);
  const wipTime       = draftTime.reduce((s, t) => s + (Number(t.minutes) / 60) * Number(t.rate || 0), 0);
  const draftExpenses = expenses.filter(e => e.status === 'draft' && e.billable);
  const wipExpenses   = draftExpenses.reduce((s, e) => s + Number(e.amount) * (1 + Number(e.markup_pct || 0)), 0);
  const wip           = wipTime + wipExpenses;

  const liveInv    = invoices.filter(i => i.status !== 'void');
  const billed     = liveInv.reduce((s, i) => s + Number(i.amount_paid || 0), 0);
  const outstanding = liveInv.filter(i => ['draft','sent'].includes(i.status))
    .reduce((s, i) => s + Math.max(0, Number(i.total || 0) + Number(i.amount_writedown || 0) - Number(i.amount_paid || 0)), 0);
  const trustBal   = (trust.entries || []).reduce((s, e) => s + Number(e.amount || 0), 0);

  const stat = (label, value, tone, sub) => el('div', { class: 'stat-card' }, [
    el('div', { class: 'stat-label' }, label),
    el('div', { class: 'stat-value', style: tone ? 'color:var(--' + tone + ')' : '' }, value),
    sub ? el('div', { class: 'stat-sub' }, sub) : null,
  ]);

  wrap.innerHTML = '';
  wrap.appendChild(el('h3', { style: 'font-size:13px;font-weight:700;color:var(--navy);margin-top:16px;margin-bottom:8px' }, 'Billing summary'));
  wrap.appendChild(el('div', { class: 'grid grid-4', style: 'margin-bottom:12px' }, [
    stat('Unbilled WIP', fmt.money(wip), wip > 0 ? 'gold' : null,
      draftTime.length + ' entr' + (draftTime.length === 1 ? 'y' : 'ies') + (draftExpenses.length ? ' + ' + draftExpenses.length + ' expense' + (draftExpenses.length === 1 ? '' : 's') : '')),
    stat('Outstanding', fmt.money(outstanding), outstanding > 0 ? 'red' : null,
      liveInv.filter(i => ['draft','sent'].includes(i.status)).length + ' open invoice' + (liveInv.filter(i => ['draft','sent'].includes(i.status)).length === 1 ? '' : 's')),
    stat('Collected', fmt.money(billed), null,
      liveInv.filter(i => i.status === 'paid').length + ' paid invoice' + (liveInv.filter(i => i.status === 'paid').length === 1 ? '' : 's')),
    stat('Trust held', fmt.money(trustBal), trustBal < 0 ? 'red' : trustBal > 0 ? 'green' : null,
      (trust.entries || []).length + ' ledger entr' + ((trust.entries || []).length === 1 ? 'y' : 'ies')),
  ]));
}

async function renderMatterInvoices(wrap, matter) {
  const invoices = await api('/api/invoices?matterId=' + encodeURIComponent(matter.id)).catch(() => []);
  wrap.innerHTML = '';
  wrap.appendChild(el('h3', { style: 'font-size:13px;font-weight:700;color:var(--navy);margin-top:16px' }, 'Invoices'));
  if (!invoices.length) {
    wrap.appendChild(el('div', { class: 'empty', style: 'padding:8px 0' }, 'No invoices yet.'));
    return;
  }
  wrap.appendChild(el('table', { class: 'data' }, [
    el('thead', {}, el('tr', {}, [
      el('th', {}, '#'), el('th', {}, 'Issued'), el('th', { class: 'num' }, 'Total'),
      el('th', { class: 'num' }, 'Paid'), el('th', {}, 'Status'), el('th', {}, ''),
    ])),
    el('tbody', {}, invoices.map(i => {
      const wd  = Number(i.amount_writedown || 0);
      const bal = +(Number(i.total || 0) + wd - Number(i.amount_paid || 0)).toFixed(2);
      return el('tr', {}, [
        el('td', {}, i.number || '—'),

        el('td', {}, el('button', { class: 'btn btn-ghost btn-sm', onclick: () => openInvoiceDetail(i.id) }, 'View')),
      ]);
    })),
  ]));
}

function renderMatterRecurring(wrap, matter) {
  wrap.innerHTML = '';
  let sched = {};
  try { sched = matter.billing_schedule ? JSON.parse(matter.billing_schedule) : {}; } catch { sched = {}; }
  const isActive = !!sched.active;
  const today = new Date().toISOString().slice(0, 10);
  const defaultDesc = `Recurring fee — ${matter.name || 'this matter'}`;
  const trustMin = Number(matter.trust_min_balance || 0);
  const trustTo  = matter.trust_replenish_to != null ? Number(matter.trust_replenish_to) : '';

  const card = el('div', { class: 'card mb-24' }, [
    el('h3', { style: 'font-size:13px;font-weight:700;color:var(--navy);margin-top:8px' }, 'Recurring billing'),
    el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:12px' },
      'Generate a flat-fee invoice automatically on a schedule. Time entries on this matter still bill normally — recurring fees are separate.'),

    el('div', { class: 'checkbox-row', style: 'margin-bottom:12px' }, [
      el('input', { type: 'checkbox', id: 'rec-active', ...(isActive ? { checked: 'checked' } : {}) }),
      el('label', { for: 'rec-active' }, 'Active'),
    ]),
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [
        el('label', {}, 'Frequency'),
        el('select', { id: 'rec-kind' }, [
          el('option', { value: 'monthly',   ...(sched.kind === 'monthly'   || !sched.kind ? { selected: 'selected' } : {}) }, 'Monthly'),
          el('option', { value: 'quarterly', ...(sched.kind === 'quarterly' ? { selected: 'selected' } : {}) }, 'Quarterly'),
        ]),
      ]),
      el('div', { class: 'field' }, [
        el('label', {}, 'Day of period (1–28)'),
        el('input', { id: 'rec-day', type: 'number', min: '1', max: '28', value: sched.day_of_period || 1 }),
      ]),
      el('div', { class: 'field' }, [
        el('label', {}, 'Amount ($)'),
        el('input', { id: 'rec-amt', type: 'number', step: '0.01', min: '0', value: sched.amount || '' }),
      ]),
      el('div', { class: 'field' }, [
        el('label', {}, 'Next run'),
        el('input', { id: 'rec-next', type: 'date', value: sched.next_run_at || today }),
      ]),
    ]),
    el('div', { class: 'field' }, [
      el('label', {}, 'Invoice line description'),
      el('input', { id: 'rec-desc', value: sched.description || defaultDesc }),
    ]),

    el('h4', { style: 'font-size:12px;font-weight:700;color:var(--navy);margin:18px 0 4px;text-transform:uppercase;letter-spacing:.04em' }, 'Trust replenishment'),
    el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:10px' },
      'When the trust balance for this matter falls below the floor, generate an invoice for the shortfall. Set floor to 0 to disable.'),
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [
        el('label', {}, 'Floor ($)'),
        el('input', { id: 'rec-trust-min', type: 'number', step: '0.01', min: '0', value: trustMin || '' }),
      ]),
      el('div', { class: 'field' }, [
        el('label', {}, 'Replenish to ($)'),
        el('input', { id: 'rec-trust-to', type: 'number', step: '0.01', min: '0', placeholder: 'Same as floor', value: trustTo }),
      ]),
    ]),

    el('div', { style: 'display:flex;gap:8px;margin-top:12px' }, [
      el('button', { class: 'btn btn-primary btn-sm', onclick: async () => {
        const active = $('#rec-active', wrap).checked;
        const kind   = $('#rec-kind', wrap).value;
        const day    = Math.max(1, Math.min(28, parseInt($('#rec-day', wrap).value, 10) || 1));
        const amt    = parseFloat($('#rec-amt', wrap).value) || 0;
        const next   = $('#rec-next', wrap).value || today;
        const desc   = $('#rec-desc', wrap).value.trim() || defaultDesc;
        const tMin   = parseFloat($('#rec-trust-min', wrap).value) || 0;
        const tToRaw = $('#rec-trust-to', wrap).value;
        const tTo    = tToRaw === '' ? null : (parseFloat(tToRaw) || 0);
        if (active && amt <= 0) return toast('Amount must be > 0 when active', true);
        const body = {
          billingSchedule: (active || amt > 0) ? { active, kind, day_of_period: day, amount: amt, next_run_at: next, description: desc } : null,
          trustMinBalance: tMin,
          trustReplenishTo: tTo,
        };
        try {
          const updated = await api('/api/matters/' + matter.id, { method: 'PUT', body });
          Object.assign(matter, updated);
          toast('Saved');
          renderMatterRecurring(wrap, matter);
        } catch(e) { /* api() already toasted */ }
      } }, 'Save'),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: async () => {
        if (!confirm('Generate any due recurring or replenishment invoices for this matter now?')) return;
        try {
          const r = await api('/api/matters/' + matter.id + '/billing-schedule/run-now', { method: 'POST' });
          const parts = [];
          if (r.generated)   parts.push('Invoice ' + (r.generated.number || '') + ' created');
          if (r.replenished) parts.push('Replenishment ' + (r.replenished.number || '') + ' created');
          toast(parts.length ? parts.join(' · ') : 'Nothing due');
          // Re-render with the advanced next_run_at by issuing a no-op PUT — the
          // route's response includes the latest matter row.
          const fresh = await api('/api/matters/' + matter.id, { method: 'PUT', body: {} }).catch(() => null);
          if (fresh) { Object.assign(matter, fresh); renderMatterRecurring(wrap, matter); }
        } catch(e) { /* api() already toasted */ }
      } }, 'Run now'),
    ]),
  ]);
  wrap.appendChild(card);
}

async function renderMatterTasks(wrap, matter) {
  const reload = () => renderMatterTasks(wrap, matter);
  let tasks, users;
  try {
    [tasks, users] = await Promise.all([
      api('/api/matters/' + matter.id + '/tasks'),
      (state._users ||= (await api('/api/seats')).users) && Promise.resolve(state._users),
    ]);
  } catch {
    wrap.innerHTML = '';
    wrap.appendChild(el('div', { class: 'empty', style: 'padding:8px 0' }, 'Could not load tasks.'));
    return;
  }

  wrap.innerHTML = '';
  wrap.appendChild(el('h3', { style: 'font-size:13px;font-weight:700;color:var(--navy);margin-top:16px' }, 'Tasks'));

  // ── Add task form ──
  const descIn   = el('input', { placeholder: 'Task description', style: 'flex:1;min-width:160px' });
  const dueIn    = el('input', { type: 'date', style: 'width:140px' });
  const assignIn = el('select', { style: 'width:160px' }, [
    el('option', { value: '' }, '— Unassigned —'),
    ...(users || []).map(u => el('option', { value: u.email }, u.name || u.email)),
  ]);
  const addBtn = el('button', { class: 'btn btn-ghost btn-sm', onclick: async () => {
    const description = descIn.value.trim();
    if (!description) return toast('Description required', true);
    addBtn.disabled = true;
    try {
      await api('/api/matters/' + matter.id + '/tasks', {
        method: 'POST',
        body: { description, dueDate: dueIn.value || undefined, assignedTo: assignIn.value || undefined },
      });
      reload();
    } catch (e) { toast(e.message || 'Failed', true); addBtn.disabled = false; }
  }}, '+ Add');

  wrap.appendChild(el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px' }, [
    descIn, dueIn, assignIn, addBtn,
  ]));

  if (!tasks.length) {
    wrap.appendChild(el('div', { class: 'empty', style: 'padding:6px 0' }, 'No tasks yet.'));
    return;
  }

  const overdue = d => d && new Date(d + 'T00:00:00') < new Date() && new Date(d + 'T00:00:00').toDateString() !== new Date().toDateString();

  wrap.appendChild(el('div', {}, tasks.map(t => {
    const isDone = t.status === 'done';
    const isOver = !isDone && overdue(t.due_date);
    return el('div', {
      style: 'display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--border);'
           + (isDone ? 'opacity:0.5' : ''),
    }, [
      el('input', { type: 'checkbox', checked: isDone ? 'checked' : undefined,
        style: 'margin-top:3px;flex-shrink:0;cursor:pointer',
        onchange: async (e) => {
          e.target.disabled = true;
          await api('/api/matters/' + matter.id + '/tasks/' + t.id, {
            method: 'PATCH', body: { status: e.target.checked ? 'done' : 'open' },
          }).catch(() => {});
          reload();
        },
      }),
      el('div', { style: 'flex:1;min-width:0' }, [
        el('div', { style: 'font-weight:500' }, t.description),
        el('div', { style: 'font-size:11px;color:' + (isOver ? 'var(--red)' : 'var(--text-muted)') }, [
          t.due_date ? ('Due ' + fmt.date(t.due_date)) : 'No due date',
          t.assigned_to ? ' · ' + (t.assigned_to) : '',
        ]),
      ]),
      el('button', { class: 'btn btn-ghost btn-sm', style: 'color:var(--text-muted);padding:0 4px;font-size:12px', onclick: async () => {
        if (!confirm('Delete this task?')) return;
        await api('/api/matters/' + matter.id + '/tasks/' + t.id, { method: 'DELETE' }).catch(() => {});
        reload();
      }}, '✕'),
    ]);
  })));
}

async function renderMatterDocuments(wrap, matter) {
  const fmtBytes = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB';
  const reload = () => renderMatterDocuments(wrap, matter);

  let docs;
  try { docs = await api('/api/matters/' + matter.id + '/documents'); }
  catch { wrap.innerHTML = ''; wrap.appendChild(el('div', { class: 'empty', style: 'padding:8px 0' }, 'Could not load documents.')); return; }

  wrap.innerHTML = '';
  wrap.appendChild(el('h3', { style: 'font-size:13px;font-weight:700;color:var(--navy);margin-top:16px' }, 'Documents'));

  const fileInput = el('input', { type: 'file', style: 'display:none', id: 'matter-doc-input',
    accept: '.pdf,.doc,.docx,.xls,.xlsx,.txt,.jpg,.jpeg,.png,.gif,.webp',
    onchange: async () => {
      const file = fileInput.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) return toast('File too large (max 10 MB)', true);
      const reader = new FileReader();
      reader.onload = async () => {
        const dataBase64 = reader.result.split(',')[1];
        try {
          await api('/api/matters/' + matter.id + '/documents', {
            method: 'POST',
            body: { filename: file.name, mimeType: file.type, dataBase64 },
          });
          toast('Uploaded');
          reload();
        } catch (e) { toast(e.message || 'Upload failed', true); }
      };
      reader.readAsDataURL(file);
    },
  });

  wrap.appendChild(el('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:8px' }, [
    fileInput,
    el('button', { class: 'btn btn-ghost btn-sm', onclick: () => fileInput.click() }, '+ Attach file'),
    el('div', { style: 'font-size:11px;color:var(--text-muted)' }, 'PDF, Word, Excel, plain text, images — max 10 MB'),
  ]));

  if (!docs.length) {
    wrap.appendChild(el('div', { class: 'empty', style: 'padding:6px 0' }, 'No documents attached yet.'));
    return;
  }

  wrap.appendChild(el('table', { class: 'data' }, [
    el('thead', {}, el('tr', {}, [
      el('th', {}, 'Filename'), el('th', {}, 'Size'), el('th', {}, 'Uploaded by'), el('th', {}, 'Date'), el('th', {}, ''),
    ])),
    el('tbody', {}, docs.map(doc => el('tr', {}, [
      el('td', {}, el('a', {
        href: '/api/matters/' + matter.id + '/documents/' + doc.id,
        target: '_blank',
        rel: 'noopener',
        style: 'color:var(--accent)',
      }, doc.filename)),
      el('td', {}, fmtBytes(doc.size)),
      el('td', {}, doc.uploaded_by),
      el('td', {}, fmt.date(doc.created_at)),
      el('td', {}, el('button', { class: 'btn btn-ghost btn-sm', style: 'color:var(--danger)', onclick: async () => {
        if (!confirm('Delete "' + doc.filename + '"?')) return;
        try {
          await api('/api/matters/' + matter.id + '/documents/' + doc.id, { method: 'DELETE' });
          toast('Deleted');
          reload();
        } catch (e) { toast(e.message || 'Delete failed', true); }
      }}, 'Delete')),
    ]))),
  ]));
}
