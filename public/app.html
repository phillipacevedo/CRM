<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM</title>
<style>
:root {
  --navy:#0f1f3d; --navy-light:#1a2f55; --gold:#c9a227; --gold-bg:#fdf8ea;
  --cream:#faf9f6; --text:#1a1916; --text-muted:#5a5850; --text-light:#8a8880;
  --border:#e2e0d8; --green:#1a7a4a; --green-bg:#e6f4ec; --red:#b83232;
  --red-bg:#fce8e8; --blue:#1459a8; --blue-bg:#e8f0fb; --gray-bg:#f4f3ee;
  --shadow:0 1px 3px rgba(0,0,0,.08); --shadow-md:0 4px 20px rgba(0,0,0,.12);
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
  font-size:14px;line-height:1.5;color:var(--text);background:var(--cream);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:220px;background:var(--navy);color:#fff;display:flex;flex-direction:column;flex-shrink:0;
}
.sidebar-header{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-header h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
.sidebar-header .firm-name{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 8px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;
  color:rgba(255,255,255,.78);font-size:13.5px;font-weight:500;cursor:pointer;
  transition:all .15s;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(201,162,39,.22);color:var(--gold);font-weight:600}
.nav-item.nav-locked{opacity:.45;cursor:default}
.nav-item.nav-locked:hover{background:none;color:rgba(255,255,255,.78)}
.nav-lock{font-size:10px;margin-left:auto;opacity:.7}
.nav-item .icon{width:18px;height:18px;flex-shrink:0;opacity:.9}
.sidebar-footer{padding:12px 8px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:2px}
.sidebar-footer .user-name{padding:8px 12px;font-size:12px;color:rgba(255,255,255,.55)}
.sidebar-footer .user-name strong{color:#fff;display:block;font-size:13.5px}
.app-switcher{display:flex;gap:4px;padding:8px 12px;flex-wrap:wrap}
.app-switcher a{
  flex:1;min-width:44px;padding:6px 8px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);
  font-size:10.5px;font-weight:700;text-align:center;border-radius:4px;letter-spacing:.5px;
}
.app-switcher a:hover{background:rgba(255,255,255,.15);color:#fff;text-decoration:none}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  padding:14px 20px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;flex-shrink:0;flex-wrap:wrap;
  row-gap:10px;
}
.topbar h2{font-size:18px;font-weight:700;color:var(--navy);margin-right:4px}
.topbar .search{
  flex:1 1 220px;max-width:420px;min-width:160px;
  display:flex;align-items:center;gap:8px;
  padding:7px 12px;background:var(--cream);border:1px solid var(--border);border-radius:6px;
}
.topbar .search input{flex:1;border:none;background:none;outline:none;font-size:13.5px;min-width:0}
.topbar .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.topbar .actions > *{flex-shrink:0}
#timer-widget{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}

.content{flex:1;overflow-y:auto;padding:24px}
.content-inner{max-width:1400px;margin:0 auto}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;
  font-size:13px;font-weight:600;transition:all .15s;border:1px solid transparent;
  white-space:nowrap;line-height:1.2;
}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-light)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{filter:brightness(.95)}
.btn-ghost{background:#fff;color:var(--text-muted);border-color:var(--border)}
.btn-ghost:hover{background:var(--gray-bg);color:var(--text);border-color:#c7c3b5}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(.95)}
.btn-sm{padding:6px 12px;font-size:12.5px}

/* Button group (segmented control) — for mutually exclusive states like invoice status */
.btn-group{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff}
.btn-group button{
  padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--text-muted);
  background:#fff;border:none;border-right:1px solid var(--border);
  transition:all .15s;white-space:nowrap;
}
.btn-group button:last-child{border-right:none}
.btn-group button:hover{background:var(--cream);color:var(--text)}
.btn-group button.active{background:var(--navy);color:#fff}
.btn-group button.active:hover{background:var(--navy-light)}

/* Action-bar cluster separators — visually group secondary actions together.
   `:where()` keeps these rules at single-class specificity (0,1,0 / 0,1,1) so they
   match `.btn-ghost:hover` etc. instead of escalating via descendant-selector boost.
   Behavior is identical to a plain `.btn-cluster .btn` selector because source order
   still favors these rules; the win is that any future per-button override only needs
   a single modifier class (no specificity arms race). */
.btn-cluster{display:inline-flex;gap:2px;padding:2px;background:var(--cream);border:1px solid var(--border);border-radius:7px}
:where(.btn-cluster) .btn{border-radius:5px;padding:5px 10px;border:none;background:transparent;color:var(--text-muted)}
:where(.btn-cluster) .btn:hover{background:#fff;color:var(--text)}

/* Cards */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}

/* Grids */
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}

/* Narrow-viewport responsiveness: let wide data tables scroll horizontally
   instead of blowing out the layout, and stack kanban columns instead of
   forcing horizontal scroll on a small screen. */
@media (max-width:900px){
  /* Topbar: the default flex-wrap stacks search + actions awkwardly mid-row.
     Below 900px, lay out the topbar as a vertical column with the search on
     its own row and the actions row left-aligned. */
  .topbar{flex-direction:column;align-items:stretch}
  .topbar .search{max-width:none}
  .topbar .actions{margin-left:0;justify-content:flex-start}
}
@media (max-width:768px){
  table.data{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;white-space:nowrap}
  .kanban{flex-direction:column;overflow-x:visible;min-height:auto}
  .kanban-col{width:100%;max-height:none}
  .kanban-cards{max-height:50vh}
  /* Modal forms tower on small phones (iPhone SE etc.); shrink inputs/labels
     fluidly. Clamp ceiling matches the existing desktop sizes (13.5/11.5px) so
     wider screens are unaffected; clamp floor keeps text legible at ~320px. */
  .modal-body input,.modal-body select,.modal-body textarea{font-size:clamp(12px,3vw,13.5px)}
  .modal-body label{font-size:clamp(10px,2.5vw,11.5px)}
}

.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat-card .stat-label{font-size:11px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px}
.stat-card .stat-value{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px;letter-spacing:-.5px}
.stat-card .stat-sub{font-size:12px;color:var(--text-muted);margin-top:2px}

/* Tables */
table.data{
  width:100%;border-collapse:collapse;background:#fff;
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
}
table.data th{
  text-align:left;padding:11px 14px;background:var(--cream);
  font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;
  border-bottom:1px solid var(--border);
}
table.data td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13.5px}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr{cursor:pointer;transition:background .1s}
table.data tbody tr:hover{background:var(--gold-bg)}
table.data .num{text-align:right;font-variant-numeric:tabular-nums}

/* Tags / badges — grouped by color instead of one rule per semantic label so a
   new badge just picks the right color group. Unique-color badges (judge,
   expert, referral, vendor) stay on their own lines. */
.badge{
  display:inline-block;padding:2px 8px;border-radius:3px;
  font-size:11px;font-weight:600;letter-spacing:.3px;
}
.badge-client, .badge-status-active, .badge-status-paid
  {background:var(--green-bg);color:var(--green)}
.badge-prospect, .badge-status-on-hold
  {background:var(--gold-bg);color:#7a6119}
.badge-opposing-counsel, .badge-status-void
  {background:var(--red-bg);color:var(--red)}
.badge-co-counsel, .badge-status-sent
  {background:var(--blue-bg);color:var(--blue)}
.badge-other, .badge-status-closed, .badge-status-draft
  {background:var(--gray-bg);color:var(--text-muted)}
.badge-judge   {background:#eee;   color:#333}
.badge-expert  {background:#e0dcf5;color:#3a2a8a}
.badge-referral{background:#e6f5dc;color:#3a6a1a}
.badge-vendor  {background:#f2e2cc;color:#7a4a0a}
.tag{
  display:inline-block;padding:2px 8px;background:var(--gray-bg);color:var(--text-muted);
  border-radius:3px;font-size:11px;font-weight:500;margin-right:4px;
}

/* Collapsible form sections (contact form) */
details.form-section{border-top:1px solid var(--border);margin-top:12px}
details.form-section > summary{
  display:flex;align-items:center;cursor:pointer;
  padding:10px 0 8px;list-style:none;user-select:none;
  font-size:11.5px;font-weight:700;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.5px;
}
details.form-section > summary::-webkit-details-marker{display:none}
details.form-section > summary::after{content:'▸';margin-left:auto;font-size:10px;opacity:.6;transition:transform .15s}
details.form-section[open] > summary::after{transform:rotate(90deg)}
details.form-section .section-body{padding-top:4px}

/* Forms */
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row > *{flex:1}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-light);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;
  background:#fff;font-size:13.5px;outline:none;transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy)}
.field textarea{resize:vertical;min-height:80px;font-family:inherit}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,31,61,.5);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;
}
.modal-overlay.open{display:flex}
.modal{
  background:#fff;border-radius:12px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow-md);display:flex;flex-direction:column;
}
.modal.wide{max-width:900px}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;font-weight:700;color:var(--navy)}
.modal-body{padding:20px 22px;overflow-y:auto}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;align-items:center}
.modal-footer > .spacer{flex:1;min-width:8px}
.close-btn{font-size:22px;color:var(--text-light);padding:0;line-height:1}
.close-btn:hover{color:var(--text)}

/* Kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding:4px 0;min-height:60vh;scroll-padding:10px}
.kanban-col{
  flex-shrink:0;width:288px;background:#f4f3ee;border-radius:10px;padding:10px;
  display:flex;flex-direction:column;max-height:calc(100vh - 180px);
  border:1px solid transparent;transition:border-color .15s;
}
.kanban-col-header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 4px 10px;border-bottom:1px solid rgba(0,0,0,0.06);margin-bottom:8px;position:sticky;top:0;background:#f4f3ee;z-index:1;
}
.kanban-col-header .title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px}
.kanban-col-header .title .dot{width:8px;height:8px;border-radius:50%;background:var(--navy);flex-shrink:0}
.kanban-col-header .count{background:#fff;color:var(--text-muted);padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600}
.kanban-cards{flex:1;overflow-y:auto;padding:2px;display:flex;flex-direction:column;gap:8px}
.kanban-card{
  background:#fff;border:1px solid var(--border);border-left:3px solid var(--navy);border-radius:7px;padding:10px 12px;
  font-size:12.5px;cursor:grab;transition:box-shadow .15s,transform .15s,border-color .15s;
}
.kanban-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.kanban-card.dragging{opacity:.5}
.kanban-card.overdue{border-left-color:var(--red)}
.kanban-card.soon{border-left-color:var(--gold)}
.kanban-card .card-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.kanban-card .card-head .name{font-weight:600;color:var(--text);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kanban-card .company{color:var(--text-muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kanban-card .card-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.kanban-card .card-meta .due{font-size:11px;font-weight:500}
.kanban-card .card-meta .chip{font-size:10.5px;color:var(--text-muted);background:var(--cream);padding:1px 7px;border-radius:10px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kanban-card .card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.kanban-col.drag-over{background:#e8e6dc;outline:2px dashed var(--gold);border-color:var(--gold)}

/* Shared contact-row visuals (used by contacts + clients tables) */
.avatar{
  width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-weight:600;font-size:11.5px;color:#fff;flex-shrink:0;letter-spacing:.3px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.15);
}
.contact-cell{display:flex;align-items:center;gap:10px;min-width:0}
.contact-cell .meta{display:flex;flex-direction:column;min-width:0}
.contact-cell .meta .name{font-weight:600;color:var(--text);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.contact-cell .meta .sub{font-size:11.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.contact-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.contact-info a{font-size:12.5px;color:var(--navy);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;display:inline-block}
.contact-info a:hover{text-decoration:underline}
.contact-info .phone{font-size:11.5px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.due-pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:10px}
.due-overdue{background:var(--red-bg);color:var(--red)}
.due-today{background:var(--gold-bg);color:#7a6119}
.due-soon{background:#fff4d6;color:#7a6119}
.due-future{background:var(--gray-bg);color:var(--text-muted)}
.tag-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center;max-width:180px}
.tag-more{font-size:10.5px;color:var(--text-muted);background:transparent;padding:2px 4px}
.priv-lock{color:var(--red);font-size:11px;font-weight:600;letter-spacing:.3px}

/* Client-specific subtle indicator on row */
table.data.contacts tbody tr.is-client td:first-child{box-shadow:inset 3px 0 0 var(--green)}

.muted-cell{color:var(--text-muted)}

/* Detail pane */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.detail-grid .field-group{margin-bottom:10px}
.detail-grid .field-group label{font-size:11px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:2px}
.detail-grid .field-group .val{font-size:14px;color:var(--text)}

/* Timeline */
.timeline{border-left:2px solid var(--border);margin-left:8px;padding-left:16px}
.timeline-item{margin-bottom:14px;position:relative}
.timeline-item::before{
  content:'';position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;
  background:#fff;border:2px solid var(--gold);
}
.timeline-item .ti-head{font-size:12px;color:var(--text-light);margin-bottom:2px}
.timeline-item .ti-head strong{color:var(--text)}
.timeline-item .ti-body{font-size:13.5px;white-space:pre-wrap}

/* Misc */
.empty{padding:40px 20px;text-align:center;color:var(--text-light)}
.row{display:flex;gap:10px;align-items:center}
.spacer{flex:1}
.mb-16{margin-bottom:16px}
.mb-24{margin-bottom:24px}
.mt-16{margin-top:16px}
.hidden{display:none!important}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;
  background:var(--navy);color:#fff;padding:10px 20px;border-radius:8px;box-shadow:var(--shadow-md);
  font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1}
.toast.err{background:var(--red)}
.privilege-banner{background:var(--red-bg);color:var(--red);padding:8px 12px;border-radius:6px;font-size:12px;font-weight:600;margin-bottom:12px}
.loader{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Conflict check highlight */
.cc-result{border-left:6px solid var(--gold);padding:12px 14px;background:var(--gold-bg);margin-bottom:8px;border-radius:4px;font-size:13px;box-shadow:inset 0 0 0 1px rgba(122,97,25,.15),0 1px 3px rgba(122,97,25,.1)}
.cc-result:hover{border-left-color:#a37d0d;box-shadow:inset 0 0 0 1px rgba(122,97,25,.22),0 2px 6px rgba(122,97,25,.18)}

.checkbox-row{display:flex;align-items:center;gap:8px}
.checkbox-row input{width:auto;flex:0}

/* Timer pill */
.timer-pill{
  display:inline-flex;align-items:center;gap:10px;height:34px;
  padding:0 5px 0 12px;border-radius:999px;
  background:var(--cream);border:1px solid var(--border);
  font-size:12.5px;transition:background .15s,border-color .15s;
}
.timer-pill.idle{padding:0 14px;cursor:pointer;gap:8px}
.timer-pill.idle:hover{background:#fff;border-color:var(--gold);color:var(--navy)}
.timer-pill.running{background:var(--gold-bg);border-color:var(--gold)}
.timer-pill.paused{background:#fff6d6;border-color:#dda520}
.timer-pill .t-info{display:inline-flex;align-items:center;gap:8px;min-width:0}
.timer-pill .dot{width:7px;height:7px;border-radius:50%;background:#c8c8c8;flex-shrink:0}
.timer-pill.running .dot{background:var(--red);animation:pulse 1.4s infinite}
.timer-pill.paused .dot{background:var(--gold)}
.timer-pill .t-clock{
  font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy);
  font-size:13px;letter-spacing:.2px;min-width:44px;
}
.timer-pill .t-meta{
  color:var(--text-muted);max-width:220px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;font-size:12px;
}
.timer-pill .t-divider{width:1px;height:18px;background:rgba(15,31,61,.15);flex-shrink:0}
.timer-pill .t-icon{display:inline-flex;align-items:center;color:var(--navy)}
.timer-pill .t-icon svg{width:14px;height:14px}
.timer-pill .t-controls{display:inline-flex;align-items:center;gap:2px;flex-shrink:0}
.timer-pill .t-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;background:transparent;
  color:var(--navy);transition:background .1s,color .1s;
}
.timer-pill .t-btn svg{width:12px;height:12px}
.timer-pill .t-btn:hover{background:rgba(15,31,61,.1)}
.timer-pill .t-btn.primary{background:var(--navy);color:#fff}
.timer-pill .t-btn.primary:hover{background:var(--navy-light)}
.timer-pill .t-btn.danger:hover{background:var(--red-bg);color:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Invoice settings — roomier vertical rhythm between fields */
.invoice-settings .field{margin-bottom:20px}
.invoice-settings .form-row{gap:20px;margin-bottom:20px}
.invoice-settings .form-row .field{margin-bottom:0}
.invoice-settings h4{margin-top:28px!important}

/* ═══════════════════════════════════════════════════════════════════════
   INVOICE EDITOR CSS — START
   All selectors in this block are prefixed `.inv-*` and are used ONLY inside
   the invoice editor overlay, the invoice preview, or the invoice mockup.
   CSS custom properties (`--inv-font`, `--inv-logo-scale`, `--inv-font-scale`,
   `--inv-accent`) are declared on `.inv-editor-body` — NOT on :root — and are
   set via element-scoped `style.setProperty` in `openInvoiceLayoutEditor`, so
   they can't leak into the main app when the overlay closes. Do not introduce
   un-prefixed rules here. Section ends before the "Settings tabs" block below.
   ═══════════════════════════════════════════════════════════════════════ */
/* Invoice layout editor — labels edited in place on a paper-like preview. */
.inv-editor-overlay{
  position:fixed;inset:0;z-index:1100;background:#e9e7de;
  display:flex;flex-direction:column;
}
.inv-editor-header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 18px;background:#fff;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:2;
}
.inv-editor-header h3{font-size:15px;font-weight:700;color:var(--navy);margin:0}
.inv-editor-header .hint{font-size:11.5px;color:var(--text-muted)}
.inv-editor-header .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inv-color-group,
.inv-logo-group{
  display:flex;align-items:center;gap:8px;padding:5px 10px;
  background:#fff;border:1px solid var(--border);border-radius:8px;
  box-shadow:0 1px 0 rgba(15,31,61,.04), inset 0 -1px 0 rgba(15,31,61,.02);
}
.inv-color-group .lab,
.inv-logo-group .lab{
  font-size:10px;color:var(--text-muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;padding-right:2px;
  border-right:1px solid var(--border);margin-right:2px;line-height:1;padding:1px 8px 1px 0;
}
.inv-color-group input[type="color"]{
  width:24px;height:24px;padding:0;border:1px solid var(--border);
  border-radius:50%;cursor:pointer;background:none;
  transition:transform .1s, box-shadow .1s;
}
.inv-color-group input[type="color"]:hover{transform:scale(1.08);box-shadow:0 0 0 2px rgba(15,31,61,.08)}
.inv-color-group input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
.inv-color-group input[type="color"]::-webkit-color-swatch{border:none;border-radius:50%}
.inv-swatch{
  width:20px;height:20px;border-radius:50%;cursor:pointer;
  border:2px solid #fff;box-shadow:0 0 0 1px rgba(15,31,61,.18), 0 1px 2px rgba(0,0,0,.06);
  transition:transform .1s, box-shadow .1s;
  padding:0;
}
.inv-swatch:hover{transform:scale(1.18);box-shadow:0 0 0 1px rgba(15,31,61,.35), 0 2px 6px rgba(0,0,0,.12)}
.inv-swatch.active{box-shadow:0 0 0 2px var(--navy), 0 0 0 4px rgba(15,31,61,.12)}

/* Logo control in the editor header */
.inv-logo-group .thumb{
  width:46px;height:30px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#fff,#fafaf6);border:1px solid var(--border);border-radius:6px;overflow:hidden;
  font-size:9px;color:var(--text-muted);font-weight:700;text-align:center;line-height:1;padding:2px;
  box-shadow:inset 0 0 0 1px rgba(15,31,61,.02);
}
.inv-logo-group .thumb img{max-width:100%;max-height:100%;object-fit:contain}
.inv-logo-group .mini-btn{
  font-size:11px;font-weight:600;padding:5px 10px;border:1px solid var(--border);border-radius:6px;
  background:linear-gradient(#fff,#f6f4ec);cursor:pointer;color:var(--navy);
  transition:background .12s, border-color .12s, transform .04s;
}
.inv-logo-group .mini-btn:hover{background:linear-gradient(#fafaf6,#efece1);border-color:#c7c3b5}
.inv-logo-group .mini-btn:active{transform:translateY(1px)}
.inv-logo-group .mini-btn.danger{color:var(--red)}
.inv-logo-group .mini-btn.danger:hover{background:#fdf2f0;border-color:#e8c5c0}

/* Logo slot inside the mock pages */
.inv-logo-slot{display:flex;align-items:center}
.inv-logo-slot img{
  max-height:calc(50px * var(--inv-logo-scale, 1));
  max-width:calc(260px * var(--inv-logo-scale, 1));
  object-fit:contain;
}
.inv-logo-slot.short img{
  max-height:calc(26px * var(--inv-logo-scale, 1));
  max-width:calc(180px * var(--inv-logo-scale, 1));
}
.inv-editor-body{
  flex:1;min-height:0;overflow-y:auto;padding:32px 24px 80px;
  display:flex;flex-direction:column;align-items:center;gap:32px;
  background:
    repeating-linear-gradient(45deg, rgba(0,0,0,.012) 0 2px, transparent 2px 6px),
    #e9e7de;
  --inv-font: 'Helvetica', Arial, sans-serif;
  --inv-logo-scale: 1;
  --inv-title-scale: 1;
  --inv-font-scale: 1;
}

/* Floating font editor panel — appears on label focus */
.inv-font-panel{
  position:fixed;top:80px;right:20px;z-index:1150;
  width:260px;background:#fff;border:1px solid var(--border);
  border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);
  padding:14px;font-size:12px;color:var(--navy);
  transform:translateX(calc(100% + 40px));opacity:0;pointer-events:none;
  transition:transform .18s ease-out, opacity .15s ease-out;
}
.inv-font-panel[data-open="1"]{transform:translateX(0);opacity:1;pointer-events:auto}
.inv-font-panel .hdr{
  display:flex;align-items:center;justify-content:space-between;
  margin:-2px 0 10px;
}
.inv-font-panel .hdr .ttl{font-weight:700;font-size:13px}
.inv-font-panel .hdr .close{
  background:none;border:none;font-size:18px;color:var(--text-muted);cursor:pointer;
  line-height:1;padding:2px 6px;border-radius:4px;
}
.inv-font-panel .hdr .close:hover{background:var(--cream);color:var(--navy)}
.inv-font-panel .section{
  margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);
}
.inv-font-panel .section:last-of-type{border-bottom:none}
.inv-font-panel .section-ttl{
  font-size:10.5px;font-weight:700;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;
}
.inv-font-panel .section-ttl .tgt{
  font-family:ui-monospace,monospace;color:var(--navy);font-weight:600;
  text-transform:none;letter-spacing:0;margin-left:4px;
}
.inv-font-panel .field{margin-bottom:10px}
.inv-font-panel .field label{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:4px;
}
.inv-font-panel .field label .ro{font-variant-numeric:tabular-nums;color:var(--navy)}
.inv-font-panel .field select,
.inv-font-panel .field input[type="number"],
.inv-font-panel .field input[type="range"]{width:100%;box-sizing:border-box}
.inv-font-panel .field select,
.inv-font-panel .field input[type="number"]{
  padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;
}
.inv-font-panel .preview{
  background:var(--cream);border-radius:6px;padding:10px;margin-bottom:8px;
  min-height:36px;
}
.inv-font-panel .preview .sample{
  font-family:var(--inv-font,inherit);
  font-size:calc(13px * var(--inv-font-scale, 1));
  color:#111;line-height:1.3;
}
.inv-font-panel .hint{font-size:10.5px;color:var(--text-muted);line-height:1.3}
/* Color row inside the per-label section */
.inv-font-panel .color-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.inv-font-panel .color-row .lbl-swatch{
  width:20px;height:20px;border-radius:50%;cursor:pointer;
  border:2px solid #fff;box-shadow:0 0 0 1px rgba(15,31,61,.2);
  padding:0;transition:transform .1s, box-shadow .1s;
}
.inv-font-panel .color-row .lbl-swatch:hover{transform:scale(1.15)}
.inv-font-panel .color-row .lbl-swatch.active{box-shadow:0 0 0 2px var(--navy), 0 0 0 4px rgba(15,31,61,.12)}
.inv-font-panel .color-row .lbl-swatch.none{
  background:
    linear-gradient(45deg, transparent 46%, #c33 46%, #c33 54%, transparent 54%),
    #fff;
}
.inv-font-panel .color-row input[type="color"]{
  width:24px;height:24px;padding:0;border:1px solid var(--border);
  border-radius:50%;cursor:pointer;background:none;
}
.inv-font-panel .color-row input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
.inv-font-panel .color-row input[type="color"]::-webkit-color-swatch{border:none;border-radius:50%}

/* Logo size slider (lives inside the logo pill) */
.inv-logo-group .size-wrap{display:flex;align-items:center;gap:4px;margin:0 2px}
.inv-logo-group .size-wrap input[type="range"]{width:70px}
.inv-logo-group .size-wrap .sz{font-size:10px;color:var(--text-muted);min-width:28px;text-align:right;font-variant-numeric:tabular-nums}

/* Paper — sized to US Letter (8.5"×11") at 96 DPI = 816×1056px.
   PDF margins are 50pt ≈ 67px, mirrored here so the on-screen preview
   matches the actual rendered PDF page proportions. */
.inv-page{
  width:min(816px, 100%);
  aspect-ratio:8.5 / 11;
  background:#fff;
  box-shadow:0 1px 1px rgba(0,0,0,.08), 0 6px 24px rgba(0,0,0,.18), 0 18px 60px rgba(0,0,0,.10);
  border:1px solid rgba(15,31,61,.08);
  border-radius:3px;padding:67px;color:#111;
  font:calc(10.5px * var(--inv-font-scale, 1))/1.45 var(--inv-font);
  box-sizing:border-box;
  position:relative;
}
/* Page-number badge in the upper-right corner of each preview page,
   driven by --inv-page-num set inline on each .inv-page. */
.inv-page::after{
  content:"Page " counter(inv-page-counter);
  counter-increment:inv-page-counter;
  position:absolute;top:-22px;right:0;
  font:600 10px/1 -apple-system,system-ui,sans-serif;
  color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase;
}
.inv-editor-body{counter-reset:inv-page-counter}
.inv-page .accent{color:var(--inv-accent)}

/* Editable label (contenteditable span) */
.inv-lbl{
  outline:none;border-radius:2px;padding:0 2px;margin:0 -2px;
  cursor:text;transition:background-color .12s, box-shadow .12s;
  -webkit-user-modify:read-write-plaintext-only;
}
.inv-lbl:hover{background:rgba(212,175,55,.18)}
.inv-lbl:focus{background:#fff1b8;box-shadow:0 0 0 2px rgba(212,175,55,.6)}
.inv-lbl[data-empty="1"]:not(:focus)::before{
  content:attr(data-placeholder);color:#aaa;font-style:italic;
}

/* Fake data — visually dim to signal "sample, not editable" */
.inv-fake{color:#3a3a3a}
.inv-fake-muted{color:#777}

/* Invoice pieces */
.inv-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.inv-logo{font:700 calc(22px * var(--inv-font-scale,1) * var(--inv-logo-scale,1))/1.1 var(--inv-font);color:var(--inv-accent);letter-spacing:.3px}
.inv-title{font:700 calc(26px * var(--inv-font-scale,1) * var(--inv-title-scale,1))/1.1 var(--inv-font);color:var(--inv-accent);text-align:right}
.inv-title-sm{font:700 calc(15px * var(--inv-font-scale,1) * var(--inv-title-scale,1))/1.1 var(--inv-font);color:var(--inv-accent);text-align:right}
.inv-divider{height:1.5px;background:var(--inv-accent);margin:10px 0 14px}
.inv-divider-thin{height:.5px;background:var(--inv-accent);margin:6px 0 12px}
.inv-meta{text-align:right;font-size:calc(10.5px * var(--inv-font-scale,1))}
.inv-meta .num{font-weight:700}
.inv-section-title{
  font:700 calc(13px * var(--inv-font-scale,1))/1.2 var(--inv-font);color:var(--inv-accent);
  text-align:center;margin:14px 0 4px;
}
.inv-section-title.left{text-align:left;font-size:calc(12px * var(--inv-font-scale,1))}
.inv-subtitle{font-style:italic;color:#333;text-align:center;margin-bottom:12px}

.inv-table{width:100%;border-collapse:collapse;margin:6px 0 0;font-size:calc(10px * var(--inv-font-scale,1))}
.inv-table thead th{
  background:var(--inv-accent);color:#fff;text-align:left;
  padding:7px 6px;font-weight:700;font-size:calc(9.5px * var(--inv-font-scale,1));
}
.inv-table thead th.right{text-align:right}
.inv-table tbody td{padding:5px 6px;border-bottom:.5px solid #c8d3e0;vertical-align:top}
.inv-table tbody td.right{text-align:right}
.inv-totals-row{background:#eef2f7;font-weight:700}
.inv-totals-row td{padding:7px 6px;border:none}
/* Totals row inside <tfoot> — inherits the table's column widths so values
   line up with the columns above (vs. an out-of-table flex row). */
.inv-table tfoot td{
  padding:8px 6px;border-top:1px solid var(--inv-accent);border-bottom:none;
  font-weight:700;color:var(--inv-accent);
}
.inv-table tfoot td.right{text-align:right}
.inv-table tfoot td.center{text-align:center}
.inv-table tfoot td.inv-fake{color:#3a3a3a}
.inv-rule{height:1px;background:var(--inv-accent);margin:6px 0 8px}
.inv-totals-line{display:flex;justify-content:flex-end;gap:40px;padding:4px 6px;font-weight:700;color:var(--inv-accent)}

.inv-payment-note{font-style:italic;color:#777;text-align:center;margin-top:22px}

.inv-bal{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;border-bottom:.5px solid #c8d3e0;font-size:calc(11.5px * var(--inv-font-scale,1));
}
.inv-bal.emph{
  background:var(--inv-accent);color:#fff;font-weight:700;
  border:none;padding:10px 14px;font-size:calc(12.5px * var(--inv-font-scale,1));margin-top:4px;
}
.inv-bal.emph .inv-lbl:hover{background:rgba(255,255,255,.2)}
.inv-bal.emph .inv-lbl:focus{background:#fff1b8;color:#111}

.inv-block-heading{font-weight:700;color:var(--inv-accent);margin:18px 0 8px;font-size:calc(11.5px * var(--inv-font-scale,1))}
.inv-wire-row{
  display:flex;background:#f5f7fb;border:.5px solid #c8d3e0;
  padding:6px 10px;font-size:calc(10.5px * var(--inv-font-scale,1));
}
.inv-wire-row .k{font-weight:700;flex:0 0 170px}
.inv-wire-row .v{flex:1;white-space:pre-line}

.inv-footer{
  font-weight:700;color:var(--inv-accent);text-align:center;
  margin-top:28px;font-size:calc(11px * var(--inv-font-scale,1));letter-spacing:.3px;
}
.inv-client{font-size:calc(10.5px * var(--inv-font-scale,1));white-space:pre-line}

/* Design mode — drag to move, drag the bottom-right corner to resize.
   Activated by toggling `.inv-design-mode` on `.inv-editor-body`. Labels
   stop accepting clicks so the whole block becomes the drag target.
   Persisted offsets/sizes are applied via inline style so they survive
   re-renders within the editor. */
.inv-design-mode [data-block-id]{
  position:relative;
  outline:1px dashed rgba(212,175,55,.55);outline-offset:2px;
  resize:both;overflow:auto;
  cursor:move;min-width:40px;min-height:18px;
  transition:outline-color .12s, background-color .12s;
}
.inv-design-mode [data-block-id]:hover{
  outline-color:#d4af37;background:rgba(212,175,55,.06);
}
.inv-design-mode [data-block-id].inv-dragging{
  outline:1px solid #d4af37;background:rgba(212,175,55,.10);
  user-select:none;
}
.inv-design-mode .inv-lbl{
  pointer-events:none;background:transparent !important;box-shadow:none !important;
}
.inv-design-mode .inv-page{cursor:default}

/* Hidden blocks — visibility toggled via the Blocks panel */
.inv-block-hidden{display:none !important}

/* Custom text block (page 1) */
.inv-custom-text{
  margin:18px 0 0;padding:10px 12px;
  border:1px dashed #c0b89a;border-radius:4px;
  font-size:calc(10.5px * var(--inv-font-scale,1));
  line-height:1.5;color:#333;min-height:36px;
  position:relative;
}
.inv-custom-text::before{
  content:'Custom text block';position:absolute;top:-9px;left:10px;
  font:600 9px/1 -apple-system,sans-serif;letter-spacing:.4px;
  text-transform:uppercase;color:#baa87e;
  background:#fff;padding:0 4px;
}
.inv-custom-text-lbl{
  display:block;outline:none;width:100%;
  white-space:pre-wrap;word-break:break-word;
  -webkit-user-modify:read-write-plaintext-only;
  min-height:22px;
}
.inv-custom-text-lbl[data-empty="1"]:not(:focus)::before{
  content:attr(data-placeholder);color:#bbb;font-style:italic;
}

/* Blocks panel — slides in from the left */
.inv-blocks-panel{
  position:fixed;top:80px;left:20px;z-index:1150;
  width:276px;background:#fff;border:1px solid var(--border);
  border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);
  padding:14px;font-size:12px;color:var(--navy);
  transform:translateX(calc(-100% - 40px));opacity:0;pointer-events:none;
  transition:transform .18s ease-out, opacity .15s ease-out;
}
.inv-blocks-panel[data-open="1"]{transform:translateX(0);opacity:1;pointer-events:auto}
.inv-blocks-panel .hdr{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
}
.inv-blocks-panel .hdr .ttl{font-weight:700;font-size:13px}
.inv-blocks-panel .hdr .close{
  background:none;border:none;font-size:18px;color:var(--text-muted);cursor:pointer;
  line-height:1;padding:2px 6px;border-radius:4px;
}
.inv-blocks-panel .hdr .close:hover{background:var(--cream,#f5f2e8);color:var(--navy)}
.inv-blocks-panel .block-row{
  display:flex;align-items:flex-start;gap:9px;padding:7px 0;
  border-bottom:.5px solid var(--border);cursor:pointer;
}
.inv-blocks-panel .block-row:last-of-type{border-bottom:none}
.inv-blocks-panel .block-row input[type="checkbox"]{margin:2px 0 0;cursor:pointer;accent-color:var(--navy,#1e3a5f);flex-shrink:0}
.inv-blocks-panel .block-row .lbl{font-size:12px;color:var(--navy);line-height:1.35;cursor:pointer}
.inv-blocks-panel .hint{font-size:10.5px;color:var(--text-muted);line-height:1.4;margin-top:10px;padding-top:8px;border-top:.5px solid var(--border)}

/* ═══════════════════════════════════════════════════════════════════════
   INVOICE EDITOR CSS — END
   ═══════════════════════════════════════════════════════════════════════ */

/* Theme picker (Appearance card in Profile settings) */
.theme-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:10px;margin-bottom:6px;
}
.theme-swatch{
  display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:10px;
  background:#fff;border:2px solid var(--border);border-radius:8px;cursor:pointer;
  transition:border-color .15s,box-shadow .15s;text-align:left;font:inherit;
}
.theme-swatch:hover{border-color:#c7c3b5}
.theme-swatch.active{border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,31,61,.08)}
.theme-swatch .tsw-bars{display:flex;gap:4px;height:18px}
.theme-swatch .tsw-bar{flex:1;border-radius:4px}
.theme-swatch .tsw-label{font-size:12.5px;font-weight:600;color:var(--text)}

/* Settings tabs */
.settings-tabs{
  display:flex;gap:2px;border-bottom:1px solid var(--border);
  margin-bottom:20px;flex-wrap:wrap;
}
.settings-tabs button{
  padding:10px 18px;font-size:13px;font-weight:600;
  color:var(--text-muted);background:transparent;border:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .15s,border-color .15s,background .15s;
  cursor:pointer;
}
.settings-tabs button:hover{color:var(--navy);background:var(--cream)}
.settings-tabs button.active{color:var(--navy);border-bottom-color:var(--gold)}

/* Time-card timer control (top of new/edit time modal) */
.tf-timer-box{
  display:flex;align-items:center;justify-content:center;
  padding:14px 12px;margin-bottom:10px;
  background:linear-gradient(180deg,var(--cream),#fff);
  border:1px solid var(--border);border-radius:10px;
  min-height:92px;
}
.tf-timer-empty{color:var(--text-muted);font-size:13px}
.tf-timer-wrap{display:flex;align-items:center;gap:14px}
.tf-timer-main{
  display:inline-flex;align-items:center;justify-content:center;
  width:64px;height:64px;border-radius:50%;
  background:var(--navy);color:#fff;border:none;cursor:pointer;
  box-shadow:0 4px 14px rgba(15,31,61,.18);
  transition:transform .1s,background .15s,box-shadow .15s;
}
.tf-timer-main:hover{transform:scale(1.04);background:var(--navy-light);box-shadow:0 6px 18px rgba(15,31,61,.24)}
.tf-timer-main:active{transform:scale(.97)}

<script>
// Theme presets and applyTheme — declared in <head> so a cached theme can apply
// before <body> paints (no flash of default colors). The 4 CSS vars below are
// the brand-driven ones; everything else cascades from them.
window.THEME_PRESETS = {
  navy:     { label: 'Navy & Gold',      primary: '#0f1f3d', primaryLight: '#1a2f55', accent: '#c9a227', accentBg: '#fdf8ea' },
  forest:   { label: 'Forest & Brass',   primary: '#1f3a2e', primaryLight: '#2c4f3f', accent: '#b89a4a', accentBg: '#f5f0dc' },
  burgundy: { label: 'Burgundy & Cream', primary: '#5a1a2b', primaryLight: '#762434', accent: '#c4a880', accentBg: '#f7efe2' },
  slate:    { label: 'Slate & Sky',      primary: '#2c3e50', primaryLight: '#3d556e', accent: '#5b8db8', accentBg: '#e8f0f8' },
  charcoal: { label: 'Charcoal & Amber', primary: '#2a2a2e', primaryLight: '#404048', accent: '#d4953a', accentBg: '#fbf3e3' },
  plum:     { label: 'Plum & Rose',      primary: '#3d2348', primaryLight: '#523360', accent: '#b87a8c', accentBg: '#f7eaf0' },
  teal:     { label: 'Teal & Sand',      primary: '#0d4f4a', primaryLight: '#176862', accent: '#c9a96b', accentBg: '#f6efde' },
};
(function(){
  function lighten(hex, amt) {
    const n = parseInt(String(hex).replace('#',''), 16);
    if (!Number.isFinite(n)) return hex;
    const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
    const mix = c => Math.round(c + (255 - c) * amt);
    return '#' + [mix(r), mix(g), mix(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  function resolveTheme(theme) {
    if (!theme) return null;
    if (theme.preset === 'custom') {
      const primary = theme.primary || '#0f1f3d';
      const accent  = theme.accent  || '#c9a227';
      return { primary, primaryLight: lighten(primary, 0.15), accent, accentBg: lighten(accent, 0.85) };
    }
    return window.THEME_PRESETS[theme.preset] || null;
  }
  window.applyTheme = function(theme) {
    const root = document.documentElement;
    const VARS = ['--navy','--navy-light','--gold','--gold-bg'];
    if (!theme || theme.preset === 'navy') { VARS.forEach(v => root.style.removeProperty(v)); return; }
    const p = resolveTheme(theme);
    if (!p) return;
    root.style.setProperty('--navy',       p.primary);
    root.style.setProperty('--navy-light', p.primaryLight);
    root.style.setProperty('--gold',       p.accent);
    root.style.setProperty('--gold-bg',    p.accentBg);
  };
  try {
    const cached = JSON.parse(localStorage.getItem('crm.theme') || 'null');
    if (cached) window.applyTheme(cached);
  } catch {}
})();
</script>

<script>
// ── State ────────────────────────────────────────────────────────────────
const state = {
  me: null,
  firm: null,
  contacts: [],
  companies: [],
  matters: [],
  currentView: 'dashboard',
  // Per-view UI prefs (filters, sorts, sub-tabs). Survives navigation away/back
  // so a user returning to a view sees their previous filter/sort selection.
  // Keys are view names (matching NAV_ITEMS ids) plus a few sub-tab fields.
  viewState: {},
  _renderVersion: 0,
};

// Bumped on every navigate(). Render functions capture a version and bail if
// it's superseded, so a slow fetch from the previous view can't overwrite the
// new view's DOM.
function isStaleRender(v) { return state._renderVersion !== v; }

// Per-view cleanup registry. Render functions that wire document-level listeners
// (e.g. mousemove during a drag) register a teardown here; navigate() runs them
// before switching views so a mid-drag nav can't leave stale document handlers.
// Returns an unregister function — drag handlers that complete normally should
// call it so the registry doesn't grow unbounded.
state._viewCleanups = new Set();
function registerViewCleanup(fn) {
  state._viewCleanups.add(fn);
  return () => state._viewCleanups.delete(fn);
}
function runViewCleanups() {
  const fns = [...state._viewCleanups];
  state._viewCleanups.clear();
  for (const fn of fns) {
    try { fn(); } catch(e) { console.error('view cleanup failed:', e); }
  }
}

// ── Utilities ────────────────────────────────────────────────────────────
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const el = (tag, attrs={}, children=[]) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (v != null) e.setAttribute(k, v);
  }
  const append = c => {
    if (c == null) return;
    if (Array.isArray(c)) { c.forEach(append); return; }
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  };
  append(children);
  return e;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = { money: n => '$' + (Number(n)||0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
              hours: m => ((Number(m)||0)/60).toFixed(2) + ' hr',
              date: d => d ? new Date(d).toLocaleDateString() : '',
              mdy: d => { if (!d) return ''; const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[2]}/${m[3]}/${m[1]}`; const dt = new Date(d); return isNaN(dt) ? String(d) : dt.toLocaleDateString('en-US'); },
              datetime: d => d ? new Date(d).toLocaleString() : '' };

// Per-firm sequential client identifier (e.g. 42). Returns '' when missing so
// callers can string-concat without a guard.
function fmtClientNumber(n) { return (n == null || n === '') ? '' : '#' + n; }
// Per-client sequential matter identifier, zero-padded to 5 digits ("00001").
function fmtMatterNumber(n) { return (n == null || n === '') ? '' : String(n).padStart(5, '0'); }
// Combined "{client}-{matter}" id used as a matter's external label (e.g.
// "42-00001"). Falls back to just the matter number when the client number
// isn't on the row, and returns '' when neither is set.
function fmtMatterFullId(m) {
  const mn = fmtMatterNumber(m && m.matter_number);
  if (!mn) return '';
  if (m && m.client_number != null) return m.client_number + '-' + mn;
  return mn;
}

// Date helpers for <input type="date"> (YYYY-MM-DD). Centralized so API responses
// that include a time component or full ISO string still produce a valid input value.
const toDateInput = d => {
  if (!d) return '';
  const s = String(d);
  const m = s.match(/^(\d{4}-\d{2}-\d{2})/);
  if (m) return m[1];
  const dt = new Date(s);
  return isNaN(dt) ? '' : dt.toISOString().slice(0, 10);
};
const todayDateInput = () => new Date().toISOString().slice(0, 10);

async function api(path, opts={}) {
  const res = await fetch(path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
    body: opts.body && typeof opts.body !== 'string' ? JSON.stringify(opts.body) : opts.body,
  });
  if (res.status === 401) { window.location.href = '/'; throw new Error('auth'); }
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'Request failed' }));
    toast(err.error || 'Error', true);
    throw new Error(err.error || 'Request failed');
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : res.blob();
}

// Toasts queue so a rapid second call can't wipe an unread first message.
// Consecutive duplicates collapse (e.g. two identical API errors show once).
const _toastQueue = [];
let _toastShowing = false;
function toast(msg, isError=false) {
  const last = _toastQueue[_toastQueue.length - 1];
  if (last && last.msg === msg && last.isError === isError) return;
  _toastQueue.push({ msg, isError });
  if (!_toastShowing) _flushToast();
}
function _flushToast() {
  const next = _toastQueue.shift();
  if (!next) { _toastShowing = false; return; }
  _toastShowing = true;
  const t = $('#toast');
  t.textContent = next.msg;
  t.classList.toggle('err', next.isError);
  t.classList.add('show');
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(_flushToast, 180);
  }, 2400);
}

const FOCUSABLE_SELECTOR = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
let _modalPreviousFocus = null;
let _modalKeyHandler = null;
let _modalDirty = false;

// Most callers build a modal footer as `el('div', {}, [...buttons])`. Nesting
// that wrapper inside `.modal-footer` would break its flex layout — buttons
// would stack as default block elements. Promote the wrapper's children so
// they become direct flex items (gap, .spacer, wrap all work as designed).
function unwrapFooter(footerEl) {
  const isPlainWrapper = footerEl.tagName === 'DIV'
    && !footerEl.className && !footerEl.id && footerEl.attributes.length === 0;
  return isPlainWrapper ? Array.from(footerEl.childNodes) : footerEl;
}

function openModal(title, bodyEl, footerEl, wide=false) {
  _modalDirty = false;
  const overlay = $('#modal-overlay');
  overlay.innerHTML = '';
  const modal = el('div', { class: 'modal' + (wide ? ' wide' : '') }, [
    el('div', { class: 'modal-header' }, [
      el('h3', {}, title),
      el('button', { class: 'close-btn', onclick: closeModal, 'aria-label': 'Close' }, '×'),
    ]),
    el('div', { class: 'modal-body' }, bodyEl),
    footerEl ? el('div', { class: 'modal-footer' }, unwrapFooter(footerEl)) : null,
  ]);
  overlay.appendChild(modal);
  overlay.classList.add('open');
  modal.addEventListener('input',  () => { _modalDirty = true; });
  modal.addEventListener('change', () => { _modalDirty = true; });
  overlay.onclick = (e) => {
    if (e.target !== overlay) return;
    if (_modalDirty && !confirm('Discard unsaved changes?')) return;
    closeModal();
  };

  // Focus management: remember what had focus, trap Tab inside the modal,
  // close on Escape. Focus the first interactive element so keyboard users
  // don't have to tab in from the background.
  _modalPreviousFocus = document.activeElement;
  const focusables = () => [...modal.querySelectorAll(FOCUSABLE_SELECTOR)];
  const first = focusables()[0];
  if (first) setTimeout(() => first.focus(), 0);
  _modalKeyHandler = (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      if (_modalDirty && !confirm('Discard unsaved changes?')) return;
      closeModal();
      return;
    }
    if (e.key !== 'Tab') return;
    const items = focusables();
    if (items.length === 0) { e.preventDefault(); return; }
    const f = items[0], l = items[items.length - 1];
    if (e.shiftKey && document.activeElement === f) { e.preventDefault(); l.focus(); }
    else if (!e.shiftKey && document.activeElement === l) { e.preventDefault(); f.focus(); }
  };
  document.addEventListener('keydown', _modalKeyHandler);
}
function closeModal() {
  _modalDirty = false;
  $('#modal-overlay').classList.remove('open');
  $('#modal-overlay').innerHTML = '';
  if (_modalKeyHandler) { document.removeEventListener('keydown', _modalKeyHandler); _modalKeyHandler = null; }
  if (_modalPreviousFocus && typeof _modalPreviousFocus.focus === 'function') {
    try { _modalPreviousFocus.focus(); } catch {}
  }
  _modalPreviousFocus = null;
}

function can(cap) {
  const u = state.me;
  if (!u) return false;
  const rank = { admin:100, partner:90, associate:70, 'project-assistant':60, paralegal:55, secretary:40, staff:20 }[u.role] || 0;
  switch (cap) {
    case 'manageUsers':  return u.isAdmin;
    case 'manageFirm':   return u.isAdmin;
    case 'viewRates':    return rank >= 90 || u.isAdmin;
    case 'manageBilling':return rank >= 90 || u.isAdmin;
    case 'logTime':      return rank >= 55 && rank !== 40;
    case 'editContacts': return rank >= 40;
    default: return true;
  }
}

// ── Router / nav ─────────────────────────────────────────────────────────

];

function renderNav() {
  const nav = $('#sidebar-nav');
  nav.innerHTML = '';
  NAV_ITEMS.forEach(it => {
    const locked = it.cap && !can(it.cap);
    const b = el('button', {
      class: 'nav-item' + (state.currentView === it.id ? ' active' : '') + (locked ? ' nav-locked' : ''),
      onclick: locked ? null : () => navigate(it.id),
      title: locked ? 'Requires ' + it.cap + ' access' : '',
      html: `${ICONS[it.icon]}<span>${it.label}</span>${locked ? '<span class="nav-lock">🔒</span>' : ''}`,
    });
    nav.appendChild(b);
  });
}

async function navigate(view, opts={}) {
  if ($('#modal-overlay').classList.contains('open') && _modalDirty) {
    if (!confirm('Discard unsaved changes?')) return;
  }
  runViewCleanups();
  const v = ++state._renderVersion;
  // Push to history on a distinct view change so browser back/forward works
  // and the URL is deep-linkable. Same-view refreshes (after save, retry) and
  // popstate-driven navs skip the push to avoid cluttering history.
  if (!opts.skipPush && state.currentView !== view) {
    try { history.pushState({ view }, '', '?view=' + view); } catch {}
  }
  state.currentView = view;
  $('#page-title').textContent = NAV_ITEMS.find(v => v.id === view)?.label || view;
  $('#topbar-actions').innerHTML = '';
  renderNav();
  const mount = $('#view');
  mount.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-light)"><span class="loader"></span></div>';
  // Safety net: if a render hangs past 15s (network stall, infinite loop, whatever),
  // replace the spinner with a timeout + retry link and invalidate the in-flight
  // render so its late response can't silently overwrite our message.
  const loadTimeout = setTimeout(() => {
    if (state._renderVersion !== v) return;
    state._renderVersion++;
    mount.innerHTML = '';
    mount.appendChild(el('div', { class: 'empty' }, [
      'Request is taking longer than expected. ',
      el('a', { href: 'javascript:void(0)', onclick: () => navigate(state.currentView) }, 'Retry'),
    ]));
  }, 15000);
  try {
    if      (view === 'dashboard') await renderDashboard(mount, v);
    else if (view === 'contacts')  await renderContacts(mount, v);
    else if (view === 'clients')   await renderClients(mount, v);
    else if (view === 'conflicts') await renderConflicts(mount, v);
    else if (view === 'pipeline')  await renderPipeline(mount, v);
    else if (view === 'matters')   await renderMatters(mount, v);
    else if (view === 'time')      await renderTime(mount, v);
    else if (view === 'expenses')  await renderExpenses(mount, v);
    else if (view === 'invoices')  await renderInvoices(mount, v);
    else if (view === 'cashflow')  await renderCashflow(mount, v);
    else if (view === 'trust')     await renderTrust(mount, v);
    else if (view === 'team')      await renderTeam(mount, v);
    else if (view === 'settings')  await renderSettings(mount, v);
  } catch(e) {
    if (isStaleRender(v)) return;
    console.error(e); mount.innerHTML = `<div class="empty">Error loading view: ${esc(e.message)}</div>`;
  } finally {
    clearTimeout(loadTimeout);
  }
}

// ── BOOT ─────────────────────────────────────────────────────────────────
async function boot() {
  try {
    state.me = await api('/api/auth/me');
    state.firm = await api('/api/firm');
  } catch(e) { window.location.href = '/'; return; }
  // Apply the user's saved theme (cached version was applied pre-paint by the
  // <head> script; this reconciles with the server in case it changed elsewhere).
  try {
    const profile = await api('/api/me/profile');
    state._profile = profile || {};
    const theme = (profile && profile.theme) || null;
    window.applyTheme(theme);
    try {
      if (theme) localStorage.setItem('crm.theme', JSON.stringify(theme));
      else localStorage.removeItem('crm.theme');
    } catch {}
  } catch {}
  $('#firm-name-label').textContent = state.firm.name || '';
  $('#user-name-label').textContent = state.me.name;
  $('#user-role-label').textContent = ROLE_LABELS[state.me.role] || state.me.role;
  $('#app').style.display = 'flex';
  $('#global-search').addEventListener('input', debounce(onGlobalSearch, 300));
  // Await initTimer before navigating so the dashboard's first render sees a
  // populated Timer.list (the dashboard subscribes to timer state for its widget).
  if (can('logTime')) {
    $('#timer-widget').classList.remove('hidden');
    await initTimer();
  }
  // Deep link support: honor ?view= in the URL, falling back to dashboard.
  // Replace (not push) so back doesn't leave the app.
  const initialView = new URL(window.location.href).searchParams.get('view') || 'dashboard';
  const validView = NAV_ITEMS.find(n => n.id === initialView && (!n.cap || can(n.cap))) ? initialView : 'dashboard';
  try { history.replaceState({ view: validView }, '', '?view=' + validView); } catch {}
  navigate(validView, { skipPush: true });
}

window.addEventListener('popstate', (e) => {
  const v = (e.state && e.state.view) || 'dashboard';
  navigate(v, { skipPush: true });
});

const ROLE_LABELS = { admin:'Admin', partner:'Partner', associate:'Associate', 'project-assistant':'Project Assistant', paralegal:'Paralegal', secretary:'Secretary', staff:'Staff' };

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

async function onGlobalSearch(e) {
  const q = e.target.value.trim();
  // If we're already on contacts, update the filter in place — no re-fetch,
  // no DOM teardown, and clearing the input correctly resets the filter.
  if (state.currentView === 'contacts' && state.viewState.contacts) {
    state.viewState.contacts.search = q;
    if (typeof applyContactFilters === 'function') applyContactFilters();
    return;
  }
  if (!q) return;
  state._pendingSearch = q;
  navigate('contacts');
}

// Combobox-style search input — input + clear/caret + dropdown of suggestions.
// Mirrors the pattern used in the Trust tab. `items` is [{ label }]; onChange
// fires on every keystroke and on suggestion pick with the current text.
function comboSearch({ items, placeholder, initial, onChange }) {
  let dropdownIdx = -1;
  const input = el('input', {
    type: 'text', role: 'combobox', autocomplete: 'off', spellcheck: 'false',
    placeholder, value: initial || '',
    style: 'width:100%;padding:8px 32px 8px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:14px',
  });
  const clearBtn = el('button', {
    type: 'button', title: 'Clear search', 'aria-label': 'Clear search',
    style: 'position:absolute;top:50%;right:8px;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--gray-bg);color:var(--text-muted);font-size:14px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0',
    onmousedown: (e) => e.preventDefault(),
    onclick: () => { input.value = ''; dropdownIdx = -1; dropdown.style.display = 'none'; updateRightAffix(); onChange(''); input.focus(); },
  }, '×');
  const caretBtn = el('button', {
    type: 'button', title: 'Show options', 'aria-label': 'Show options',
    style: 'position:absolute;top:50%;right:8px;transform:translateY(-50%);width:20px;height:20px;background:transparent;color:var(--text-muted);font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0',
    onmousedown: (e) => {
      e.preventDefault();
      if (dropdown.style.display === 'block') dropdown.style.display = 'none';
      else { input.focus(); dropdownIdx = -1; renderDropdown(); }
    },
  }, '▾');
  const updateRightAffix = () => {
    const hasText = !!input.value;
    clearBtn.style.display = hasText ? 'flex' : 'none';
    caretBtn.style.display = hasText ? 'none' : 'flex';
  };
  const dropdown = el('div', {
    style: 'position:absolute;top:100%;left:0;right:0;margin-top:2px;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow-md);max-height:260px;overflow-y:auto;z-index:50;display:none',
  });
  const wrap = el('div', { style: 'position:relative;flex:1;min-width:200px' }, [input, clearBtn, caretBtn, dropdown]);
  updateRightAffix();

  function matches() {
    const q = input.value.trim().toLowerCase();
    if (!q) return items.slice(0, 50);
    const starts = [], contains = [];
    for (const it of items) {
      const ln = (it.label || '').toLowerCase();
      if (ln.startsWith(q)) starts.push(it);
      else if (ln.includes(q)) contains.push(it);
    }
    return [...starts, ...contains].slice(0, 50);
  }
  function highlightItems() {
    [...dropdown.children].forEach((child, j) => {
      child.style.background = j === dropdownIdx ? 'var(--gold-bg)' : '';
    });
  }
  function renderDropdown() {
    const list = matches();
    dropdown.innerHTML = '';
    if (list.length === 0) { dropdown.style.display = 'none'; return; }
    if (dropdownIdx >= list.length) dropdownIdx = list.length - 1;
    list.forEach((it, i) => {
      dropdown.appendChild(el('div', {
        style: 'padding:8px 12px;cursor:pointer;font-size:14px;' + (i === dropdownIdx ? 'background:var(--gold-bg)' : ''),
        onmousedown: (e) => { e.preventDefault(); select(it); },
        onmouseenter: () => { dropdownIdx = i; highlightItems(); },
      }, it.label));
    });
    dropdown.style.display = 'block';
  }
  function select(it) {
    input.value = it.label;
    dropdown.style.display = 'none';
    dropdownIdx = -1;
    updateRightAffix();
    onChange(it.label);
  }
  input.addEventListener('input', () => { dropdownIdx = -1; updateRightAffix(); renderDropdown(); onChange(input.value); });
  input.addEventListener('focus', () => { dropdownIdx = -1; renderDropdown(); });
  input.addEventListener('blur', () => { setTimeout(() => { dropdown.style.display = 'none'; }, 150); });
  input.addEventListener('keydown', (e) => {
    const list = matches();
    if (e.key === 'Tab' && list.length > 0) { e.preventDefault(); select(list[dropdownIdx >= 0 ? dropdownIdx : 0]); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!list.length) return; dropdownIdx = (dropdownIdx + 1) % list.length; highlightItems(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (!list.length) return; dropdownIdx = dropdownIdx <= 0 ? list.length - 1 : dropdownIdx - 1; highlightItems(); }
    else if (e.key === 'Enter') { if (list.length > 0 && dropdownIdx >= 0) { e.preventDefault(); select(list[dropdownIdx]); } }
    else if (e.key === 'Escape') { dropdown.style.display = 'none'; dropdownIdx = -1; }
  });
  return wrap;
}

// ─────────────────────────────────────────────────────────────────────────
// SELECTION + BULK ACTIONS (shared by Clients, Matters, Time Entries, Invoices)
// ─────────────────────────────────────────────────────────────────────────
// Row/header checkboxes share a Set<id> kept on viewState. The toolbar shows
// "N selected · Delete · Export · Clear" only while ≥1 row is checked.
// Re-renders should rebuild from the same Set so selection survives sort,
// search, and pagination.

function csvCell(v) {
  if (v == null) return '';
  const s = String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function csvDownload(filename, headers, rows) {
  const lines = [headers.map(csvCell).join(',')];
  for (const r of rows) lines.push(r.map(csvCell).join(','));
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}

// Iterate per-row DELETEs since we don't have bulk endpoints. Surface failures
// (e.g. server rules like "billed entries cannot be deleted") instead of
// swallowing them — partial results are better than silent skips.
async function bulkApiDelete(endpointBase, ids) {
  let ok = 0;
  const errors = [];
  for (const id of ids) {
    try {
      await api(endpointBase + '/' + encodeURIComponent(id), { method: 'DELETE' });
      ok++;
    } catch (e) {
      errors.push({ id, message: e?.message || 'failed' });
    }
  }
  return { ok, errors };
}

// Row checkbox cell. stopPropagation so row-level onclick handlers (e.g. open
// edit modal) don't fire when ticking the box.
function rowSelectCell(id, selection, onChange) {
  const cb = el('input', {
    type: 'checkbox',
    'data-row-action': 'select',
    'aria-label': 'Select row',
    ...(selection.has(id) ? { checked: 'checked' } : {}),
    onclick: (e) => e.stopPropagation(),
    onchange: (e) => {
      if (e.target.checked) selection.add(id); else selection.delete(id);
      onChange();
    },
  });
  return el('td', { class: 'sel-cell', style: 'width:36px;text-align:center', 'data-row-action': 'select' }, cb);
}

// Header "select all visible" checkbox. Reflects all/some/none state.
function headerSelectCell(visibleIds, selection, onChange) {
  const total = visibleIds.length;
  const picked = visibleIds.filter(id => selection.has(id)).length;
  const cb = el('input', {
    type: 'checkbox',
    'aria-label': 'Select all visible',
    ...(total > 0 && picked === total ? { checked: 'checked' } : {}),
    onclick: (e) => e.stopPropagation(),
    onchange: (e) => {
      if (e.target.checked) for (const id of visibleIds) selection.add(id);
      else                  for (const id of visibleIds) selection.delete(id);
      onChange();
    },
  });
  // Set indeterminate after mount (HTML attr can't express it)
  setTimeout(() => { cb.indeterminate = picked > 0 && picked < total; }, 0);
  return el('th', { class: 'sel-cell', style: 'width:36px;text-align:center' }, cb);
}

// Floating action bar shown above a table when ≥1 row is selected.

    ...(extraActions || []).map(a => el('button', { class: 'btn btn-ghost btn-sm', onclick: a.onclick }, a.label)),

const CONTACT_SORT_KEY = {
  name:        c => (c.full_name || '').toLowerCase(),
  type:        c => c.type || '',
  company:     c => (c.company_name || '').toLowerCase(),
  email:       c => (c.email || '').toLowerCase(),
  owner:       c => (c.owner_email || '').toLowerCase(),
  next_action: c => c.next_action_at || '',
  client_since: c => c.client_since || '',
};

function sortContactRows(rows, sort, dir) {
  const keyFn = CONTACT_SORT_KEY[sort] || CONTACT_SORT_KEY.name;
  const sign = dir === 'desc' ? -1 : 1;
  return rows.slice().sort((a, b) => {
    const av = keyFn(a), bv = keyFn(b);
    // empty values sort last regardless of direction
    const aEmpty = av === '' || av == null, bEmpty = bv === '' || bv == null;
    if (aEmpty && !bEmpty) return 1;
    if (!aEmpty && bEmpty) return -1;
    return av < bv ? -sign : av > bv ? sign : 0;
  });
}

function toggleContactSort(cv, key) {
  if (cv.sort === key) cv.dir = cv.dir === 'asc' ? 'desc' : 'asc';
  else { cv.sort = key; cv.dir = key === 'next_action' ? 'desc' : 'asc'; }
}

function applyContactFilters() {
  const cv = state.viewState.contacts || { search: '', type: '', sort: 'name', dir: 'asc' };
  cv.sort ||= 'name'; cv.dir ||= 'asc';
  const wrap = $('#contacts-table');
  if (!wrap) return;
  wrap.innerHTML = '';
  const qq = (cv.search || '').trim().toLowerCase();
  let rows = cv.type ? state.contacts.filter(c => c.type === cv.type) : state.contacts;
  rows = rows.filter(c => contactMatchesQuery(c, qq));
  rows = sortContactRows(rows, cv.sort, cv.dir);
  wrap.appendChild(buildContactsTable(rows, {
    sort: cv.sort, dir: cv.dir,
    onChange: (key) => { toggleContactSort(cv, key); applyContactFilters(); },
  }));
  const count = $('#contacts-count');
  if (count) count.textContent = `${rows.length} contact${rows.length === 1 ? '' : 's'}`;
  const clearSlot = $('#contacts-clear');
  if (clearSlot) {
    clearSlot.innerHTML = '';
    if (cv.search || cv.type) {
      clearSlot.appendChild(el('button', { class: 'btn btn-ghost btn-sm', style: 'color:var(--red)', onclick: () => {
        cv.search = ''; cv.type = ''; navigate('contacts');
      }}, '× Clear filters'));
    }
  }
}

function applyClientFilters() {
  const cv = state.viewState.clients || { search: '', sort: 'name', dir: 'asc' };
  cv.sort ||= 'name'; cv.dir ||= 'asc';
  cv.selection ||= new Set();
  const wrap = $('#clients-table');
  if (!wrap) return;
  wrap.innerHTML = '';
  const qq = (cv.search || '').trim().toLowerCase();
  let rows = state.contacts.filter(c => contactMatchesQuery(c, qq));
  rows = sortContactRows(rows, cv.sort, cv.dir);
  const clearSlot = $('#clients-clear');
  if (clearSlot) {
    clearSlot.innerHTML = '';
    if (cv.search) {
      clearSlot.appendChild(el('button', { class: 'btn btn-ghost btn-sm', style: 'color:var(--red)', onclick: () => {
        cv.search = ''; navigate('clients');
      }}, '× Clear'));
    }
  }

  // Drop selections for rows no longer visible after filtering — avoids
  // ghost-deleting a row the user can't see and forgot was selected.
  const visibleIds = rows.map(r => r.id);
  for (const id of [...cv.selection]) if (!visibleIds.includes(id)) cv.selection.delete(id);

  const toolbar = $('#clients-toolbar');
  if (toolbar) {
    toolbar.innerHTML = '';
    const tb = selectionToolbar({
      count: cv.selection.size,
      label: 'client',
      onClear: () => { cv.selection.clear(); applyClientFilters(); },
      onExport: () => {
        const picked = state.contacts.filter(c => cv.selection.has(c.id));
        const headers = ['Name','Type','Company','Email','Phone','Owner','Client since','Next action','Tags'];
        const data = picked.map(c => [
          c.full_name || '', c.type || '', c.company_name || '', c.email || '', c.phone || '',
          c.owner_email || '', c.client_since || '', c.next_action || '', (c.tags || []).join('; '),
        ]);
        csvDownload('clients-' + todayYmd() + '.csv', headers, data);
      },
      onDelete: can('editContacts') ? async () => {
        const n = cv.selection.size;
        if (!confirm('Delete ' + n + ' client' + (n === 1 ? '' : 's') + '? This cannot be undone.')) return;
        const ids = [...cv.selection];
        const r = await bulkApiDelete('/api/contacts', ids);
        cv.selection.clear();
        toast(r.ok + ' deleted' + (r.errors.length ? ' · ' + r.errors.length + ' failed' : ''),
              r.errors.length > 0);
        navigate('clients');
      } : null,
    });
    if (tb) toolbar.appendChild(tb);
  }

  wrap.appendChild(buildContactsTable(rows, {
    sort: cv.sort, dir: cv.dir,
    onChange: (key) => { toggleContactSort(cv, key); applyClientFilters(); },
  }, { showType: false, showClientSince: true, selection: cv.selection, onSelectionChange: applyClientFilters }));
  const count = $('#clients-count');
  if (count) count.textContent = `${rows.length} client${rows.length === 1 ? '' : 's'}`;
}

// Shared helpers — also used by the kanban and detail views
const INITIALS_PALETTE = ['#1e3a5f','#4a5d7e','#7a4a0a','#3a6a1a','#8a3a3a','#3a2a8a','#1a6a7a','#6a3a6a','#4a5f2a','#5a3a2a'];
function contactInitials(c) {
  const src = c.full_name || c.company_name || c.email || '?';
  const parts = src.trim().split(/\s+/).slice(0, 2);
  return parts.map(p => p[0]).join('').toUpperCase() || '?';
}
function contactAvatarColor(c) {
  const src = (c.id || c.full_name || c.email || '').toString();
  let h = 0; for (let i = 0; i < src.length; i++) h = (h * 31 + src.charCodeAt(i)) >>> 0;
  return INITIALS_PALETTE[h % INITIALS_PALETTE.length];
}
function avatarEl(c) {
  return el('div', { class: 'avatar', style: 'background:' + contactAvatarColor(c) }, contactInitials(c));
}
// Classify a YYYY-MM-DD date relative to today → CSS class + label.
function dueClassAndLabel(isoDate) {
  if (!isoDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(isoDate);
  if (isNaN(d)) return null;
  d.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  const label = fmt.mdy(isoDate);
  if (diff < 0) return { cls: 'due-overdue', label, rel: `${-diff}d overdue` };
  if (diff === 0) return { cls: 'due-today',  label, rel: 'today' };
  if (diff <= 3)  return { cls: 'due-soon',   label, rel: `in ${diff}d` };
  if (diff <= 14) return { cls: 'due-future', label, rel: `in ${diff}d` };
  return { cls: 'due-future', label };
}
function duePill(isoDate, nextAction) {
  const info = dueClassAndLabel(isoDate);
  if (!info) return el('span', { class: 'muted-cell' }, '—');
  return el('div', { style: 'display:flex;flex-direction:column;gap:3px;min-width:0' }, [
    el('span', { class: 'due-pill ' + info.cls, title: info.rel || '' }, [
      info.label,
      info.rel ? el('span', { style: 'opacity:.7' }, ' · ' + info.rel) : null,
    ]),
    nextAction ? el('span', { style: 'font-size:11.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px' }, nextAction) : null,
  ]);
}

function buildContactsTable(rows, sortState, opts = {}) {

  const editable = can('editContacts');

  const showClientSinceCol = !!opts.showClientSince;
  const selection = opts.selection;
  const onSelChange = opts.onSelectionChange || (() => {});

  const th = (key, label, extra) => {
    if (!sortState) return el('th', extra || {}, label);
    const arrow = sortState.sort === key ? (sortState.dir === 'asc' ? ' ▲' : ' ▼') : '';
    const baseStyle = (extra && extra.style) ? extra.style + ';' : '';
    return el('th', {
      ...(extra || {}),
      style: baseStyle + 'cursor:pointer;user-select:none',
      onclick: () => sortState.onChange(key),
    }, label + arrow);

  const tbl = el('table', { class: 'data contacts' }, [

      // the edit button sits in a cell tagged data-row-action so we can skip the
      // row-open on its clicks. Keeps closures per-row from piling up on large tables.
      onclick: (e) => {

          el('label', { for: 'priv-cb' }, 'Mark privileged / confidential'),
        ]),
      ]),
    ]),
  ]);

  // Show/hide client-only fields based on type
  body.querySelector('select[name="type"]').addEventListener('change', (e) => {
    body.querySelector('#client-only-wrap').style.display = e.target.value === 'client' ? '' : 'none';
  });

  const save = async () => {
    const data = {};
    // Whitelist by field name (see CONTACT_FORM_FIELDS) so a stray named input
    // (from autocomplete, embedded search, etc.) can't smuggle data into the
    // save payload.
    $$('input[name], select[name], textarea[name]', body).forEach(i => {
      if (!CONTACT_FORM_FIELDS.has(i.name)) return;
      if (i.type === 'checkbox') data[i.name] = i.checked;
      else data[i.name] = i.value;
    });
    data.tags = data.tags ? data.tags.split(',').map(s => s.trim()).filter(Boolean) : [];
    data.billingIncrementMinutes = data.billingIncrementMinutes ? parseInt(data.billingIncrementMinutes, 10) : null;
    if (data.email) {
      const qs = '?email=' + encodeURIComponent(data.email) + (isNew ? '' : '&excludeId=' + c.id);
      const dups = await api('/api/contacts/dedup-check' + qs).catch(() => []);
      if (dups.length > 0) {
        const names = dups.map(x => x.full_name).join(', ');
        if (!confirm('A contact with this email already exists: ' + names + '.\n\nSave anyway?')) return;
      }
    }
    try {
      if (isNew) await api('/api/contacts', { method: 'POST', body: data });
      else       await api('/api/contacts/' + c.id, { method: 'PUT', body: data });
    } catch(e) {
      // api() already surfaced a toast — leave the modal open so the user can retry.
      console.error('Contact save failed:', e);
      return;
    }
    toast(isNew ? 'Contact created' : 'Contact saved');
    closeModal();
    // Always refresh whatever view the user is on so the edit shows up
    // immediately. Previously this only refreshed the contacts + pipeline
    // views, so edits made from the Clients view (or elsewhere) looked like
    // they hadn't saved.
    if (state.currentView) {
      try { navigate(state.currentView); }
      catch(e) { console.error('Post-save navigate failed:', e); }
    }
  };
  const footer = el('div', {}, [
    !isNew && can('editContacts') ? el('button', { class: 'btn btn-danger btn-sm', onclick: async () => { if (!confirm('Delete this contact?')) return; await api('/api/contacts/' + c.id, { method: 'DELETE' }); toast('Deleted'); closeModal(); navigate(state.currentView); } }, 'Delete') : null,
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: save }, isNew ? 'Create contact' : 'Save'),
  ]);
  openModal(isNew ? 'New contact' : 'Edit contact', body, footer, true);
}
