async function renderSettings(mount) {
  mount.innerHTML = '';
  // Profile
  const profile = await api('/api/me/profile').catch(() => ({}));
  const browserTz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'UTC';
  const currentTz = profile.timezone || browserTz;
  const tzList = (typeof Intl.supportedValuesOf === 'function')
    ? Intl.supportedValuesOf('timeZone')
    : ['UTC','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','America/Anchorage','Pacific/Honolulu','Europe/London','Europe/Paris','Asia/Tokyo','Australia/Sydney'];
  if (!tzList.includes(currentTz)) tzList.unshift(currentTz);
  mount.appendChild(el('div', { class: 'card mb-24' }, [
    el('h3', {}, 'Your profile'),
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'First name'), el('input', { id: 'pf-first', value: state.me.firstName || '' }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Last name'), el('input', { id: 'pf-last', value: state.me.lastName || '' }) ]),
    ]),
    el('div', { class: 'field' }, [
      el('label', {}, 'Time zone'),
      el('select', { id: 'pf-tz' },
        tzList.map(tz => el('option', { value: tz, ...(tz === currentTz ? { selected: 'selected' } : {}) }, tz))),
      el('div', { style: 'font-size:12px;color:var(--text-muted);margin-top:4px' }, 'Used to display times across the app. Browser detected: ' + browserTz),
    ]),
    el('div', { class: 'row' }, [
      el('button', { class: 'btn btn-primary btn-sm', onclick: async () => {
        await api('/api/me', { method: 'PUT', body: { firstName: $('#pf-first').value, lastName: $('#pf-last').value } });
        await api('/api/me/profile', { method: 'PUT', body: { ...profile, timezone: $('#pf-tz').value } });
        toast('Saved'); boot();
      } }, 'Save profile'),
      el('div', { class: 'spacer' }),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: changePasswordModal }, 'Change password'),
    ]),
  ]));

  // Firm settings (admin)
  if (can('manageFirm')) {
    mount.appendChild(el('div', { class: 'card mb-24' }, [
      el('h3', {}, 'Firm'),
      el('div', { class: 'field' }, [ el('label', {}, 'Firm name'), el('input', { id: 'firm-name-in', value: state.firm.name || '' }) ]),
      el('button', { class: 'btn btn-primary btn-sm', onclick: async () => {
        await api('/api/firm', { method: 'PUT', body: { name: $('#firm-name-in').value } });
        toast('Saved'); state.firm.name = $('#firm-name-in').value; $('#firm-name-label').textContent = state.firm.name;
      } }, 'Save'),
    ]));

    // Invoice customization — all stored in firm.settings JSON
    {
      const s = state.firm.settings || {};
      const collectInvoiceSettings = (base) => {
        const v = (id) => $('#' + id).value;
        return {
          ...base,
          invoiceTemplate:        v('inv-template'),
          accentColor:            v('inv-accent'),
          invoiceLogoText:        v('inv-logo-text'),
          address:                v('inv-firm-address'),
          remitPayeeName:         v('inv-remit-name'),
          remitAddress:           v('inv-remit-addr'),
          wireBeneficiaryName:    v('inv-wire-ben-name'),
          wireBeneficiaryAddress: v('inv-wire-ben-addr'),
          wireAccountNumber:      v('inv-wire-acct'),
          wireRoutingNumber:      v('inv-wire-routing'),
          wireBankName:           v('inv-wire-bank-name'),
          wireBankAddress:        v('inv-wire-bank-addr'),
          invoiceFooterText:      v('inv-footer'),
        };
      };
      const mkField = (id, label, val, opts = {}) => el('div', { class: 'field' }, [
        el('label', {}, label),
        opts.multiline
          ? el('textarea', { id, style: 'width:100%;min-height:' + (opts.rows ? (opts.rows * 20) : 60) + 'px' }, val || '')
          : el('input', { id, type: opts.type || 'text', value: val == null ? '' : String(val), ...(opts.placeholder ? { placeholder: opts.placeholder } : {}) }),
      ]);
      mount.appendChild(el('div', { class: 'card mb-24' }, [
        el('h3', {}, 'Invoice customization'),
        el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:14px' },
          'Controls how invoice PDFs look and what shows on the remittance page.'),

        el('div', { class: 'form-row' }, [
          el('div', { class: 'field' }, [
            el('label', {}, 'Template'),
            el('select', { id: 'inv-template' }, [
              el('option', { value: 'ap', ...((s.invoiceTemplate || 'ap') === 'ap' ? { selected: 'selected' } : {}) }, 'AP — detailed (cover + services + remittance)'),
              el('option', { value: 'simple', ...(s.invoiceTemplate === 'simple' ? { selected: 'selected' } : {}) }, 'Simple — single page'),
            ]),
          ]),
          mkField('inv-accent', 'Accent color', s.accentColor || '#1e3a5f', { type: 'color' }),
        ]),
        mkField('inv-logo-text', 'Logo header text', s.invoiceLogoText || (state.firm.name || '').toUpperCase(), { placeholder: 'Fallback used only when no logo image is uploaded' }),

        // ── Logo upload ─────────────────────────────────────────────────
        (() => {
          const wrap = el('div', { class: 'field' }, [ el('label', {}, 'Firm logo (PNG or JPEG, max 2 MB)') ]);
          const preview = el('div', {
            id: 'inv-logo-preview',
            style: 'display:flex;align-items:center;gap:12px;min-height:72px;padding:10px;border:1px dashed var(--border);border-radius:6px;background:#fafbfc',
          });
          // Holds pending upload: null = no change, {data, mime} = new upload, false = remove
          let pending = null;
          const renderPreview = () => {
            preview.innerHTML = '';
            const hasSaved = !!state.firm.hasLogo;
            if (pending && pending !== false) {
              const img = el('img', { src: 'data:' + pending.mime + ';base64,' + pending.data, style: 'max-height:60px;max-width:240px;background:#fff;border:1px solid var(--border);padding:4px;border-radius:4px' });
              preview.appendChild(img);
              preview.appendChild(el('div', { style: 'font-size:12px;color:var(--text-muted)' }, 'New logo selected — save to apply'));
            } else if (pending === false) {
              preview.appendChild(el('div', { style: 'font-size:12px;color:var(--text-muted)' }, 'Logo will be removed on save'));
            } else if (hasSaved) {
              const img = el('img', { src: '/api/firm/logo?t=' + Date.now(), style: 'max-height:60px;max-width:240px;background:#fff;border:1px solid var(--border);padding:4px;border-radius:4px', onerror: (e) => e.target.remove() });
              preview.appendChild(img);
              preview.appendChild(el('div', { style: 'font-size:12px;color:var(--text-muted)' }, 'Current logo'));
            } else {
              preview.appendChild(el('div', { style: 'font-size:12px;color:var(--text-muted)' }, 'No logo — the "Logo header text" above will be used instead'));
            }
          };
          const fileIn = el('input', {
            id: 'inv-logo-file', type: 'file', accept: 'image/png,image/jpeg',
            style: 'display:none',
            onchange: (e) => {
              const f = e.target.files[0]; if (!f) return;
              if (!['image/png','image/jpeg','image/jpg'].includes(f.type)) { toast('PNG or JPEG only', true); return; }
              if (f.size > 2 * 1024 * 1024) { toast('Logo must be under 2 MB', true); return; }
              const reader = new FileReader();
              reader.onload = () => {
                const b64 = String(reader.result).split(',')[1] || '';
                pending = { data: b64, mime: f.type === 'image/jpg' ? 'image/jpeg' : f.type };
                renderPreview();
              };
              reader.readAsDataURL(f);
              e.target.value = '';
            },
          });
          const buttons = el('div', { class: 'row mt-8', style: 'gap:8px' }, [
            el('button', { class: 'btn btn-ghost btn-sm', onclick: () => fileIn.click() }, 'Choose file…'),
            el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { pending = false; renderPreview(); } }, 'Remove logo'),
            el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { pending = null; renderPreview(); } }, 'Reset'),
          ]);
          // Expose the pending logo state so the save/preview handlers can use it
          state.firm._logoPending = () => pending;
          wrap.appendChild(preview);
          wrap.appendChild(fileIn);
          wrap.appendChild(buttons);
          renderPreview();
          return wrap;
        })(),

        mkField('inv-firm-address', 'Firm address', s.address, { multiline: true, rows: 3 }),

        el('h4', { style: 'margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)' }, 'Checks — payable to'),
        mkField('inv-remit-name', 'Payee name', s.remitPayeeName, { placeholder: 'Defaults to firm name' }),
        mkField('inv-remit-addr', 'Remit-to address', s.remitAddress, { multiline: true, rows: 3, placeholder: 'Defaults to firm address' }),

        el('h4', { style: 'margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)' }, 'Wire / ACH details'),
        el('div', { class: 'form-row' }, [
          mkField('inv-wire-ben-name', 'Beneficiary name', s.wireBeneficiaryName),
          mkField('inv-wire-acct', 'Account number', s.wireAccountNumber),
        ]),
        mkField('inv-wire-ben-addr', 'Beneficiary address', s.wireBeneficiaryAddress, { multiline: true, rows: 3 }),
        el('div', { class: 'form-row' }, [
          mkField('inv-wire-routing', 'ABA routing number', s.wireRoutingNumber),
          mkField('inv-wire-bank-name', 'Bank name', s.wireBankName),
        ]),
        mkField('inv-wire-bank-addr', 'Bank address', s.wireBankAddress, { multiline: true, rows: 3 }),

        mkField('inv-footer', 'Footer text', s.invoiceFooterText || 'INVOICES ARE PAYABLE UPON RECEIPT'),

        el('div', { class: 'row mt-16', style: 'gap:8px;align-items:center' }, [
          el('button', { class: 'btn btn-primary btn-sm', onclick: async () => {
            await api('/api/firm', { method: 'PUT', body: { settings: collectInvoiceSettings(s) } });
            state.firm.settings = collectInvoiceSettings(s);
            const pending = state.firm._logoPending && state.firm._logoPending();
            if (pending && pending !== false) {
              await api('/api/firm/logo', { method: 'POST', body: { mimeType: pending.mime, dataBase64: pending.data } });
              state.firm.hasLogo = true;
            } else if (pending === false) {
              await api('/api/firm/logo', { method: 'DELETE' });
              state.firm.hasLogo = false;
            }
            toast('Invoice settings saved');
            renderSettings($('#main')); // re-render so the preview pane reflects the saved logo
          } }, 'Save invoice settings'),
          el('button', { class: 'btn btn-ghost btn-sm', onclick: async () => {
            try {
              const pending = state.firm._logoPending && state.firm._logoPending();
              const body = { settings: collectInvoiceSettings(s) };
              if (pending && pending !== false) body.logo = { mimeType: pending.mime, dataBase64: pending.data };
              else if (pending === false) body.logo = null;
              const res = await fetch('/api/invoices/preview', {
                method: 'POST', credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
              });
              if (!res.ok) {
                const text = await res.text().catch(() => '');
                let msg;
                if (res.status === 404) msg = 'Preview endpoint not found — restart the server to load new routes';
                else if (res.status === 403) msg = 'Preview requires admin access';
                else {
                  try { msg = JSON.parse(text).error || `Preview failed (${res.status})`; }
                  catch { msg = `Preview failed (${res.status})`; }
                }
                console.error('Preview error:', res.status, text);
                toast(msg, true);
                return;
              }
              const blob = await res.blob();
              if (!blob.type.includes('pdf')) { toast('Preview failed — unexpected response', true); return; }
              const url = URL.createObjectURL(blob);
              const win = window.open(url, '_blank');
              if (!win) toast('Pop-up blocked — allow pop-ups to preview', true);
              setTimeout(() => URL.revokeObjectURL(url), 60000);
            } catch (e) {
              console.error('Preview fetch threw:', e);
              toast('Preview failed: ' + (e.message || 'network error'), true);
            }
          } }, 'Preview PDF'),
          el('div', { class: 'spacer' }),
          el('span', { style: 'font-size:12px;color:var(--text-muted)' }, 'Preview uses current form values — no need to save first.'),
        ]),
      ]));
    }

    mount.appendChild(el('div', { class: 'card mb-24' }, [
      el('h3', {}, 'Pipeline stages'),
      el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:10px' }, 'Stages prospects move through. One per line: "id | label".'),
      el('textarea', { id: 'stages-ta', style: 'width:100%;min-height:140px;font-family:monospace' },
        (state.firm.pipelineStages || []).map(s => `${s.id} | ${s.label}`).join('\n')),
      el('button', { class: 'btn btn-primary btn-sm mt-16', onclick: async () => {
        const lines = $('#stages-ta').value.split('\n').map(l => l.trim()).filter(Boolean);
        const stages = lines.map(l => {
          const [id, label] = l.split('|').map(s => s.trim());
          return { id: id || label.toLowerCase().replace(/\s+/g,'-'), label: label || id };
        });
        await api('/api/firm', { method: 'PUT', body: { pipelineStages: stages } });
        state.firm.pipelineStages = stages;
        toast('Saved');
      } }, 'Save stages'),
    ]));
  }
}

function changePasswordModal() {
  const body = el('div', {}, [
    el('div', { class: 'field' }, [ el('label', {}, 'Current password'), el('input', { id: 'cp-cur', type: 'password' }) ]),
    el('div', { class: 'field' }, [ el('label', {}, 'New password (min 8)'), el('input', { id: 'cp-new', type: 'password' }) ]),
  ]);
  openModal('Change password', body, el('div', {}, [
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: async () => {
      try {
        await api('/api/auth/change-password', { method: 'POST', body: { currentPassword: $('#cp-cur').value, newPassword: $('#cp-new').value } });
        toast('Password updated'); closeModal();
      } catch(e) {}
    } }, 'Update'),
  ]));
}

function inviteUserModal(roles) {
  const body = el('div', {}, [
    el('div', { class: 'field' }, [ el('label', {}, 'Email'), el('input', { id: 'inv-email', type: 'email' }) ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Role'),
      el('select', { id: 'inv-role' }, roles.map(r => el('option', { value: r.id }, r.label))) ]),
    el('div', { class: 'checkbox-row' }, [
      el('input', { type: 'checkbox', id: 'inv-admin' }),
      el('label', { for: 'inv-admin' }, 'Also make admin'),
    ]),
  ]);
  openModal('Invite user', body, el('div', {}, [
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: async () => {
      await api('/api/seats/invite', { method: 'POST', body: { email: $('#inv-email').value, role: $('#inv-role').value, isAdmin: $('#inv-admin').checked } });
      toast('Invite sent'); closeModal(); navigate('settings');
    } }, 'Send invite'),
  ]));
}

function editUserModal(u, roles) {
  const body = el('div', {}, [
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'First name'), el('input', { id: 'eu-first', value: u.firstName || '' }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Last name'),  el('input', { id: 'eu-last',  value: u.lastName  || '' }) ]),
    ]),
    el('div', { class: 'field' }, [ el('label', {}, 'Email'), el('input', { value: u.email, disabled: 'disabled', style: 'background:var(--gray-bg);color:var(--text-muted)' }) ]),
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Role'),
        el('select', { id: 'eu-role' }, roles.map(r => el('option', { value: r.id, ...(u.role === r.id ? { selected: 'selected' } : {}) }, r.label))) ]),
      can('viewRates') ? el('div', { class: 'field' }, [ el('label', {}, 'Base billing rate ($/hr)'),
        el('input', { id: 'eu-rate', type: 'number', step: '0.01', value: u.defaultRate || 0 }) ]) : null,
      can('viewRates') ? el('div', { class: 'field' }, [ el('label', {}, 'Discount rate ($/hr)'),
        el('input', { id: 'eu-discount', type: 'number', step: '0.01',
          value: u.discountRate != null ? u.discountRate : '',
          placeholder: 'optional' }) ]) : null,
    ]),
    el('div', { class: 'checkbox-row' }, [
      el('input', { type: 'checkbox', id: 'eu-admin', ...(u.isAdmin ? { checked: 'checked' } : {}) }),
      el('label', { for: 'eu-admin' }, 'Admin'),
    ]),
    el('div', { class: 'checkbox-row' }, [
      el('input', { type: 'checkbox', id: 'eu-active', ...(u.active ? { checked: 'checked' } : {}) }),
      el('label', { for: 'eu-active' }, 'Active'),
    ]),
  ]);
  openModal('Edit team member — ' + u.email, body, el('div', {}, [
    el('button', { class: 'btn btn-ghost btn-sm', onclick: async () => {
      await api('/api/seats/' + encodeURIComponent(u.email) + '/reset-password', { method: 'POST' });
      toast('Reset email sent');
    } }, 'Send reset email'),
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: async () => {
      const body = {
        firstName: $('#eu-first').value, lastName: $('#eu-last').value,
        role: $('#eu-role').value, active: $('#eu-active').checked,
      };
      if ($('#eu-rate'))     body.defaultRate  = parseFloat($('#eu-rate').value) || 0;
      if ($('#eu-discount')) body.discountRate = $('#eu-discount').value === '' ? null : parseFloat($('#eu-discount').value);
      await api('/api/seats/' + encodeURIComponent(u.email), { method: 'PUT', body });
      if (u.email !== state.me.email) {
        await api('/api/seats/' + encodeURIComponent(u.email), { method: 'PATCH', body: { isAdmin: $('#eu-admin').checked } });
      }
      toast('Saved'); closeModal(); state._users = null; navigate('team');
    } }, 'Save'),
  ]));
}

// ── Start ─────────────────────────────────────────────────────────────────
boot();
</script>
