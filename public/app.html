<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM</title>
<style>
:root {
  --navy:#0f1f3d; --navy-light:#1a2f55; --gold:#c9a227; --gold-bg:#fdf8ea;
  --cream:#faf9f6; --text:#1a1916; --text-muted:#5a5850; --text-light:#8a8880;
  --border:#e2e0d8; --green:#1a7a4a; --green-bg:#e6f4ec; --red:#b83232;
  --red-bg:#fce8e8; --blue:#1459a8; --blue-bg:#e8f0fb; --gray-bg:#f4f3ee;
  --shadow:0 1px 3px rgba(0,0,0,.08); --shadow-md:0 4px 20px rgba(0,0,0,.12);
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
  font-size:14px;line-height:1.5;color:var(--text);background:var(--cream);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:220px;background:var(--navy);color:#fff;display:flex;flex-direction:column;flex-shrink:0;
}
.sidebar-header{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-header h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
.sidebar-header .firm-name{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 8px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;
  color:rgba(255,255,255,.78);font-size:13.5px;font-weight:500;cursor:pointer;
  transition:all .15s;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(201,162,39,.22);color:var(--gold);font-weight:600}
.nav-item .icon{width:18px;height:18px;flex-shrink:0;opacity:.9}
.sidebar-footer{padding:12px 8px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:2px}
.sidebar-footer .user-name{padding:8px 12px;font-size:12px;color:rgba(255,255,255,.55)}
.sidebar-footer .user-name strong{color:#fff;display:block;font-size:13.5px}
.app-switcher{display:flex;gap:4px;padding:8px 12px;flex-wrap:wrap}
.app-switcher a{
  flex:1;min-width:44px;padding:6px 8px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);
  font-size:10.5px;font-weight:700;text-align:center;border-radius:4px;letter-spacing:.5px;
}
.app-switcher a:hover{background:rgba(255,255,255,.15);color:#fff;text-decoration:none}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  padding:14px 20px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;flex-shrink:0;flex-wrap:wrap;
  row-gap:10px;
}
.topbar h2{font-size:18px;font-weight:700;color:var(--navy);margin-right:4px}
.topbar .search{
  flex:1 1 220px;max-width:420px;min-width:160px;
  display:flex;align-items:center;gap:8px;
  padding:7px 12px;background:var(--cream);border:1px solid var(--border);border-radius:6px;
}
.topbar .search input{flex:1;border:none;background:none;outline:none;font-size:13.5px;min-width:0}
.topbar .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.topbar .actions > *{flex-shrink:0}
#timer-widget{flex-shrink:0}

.content{flex:1;overflow-y:auto;padding:24px}
.content-inner{max-width:1400px;margin:0 auto}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;
  font-size:13px;font-weight:600;transition:all .15s;border:1px solid transparent;
  white-space:nowrap;line-height:1.2;
}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-light)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{filter:brightness(.95)}
.btn-ghost{background:#fff;color:var(--text-muted);border-color:var(--border)}
.btn-ghost:hover{background:var(--gray-bg);color:var(--text);border-color:#c7c3b5}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(.95)}
.btn-sm{padding:6px 12px;font-size:12.5px}

/* Button group (segmented control) — for mutually exclusive states like invoice status */
.btn-group{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff}
.btn-group button{
  padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--text-muted);
  background:#fff;border:none;border-right:1px solid var(--border);
  transition:all .15s;white-space:nowrap;
}
.btn-group button:last-child{border-right:none}
.btn-group button:hover{background:var(--cream);color:var(--text)}
.btn-group button.active{background:var(--navy);color:#fff}
.btn-group button.active:hover{background:var(--navy-light)}

/* Action-bar cluster separators — visually group secondary actions together */
.btn-cluster{display:inline-flex;gap:2px;padding:2px;background:var(--cream);border:1px solid var(--border);border-radius:7px}
.btn-cluster .btn{border-radius:5px;padding:5px 10px;border:none;background:transparent;color:var(--text-muted)}
.btn-cluster .btn:hover{background:#fff;color:var(--text)}

/* Cards */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}

/* Grids */
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}

.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat-card .stat-label{font-size:11px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px}
.stat-card .stat-value{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px;letter-spacing:-.5px}
.stat-card .stat-sub{font-size:12px;color:var(--text-muted);margin-top:2px}

/* Tables */
table.data{
  width:100%;border-collapse:collapse;background:#fff;
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
}
table.data th{
  text-align:left;padding:11px 14px;background:var(--cream);
  font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;
  border-bottom:1px solid var(--border);
}
table.data td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13.5px}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr{cursor:pointer;transition:background .1s}
table.data tbody tr:hover{background:var(--gold-bg)}
table.data .num{text-align:right;font-variant-numeric:tabular-nums}

/* Tags / badges */
.badge{
  display:inline-block;padding:2px 8px;border-radius:3px;
  font-size:11px;font-weight:600;letter-spacing:.3px;
}
.badge-client{background:var(--green-bg);color:var(--green)}
.badge-prospect{background:var(--gold-bg);color:#7a6119}
.badge-opposing-counsel{background:var(--red-bg);color:var(--red)}
.badge-co-counsel{background:var(--blue-bg);color:var(--blue)}
.badge-judge{background:#eee;color:#333}
.badge-expert{background:#e0dcf5;color:#3a2a8a}
.badge-referral{background:#e6f5dc;color:#3a6a1a}
.badge-vendor{background:#f2e2cc;color:#7a4a0a}
.badge-other{background:var(--gray-bg);color:var(--text-muted)}
.badge-status-active{background:var(--green-bg);color:var(--green)}
.badge-status-closed{background:var(--gray-bg);color:var(--text-muted)}
.badge-status-on-hold{background:var(--gold-bg);color:#7a6119}
.badge-status-draft{background:var(--gray-bg);color:var(--text-muted)}
.badge-status-sent{background:var(--blue-bg);color:var(--blue)}
.badge-status-paid{background:var(--green-bg);color:var(--green)}
.badge-status-void{background:var(--red-bg);color:var(--red)}
.tag{
  display:inline-block;padding:2px 8px;background:var(--gray-bg);color:var(--text-muted);
  border-radius:3px;font-size:11px;font-weight:500;margin-right:4px;
}

/* Forms */
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row > *{flex:1}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-light);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;
  background:#fff;font-size:13.5px;outline:none;transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy)}
.field textarea{resize:vertical;min-height:80px;font-family:inherit}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,31,61,.5);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;
}
.modal-overlay.open{display:flex}
.modal{
  background:#fff;border-radius:12px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow-md);display:flex;flex-direction:column;
}
.modal.wide{max-width:900px}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;font-weight:700;color:var(--navy)}
.modal-body{padding:20px 22px;overflow-y:auto}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;align-items:center}
.modal-footer > .spacer{flex:1;min-width:8px}
.close-btn{font-size:22px;color:var(--text-light);padding:0;line-height:1}
.close-btn:hover{color:var(--text)}

/* Kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding:4px 0;min-height:60vh;scroll-padding:10px}
.kanban-col{
  flex-shrink:0;width:288px;background:#f4f3ee;border-radius:10px;padding:10px;
  display:flex;flex-direction:column;max-height:calc(100vh - 180px);
  border:1px solid transparent;transition:border-color .15s;
}
.kanban-col-header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 4px 10px;border-bottom:1px solid rgba(0,0,0,0.06);margin-bottom:8px;position:sticky;top:0;background:#f4f3ee;z-index:1;
}
.kanban-col-header .title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px}
.kanban-col-header .title .dot{width:8px;height:8px;border-radius:50%;background:var(--navy);flex-shrink:0}
.kanban-col-header .count{background:#fff;color:var(--text-muted);padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600}
.kanban-cards{flex:1;overflow-y:auto;padding:2px;display:flex;flex-direction:column;gap:8px}
.kanban-card{
  background:#fff;border:1px solid var(--border);border-left:3px solid var(--navy);border-radius:7px;padding:10px 12px;
  font-size:12.5px;cursor:grab;transition:box-shadow .15s,transform .15s,border-color .15s;
}
.kanban-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.kanban-card.dragging{opacity:.5}
.kanban-card.overdue{border-left-color:var(--red)}
.kanban-card.soon{border-left-color:var(--gold)}
.kanban-card .card-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.kanban-card .card-head .name{font-weight:600;color:var(--text);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kanban-card .company{color:var(--text-muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kanban-card .card-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.kanban-card .card-meta .due{font-size:11px;font-weight:500}
.kanban-card .card-meta .chip{font-size:10.5px;color:var(--text-muted);background:var(--cream);padding:1px 7px;border-radius:10px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kanban-card .card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.kanban-col.drag-over{background:#e8e6dc;outline:2px dashed var(--gold);border-color:var(--gold)}

/* Shared contact-row visuals (used by contacts + clients tables) */
.avatar{
  width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-weight:600;font-size:11.5px;color:#fff;flex-shrink:0;letter-spacing:.3px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.15);
}
.contact-cell{display:flex;align-items:center;gap:10px;min-width:0}
.contact-cell .meta{display:flex;flex-direction:column;min-width:0}
.contact-cell .meta .name{font-weight:600;color:var(--text);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.contact-cell .meta .sub{font-size:11.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.contact-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.contact-info a{font-size:12.5px;color:var(--navy);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;display:inline-block}
.contact-info a:hover{text-decoration:underline}
.contact-info .phone{font-size:11.5px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.due-pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:10px}
.due-overdue{background:var(--red-bg);color:var(--red)}
.due-today{background:var(--gold-bg);color:#7a6119}
.due-soon{background:#fff4d6;color:#7a6119}
.due-future{background:var(--gray-bg);color:var(--text-muted)}
.tag-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center;max-width:180px}
.tag-more{font-size:10.5px;color:var(--text-muted);background:transparent;padding:2px 4px}
.priv-lock{color:var(--red);font-size:11px;font-weight:600;letter-spacing:.3px}

/* Client-specific subtle indicator on row */
table.data.contacts tbody tr.is-client td:first-child{box-shadow:inset 3px 0 0 var(--green)}

.muted-cell{color:var(--text-muted)}

/* Detail pane */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.detail-grid .field-group{margin-bottom:10px}
.detail-grid .field-group label{font-size:11px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:2px}
.detail-grid .field-group .val{font-size:14px;color:var(--text)}

/* Timeline */
.timeline{border-left:2px solid var(--border);margin-left:8px;padding-left:16px}
.timeline-item{margin-bottom:14px;position:relative}
.timeline-item::before{
  content:'';position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;
  background:#fff;border:2px solid var(--gold);
}
.timeline-item .ti-head{font-size:12px;color:var(--text-light);margin-bottom:2px}
.timeline-item .ti-head strong{color:var(--text)}
.timeline-item .ti-body{font-size:13.5px;white-space:pre-wrap}

/* Misc */
.empty{padding:40px 20px;text-align:center;color:var(--text-light)}
.row{display:flex;gap:10px;align-items:center}
.spacer{flex:1}
.mb-16{margin-bottom:16px}
.mb-24{margin-bottom:24px}
.mt-16{margin-top:16px}
.hidden{display:none!important}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;
  background:var(--navy);color:#fff;padding:10px 20px;border-radius:8px;box-shadow:var(--shadow-md);
  font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1}
.toast.err{background:var(--red)}
.privilege-banner{background:var(--red-bg);color:var(--red);padding:8px 12px;border-radius:6px;font-size:12px;font-weight:600;margin-bottom:12px}
.loader{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Conflict check highlight */
.cc-result{border-left:3px solid var(--gold);padding:10px 12px;background:var(--gold-bg);margin-bottom:8px;border-radius:4px;font-size:13px}

.checkbox-row{display:flex;align-items:center;gap:8px}
.checkbox-row input{width:auto;flex:0}

/* Timer pill */
.timer-pill{
  display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:20px;
  background:var(--cream);border:1px solid var(--border);font-size:12.5px;
  cursor:pointer;transition:all .15s;min-height:32px;
}
.timer-pill:hover{background:#fff;border-color:var(--gold)}
.timer-pill.running{background:var(--gold-bg);border-color:var(--gold)}
.timer-pill.paused{background:#fff2cc;border-color:#dda520}
.timer-pill .t-clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy);min-width:56px;text-align:center}
.timer-pill .t-meta{color:var(--text-muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer-pill .t-btn{padding:2px 6px;border-radius:4px;background:transparent;color:var(--navy);font-weight:700;font-size:13px}
.timer-pill .t-btn:hover{background:rgba(15,31,61,.08)}
.timer-pill .dot{width:7px;height:7px;border-radius:50%;background:#c8c8c8}
.timer-pill.running .dot{background:var(--red);animation:pulse 1.4s infinite}
.timer-pill.paused .dot{background:var(--gold)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="app" id="app" style="display:none">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>CRM</h1>
      <div class="firm-name" id="firm-name-label"></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="app-switcher" id="app-switcher">
        <a href="https://dt.phillipacevedo.com" title="DealTracker">DT</a>
        <a href="https://lb.phillipacevedo.com" title="Leaderboard">LB</a>
        <a href="https://spv.phillipacevedo.com" title="SPV Tracker">SPVT</a>
      </div>
      <div class="user-name"><strong id="user-name-label"></strong><span id="user-role-label"></span></div>
      <button class="nav-item" onclick="logout()">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="page-title">Dashboard</h2>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="global-search" placeholder="Search contacts, companies, notes…" />
      </div>
      <div id="timer-widget" class="hidden"></div>
      <div class="actions" id="topbar-actions"></div>
    </div>
    <div class="content">
      <div class="content-inner" id="view"></div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay"></div>
<div class="toast" id="toast"></div>

<script src="/inactivity.js"></script>
<script>
// ── State ────────────────────────────────────────────────────────────────
const state = {
  me: null,
  firm: null,
  contacts: [],
  companies: [],
  matters: [],
  currentView: 'dashboard',
};

// ── Utilities ────────────────────────────────────────────────────────────
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const el = (tag, attrs={}, children=[]) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (v != null) e.setAttribute(k, v);
  }
  const append = c => {
    if (c == null) return;
    if (Array.isArray(c)) { c.forEach(append); return; }
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  };
  append(children);
  return e;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = { money: n => '$' + (Number(n)||0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
              hours: m => ((Number(m)||0)/60).toFixed(2) + ' hr',
              date: d => d ? new Date(d).toLocaleDateString() : '',
              mdy: d => { if (!d) return ''; const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[2]}/${m[3]}/${m[1]}`; const dt = new Date(d); return isNaN(dt) ? String(d) : dt.toLocaleDateString('en-US'); },
              datetime: d => d ? new Date(d).toLocaleString() : '' };

async function api(path, opts={}) {
  const res = await fetch(path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
    body: opts.body && typeof opts.body !== 'string' ? JSON.stringify(opts.body) : opts.body,
  });
  if (res.status === 401) { window.location.href = '/'; throw new Error('auth'); }
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'Request failed' }));
    toast(err.error || 'Error', true);
    throw new Error(err.error || 'Request failed');
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : res.blob();
}

function toast(msg, isError=false) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('err', isError);
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}

function openModal(title, bodyEl, footerEl, wide=false) {
  const overlay = $('#modal-overlay');
  overlay.innerHTML = '';
  const modal = el('div', { class: 'modal' + (wide ? ' wide' : '') }, [
    el('div', { class: 'modal-header' }, [
      el('h3', {}, title),
      el('button', { class: 'close-btn', onclick: closeModal }, '×'),
    ]),
    el('div', { class: 'modal-body' }, bodyEl),
    footerEl ? el('div', { class: 'modal-footer' }, footerEl) : null,
  ]);
  overlay.appendChild(modal);
  overlay.classList.add('open');
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
}

  const rank = { admin:100, partner:90, associate:70, 'project-assistant':60, paralegal:55, secretary:40, staff:20 }[u.role] || 0;
  switch (cap) {

// Combobox-style search input — input + clear/caret + dropdown of suggestions.
// Mirrors the pattern used in the Trust tab. `items` is [{ label }]; onChange
// fires on every keystroke and on suggestion pick with the current text.
function comboSearch({ items, placeholder, initial, onChange }) {
  let dropdownIdx = -1;
  const input = el('input', {
    type: 'text', role: 'combobox', autocomplete: 'off', spellcheck: 'false',
    placeholder, value: initial || '',
    style: 'width:100%;padding:8px 32px 8px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:14px',
  });
  const clearBtn = el('button', {
    type: 'button', title: 'Clear search', 'aria-label': 'Clear search',
    style: 'position:absolute;top:50%;right:8px;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--gray-bg);color:var(--text-muted);font-size:14px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0',
    onmousedown: (e) => e.preventDefault(),
    onclick: () => { input.value = ''; dropdownIdx = -1; dropdown.style.display = 'none'; updateRightAffix(); onChange(''); input.focus(); },
  }, '×');
  const caretBtn = el('button', {
    type: 'button', title: 'Show options', 'aria-label': 'Show options',
    style: 'position:absolute;top:50%;right:8px;transform:translateY(-50%);width:20px;height:20px;background:transparent;color:var(--text-muted);font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0',
    onmousedown: (e) => {
      e.preventDefault();
      if (dropdown.style.display === 'block') dropdown.style.display = 'none';
      else { input.focus(); dropdownIdx = -1; renderDropdown(); }
    },
  }, '▾');
  const updateRightAffix = () => {
    const hasText = !!input.value;
    clearBtn.style.display = hasText ? 'flex' : 'none';
    caretBtn.style.display = hasText ? 'none' : 'flex';
  };
  const dropdown = el('div', {
    style: 'position:absolute;top:100%;left:0;right:0;margin-top:2px;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow-md);max-height:260px;overflow-y:auto;z-index:50;display:none',
  });
  const wrap = el('div', { style: 'position:relative;flex:1;min-width:200px' }, [input, clearBtn, caretBtn, dropdown]);
  updateRightAffix();

  function matches() {
    const q = input.value.trim().toLowerCase();
    if (!q) return items.slice(0, 50);
    const starts = [], contains = [];
    for (const it of items) {
      const ln = (it.label || '').toLowerCase();
      if (ln.startsWith(q)) starts.push(it);
      else if (ln.includes(q)) contains.push(it);
    }
    return [...starts, ...contains].slice(0, 50);
  }
  function highlightItems() {
    [...dropdown.children].forEach((child, j) => {
      child.style.background = j === dropdownIdx ? 'var(--gold-bg)' : '';
    });
  }
  function renderDropdown() {
    const list = matches();
    dropdown.innerHTML = '';
    if (list.length === 0) { dropdown.style.display = 'none'; return; }
    if (dropdownIdx >= list.length) dropdownIdx = list.length - 1;
    list.forEach((it, i) => {
      dropdown.appendChild(el('div', {
        style: 'padding:8px 12px;cursor:pointer;font-size:14px;' + (i === dropdownIdx ? 'background:var(--gold-bg)' : ''),
        onmousedown: (e) => { e.preventDefault(); select(it); },
        onmouseenter: () => { dropdownIdx = i; highlightItems(); },
      }, it.label));
    });
    dropdown.style.display = 'block';
  }
  function select(it) {
    input.value = it.label;
    dropdown.style.display = 'none';
    dropdownIdx = -1;
    updateRightAffix();
    onChange(it.label);
  }
  input.addEventListener('input', () => { dropdownIdx = -1; updateRightAffix(); renderDropdown(); onChange(input.value); });
  input.addEventListener('focus', () => { dropdownIdx = -1; renderDropdown(); });
  input.addEventListener('blur', () => { setTimeout(() => { dropdown.style.display = 'none'; }, 150); });
  input.addEventListener('keydown', (e) => {
    const list = matches();
    if (e.key === 'Tab' && list.length > 0) { e.preventDefault(); select(list[dropdownIdx >= 0 ? dropdownIdx : 0]); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!list.length) return; dropdownIdx = (dropdownIdx + 1) % list.length; highlightItems(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (!list.length) return; dropdownIdx = dropdownIdx <= 0 ? list.length - 1 : dropdownIdx - 1; highlightItems(); }
    else if (e.key === 'Enter') { if (list.length > 0 && dropdownIdx >= 0) { e.preventDefault(); select(list[dropdownIdx]); } }
    else if (e.key === 'Escape') { dropdown.style.display = 'none'; dropdownIdx = -1; }
  });
  return wrap;
}

function contactMatchesQuery(c, qq) {

  return hay.includes(qq);
}

const CONTACT_SORT_KEY = {
  name:        c => (c.full_name || '').toLowerCase(),
  type:        c => c.type || '',
  company:     c => (c.company_name || '').toLowerCase(),
  email:       c => (c.email || '').toLowerCase(),
  owner:       c => (c.owner_email || '').toLowerCase(),
  next_action: c => c.next_action_at || '',
  client_since: c => c.client_since || '',
};

function sortContactRows(rows, sort, dir) {
  const keyFn = CONTACT_SORT_KEY[sort] || CONTACT_SORT_KEY.name;
  const sign = dir === 'desc' ? -1 : 1;
  return rows.slice().sort((a, b) => {
    const av = keyFn(a), bv = keyFn(b);
    // empty values sort last regardless of direction
    const aEmpty = av === '' || av == null, bEmpty = bv === '' || bv == null;
    if (aEmpty && !bEmpty) return 1;
    if (!aEmpty && bEmpty) return -1;
    return av < bv ? -sign : av > bv ? sign : 0;
  });
}

function toggleContactSort(cv, key) {
  if (cv.sort === key) cv.dir = cv.dir === 'asc' ? 'desc' : 'asc';
  else { cv.sort = key; cv.dir = key === 'next_action' ? 'desc' : 'asc'; }
}

function applyContactFilters() {
  const cv = state._contactsView || { search: '', type: '', sort: 'name', dir: 'asc' };
  cv.sort ||= 'name'; cv.dir ||= 'asc';
  const wrap = $('#contacts-table');
  if (!wrap) return;
  wrap.innerHTML = '';
  const qq = (cv.search || '').trim().toLowerCase();
  let rows = cv.type ? state.contacts.filter(c => c.type === cv.type) : state.contacts;
  rows = rows.filter(c => contactMatchesQuery(c, qq));
  rows = sortContactRows(rows, cv.sort, cv.dir);
  wrap.appendChild(buildContactsTable(rows, {
    sort: cv.sort, dir: cv.dir,
    onChange: (key) => { toggleContactSort(cv, key); applyContactFilters(); },
  }));
  const count = $('#contacts-count');
  if (count) count.textContent = `${rows.length} contact${rows.length === 1 ? '' : 's'}`;
}

function applyClientFilters() {
  const cv = state._clientsView || { search: '', sort: 'name', dir: 'asc' };
  cv.sort ||= 'name'; cv.dir ||= 'asc';
  const wrap = $('#clients-table');
  if (!wrap) return;
  wrap.innerHTML = '';
  const qq = (cv.search || '').trim().toLowerCase();
  let rows = state.contacts.filter(c => contactMatchesQuery(c, qq));
  rows = sortContactRows(rows, cv.sort, cv.dir);
  wrap.appendChild(buildContactsTable(rows, {
    sort: cv.sort, dir: cv.dir,
    onChange: (key) => { toggleContactSort(cv, key); applyClientFilters(); },
  }, { showType: false, showClientSince: true }));
  const count = $('#clients-count');
  if (count) count.textContent = `${rows.length} client${rows.length === 1 ? '' : 's'}`;
}

// Shared helpers — also used by the kanban and detail views
const INITIALS_PALETTE = ['#1e3a5f','#4a5d7e','#7a4a0a','#3a6a1a','#8a3a3a','#3a2a8a','#1a6a7a','#6a3a6a','#4a5f2a','#5a3a2a'];
function contactInitials(c) {
  const src = c.full_name || c.company_name || c.email || '?';
  const parts = src.trim().split(/\s+/).slice(0, 2);
  return parts.map(p => p[0]).join('').toUpperCase() || '?';
}
function contactAvatarColor(c) {
  const src = (c.id || c.full_name || c.email || '').toString();
  let h = 0; for (let i = 0; i < src.length; i++) h = (h * 31 + src.charCodeAt(i)) >>> 0;
  return INITIALS_PALETTE[h % INITIALS_PALETTE.length];
}
function avatarEl(c) {
  return el('div', { class: 'avatar', style: 'background:' + contactAvatarColor(c) }, contactInitials(c));
}
// Classify a YYYY-MM-DD date relative to today → CSS class + label.
function dueClassAndLabel(isoDate) {
  if (!isoDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(isoDate);
  if (isNaN(d)) return null;
  d.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  const label = fmt.mdy(isoDate);
  if (diff < 0) return { cls: 'due-overdue', label, rel: `${-diff}d overdue` };
  if (diff === 0) return { cls: 'due-today',  label, rel: 'today' };
  if (diff <= 3)  return { cls: 'due-soon',   label, rel: `in ${diff}d` };
  if (diff <= 14) return { cls: 'due-future', label, rel: `in ${diff}d` };
  return { cls: 'due-future', label };
}
function duePill(isoDate, nextAction) {
  const info = dueClassAndLabel(isoDate);
  if (!info) return el('span', { class: 'muted-cell' }, '—');
  return el('div', { style: 'display:flex;flex-direction:column;gap:3px;min-width:0' }, [
    el('span', { class: 'due-pill ' + info.cls, title: info.rel || '' }, [
      info.label,
      info.rel ? el('span', { style: 'opacity:.7' }, ' · ' + info.rel) : null,
    ]),
    nextAction ? el('span', { style: 'font-size:11.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px' }, nextAction) : null,
  ]);
}

async function buildClientFinancialSummary(clientId) {
  const [matters, invoices, trust] = await Promise.all([
    api('/api/matters?clientId=' + encodeURIComponent(clientId)).catch(() => []),
    api('/api/invoices?clientId=' + encodeURIComponent(clientId)).catch(() => []),
    api('/api/trust?clientId=' + encodeURIComponent(clientId)).catch(() => ({ entries: [], balances: [] })),
  ]);
  const timeByMatter = await Promise.all(matters.map(m =>
    api('/api/time?matterId=' + encodeURIComponent(m.id)).catch(() => [])));
  const allTime = timeByMatter.flat();

  const unbilled  = allTime.filter(t => t.status === 'draft' && t.billable);
  const billedTE  = allTime.filter(t => t.status === 'billed');
  const unbilledMin = unbilled.reduce((s, t) => s + Number(t.minutes || 0), 0);
  const unbilledAmt = unbilled.reduce((s, t) => s + (Number(t.minutes || 0) / 60) * Number(t.rate || 0), 0);
  const billedMin   = billedTE.reduce((s, t) => s + Number(t.minutes || 0), 0);

  const liveInvoices = invoices.filter(i => i.status !== 'void');
  const totalInvoiced = liveInvoices.reduce((s, i) => s + Number(i.total || 0), 0);
  const totalPaid     = liveInvoices.reduce((s, i) => s + Number(i.amount_paid || 0), 0);
  const openInv       = invoices.filter(i => ['draft','sent'].includes(i.status));
  const outstanding   = openInv.reduce((s, i) => s + (Number(i.total || 0) - Number(i.amount_paid || 0)), 0);
  const lastPayment = liveInvoices
    .filter(i => i.status === 'paid')
    .map(i => i.updated_at || i.issued_at)
    .sort()
    .pop();

  const trustEntries = trust.entries || [];
  const trustBalance = trustEntries.reduce((s, e) => s + Number(e.amount || 0), 0);
  const lastDeposit = trustEntries
    .filter(e => e.kind === 'deposit')
    .map(e => e.occurred_at)
    .sort()
    .pop();

  const openMatters   = matters.filter(m => m.status === 'active').length;
  const closedMatters = matters.filter(m => m.status === 'closed').length;

  const stat = (label, value, sub, tone) => el('div', { class: 'stat-card' }, [
    el('div', { class: 'stat-label' }, label),
    el('div', { class: 'stat-value', style: tone ? `color:var(--${tone})` : '' }, value),
    sub ? el('div', { style: 'font-size:11.5px;color:var(--text-muted);margin-top:2px' }, sub) : null,
  ]);

  const trustTone = trustBalance < 0 ? 'red' : trustBalance > 0 ? 'green' : null;
  const arTone = outstanding > 0 ? 'red' : null;

  return el('div', {}, [
    el('h3', { style: 'font-size:13px;font-weight:700;color:var(--navy);margin:0 0 10px' }, 'Financial summary'),
    el('div', { class: 'grid grid-3 mb-12' }, [
      stat('Unbilled WIP', fmt.money(unbilledAmt), fmt.hours(unbilledMin) + ' · ' + unbilled.length + ' entr' + (unbilled.length === 1 ? 'y' : 'ies')),
      stat('Outstanding A/R', fmt.money(outstanding), openInv.length + ' open invoice' + (openInv.length === 1 ? '' : 's'), arTone),
      stat('Trust balance', fmt.money(trustBalance), lastDeposit ? 'Last deposit ' + fmt.date(lastDeposit) : (trustEntries.length ? trustEntries.length + ' entries' : 'no activity'), trustTone),
    ]),
    el('div', { class: 'grid grid-3 mb-16' }, [
      stat('Billed to date', fmt.money(totalInvoiced), liveInvoices.length + ' invoice' + (liveInvoices.length === 1 ? '' : 's')),
      stat('Cash received', fmt.money(totalPaid), lastPayment ? 'Last paid ' + fmt.date(lastPayment) : '—'),
      stat('Billed time', fmt.hours(billedMin), openMatters + ' open matter' + (openMatters === 1 ? '' : 's') + (closedMatters ? ' · ' + closedMatters + ' closed' : '')),
    ]),
    matters.length ? el('div', { class: 'card mb-16' }, [
      el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px' }, [
        el('strong', {}, 'Matters'),
        el('span', { style: 'color:var(--text-muted);font-size:12px' }, matters.length + ' total'),
      ]),
      el('table', { class: 'data' }, [
        el('thead', {}, el('tr', {}, [
          el('th', {}, 'Matter'), el('th', {}, 'Billing'), el('th', {}, 'Opened'), el('th', {}, 'Status'),
        ])),
        el('tbody', {}, matters.map(m => el('tr', {}, [
          el('td', {}, m.name),
          el('td', {}, m.billing_type + (m.billing_type === 'flat' && m.flat_fee ? ' · ' + fmt.money(m.flat_fee) : '')),
          el('td', {}, fmt.date(m.opened_at)),
          el('td', {}, el('span', { class: 'badge badge-status-' + m.status }, m.status)),
        ]))),
      ]),
    ]) : el('div', { class: 'card empty mb-16' }, 'No matters yet.'),
    invoices.length ? el('div', { class: 'card mb-16' }, [
      el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px' }, [
        el('strong', {}, 'Invoice history'),
        el('span', { style: 'color:var(--text-muted);font-size:12px' }, invoices.length + ' total · showing ' + Math.min(invoices.length, 10)),
      ]),
      el('table', { class: 'data' }, [
        el('thead', {}, el('tr', {}, [
          el('th', {}, '#'), el('th', {}, 'Issued'), el('th', {}, 'Due'), el('th', {}, 'Total'), el('th', {}, 'Paid'), el('th', {}, 'Status'),
        ])),
        el('tbody', {}, invoices.slice(0, 10).map(i => el('tr', {}, [
          el('td', {}, i.number || '—'),
          el('td', {}, fmt.date(i.issued_at)),
          el('td', {}, i.due_at ? fmt.date(i.due_at) : '—'),
          el('td', {}, fmt.money(i.total)),
          el('td', {}, fmt.money(i.amount_paid || 0)),
          el('td', {}, el('span', { class: 'badge badge-status-' + i.status }, i.status)),
        ]))),
      ]),
    ]) : null,
    trustEntries.length ? el('div', { class: 'card mb-16' }, [
      el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px' }, [
        el('strong', {}, 'Trust activity (IOLTA)'),
        el('span', { style: 'color:var(--text-muted);font-size:12px' }, trustEntries.length + ' total · showing ' + Math.min(trustEntries.length, 10)),
      ]),
      el('table', { class: 'data' }, [
        el('thead', {}, el('tr', {}, [
          el('th', {}, 'Date'), el('th', {}, 'Kind'), el('th', {}, 'Amount'), el('th', {}, 'Reference'),
        ])),
        el('tbody', {}, trustEntries.slice(0, 10).map(t => el('tr', {}, [
          el('td', {}, fmt.date(t.occurred_at)),
          el('td', {}, t.kind),
          el('td', { style: 'color:' + (Number(t.amount) < 0 ? 'var(--red)' : 'var(--green)') }, fmt.money(t.amount)),
          el('td', {}, t.reference || t.notes || '—'),
        ]))),
      ]),
    ]) : null,
  ]);
}

// Reusable: runs a conflict check and returns a DOM element rendering the results.
// onClear: optional callback fired when all terms came back with zero hits.
function buildConflictResults(data, { onOpenContact } = {}) {
  const wrap = el('div', {});
  const total = data.results.reduce((s, r) => s + r.hits, 0);
  wrap.appendChild(el('div', {
    style: `padding:10px 14px;border-radius:6px;margin-bottom:12px;font-weight:600;font-size:13px;background:${total === 0 ? 'var(--green-bg)' : 'var(--red-bg)'};color:${total === 0 ? 'var(--green)' : 'var(--red)'}`
  }, total === 0 ? '✓ No matches — looks clear' : `⚠ ${total} potential conflict${total === 1 ? '' : 's'} — review carefully`));

  data.results.forEach(r => {
    const section = el('div', { style: 'margin-bottom:16px' }, [
      el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:6px' }, [
        el('strong', { style: 'color:var(--text)' }, `"${r.term}"`),
        document.createTextNode(` — ${r.hits} match${r.hits === 1 ? '' : 'es'}`),
      ]),
    ]);
    if (r.hits === 0) {
      section.appendChild(el('div', { style: 'color:var(--text-light);font-size:12.5px;padding-left:8px' }, 'Clear'));
    }
    r.contacts.forEach(c => section.appendChild(el('div', {
      class: 'cc-result',
      style: 'cursor:pointer',
      onclick: () => onOpenContact ? onOpenContact(c.id) : openContact(c.id),
    }, [
      el('strong', {}, c.full_name || '—'),
      document.createTextNode(' · '),
      el('span', { class: 'badge badge-' + c.type }, c.type),
      c.company_name ? el('div', { style: 'font-size:12px;color:var(--text-muted)' }, c.company_name) : null,
      c.owner_email ? el('div', { style: 'font-size:11.5px;color:var(--text-light)' }, 'Owner: ' + c.owner_email) : null,
    ])));
    r.matters.forEach(m => section.appendChild(el('div', { class: 'cc-result' }, [
      el('strong', {}, m.name),
      document.createTextNode(' (matter)'),
      m.client_name ? el('div', { style: 'font-size:12px;color:var(--text-muted)' }, 'Client: ' + m.client_name + ' · ' + m.status) : null,
    ])));
    wrap.appendChild(section);
  });
  return { wrap, totalHits: total };
}

async function runConflictCheck(query, opts = {}) {
  const q = (query || '').trim();
  if (!q) return { results: [], logId: null };
  const params = new URLSearchParams({ q });
  if (opts.context) params.set('context', opts.context);
  if (opts.relatedContactId) params.set('relatedContactId', opts.relatedContactId);
  if (opts.acknowledged) params.set('acknowledged', '1');
  if (opts.skipLog) params.set('log', '0');
  return await api('/api/conflict-check?' + params.toString());
}

// ─────────────────────────────────────────────────────────────────────────
// NEW CLIENT INTAKE (streamlined two-step flow)
// ─────────────────────────────────────────────────────────────────────────
async function startClientIntake(opts = {}) {
  // Step 1: conflict check. If precheckedData is passed (from the Conflict Check tab), skip the search UI.
  const state = {
    step: opts.precheckedData ? 2 : 1,
    query: opts.precheckedQuery || '',
    conflictData: opts.precheckedData || null,
    acknowledged: false,
    clientData: opts.clientData || {},
  };
  renderIntake();

  function renderIntake() {
    const stepBar = el('div', { class: 'row mb-16', style: 'gap:12px;font-size:12px;color:var(--text-muted)' }, [
      el('div', { style: 'font-weight:' + (state.step === 1 ? '700' : '500') + ';color:' + (state.step === 1 ? 'var(--navy)' : 'var(--text-muted)') }, '1. Conflict check'),
      el('div', {}, '›'),
      el('div', { style: 'font-weight:' + (state.step === 2 ? '700' : '500') + ';color:' + (state.step === 2 ? 'var(--navy)' : 'var(--text-muted)') }, '2. Client details'),
    ]);

    if (state.step === 1) {
      const body = el('div', {}, [
        stepBar,
        el('p', { style: 'color:var(--text-muted);font-size:13px;margin-bottom:12px' },
          'Before creating a new client, check for conflicts. Enter names, companies, and any adverse parties — one per line or comma-separated.'),
        el('textarea', {
          id: 'intake-cc',
          placeholder: 'Acme Corp\nJane Doe (client rep)\nOpposing: Big Law LLP',
          style: 'width:100%;min-height:100px;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13.5px',
          value: state.query,
        }),
        el('div', { id: 'intake-cc-out', style: 'margin-top:12px' }),
      ]);
      const run = async () => {
        const q = body.querySelector('#intake-cc').value.trim();
        if (!q) return toast('Enter names/companies to check', true);
        state.query = q;
        state.conflictData = await runConflictCheck(q, { context: 'client-intake' });
        const out = body.querySelector('#intake-cc-out');
        out.innerHTML = '';
        const { wrap } = buildConflictResults(state.conflictData);
        out.appendChild(wrap);
        if (state.conflictData.logId) {
          out.appendChild(el('div', { style: 'font-size:11.5px;color:var(--text-light);margin-top:6px' }, `Logged as ${state.conflictData.logId}`));
        }
        // Require acknowledgement checkbox before proceeding if there are hits
        const total = state.conflictData.results.reduce((s, r) => s + r.hits, 0);
        if (total > 0) {
          out.appendChild(el('div', { class: 'checkbox-row', style: 'margin-top:8px' }, [
            el('input', { type: 'checkbox', id: 'intake-ack' }),
            el('label', { for: 'intake-ack' }, 'I have reviewed the matches above and there is no disqualifying conflict.'),
          ]));
        }
      };
      const proceed = () => {
        if (!state.conflictData) return toast('Run the conflict check first', true);
        const total = state.conflictData.results.reduce((s, r) => s + r.hits, 0);
        if (total > 0 && !body.querySelector('#intake-ack')?.checked) return toast('Acknowledge conflict review first', true);
        // Pre-populate client name from the first term (heuristic)
        if (!state.clientData.companyName && !state.clientData.fullName) {
          const firstTerm = state.query.split(/[,\n]+/).map(s => s.trim()).filter(Boolean)[0];

    }

    // Step 2: client details (reuses the same fields as openContactForm but trimmed + pre-filled)
    const suggested = state.clientData.suggestedName || '';
    const body = el('div', {}, [
      stepBar,
      el('div', { style: 'padding:8px 12px;background:var(--green-bg);color:var(--green);border-radius:6px;margin-bottom:14px;font-size:12.5px;font-weight:600' },
        '✓ Conflict check complete'),
      el('div', { class: 'form-row' }, [
        el('div', { class: 'field' }, [ el('label', {}, 'First name'), el('input', { name: 'firstName' }) ]),
        el('div', { class: 'field' }, [ el('label', {}, 'Last name'),  el('input', { name: 'lastName' }) ]),
      ]),
      el('div', { class: 'form-row' }, [
        el('div', { class: 'field' }, [ el('label', {}, 'Company (if entity client, put here)'),
          el('input', { name: 'companyName', value: suggested }) ]),
        el('div', { class: 'field' }, [ el('label', {}, 'Email'), el('input', { name: 'email', type: 'email' }) ]),
      ]),
      el('div', { class: 'form-row' }, [
        el('div', { class: 'field' }, [ el('label', {}, 'Phone'), el('input', { name: 'phone' }) ]),
        el('div', { class: 'field' }, [ el('label', {}, 'Default billing increment'),
          el('select', { name: 'billingIncrementMinutes' }, [
            el('option', { value: '' }, 'Firm default (0.1 hr / 6 min)'),
            el('option', { value: '6' },  '0.1 hr (6 min)'),
            el('option', { value: '15' }, '0.25 hr (15 min)'),
          ]) ]),
      ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Tags (comma separated)'), el('input', { name: 'tags' }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Intake notes'),
        el('textarea', { name: 'notes' }, state.query ? `Conflict check run with terms:\n${state.query}\n` : '') ]),
    ]);

    const save = async () => {
      const d = { type: 'client' };
      $$('input, select, textarea', body).forEach(i => { d[i.name] = i.value; });
      d.tags = d.tags ? d.tags.split(',').map(s => s.trim()).filter(Boolean) : [];
      d.billingIncrementMinutes = d.billingIncrementMinutes ? parseInt(d.billingIncrementMinutes, 10) : null;
      if (!d.firstName && !d.lastName && !d.companyName) return toast('Enter at least a name or company', true);
      const created = await api('/api/contacts', { method: 'POST', body: d });
      // Link the intake conflict-check log to this new client for traceability.
      if (state.conflictData?.logId) {
        await api('/api/conflict-checks/' + state.conflictData.logId, {
          method: 'PATCH',
          body: { notes: `Linked to new client: ${created.full_name || created.company_name || created.id}` }
        }).catch(() => {});
      }
      toast('Client created: ' + (created.full_name || created.company_name));
      closeModal();
      // Offer to create a matter immediately
      if (confirm('Create a matter for this client now?')) {
        openMatterForm({ client_contact_id: created.id, client_name: created.full_name });
      } else if (window.state?.currentView === 'contacts') navigate('contacts');

    openModal('New client intake', body, el('div', {}, [
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { state.step = 1; renderIntake(); } }, '← Back'),
      el('div', { class: 'spacer' }),

    ]), true);

function importCsvModal() {
  const body = el('div', {}, [
    el('p', { style: 'color:var(--text-muted);margin-bottom:12px' },

    el('textarea', { id: 'csv-text', style: 'width:100%;min-height:220px;font-family:monospace;font-size:12px;padding:10px;border:1px solid var(--border);border-radius:6px' }),
  ]);
  const doImport = async () => {

    toast(`Imported ${r.inserted} (skipped ${r.skipped})`);
    closeModal();

  openModal('Import contacts from CSV', body, el('div', {}, [

    el('button', { class: 'btn btn-primary btn-sm', onclick: doImport }, 'Import'),
  ]));

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const headers = splitCsvLine(lines[0]);
  return lines.slice(1).map(line => {
    const cells = splitCsvLine(line);
    const o = {};
    headers.forEach((h, i) => { o[h.trim()] = (cells[i] || '').trim(); });
    if (o.tags) o.tags = o.tags.split('|').map(s => s.trim()).filter(Boolean);
    return o;
  });
}
function splitCsvLine(line) {
  const out = []; let cur = ''; let inq = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"' && inq && line[i+1] === '"') { cur += '"'; i++; }
    else if (c === '"') inq = !inq;
    else if (c === ',' && !inq) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

// Parse a vCard text blob into an array of row objects matching the CSV
// importer's shape (firstName, lastName, fullName, email, phone, title,
// companyName, address, linkedin, notes).
function parseVcard(text) {
  if (!text) return [];
  // Strip BOM and unfold continuation lines (lines beginning with space/tab
  // are continuations of the previous logical line per RFC 6350).
  const raw = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const unfolded = raw.replace(/\n[ \t]/g, '');
  const lines = unfolded.split('\n');
  const cards = [];
  let cur = null;
  for (const line of lines) {
    const t = line.trim();
    if (!t) continue;
    if (/^BEGIN:VCARD$/i.test(t)) { cur = []; continue; }
    if (/^END:VCARD$/i.test(t)) {
      if (cur) cards.push(cur);
      cur = null;
      continue;
    }
    if (cur) cur.push(t);
  }

  const unescape = (v) => (v || '')
    .replace(/\\n/gi, '\n').replace(/\\,/g, ',').replace(/\\;/g, ';').replace(/\\\\/g, '\\');

  const decodeQP = (v) => {
    try {
      const bytes = [];
      for (let i = 0; i < v.length; i++) {
        if (v[i] === '=' && /[0-9A-Fa-f]{2}/.test(v.substr(i + 1, 2))) {
          bytes.push(parseInt(v.substr(i + 1, 2), 16));
          i += 2;
        } else {
          bytes.push(v.charCodeAt(i));
        }
      }
      return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
    } catch { return v; }
  };

  const rows = cards.map(props => {
    const row = {};
    const typePrefs = (typeList, wanted) => {
      const lower = typeList.map(t => t.toLowerCase());
      for (const w of wanted) if (lower.includes(w)) return true;
      return false;
    };
    let bestTel = null, bestTelScore = -1;
    let bestEmail = null, bestEmailScore = -1;
    let adr = null;

    for (const prop of props) {
      const colon = prop.indexOf(':');
      if (colon < 0) continue;
      const head = prop.slice(0, colon);
      let value = prop.slice(colon + 1);
      const segments = head.split(';');
      const name = segments[0].toUpperCase();
      const params = {};
      const types = [];
      for (let i = 1; i < segments.length; i++) {
        const seg = segments[i];
        const eq = seg.indexOf('=');
        if (eq < 0) {
          // vCard 2.1 bare param (e.g. TEL;CELL:...)
          types.push(seg);
        } else {
          const k = seg.slice(0, eq).toUpperCase();
          const v = seg.slice(eq + 1);
          params[k] = v;
          if (k === 'TYPE') v.split(',').forEach(s => types.push(s));
        }
      }
      if ((params.ENCODING || '').toUpperCase() === 'QUOTED-PRINTABLE') value = decodeQP(value);
      value = unescape(value);

      switch (name) {
        case 'FN':
          row.fullName = value.trim();
          break;
        case 'N': {
          const parts = value.split(';');
          row.lastName  = (parts[0] || '').trim();
          row.firstName = (parts[1] || '').trim();
          break;
        }
        case 'EMAIL': {
          const score = (typePrefs(types, ['pref']) ? 3 : 0) +
                        (typePrefs(types, ['work']) ? 2 : 0) +
                        (typePrefs(types, ['internet']) ? 1 : 0);
          if (score > bestEmailScore) { bestEmail = value.trim(); bestEmailScore = score; }
          break;
        }
        case 'TEL': {
          const score = (typePrefs(types, ['pref']) ? 4 : 0) +
                        (typePrefs(types, ['cell', 'mobile']) ? 3 : 0) +
                        (typePrefs(types, ['work']) ? 2 : 0) +
                        (typePrefs(types, ['voice']) ? 1 : 0);
          if (score > bestTelScore) { bestTel = value.trim(); bestTelScore = score; }
          break;
        }
        case 'ORG':
          row.companyName = value.split(';')[0].trim();
          break;
        case 'TITLE':
          row.title = value.trim();
          break;
        case 'ADR': {
          // ADR: pobox;ext;street;locality;region;postal;country
          const p = value.split(';').map(s => s.trim());
          const street = [p[1], p[2]].filter(Boolean).join(' ');
          const cityLine = [p[3], p[4]].filter(Boolean).join(', ');
          const line = [street, cityLine, p[5], p[6]].filter(Boolean).join(', ');
          if (line && (!adr || typePrefs(types, ['pref', 'work']))) adr = line;
          break;
        }
        case 'URL':
          if (!row.linkedin || /linkedin\.com/i.test(value)) row.linkedin = value.trim();
          break;
        case 'NOTE':
          row.notes = (row.notes ? row.notes + '\n' : '') + value.trim();
          break;
      }
    }

    if (bestEmail) row.email = bestEmail;
    if (bestTel) row.phone = bestTel;
    if (adr) row.address = adr;
    if (!row.fullName) {
      const combined = [row.firstName, row.lastName].filter(Boolean).join(' ').trim();
      row.fullName = combined || row.companyName || '';
    }
    return row;
  }).filter(r => r.fullName);

  return rows;
}

async function renderPipeline(mount) {
  const stages = state.firm.pipelineStages || [];
  const prospects = await api('/api/contacts?type=prospect');

  const actions = $('#topbar-actions');
  actions.innerHTML = '';
  if (can('editContacts')) {
    actions.appendChild(el('button', { class: 'btn btn-primary btn-sm', onclick: () => openContactForm({ type: 'prospect' }) }, '+ New prospect'));
  }

  // Stable, distinct color per stage for the header dot + card accent
  const stageColors = ['#1e3a5f','#4a5d7e','#7a6119','#3a6a1a','#8a3a3a','#3a2a8a','#1a6a7a','#6a3a6a'];
  const colorFor = (idx) => stageColors[idx % stageColors.length];

  const kanban = el('div', { class: 'kanban' });
  stages.forEach((stage, idx) => {
    const stageColor = colorFor(idx);
    const cards = prospects.filter(p => (p.pipeline_stage || stages[0].id) === stage.id);
    const col = el('div', { class: 'kanban-col', 'data-stage': stage.id,
      ondragover: (e) => { e.preventDefault(); col.classList.add('drag-over'); },
      ondragleave: () => col.classList.remove('drag-over'),
      ondrop: async (e) => {
        e.preventDefault(); col.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        if (!id) return;
        await api('/api/contacts/' + id + '/stage', { method: 'PATCH', body: { stage: stage.id } });
        navigate('pipeline');
      },
    }, [
      el('div', { class: 'kanban-col-header' }, [
        el('div', { class: 'title' }, [
          el('span', { class: 'dot', style: 'background:' + stageColor }),
          stage.label,
        ]),
        el('span', { class: 'count' }, String(cards.length)),
      ]),
      el('div', { class: 'kanban-cards' }, cards.length === 0
        ? [ el('div', { style: 'font-size:11.5px;color:var(--text-muted);padding:12px 6px;text-align:center;font-style:italic' }, 'Drop here') ]
        : cards.map(c => {
          const info = dueClassAndLabel(c.next_action_at);
          const accentCls = info && (info.cls === 'due-overdue' ? 'overdue' : (info.cls === 'due-today' ? 'soon' : ''));
          const tags = c.tags || [];
          const ownerShort = (c.owner_email || '').split('@')[0];
          return el('div', {
            class: 'kanban-card' + (accentCls ? ' ' + accentCls : ''),
            style: accentCls ? '' : 'border-left-color:' + stageColor,
            draggable: 'true',
            ondragstart: (e) => { e.dataTransfer.setData('text/plain', c.id); e.currentTarget.classList.add('dragging'); },
            ondragend: (e) => e.currentTarget.classList.remove('dragging'),
            onclick: () => openContact(c.id),
          }, [
            el('div', { class: 'card-head' }, [
              avatarEl(c),
              el('div', { class: 'name', title: c.full_name || '' }, c.full_name || '—'),
            ]),
            c.company_name ? el('div', { class: 'company', title: c.company_name }, c.company_name) : null,
            (info || ownerShort) ? el('div', { class: 'card-meta' }, [
              info ? el('span', { class: 'due-pill ' + info.cls, title: info.rel || '' }, [
                info.label,
                info.rel ? el('span', { style: 'opacity:.7' }, ' · ' + info.rel) : null,
              ]) : null,
              ownerShort ? el('span', { class: 'chip', title: c.owner_email }, ownerShort) : null,
            ]) : null,
            tags.length ? el('div', { class: 'card-tags' }, [
              ...tags.slice(0, 3).map(t => el('span', { class: 'tag' }, t)),
              tags.length > 3 ? el('span', { class: 'tag-more', title: tags.slice(3).join(', ') }, '+' + (tags.length - 3)) : null,
            ]) : null,
          ]);
        })),
    ]);
    kanban.appendChild(col);
  });

  mount.innerHTML = '';
  mount.appendChild(kanban);
}

  const body = el('div', {}, [

          el('option', { value: t, ...((m.billing_type||'hourly') === t ? { selected: 'selected' } : {}) }, t))) ]),

        el('input', { name: 'flatFee', type: 'number', step: '0.01', value: m.flat_fee || 0 }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Status'),
        el('select', { name: 'status' }, ['active','on-hold','closed'].map(s =>
          el('option', { value: s, ...((m.status||'active') === s ? { selected: 'selected' } : {}) }, s))) ]),
    ]),
    el('div', { class: 'field' }, [
      el('label', {}, 'Billing increment (timer rounding)'),
      el('select', { name: 'billingIncrementMinutes' }, [
        el('option', { value: '', ...(!m.billing_increment_minutes ? { selected: 'selected' } : {}) }, 'Inherit from client or firm default'),
        el('option', { value: '6',  ...(m.billing_increment_minutes === 6  ? { selected: 'selected' } : {}) }, '0.1 hr (6 min)'),

    !isNew && can('manageBilling') ? el('button', { class: 'btn btn-danger btn-sm', onclick: async () => { if (!confirm('Delete matter and all its time entries?')) return; await api('/api/matters/' + m.id, { method: 'DELETE' }); toast('Deleted'); closeModal(); navigate('matters'); } }, 'Delete') : null,
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: save }, 'Save'),
  ]), true);
}

// ─────────────────────────────────────────────────────────────────────────
// TIME TRACKING
// ─────────────────────────────────────────────────────────────────────────
// ── Time view helpers ───────────────────────────────────────────────────
function ymd(d) { return d.toISOString().slice(0, 10); }
function monthBounds(yyyymm) {
  const [y, m] = yyyymm.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1));
  const last  = new Date(Date.UTC(y, m,     0));
  return { from: ymd(first), to: ymd(last), first, last };
}
function shiftMonth(yyyymm, delta) {
  const [y, m] = yyyymm.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1 + delta, 1));
  return d.toISOString().slice(0, 7);
}
function monthLabel(yyyymm) {
  const [y, m] = yyyymm.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString(undefined, { year: 'numeric', month: 'long', timeZone: 'UTC' });
}
function shortMonthLabel(yyyymm) {
  const [y, m] = yyyymm.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString(undefined, { month: 'short', timeZone: 'UTC' });
}
function shiftDay(yyyymmdd, delta) {
  const d = new Date(yyyymmdd + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + delta);
  return d.toISOString().slice(0, 10);
}
function dayLabel(yyyymmdd) {
  const d = new Date(yyyymmdd + 'T00:00:00Z');
  return d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
}
function weekStartSunday(yyyymmdd) {
  const d = new Date(yyyymmdd + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());
  return d.toISOString().slice(0, 10);
}
function userShortName(email) { return email.split('@')[0]; }
const todayYmd = () => new Date().toISOString().slice(0, 10);
const todayYmm = () => new Date().toISOString().slice(0, 7);

async function renderTime(mount) {
  state._timeView ||= { mode: 'entries', month: todayYmm(), day: todayYmd(), userFilter: '' };
  const tv = state._timeView;
  // Migrate stale mode names from older builds
  if (tv.mode === 'daily')    tv.mode = 'day';
  if (tv.mode === 'monthly')  tv.mode = 'month';
  if (tv.mode === 'calendar') tv.mode = 'month'; // Calendar merged into Month View
  if (!tv.day) tv.day = todayYmd();

  const matters = await api('/api/matters?status=active');
  const actions = $('#topbar-actions');
  actions.innerHTML = '';
  actions.appendChild(el('button', { class: 'btn btn-primary btn-sm', onclick: () => openTimeForm(null, matters) }, '+ New time entry'));

  // Determine fetch range per mode
  let from, to;
  if (tv.mode === 'day') {
    const ws = weekStartSunday(tv.day);
    from = ws;
    to   = shiftDay(ws, 6);
  } else if (tv.mode === 'month') {
    // Month View now shows the full calendar grid + a 12-month strip,
    // so we widen to cover the leading/trailing pad days of the grid.
    const cur = monthBounds(tv.month);
    const leading = cur.first.getUTCDay();
    const gridStart = new Date(Date.UTC(cur.first.getUTCFullYear(), cur.first.getUTCMonth(), 1 - leading));
    const totalDays = leading + cur.last.getUTCDate();
    const trailing = (7 - (totalDays % 7)) % 7;
    const gridEnd = new Date(Date.UTC(cur.last.getUTCFullYear(), cur.last.getUTCMonth(), cur.last.getUTCDate() + trailing));
    const year = parseInt(tv.month.split('-')[0], 10);
    // Take whichever range is wider so the year strip can show monthly totals too.
    from = `${year}-01-01` < ymd(gridStart) ? `${year}-01-01` : ymd(gridStart);
    to   = `${year}-12-31` > ymd(gridEnd)   ? `${year}-12-31` : ymd(gridEnd);
  } else {
    const b = monthBounds(tv.month); from = b.from; to = b.to;
  }
  const params = new URLSearchParams({ from, to });
  if (tv.userFilter) params.set('userEmail', tv.userFilter);
  const entries = await api('/api/time?' + params.toString());

  // Mode-specific period nav
  const modeBtn = (id, label) => el('button', {
    class: 'btn btn-sm ' + (tv.mode === id ? 'btn-primary' : 'btn-ghost'),
    onclick: () => { tv.mode = id; navigate('time'); },
  }, label);
  let periodNav;
  if (tv.mode === 'day') {
    periodNav = el('div', { class: 'row', style: 'gap:6px;align-items:center' }, [
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.day = shiftDay(tv.day, -1); navigate('time'); } }, '←'),
      el('input', { type: 'date', value: tv.day,
        style: 'padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:#fff',
        onchange: (e) => { if (e.target.value) { tv.day = e.target.value; navigate('time'); } } }),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.day = shiftDay(tv.day, 1); navigate('time'); } }, '→'),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.day = todayYmd(); navigate('time'); } }, 'Today'),
    ]);
  } else {
    periodNav = el('div', { class: 'row', style: 'gap:6px;align-items:center' }, [
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.month = shiftMonth(tv.month, -1); navigate('time'); } }, '←'),
      el('strong', { style: 'min-width:140px;text-align:center' }, monthLabel(tv.month)),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.month = shiftMonth(tv.month, 1); navigate('time'); } }, '→'),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.month = todayYmm(); navigate('time'); } }, 'Today'),
    ]);
  }

  let userFilterEl = null;
  if (can('manageBilling')) {
    const allUsers = (state._users ||= (await api('/api/seats')).users);
    userFilterEl = el('select', { class: 'field', style: 'width:auto;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:#fff',
      onchange: (e) => { tv.userFilter = e.target.value; navigate('time'); } }, [
      el('option', { value: '' }, 'All users'),
      ...allUsers.map(u => el('option', { value: u.email, ...(tv.userFilter === u.email ? { selected: 'selected' } : {}) }, u.name + ' (' + u.email + ')')),
    ]);
  }

  mount.innerHTML = '';
  mount.appendChild(el('div', { class: 'row mb-16', style: 'gap:8px;flex-wrap:wrap;align-items:center' }, [
    el('div', { class: 'btn-cluster' }, [
      modeBtn('entries', 'Entries'),
      modeBtn('day',     'Day View'),
      modeBtn('month',   'Month View'),
    ]),
    el('div', { class: 'spacer' }),
    userFilterEl,
    periodNav,
  ]));

  if (tv.mode === 'entries')    renderTimeEntries(mount, entries, matters);
  else if (tv.mode === 'day')   renderTimeDay(mount, entries, matters, tv);
  else if (tv.mode === 'month') renderTimeMonth(mount, entries, matters, tv);
}
