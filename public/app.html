// TIME TRACKING
// ─────────────────────────────────────────────────────────────────────────
// ── Time view helpers ───────────────────────────────────────────────────
function ymd(d) { return d.toISOString().slice(0, 10); }
function monthBounds(yyyymm) {
  const [y, m] = yyyymm.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1));
  const last  = new Date(Date.UTC(y, m,     0));
  return { from: ymd(first), to: ymd(last), first, last };
}
function shiftMonth(yyyymm, delta) {
  const [y, m] = yyyymm.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1 + delta, 1));
  return d.toISOString().slice(0, 7);
}
function monthLabel(yyyymm) {
  const [y, m] = yyyymm.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString(undefined, { year: 'numeric', month: 'long', timeZone: 'UTC' });
}
function shortMonthLabel(yyyymm) {
  const [y, m] = yyyymm.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString(undefined, { month: 'short', timeZone: 'UTC' });
}
function shiftDay(yyyymmdd, delta) {
  const d = new Date(yyyymmdd + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + delta);
  return d.toISOString().slice(0, 10);
}
function dayLabel(yyyymmdd) {
  const d = new Date(yyyymmdd + 'T00:00:00Z');
  return d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
}
function weekStartSunday(yyyymmdd) {
  const d = new Date(yyyymmdd + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());
  return d.toISOString().slice(0, 10);
}
function userShortName(email) { return email.split('@')[0]; }
const todayYmd = () => new Date().toISOString().slice(0, 10);
const todayYmm = () => new Date().toISOString().slice(0, 7);

async function renderTime(mount, v) {
  state.viewState.time ||= { mode: 'entries', month: todayYmm(), day: todayYmd(), userFilter: '' };
  const tv = state.viewState.time;
  // Migrate stale mode names from older builds
  if (tv.mode === 'daily')    tv.mode = 'day';
  if (tv.mode === 'monthly')  tv.mode = 'month';
  if (tv.mode === 'calendar') tv.mode = 'month'; // Calendar merged into Month View
  if (!tv.day) tv.day = todayYmd();

  const matters = await api('/api/matters?status=active');
  if (isStaleRender(v)) return;
  const actions = $('#topbar-actions');
  actions.innerHTML = '';
  if (can('logTime')) actions.appendChild(el('button', { class: 'btn btn-sm', onclick: importTimeCsvModal }, 'Import CSV'));
  actions.appendChild(el('button', { class: 'btn btn-primary btn-sm', onclick: () => openTimeForm(null, matters) }, '+ New time entry'));

  // Determine fetch range per mode
  let from, to;
  if (tv.mode === 'day') {
    const ws = weekStartSunday(tv.day);
    from = ws;
    to   = shiftDay(ws, 6);
  } else if (tv.mode === 'month') {
    // Month View now shows the full calendar grid + a 12-month strip,
    // so we widen to cover the leading/trailing pad days of the grid.
    const cur = monthBounds(tv.month);
    const leading = cur.first.getUTCDay();
    const gridStart = new Date(Date.UTC(cur.first.getUTCFullYear(), cur.first.getUTCMonth(), 1 - leading));
    const totalDays = leading + cur.last.getUTCDate();
    const trailing = (7 - (totalDays % 7)) % 7;
    const gridEnd = new Date(Date.UTC(cur.last.getUTCFullYear(), cur.last.getUTCMonth(), cur.last.getUTCDate() + trailing));
    const year = parseInt(tv.month.split('-')[0], 10);
    // Take whichever range is wider so the year strip can show monthly totals too.
    from = `${year}-01-01` < ymd(gridStart) ? `${year}-01-01` : ymd(gridStart);
    to   = `${year}-12-31` > ymd(gridEnd)   ? `${year}-12-31` : ymd(gridEnd);
  } else {
    const b = monthBounds(tv.month); from = b.from; to = b.to;
  }
  const params = new URLSearchParams({ from, to });
  if (tv.userFilter) params.set('userEmail', tv.userFilter);
  const entries = await api('/api/time?' + params.toString());

  // Mode-specific period nav
  const modeBtn = (id, label) => el('button', {
    class: 'btn btn-sm ' + (tv.mode === id ? 'btn-primary' : 'btn-ghost'),
    onclick: () => { tv.mode = id; navigate('time'); },
  }, label);
  let periodNav;
  if (tv.mode === 'day') {
    periodNav = el('div', { class: 'row', style: 'gap:6px;align-items:center' }, [
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.day = shiftDay(tv.day, -1); navigate('time'); } }, '←'),
      el('input', { type: 'date', value: tv.day,
        style: 'padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:#fff',
        onchange: (e) => { if (e.target.value) { tv.day = e.target.value; navigate('time'); } } }),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.day = shiftDay(tv.day, 1); navigate('time'); } }, '→'),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.day = todayYmd(); navigate('time'); } }, 'Today'),
    ]);
  } else {
    periodNav = el('div', { class: 'row', style: 'gap:6px;align-items:center' }, [
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.month = shiftMonth(tv.month, -1); navigate('time'); } }, '←'),
      el('strong', { style: 'min-width:140px;text-align:center' }, monthLabel(tv.month)),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.month = shiftMonth(tv.month, 1); navigate('time'); } }, '→'),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.month = todayYmm(); navigate('time'); } }, 'Today'),
    ]);
  }

  let userFilterEl = null;
  if (can('manageBilling')) {
    const allUsers = (state._users ||= (await api('/api/seats')).users);
    userFilterEl = el('select', { class: 'field', style: 'width:auto;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:#fff',
      onchange: (e) => { tv.userFilter = e.target.value; navigate('time'); } }, [
      el('option', { value: '' }, 'All users'),
      ...allUsers.map(u => el('option', { value: u.email, ...(tv.userFilter === u.email ? { selected: 'selected' } : {}) }, u.name + ' (' + u.email + ')')),
    ]);
  }

  mount.innerHTML = '';
  mount.appendChild(el('div', { class: 'row mb-16', style: 'gap:8px;flex-wrap:wrap;align-items:center' }, [
    el('div', { class: 'btn-cluster' }, [
      modeBtn('entries', 'Entries'),
      modeBtn('day',     'Day View'),
      modeBtn('month',   'Month View'),
    ]),
    el('div', { class: 'spacer' }),
    userFilterEl,
    periodNav,
  ]));

  if (tv.mode === 'entries')    renderTimeEntries(mount, entries, matters);
  else if (tv.mode === 'day')   renderTimeDay(mount, entries, matters, tv);
  else if (tv.mode === 'month') renderTimeMonth(mount, entries, matters, tv);
}

// Stat cards used by every focused view. When the caller knows the billable $
// (computed from the entries' stored rates) and the user can view rates, render
// a fourth card so the time-card "Estimated" line has a corresponding total at
// the view level.
function timeStatCards(minutes, billableMin, count, billableAmt) {
  const showAmt = can('viewRates') && typeof billableAmt === 'number';
  return el('div', { class: showAmt ? 'grid grid-4 mb-16' : 'grid grid-3 mb-16' }, [
    el('div', { class: 'stat-card' }, [ el('div', { class: 'stat-label' }, 'Total hours'), el('div', { class: 'stat-value' }, (minutes/60).toFixed(1)) ]),
    el('div', { class: 'stat-card' }, [ el('div', { class: 'stat-label' }, 'Billable hours'), el('div', { class: 'stat-value' }, (billableMin/60).toFixed(1)) ]),
    showAmt ? el('div', { class: 'stat-card' }, [
      el('div', { class: 'stat-label' }, 'Billable $'),
      el('div', { class: 'stat-value' }, fmt.money(billableAmt)),
      el('div', { class: 'stat-sub' }, 'Hours × stored rate'),
    ]) : null,
    el('div', { class: 'stat-card' }, [ el('div', { class: 'stat-label' }, 'Entries'), el('div', { class: 'stat-value' }, String(count)) ]),
  ]);
}

// ── Entries view (full list for the picked month) ───────────────────────
function renderTimeEntries(mount, entries, matters) {
  const sum = entries.reduce((a, t) => {
    a.min += t.minutes;
    if (t.billable) {
      a.bill += t.minutes;
      a.amt += (t.minutes / 60) * (Number(t.rate) || 0);
    }
    return a;
  }, { min: 0, bill: 0, amt: 0 });
  mount.appendChild(timeStatCards(sum.min, sum.bill, entries.length, sum.amt));
  if (entries.length === 0) {
    mount.appendChild(el('div', { class: 'card', style: 'padding:32px;text-align:center' }, [
      el('div', { style: 'color:var(--text-light);margin-bottom:12px' }, 'No time entries this month.'),
      can('logTime') ? el('button', { class: 'btn btn-primary btn-sm', onclick: () => openTimeForm(null, matters) }, '+ Log time') : null,
    ]));
    return;
  }
  const canTime = can('logTime');

  state.viewState.time ||= {};
  const tv = state.viewState.time;
  tv.entriesSelection ||= new Set();
  // Drop ids that aren't in the freshly-fetched entries set
  const entryIds = entries.map(t => t.id);
  for (const id of [...tv.entriesSelection]) if (!entryIds.includes(id)) tv.entriesSelection.delete(id);

  const toolbarSlot = el('div');
  const tableSlot = el('div');
  mount.appendChild(toolbarSlot);
  mount.appendChild(tableSlot);

  const matterById = new Map(matters.map(m => [m.id, m]));

  const refresh = () => {
    toolbarSlot.innerHTML = '';
    const tb = selectionToolbar({
      count: tv.entriesSelection.size,
      label: 'entry',
      onClear: () => { tv.entriesSelection.clear(); refresh(); },
      onExport: () => {
        const picked = entries.filter(t => tv.entriesSelection.has(t.id));
        const showRates = can('viewRates');
        const headers = ['Date','User','Client','Matter','Hours','Billable',
          ...(showRates ? ['Rate','Amount'] : []),
          'Description','Status'];
        const data = picked.map(t => {
          const m = matterById.get(t.matter_id);
          const hrs = (t.minutes / 60);
          const base = [
            t.date || '', t.user_email || '', m?.client_name || '', m?.name || '',
            hrs.toFixed(2), t.billable ? 'yes' : 'no',
          ];
          if (showRates) base.push(Number(t.rate || 0).toFixed(2), (hrs * (Number(t.rate) || 0)).toFixed(2));
          base.push(t.description || '', t.status || '');
          return base;
        });
        csvDownload('time-entries-' + todayYmd() + '.csv', headers, data);
      },
      onDelete: canTime ? async () => {
        const n = tv.entriesSelection.size;
        if (!confirm('Delete ' + n + ' time entr' + (n === 1 ? 'y' : 'ies') + '? Billed entries will be skipped.')) return;
        const ids = [...tv.entriesSelection];
        const r = await bulkApiDelete('/api/time', ids);
        tv.entriesSelection.clear();
        toast(r.ok + ' deleted' + (r.errors.length ? ' · ' + r.errors.length + ' failed (likely billed)' : ''),
              r.errors.length > 0);
        navigate('time');
      } : null,
    });
    if (tb && can('manageBilling')) {
      const picked = entries.filter(t => tv.entriesSelection.has(t.id));
      const draftBillable = picked.filter(t => t.status === 'draft' && t.billable);
      const matterIds = [...new Set(draftBillable.map(t => t.matter_id))];
      if (matterIds.length === 1) {
        const matter = matterById.get(matterIds[0]);
        const billBtn = el('button', { class: 'btn btn-primary btn-sm', onclick: async () => {
          const mName = matter?.name || 'this matter';
          if (!confirm('Generate an invoice for "' + mName + '"?\n\nAll draft billable time and expenses on this matter will be included.')) return;
          try {
            const r = await api('/api/invoices', { method: 'POST', body: { matterId: matterIds[0], issuedAt: new Date().toISOString().slice(0, 10) } });
            toast('Invoice ' + (r.number || '') + ' created');
            tv.entriesSelection.clear();
            navigate('invoices');
          } catch(e) { toast(e.message || 'Could not generate invoice', true); }
        }}, 'Generate invoice');
        const deleteBtn = tb.querySelector('.btn-danger');
        tb.insertBefore(billBtn, deleteBtn || tb.lastChild);
      }
    }
    if (tb) toolbarSlot.appendChild(tb);

    tableSlot.innerHTML = '';
    tableSlot.appendChild(el('table', { class: 'data' }, [
      el('thead', {}, el('tr', {}, [
        headerSelectCell(entryIds, tv.entriesSelection, refresh),
        el('th', {}, 'Date'), el('th', {}, 'Client'), el('th', {}, 'Matter'),
        el('th', { class: 'num' }, 'Hours'),
        can('viewRates') ? el('th', { class: 'num' }, 'Rate') : null,
        can('viewRates') ? el('th', { class: 'num' }, 'Amount') : null,
        el('th', {}, 'Description'), el('th', {}, 'Status'),
        canTime ? el('th', { style: 'width:36px' }, '') : null,
      ])),
      el('tbody', {}, entries.map(t => {
        const matter = matterById.get(t.matter_id);
        return el('tr', { onclick: t.status === 'draft' ? (e) => {
          if (e.target.closest('[data-row-action]')) return;
          openTimeForm(t, matters);
        } : null }, [
          rowSelectCell(t.id, tv.entriesSelection, refresh),
          el('td', {}, t.date),
          el('td', {}, matter?.client_name || '—'),
          el('td', {}, matter?.name || '—'),
          el('td', { class: 'num' }, (t.minutes/60).toFixed(2)),
          can('viewRates') ? el('td', { class: 'num' }, fmt.money(t.rate || 0)) : null,
          can('viewRates') ? el('td', { class: 'num' }, fmt.money((t.minutes/60) * (t.rate || 0))) : null,
          el('td', {}, t.description || '—'),
          el('td', {}, (t.status === 'billed' && t.invoice_id)
            ? el('span', { style: 'display:flex;align-items:center;gap:6px' }, [
                el('span', { class: 'badge badge-status-billed' }, 'billed'),
                el('button', { style: 'font-size:11px;color:var(--blue);background:none;border:none;padding:0;cursor:pointer', onclick: (e) => { e.stopPropagation(); openInvoiceDetail(t.invoice_id); } }, 'Invoice ↗'),
              ])
            : el('span', { class: 'badge badge-status-' + t.status }, t.status)),
          canTime ? el('td', { style: 'text-align:center', 'data-row-action': 'timer' }, el('button', {
            class: 'row-timer-btn',
            title: 'Start timer for this matter',
            html: TIMER_ICONS.play,
            onclick: (e) => { e.stopPropagation(); startTimerForMatter(t.matter_id, t.description || ''); },
          })) : null,
        ]);
      })),
    ]));
  };

  refresh();
}

// ── Day View — focus on one date with week-strip nav ────────────────────
function fmtHourLabel(h) {
  if (h === 0) return '12 AM';
  if (h === 12) return '12 PM';
  return h < 12 ? `${h} AM` : `${h - 12} PM`;
}

function renderTimeDay(mount, weekEntries, matters, tv) {
  const day = tv.day;
  const dayEntries = weekEntries.filter(t => t.date === day);
  const sum = dayEntries.reduce((a, t) => {
    a.min += t.minutes;
    if (t.billable) {
      a.bill += t.minutes;
      a.amt += (t.minutes / 60) * (Number(t.rate) || 0);
    }
    return a;
  }, { min: 0, bill: 0, amt: 0 });

  // Week strip — 7 cells, each with day label and total hours
  const ws = weekStartSunday(day);
  const dayHeaders = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const minutesByDate = weekEntries.reduce((a, t) => { a[t.date] = (a[t.date] || 0) + t.minutes; return a; }, {});
  const today = todayYmd();
  const stripMax = Math.max(1, ...Object.values(minutesByDate));
  const stripCells = Array.from({ length: 7 }, (_, i) => {
    const d = shiftDay(ws, i);
    const mins = minutesByDate[d] || 0;
    const isSelected = d === day;
    const isToday = d === today;
    const intensity = mins / stripMax;
    const dayNum = parseInt(d.slice(8, 10), 10);
    const monthShort = new Date(d + 'T00:00:00Z').toLocaleDateString(undefined, { month: 'short', timeZone: 'UTC' });
    return el('button', {
      class: 'btn',
      style: `flex:1;min-width:0;padding:8px 4px;border:1px solid ${isSelected ? 'var(--accent,#2563eb)' : 'var(--border)'};border-radius:6px;background:${isSelected ? 'rgba(37,99,235,0.12)' : `rgba(37,99,235,${0.04 + intensity * 0.18})`};cursor:pointer;text-align:center;${isToday ? 'outline:2px dashed var(--accent,#2563eb);outline-offset:-3px;' : ''}`,
      onclick: () => { tv.day = d; navigate('time'); },
    }, [
      el('div', { style: 'font-size:11px;color:var(--text-muted);font-weight:500' }, dayHeaders[i]),
      el('div', { style: `font-size:18px;font-weight:600;color:${isSelected ? 'var(--accent,#2563eb)' : 'var(--text)'}` }, String(dayNum)),
      el('div', { style: 'font-size:10px;color:var(--text-muted)' }, monthShort),
      el('div', { style: 'font-size:11px;font-weight:600;margin-top:3px;color:var(--text)' }, mins ? (mins/60).toFixed(1) + ' hr' : '—'),
    ]);
  });

  mount.appendChild(el('div', { style: 'display:flex;gap:6px;margin-bottom:16px' }, stripCells));
  mount.appendChild(el('h3', { style: 'margin:0 0 12px;font-size:18px' }, dayLabel(day)));
  mount.appendChild(timeStatCards(sum.min, sum.bill, dayEntries.length, sum.amt));

  // Untimed entries (no start_time) — listed above the schedule.
  // Draft rows can be click-edited or dragged onto the schedule to assign a start time.
  const untimed = dayEntries.filter(t => !t.start_time);
  const timed   = dayEntries.filter(t => t.start_time);
  const draggableUntimed = [];  // { row, entry } pairs wired up below, after grid/helpers exist
  if (untimed.length) {
    mount.appendChild(el('div', { class: 'card mb-16' }, [
      el('div', { style: 'font-weight:600;margin-bottom:4px' }, 'Untimed entries'),
      el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:8px' },
        'Drag a row onto the schedule below to assign a start time. Click to edit.'),
      el('table', { class: 'data' }, [
        el('thead', {}, el('tr', {}, [
          el('th', {}, 'Client'),
          el('th', {}, 'Matter'),
          el('th', { class: 'num' }, 'Hours'),
          can('viewRates') ? el('th', { class: 'num' }, 'Amount') : null,
          el('th', {}, 'Description'),
          el('th', {}, 'Status'),
        ])),
        el('tbody', {}, untimed.map(t => {
          const matter = matters.find(m => m.id === t.matter_id);
          const amt = t.billable ? (t.minutes / 60) * (Number(t.rate) || 0) : 0;
          const row = el('tr', {}, [
            el('td', {}, matter?.client_name || '—'),
            el('td', {}, matter?.name || '—'),
            el('td', { class: 'num' }, (t.minutes/60).toFixed(2)),
            can('viewRates') ? el('td', {
              class: 'num',
              style: t.billable && !(Number(t.rate) > 0) ? 'color:var(--red)' : '',
              title: t.billable && !(Number(t.rate) > 0) ? 'No rate stored on this entry — will not bill' : '',
            }, t.billable ? fmt.money(amt) : '—') : null,
            el('td', {}, t.description || '—'),
            el('td', {}, el('span', { class: 'badge badge-status-' + t.status }, t.status)),
          ]);
          row.style.cursor = 'grab';
          row.style.userSelect = 'none';
          draggableUntimed.push({ row, entry: t });
          return row;
        })),
      ]),
    ]));
  }

  // Hourly schedule grid — 6 AM to 10 PM by default
  const HOUR_START = 6, HOUR_END = 22, ROW_HEIGHT = 48, GUTTER = 60;
  const totalHours = HOUR_END - HOUR_START;
  const gridHeight = totalHours * ROW_HEIGHT;

  const grid = el('div', {
    style: `position:relative;height:${gridHeight}px;border:1px solid var(--border);border-radius:6px;background:#fff;overflow:hidden`,
  });

  // Hour labels + visual row borders (no click handlers — click goes to scheduleArea below)
  for (let h = HOUR_START; h < HOUR_END; h++) {
    const top = (h - HOUR_START) * ROW_HEIGHT;
    grid.appendChild(el('div', {
      style: `position:absolute;top:${top}px;left:0;width:${GUTTER}px;height:${ROW_HEIGHT}px;padding:4px 8px;font-size:11px;color:var(--text-muted);border-top:1px solid var(--border);background:var(--gray-bg);box-sizing:border-box;pointer-events:none`,
    }, fmtHourLabel(h)));
    grid.appendChild(el('div', {
      style: `position:absolute;top:${top}px;left:${GUTTER}px;right:0;height:${ROW_HEIGHT}px;border-top:1px solid var(--border);pointer-events:none`,
    }));
  }

  // Half-hour separator lines
  for (let h = HOUR_START; h < HOUR_END; h++) {
    const top = (h - HOUR_START) * ROW_HEIGHT + ROW_HEIGHT / 2;
    grid.appendChild(el('div', {
      style: `position:absolute;top:${top}px;left:${GUTTER}px;right:0;height:0;border-top:1px dashed var(--border);pointer-events:none`,
    }));
  }

  // Click-or-drag snaps to the firm's billing increment (6 or 15 min) so a new
  // entry created here lines up cleanly with how it'll be billed. Existing-block
  // moves still snap to 15 — those just reschedule, not resize.
  const SNAP_MIN = firmDefaultIncMinutes();
  // Click-or-drag area: covers the schedule region (under entry blocks, over hour borders).
  // A plain click opens a SNAP_MIN entry at that time; drag to size a longer block.
  const scheduleArea = el('div', {
    style: `position:absolute;top:0;left:${GUTTER}px;right:0;height:${gridHeight}px;cursor:pointer;z-index:0`,
    title: `Click to add a ${SNAP_MIN}-min entry, or drag to size`,
  });
  grid.appendChild(scheduleArea);

  const minutesToTimeStr = (m) => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
  const yToMinutes = (y) => HOUR_START * 60 + Math.round((y * 60 / ROW_HEIGHT) / SNAP_MIN) * SNAP_MIN;
  const clampMin = (m) => Math.max(HOUR_START * 60, Math.min(HOUR_END * 60, m));

  let dragStart = null;
  let ghostEl = null;
  const removeGhost = () => { if (ghostEl) { ghostEl.remove(); ghostEl = null; } };
  const drawGhost = (startMin, endMin) => {
    removeGhost();
    const top = ((startMin - HOUR_START * 60) / 60) * ROW_HEIGHT;
    const height = Math.max(2, ((endMin - startMin) / 60) * ROW_HEIGHT - 2);
    ghostEl = el('div', {
      style: `position:absolute;top:${top}px;left:calc(${GUTTER}px + 2px);right:2px;height:${height}px;background:rgba(37,99,235,0.22);border:2px dashed var(--accent,#2563eb);border-radius:4px;pointer-events:none;z-index:5;padding:4px 8px;font-size:12px;color:var(--accent,#2563eb);font-weight:600;box-sizing:border-box;overflow:hidden`,
    }, `${minutesToTimeStr(startMin)} – ${minutesToTimeStr(endMin)} · ${((endMin-startMin)/60).toFixed(2)} hr`);
    grid.appendChild(ghostEl);
  };

  // Ghost drag supports both directions: starting point is the mousedown;
  // start/end are derived as min/max of anchor and current cursor.
  const computeRange = (ev) => {
    const rect = scheduleArea.getBoundingClientRect();
    const cur = clampMin(yToMinutes(ev.clientY - rect.top));
    let startMin = Math.min(dragStart, cur);
    let endMin   = Math.max(dragStart, cur);
    if (endMin - startMin < SNAP_MIN) {
      // Single-click or tiny drag: grow one increment downward if possible, else upward
      if (startMin + SNAP_MIN <= HOUR_END * 60) endMin = startMin + SNAP_MIN;
      else startMin = endMin - SNAP_MIN;
    }
    return { startMin, endMin };
  };
  const onMove = (ev) => {
    if (dragStart == null) return;
    const { startMin, endMin } = computeRange(ev);
    drawGhost(startMin, endMin);
  };
  let unregisterCreateDrag = null;
  const endCreateDrag = () => {
    dragStart = null;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    removeGhost();
    if (unregisterCreateDrag) { unregisterCreateDrag(); unregisterCreateDrag = null; }
  };
  const onUp = (ev) => {
    if (dragStart == null) return;
    const { startMin, endMin } = computeRange(ev);
    endCreateDrag();
    openTimeForm(null, matters, {
      date: day,
      startTime: minutesToTimeStr(startMin),
      hours: ((endMin - startMin) / 60).toFixed(2),
    });
  };

  scheduleArea.addEventListener('mousedown', (ev) => {
    if (ev.button !== 0) return;
    ev.preventDefault();
    const rect = scheduleArea.getBoundingClientRect();
    dragStart = clampMin(yToMinutes(ev.clientY - rect.top));
    drawGhost(dragStart, Math.min(dragStart + SNAP_MIN, HOUR_END * 60));
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    // If the user navigates mid-drag, this tears down the doc listeners and ghost.
    unregisterCreateDrag = registerViewCleanup(endCreateDrag);
  });

  // Today's now-line
  const nowDate = new Date();
  if (day === todayYmd()) {
    const nowHour = nowDate.getHours() + nowDate.getMinutes() / 60;
    if (nowHour >= HOUR_START && nowHour < HOUR_END) {
      const nowTop = (nowHour - HOUR_START) * ROW_HEIGHT;
      grid.appendChild(el('div', {
        style: `position:absolute;top:${nowTop}px;left:${GUTTER - 4}px;right:0;height:0;border-top:2px solid #ef4444;pointer-events:none;z-index:2`,
      }));
    }
  }

  // Render timed entries as positioned blocks
  // Color-code per user (deterministic hash to a hue)
  const userHue = (email) => {
    let h = 0; for (const c of email) h = (h * 31 + c.charCodeAt(0)) | 0;
    return Math.abs(h) % 360;
  };
  // Group overlapping entries into columns so they don't fully cover each other
  const sortedTimed = [...timed].sort((a, b) => (a.start_time || '').localeCompare(b.start_time || ''));
  const minutesFromStart = (t) => {
    const [hh, mm] = t.start_time.split(':').map(Number);
    return hh * 60 + mm;
  };
  const minutesEnd = (t) => minutesFromStart(t) + t.minutes;
  // Greedy column assignment
  const blocks = sortedTimed.map(t => ({ t, col: 0, cols: 1 }));
  const active = []; // [{end, col}]
  blocks.forEach(b => {
    const start = minutesFromStart(b.t);
    // free up columns
    for (let i = active.length - 1; i >= 0; i--) if (active[i].end <= start) active.splice(i, 1);
    const usedCols = new Set(active.map(a => a.col));
    let col = 0;
    while (usedCols.has(col)) col++;
    b.col = col;
    active.push({ end: minutesEnd(b.t), col });
  });
  // Compute overall column count for each cluster
  const maxCols = blocks.reduce((m, b) => Math.max(m, b.col + 1), 1);
  blocks.forEach(b => { b.cols = maxCols; });

  blocks.forEach(({ t, col, cols }) => {
    const startMin = minutesFromStart(t);
    const startHour = startMin / 60;
    if (startHour >= HOUR_END) return;
    const top = Math.max(0, (startHour - HOUR_START) * ROW_HEIGHT);
    const visibleMin = Math.min(t.minutes, (HOUR_END * 60) - startMin);
    const height = Math.max(20, (visibleMin / 60) * ROW_HEIGHT - 2);
    const widthPct = 100 / cols;
    const leftPct = col * widthPct;
    const hue = userHue(t.user_email);
    const matter = matters.find(m => m.id === t.matter_id);
    const clientLabel = matter?.client_name || '—';
    const matterLabel = matter?.name || '—';
    const block = el('div', {
      style: `position:absolute;top:${top}px;left:calc(${GUTTER}px + ${leftPct}% + 2px);width:calc(${widthPct}% - 4px);height:${height}px;background:hsl(${hue} 70% 92%);border-left:3px solid hsl(${hue} 60% 50%);border-radius:4px;padding:4px 6px;font-size:11px;cursor:grab;overflow:hidden;box-sizing:border-box;z-index:1;user-select:none`,
      title: `${clientLabel} · ${matterLabel} — ${(t.minutes/60).toFixed(2)} hr — ${t.description || ''}`,
    }, [
      el('div', { style: 'font-weight:600;color:#1a2332' }, `${t.start_time} · ${(t.minutes/60).toFixed(2)} hr`),
      el('div', { style: 'color:#1a2332;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, clientLabel),
      el('div', { style: 'color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, matterLabel),
      height > 64 ? el('div', { style: 'color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, t.description || '') : null,
    ]);

    // Every block is click-and-drag. Mousedown starts a drag; a 4px threshold
    // distinguishes drag from click-to-edit. The server is the source of truth
    // on whether the edit/move is permitted (e.g. billed entries are locked) —
    // on rejection we toast and revert.
    block.addEventListener('mousedown', (ev) => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      ev.stopPropagation();
      const mouseDownY = ev.clientY;
      const origTop = top;
      const blockHeightMin = t.minutes;
      const snapPx = ROW_HEIGHT / 4;
      const maxTop = (HOUR_END - HOUR_START) * ROW_HEIGHT - (blockHeightMin / 60) * ROW_HEIGHT;
      let moved = false;
      block.style.cursor = 'grabbing';
      block.style.zIndex = '10';
      block.style.opacity = '0.85';

      const onDragMove = (e) => {
        const dy = e.clientY - mouseDownY;
        if (Math.abs(dy) > 4) moved = true;
        const snappedDy = Math.round(dy / snapPx) * snapPx;
        const newTop = Math.max(0, Math.min(maxTop, origTop + snappedDy));
        block.style.top = newTop + 'px';
      };
      let unregisterMoveDrag = null;
      const endMoveDrag = () => {
        document.removeEventListener('mousemove', onDragMove);
        document.removeEventListener('mouseup', onDragUp);
        block.style.cursor = 'grab';
        block.style.zIndex = '1';
        block.style.opacity = '1';
        if (unregisterMoveDrag) { unregisterMoveDrag(); unregisterMoveDrag = null; }
      };
      const onDragUp = async () => {
        endMoveDrag();
        if (!moved) {
          openTimeForm(t, matters);
          return;
        }
        const finalTop = parseFloat(block.style.top);
        const newStartMin = Math.round((HOUR_START * 60 + (finalTop / ROW_HEIGHT) * 60) / 15) * 15;
        const newStartTime = minutesToTimeStr(newStartMin);
        if (newStartTime === t.start_time) { block.style.top = origTop + 'px'; return; }
        const scroller = document.querySelector('.content');
        const savedScroll = scroller ? scroller.scrollTop : window.scrollY;
        try {
          await api('/api/time/' + t.id, { method: 'PUT', body: { startTime: newStartTime } });
          toast('Moved to ' + newStartTime);
          await navigate('time');
          if (scroller) scroller.scrollTop = savedScroll;
          else window.scrollTo(0, savedScroll);
        } catch (err) {
          block.style.top = origTop + 'px';
        }
      };
      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', onDragUp);
      unregisterMoveDrag = registerViewCleanup(endMoveDrag);
    });

    grid.appendChild(block);
  });

  mount.appendChild(el('div', { style: 'font-weight:600;margin:8px 0' }, 'Schedule'));
  mount.appendChild(el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:8px' }, 'Click an empty slot to add a time entry (or drag to size). Click a block to edit, or drag it to reschedule.'));
  mount.appendChild(grid);

  // Wire drag-to-schedule on untimed rows now that scheduleArea + helpers exist
  for (const { row, entry } of draggableUntimed) {
    row.addEventListener('mousedown', (ev) => {
      if (ev.button !== 0) return;
      // Let clicks on buttons/links inside the row behave normally
      if (ev.target.closest('button, a, input, select, textarea')) return;
      ev.preventDefault();
      const mouseDownY = ev.clientY;
      let dragging = false;
      const durationMin = entry.minutes;
      const clampStart = (m) => Math.max(HOUR_START * 60, Math.min(HOUR_END * 60 - durationMin, m));
      const onMove = (e) => {
        const dy = e.clientY - mouseDownY;
        if (!dragging && Math.abs(dy) < 4) return;
        dragging = true;
        const rect = scheduleArea.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const xOver = e.clientX >= rect.left && e.clientX <= rect.right;
        if (!xOver || y < 0 || y > gridHeight) { removeGhost(); return; }
        const startMin = clampStart(yToMinutes(y));
        drawGhost(startMin, startMin + durationMin);
      };
      let unregisterUntimedDrag = null;
      const endUntimedDrag = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        removeGhost();
        if (unregisterUntimedDrag) { unregisterUntimedDrag(); unregisterUntimedDrag = null; }
      };
      const onUp = async (e) => {
        endUntimedDrag();
        if (!dragging) {
          // Treat as click → open edit
          openTimeForm(entry, matters);
          return;
        }
        const rect = scheduleArea.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const xOver = e.clientX >= rect.left && e.clientX <= rect.right;
        removeGhost();
        if (!xOver || y < 0 || y > gridHeight) return; // released outside the grid = no-op
        const startMin = clampStart(yToMinutes(y));  // already snapped to SNAP_MIN
        const newStartTime = minutesToTimeStr(startMin);
        const scroller = document.querySelector('.content');
        const savedScroll = scroller ? scroller.scrollTop : window.scrollY;
        try {
          await api('/api/time/' + entry.id, { method: 'PUT', body: { startTime: newStartTime } });
          toast('Scheduled at ' + newStartTime);
          await navigate('time');
          if (scroller) scroller.scrollTop = savedScroll;
          else window.scrollTo(0, savedScroll);
        } catch (err) {
          toast('Could not schedule entry', true);
        }
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      unregisterUntimedDrag = registerViewCleanup(endUntimedDrag);
    });
  }
}

// ── Month View — focus on one month with year-strip nav ─────────────────
function renderTimeMonth(mount, yearEntries, matters, tv) {
  const month = tv.month;
  const year = parseInt(month.split('-')[0], 10);
  const monthEntries = yearEntries.filter(t => t.date.startsWith(month + '-'));
  const sum = monthEntries.reduce((a, t) => {
    a.min += t.minutes;
    if (t.billable) {
      a.bill += t.minutes;
      a.amt += (t.minutes / 60) * (Number(t.rate) || 0);
    }
    return a;
  }, { min: 0, bill: 0, amt: 0 });

  // Year strip — 12 month cells
  const todayMonth = todayYmm();
  const minutesByMonth = yearEntries.reduce((a, t) => { const k = t.date.slice(0, 7); a[k] = (a[k] || 0) + t.minutes; return a; }, {});
  const stripMax = Math.max(1, ...Object.values(minutesByMonth));
  const stripCells = Array.from({ length: 12 }, (_, i) => {
    const m = `${year}-${String(i + 1).padStart(2, '0')}`;
    const mins = minutesByMonth[m] || 0;
    const isSelected = m === month;
    const isCurrent = m === todayMonth;
    const intensity = mins / stripMax;
    return el('button', {
      class: 'btn',
      style: `flex:1;min-width:0;padding:8px 4px;border:1px solid ${isSelected ? 'var(--accent,#2563eb)' : 'var(--border)'};border-radius:6px;background:${isSelected ? 'rgba(37,99,235,0.12)' : `rgba(37,99,235,${0.04 + intensity * 0.18})`};cursor:pointer;text-align:center;${isCurrent ? 'outline:2px dashed var(--accent,#2563eb);outline-offset:-3px;' : ''}`,
      onclick: () => { tv.month = m; navigate('time'); },
    }, [
      el('div', { style: `font-size:13px;font-weight:600;color:${isSelected ? 'var(--accent,#2563eb)' : 'var(--text)'}` }, shortMonthLabel(m)),
      el('div', { style: 'font-size:11px;font-weight:600;margin-top:3px;color:var(--text-muted)' }, mins ? (mins/60).toFixed(1) + ' hr' : '—'),
    ]);
  });

  // Year nav
  const prevYearBtn = el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.month = `${year - 1}-${month.split('-')[1]}`; navigate('time'); } }, '← ' + (year - 1));
  const nextYearBtn = el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { tv.month = `${year + 1}-${month.split('-')[1]}`; navigate('time'); } }, (year + 1) + ' →');
  mount.appendChild(el('div', { class: 'row mb-12', style: 'align-items:center;gap:8px' }, [
    prevYearBtn,
    el('strong', { style: 'font-size:14px' }, String(year)),
    nextYearBtn,
  ]));
  mount.appendChild(el('div', { style: 'display:flex;gap:6px;margin-bottom:16px' }, stripCells));

  mount.appendChild(el('h3', { style: 'margin:0 0 12px;font-size:18px' }, monthLabel(month)));
  mount.appendChild(timeStatCards(sum.min, sum.bill, monthEntries.length, sum.amt));

  if (monthEntries.length === 0) { mount.appendChild(el('div', { class: 'card empty' }, 'No time this month.')); return; }

  // Per-user breakdown for this month
  const byUser = {};
  monthEntries.forEach(t => {
    byUser[t.user_email] ||= { min: 0, bill: 0, amt: 0, count: 0 };
    byUser[t.user_email].min += t.minutes;
    if (t.billable) {
      byUser[t.user_email].bill += t.minutes;
      byUser[t.user_email].amt  += (t.minutes / 60) * (Number(t.rate) || 0);
    }
    byUser[t.user_email].count++;
  });
  const users = Object.entries(byUser).sort((a, b) => b[1].min - a[1].min);
  const showAmt = can('viewRates');
  mount.appendChild(el('div', { class: 'card mb-16' }, [
    el('div', { style: 'font-weight:600;margin-bottom:10px' }, 'By user'),
    el('table', { class: 'data' }, [
      el('thead', {}, el('tr', {}, [
        el('th', {}, 'User'),
        el('th', { class: 'num' }, 'Hours'),
        el('th', { class: 'num' }, 'Billable hrs'),
        showAmt ? el('th', { class: 'num' }, 'Billable $') : null,
        el('th', { class: 'num' }, 'Entries'),
      ])),
      el('tbody', {}, users.map(([email, v]) => el('tr', {}, [
        el('td', {}, userShortName(email)),
        el('td', { class: 'num' }, (v.min/60).toFixed(2)),
        el('td', { class: 'num' }, (v.bill/60).toFixed(2)),
        showAmt ? el('td', { class: 'num' }, fmt.money(v.amt)) : null,
        el('td', { class: 'num' }, String(v.count)),
      ]))),
    ]),
  ]));

  // Full month calendar grid — click any in-month day to drill into Day View
  mount.appendChild(el('div', { style: 'font-weight:600;margin:0 0 10px' }, 'Calendar · click a day to open Day View'));
  renderMonthCalendarGrid(mount, yearEntries, matters, month, tv);
}

function renderMonthCalendarGrid(mount, entries, matters, month, tv) {
  const { first, last } = monthBounds(month);
  const matterById = new Map(matters.map(m => [m.id, m]));
  // Aggregate by date
  const byDate = {};
  entries.forEach(t => {
    byDate[t.date] ||= { minutes: 0, billable: 0, byClient: {}, items: [] };
    byDate[t.date].minutes += t.minutes;
    if (t.billable) byDate[t.date].billable += t.minutes;
    const clientName = matterById.get(t.matter_id)?.client_name || '—';
    byDate[t.date].byClient[clientName] = (byDate[t.date].byClient[clientName] || 0) + t.minutes;
    byDate[t.date].items.push(t);
  });

  // Build the grid: pad with leading days from prev month and trailing days from next month
  // so every cell shows a date number (off-month cells are visually grayed out below).
  const leading = first.getUTCDay(); // 0=Sun
  const daysInMonth = last.getUTCDate();
  const gridStart = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth(), 1 - leading));
  const totalDays = leading + daysInMonth;
  const trailing = (7 - (totalDays % 7)) % 7;
  const gridLen = totalDays + trailing;
  const cells = [];
  for (let i = 0; i < gridLen; i++) {
    const d = new Date(Date.UTC(gridStart.getUTCFullYear(), gridStart.getUTCMonth(), gridStart.getUTCDate() + i));
    const ds = ymd(d);
    const inMonth = d.getUTCFullYear() === first.getUTCFullYear() && d.getUTCMonth() === first.getUTCMonth();
    cells.push({ date: ds, inMonth });
  }

  const todayStr = ymd(new Date());
  const inMonthMins = Object.entries(byDate)
    .filter(([d]) => d >= ymd(first) && d <= ymd(last))
    .map(([, v]) => v.minutes);
  const maxMins = Math.max(1, ...inMonthMins);
  const fmtH = (m) => (m/60).toFixed(1) + ' hr';

  const dayCell = ({ date, inMonth }) => {
    const data = byDate[date];
    const isToday = date === todayStr;
    const intensity = data && inMonth ? data.minutes / maxMins : 0;
    const bg = inMonth
      ? (data ? `rgba(37,99,235,${0.06 + intensity * 0.22})` : '#fff')
      : '#f4f5f7';
    const baseColor = inMonth ? 'var(--text-muted)' : '#b0b4bb';
    const numColor = isToday ? 'var(--accent,#2563eb)' : (inMonth ? 'var(--text)' : '#b0b4bb');
    const dayNum = parseInt(date.slice(8, 10), 10);
    const clientsInCell = data ? Object.entries(data.byClient).sort((a,b) => b[1] - a[1]).slice(0, 3) : [];
    return el('div', {
      style: `border:1px solid var(--border);min-height:88px;padding:6px;cursor:${inMonth ? 'pointer' : 'default'};background:${bg};${isToday ? 'outline:2px solid var(--accent,#2563eb);outline-offset:-2px;' : ''}${inMonth ? '' : 'opacity:0.85;'}`,
      onclick: inMonth ? () => { tv.mode = 'day'; tv.day = date; navigate('time'); } : null,
    }, [
      el('div', { style: 'display:flex;justify-content:space-between;font-size:12px;color:' + baseColor }, [
        el('span', { style: `color:${numColor};${isToday ? 'font-weight:700' : ''}` }, String(dayNum)),
        data && inMonth ? el('strong', { style: 'color:var(--text)' }, fmtH(data.minutes)) : null,
      ]),
      ...(inMonth ? clientsInCell.map(([clientName, mins]) => el('div', {
        style: 'font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px',
      }, `${clientName} · ${(mins/60).toFixed(1)}`)) : []),
      data && inMonth && Object.keys(data.byClient).length > 3
        ? el('div', { style: 'font-size:10px;color:var(--text-muted)' }, `+${Object.keys(data.byClient).length - 3} more`)
        : null,
    ]);
  };

  const dayHeaders = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  mount.appendChild(el('div', { style: 'display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--border);padding:2px;border-radius:6px' }, [
    ...dayHeaders.map(d => el('div', { style: 'background:var(--gray-bg);padding:6px;text-align:center;font-size:12px;font-weight:600;color:var(--text-muted)' }, d)),
    ...cells.map(dayCell),
  ]));
}

// ─────────────────────────────────────────────────────────────────────────
// CLIENT → MATTER PICKER (shared)
// Renders two cascading selects: pick Client, then Matter filtered to that client.
// If the chosen client has zero active matters, shows an inline "Run conflict check
// & open matter" shortcut so the user can unblock themselves without leaving the form.
// Returns an element carrying hidden inputs named `clientId` and `matterId`, plus a
// `refresh(newMatters, preselectMatterId)` method the caller can invoke after a new
// matter is added elsewhere.
// ─────────────────────────────────────────────────────────────────────────
// Single source of truth for "who are our clients?" across time and trust.
// Reduces a matters array to unique clients — skipping matters whose client was
// deleted (client_contact_id is null). Time and Trust both call this to avoid
// list drift.
function clientsFromMattersList(matters) {
  const map = new Map();
  for (const m of matters) {
    if (!m.client_contact_id) continue;
    if (!m.client_name || !m.client_name.trim()) continue;
    if (!map.has(m.client_contact_id)) {
      map.set(m.client_contact_id, { id: m.client_contact_id, name: m.client_name.trim() });
    }
  }
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
}

// Text-input combobox: type to filter, Tab fills the top (or highlighted) match,
// Enter/click selects, Arrow keys navigate, Esc closes. Returns a wrapper div.
function comboInput({ items, initialLabel = '', placeholder = '', name, onSelect }) {
  let filterQ = '';
  let idx = -1;
  const input = el('input', {
    type: 'text',
    name: name || null,
    autocomplete: 'off',
    spellcheck: 'false',
    placeholder,
    value: initialLabel,
    style: 'width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:14px',
  });
  const dropdown = el('div', {
    style: 'position:absolute;top:100%;left:0;right:0;margin-top:2px;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow-md);max-height:220px;overflow-y:auto;z-index:50;display:none',
  });
  const wrap = el('div', { style: 'position:relative' }, [input, dropdown]);

  function matches() {
    const q = filterQ.trim().toLowerCase();
    if (!q) return items.slice(0, 100);
    const starts = [], contains = [];
    for (const it of items) {
      const l = it.label.toLowerCase();
      if (l.startsWith(q)) starts.push(it);
      else if (l.includes(q)) contains.push(it);
    }
    return [...starts, ...contains].slice(0, 100);
  }
  function renderList() {
    const list = matches();
    dropdown.innerHTML = '';
    if (list.length === 0) { dropdown.style.display = 'none'; return; }
    if (idx >= list.length) idx = list.length - 1;
    list.forEach((it, i) => {
      const row = el('div', {
        style: 'padding:8px 12px;cursor:pointer;font-size:14px;' + (i === idx ? 'background:var(--gold-bg)' : ''),
        onmousedown: (e) => { e.preventDefault(); select(it); },
        onmouseenter: () => { idx = i; renderList(); },
      }, it.label);
      dropdown.appendChild(row);
    });
    dropdown.style.display = 'block';
  }
  function select(item) {
    input.value = item.label;
    filterQ = '';
    dropdown.style.display = 'none';
    idx = -1;
    onSelect(item);
  }
  input.addEventListener('input', () => { filterQ = input.value; idx = -1; renderList(); });
  input.addEventListener('focus', () => { filterQ = ''; idx = -1; renderList(); });
  input.addEventListener('blur', () => { setTimeout(() => { dropdown.style.display = 'none'; }, 150); });
  input.addEventListener('keydown', (e) => {
    const list = matches();
    if (e.key === 'Tab' && list.length > 0) { e.preventDefault(); select(list[idx >= 0 ? idx : 0]); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); if (list.length) { idx = (idx + 1) % list.length; renderList(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (list.length) { idx = idx <= 0 ? list.length - 1 : idx - 1; renderList(); } }
    else if (e.key === 'Enter') { if (list.length && idx >= 0) { e.preventDefault(); select(list[idx]); } }
    else if (e.key === 'Escape') { dropdown.style.display = 'none'; idx = -1; }
  });
  return wrap;
}

function clientMatterPicker(initialMatters, opts = {}) {
  const root = el('div', { class: 'client-matter-picker' }, []);
  // Only matters with a real client — keeps this picker's client list identical
  // to the Trust picker (both use clientsFromMattersList).
  let matters = initialMatters.filter(m => m.client_contact_id);
  let clientId = null;
  let matterId = opts.selectedMatterId || null;
  if (matterId) {
    const m = matters.find(x => x.id === matterId);
    if (m) clientId = m.client_contact_id;
  }

  function render() {
    root.innerHTML = '';
    const clients = clientsFromMattersList(matters);
    if (!clientId && clients.length) clientId = clients[0].id;
    const clientMatters = matters
      .filter(m => m.client_contact_id === clientId)
      .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    if (!clientMatters.find(m => m.id === matterId)) matterId = clientMatters[0]?.id || null;

    const clientSelect = el('select', { name: 'clientId' },
      clients.length
        ? clients.map(c => el('option', { value: c.id, ...(c.id === clientId ? { selected: 'selected' } : {}) }, c.name))
        : [el('option', { value: '' }, 'No clients with matters yet')]
    );
    clientSelect.addEventListener('change', (e) => {
      clientId = e.target.value || null;
      matterId = null;
      render();
      if (opts.onChange) opts.onChange({ clientId, matterId });
    });

    const matterSelect = el('select', { name: 'matterId' },
      clientMatters.length
        ? clientMatters.map(m => el('option', { value: m.id, ...(m.id === matterId ? { selected: 'selected' } : {}) }, m.name))
        : [el('option', { value: '' }, '— No matters for this client —')]
    );
    matterSelect.addEventListener('change', (e) => {
      matterId = e.target.value || null;
      if (opts.onChange) opts.onChange({ clientId, matterId });
    });

    root.appendChild(el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Client'), clientSelect ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Matter'), matterSelect ]),
    ]));

    if (clientMatters.length === 0) {
      const client = clients.find(c => c.id === clientId);
      root.appendChild(noMattersBanner(client, (newMatter) => {
        matters = [newMatter, ...matters];
        matterId = newMatter.id;
        clientId = newMatter.client_contact_id || clientId;
        render();
        if (opts.onChange) opts.onChange({ clientId, matterId });
      }));
    }
  }

  root.refresh = (newMatters, preselectMatterId) => {
    matters = newMatters.filter(m => m.client_contact_id);
    if (preselectMatterId) {
      matterId = preselectMatterId;
      const m = matters.find(x => x.id === matterId);
      if (m) clientId = m.client_contact_id;
    }
    render();
  };
  root.getValues = () => ({ clientId, matterId });

  render();
  return root;
}

// Inline banner + flow for "this client has no matters — run a conflict check and open one".
// Stays inside the parent modal so we don't lose the caller's form state.
function noMattersBanner(client, onCreated) {
  const wrap = el('div', { class: 'card', style: 'background:var(--gold-bg);border:1px solid var(--gold);padding:12px;margin-top:8px' }, []);
  const renderCollapsed = () => {
    wrap.innerHTML = '';
    wrap.appendChild(el('div', { style: 'display:flex;align-items:center;gap:12px;flex-wrap:wrap' }, [
      el('div', { style: 'flex:1;min-width:200px;font-size:13px' },
        `No active matters for ${client?.name || 'this client'}. Open one to log time against.`),
      el('button', { class: 'btn btn-primary btn-sm', onclick: renderExpanded }, 'Run conflict check & open matter'),
    ]));
  };
  const renderExpanded = () => {
    wrap.innerHTML = '';
    const conflictOut = el('div', { style: 'margin-top:8px' });
    const ccText = el('textarea', {
      style: 'width:100%;min-height:70px;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px',
      placeholder: 'Names, companies, adverse parties — one per line',
    }, client?.name || '');
    let ccData = null;
    const ackWrap = el('div', { style: 'margin-top:6px' });
    const nameIn = el('input', { placeholder: 'e.g. Formation — Delaware LLC', style: 'width:100%' });
    const billIn = el('select', { style: 'width:100%' }, [
      el('option', { value: 'hourly' }, 'Hourly'),
      el('option', { value: 'flat' },   'Flat fee'),
      el('option', { value: 'contingency' }, 'Contingency'),
    ]);
    const runCheck = async () => {
      const q = ccText.value.trim();
      if (!q) return toast('Enter names/companies to check', true);
      ccData = await runConflictCheck(q, { context: 'time-matter-shortcut' });
      conflictOut.innerHTML = '';
      const { wrap: resultEl } = buildConflictResults(ccData);
      conflictOut.appendChild(resultEl);
      ackWrap.innerHTML = '';
      const total = ccData.results.reduce((s, r) => s + r.hits, 0);
      if (total > 0) {
        ackWrap.appendChild(el('div', { class: 'checkbox-row' }, [
          el('input', { type: 'checkbox', id: 'cm-ack' }),
          el('label', { for: 'cm-ack' }, 'I have reviewed the matches and there is no disqualifying conflict.'),
        ]));
      }
    };
    const createMatter = async () => {
      if (!ccData) return toast('Run the conflict check first', true);
      const total = ccData.results.reduce((s, r) => s + r.hits, 0);
      if (total > 0 && !$('#cm-ack')?.checked) return toast('Acknowledge conflict review first', true);
      if (!nameIn.value.trim()) return toast('Matter name required', true);
      if (!client?.id || client.id === '__none__') return toast('Pick a valid client first', true);
      const created = await api('/api/matters', { method: 'POST', body: {
        clientContactId: client.id, clientName: client.name,
        name: nameIn.value.trim(), billingType: billIn.value,
      }});
      if (ccData.logId) {
        await api('/api/conflict-checks/' + ccData.logId, { method: 'PATCH',
          body: { notes: `Linked to new matter: ${created.name} (${client.name})` } }).catch(() => {});
      }
      toast('Matter opened: ' + created.name);
      onCreated(created);
    };
    wrap.appendChild(el('div', {}, [
      el('div', { style: 'font-weight:600;font-size:13px;margin-bottom:6px' }, 'Conflict check'),
      ccText,
      el('div', { style: 'margin-top:6px' }, el('button', { class: 'btn btn-ghost btn-sm', onclick: runCheck }, 'Run check')),
      conflictOut,
      ackWrap,
      el('div', { style: 'margin-top:12px;display:grid;grid-template-columns:2fr 1fr;gap:8px' }, [
        el('div', { class: 'field' }, [ el('label', {}, 'Matter name'), nameIn ]),
        el('div', { class: 'field' }, [ el('label', {}, 'Billing type'), billIn ]),
      ]),
      el('div', { style: 'margin-top:8px;display:flex;gap:8px' }, [
        el('button', { class: 'btn btn-ghost btn-sm', onclick: renderCollapsed }, 'Cancel'),
        el('button', { class: 'btn btn-primary btn-sm', onclick: createMatter }, 'Create matter'),
      ]),
    ]));
  };
  renderCollapsed();
  return wrap;
}

function openTimeForm(existing, matters, defaults = {}) {
  const isNew = !existing, t = existing || {};
  const hours = t.minutes ? (t.minutes / 60).toFixed(2) : '';
  const timerBox = el('div', { class: 'tf-timer-box' });
  // For new entries, only attach to a timer this form explicitly started — never
  // a pre-existing one for the same matter, so the clock starts at 0:00.
  let createdTimerId = null;
  const picker = clientMatterPicker(matters, {
    selectedMatterId: t.matter_id || defaults.matterId || null,
    onChange: () => { createdTimerId = null; renderTimerBox(); refreshRate(); },
  });
  const descTextarea = el('textarea', { name: 'description', style: 'flex:1;min-height:140px' }, t.description || defaults.description || '');
  // Hours input arrows step by the matter/client/firm billing increment
  // (6 min = 0.1 hr, 15 min = 0.25 hr). The step is updated when the matter
  // changes via refreshRate(), which fetches the resolved increment.
  const initialIncMinutes = t.incrementMinutes || firmDefaultIncMinutes();
  const hoursStepFor = (mins) => (mins === 15 ? '0.25' : '0.1');
  // Live rate preview: shows hours × rate as the user types, and warns when
  // their effective rate is $0 — that's currently a silent failure (the entry
  // saves and shows hours, but contributes $0 to unbilled WIP).
  const hoursInput = el('input', {
    name: 'hours', type: 'number', step: hoursStepFor(initialIncMinutes), min: '0',
    value: hours || defaults.hours || '',
    oninput: () => updateRateLine(),
  });
  const rateLine = el('div', { style: 'font-size:13px;min-height:18px;padding:2px 2px 0;color:var(--text-muted)' });
  let currentRate = null;   // dollars/hr, or null when hidden by viewRates perm
  let hasRate = false;
  let rateFetchSeq = 0;

  function getCurrentMatterId() { return picker.getValues().matterId; }
  function getHoursVal() {
    const v = parseFloat(hoursInput.value || '0');
    return isFinite(v) && v > 0 ? v : 0;
  }
  function updateRateLine() {
    rateLine.innerHTML = '';
    rateLine.style.color = 'var(--text-muted)';
    const mid = getCurrentMatterId();
    if (!mid) return;
    if (currentRate !== null) {
      const h = getHoursVal();
      let txt = 'Rate: ' + fmt.money(currentRate) + '/hr';
      if (h > 0) txt += ' · Estimated: ' + fmt.money(h * currentRate);
      rateLine.textContent = txt;
      if (!hasRate) {
        rateLine.style.color = 'var(--red)';
        rateLine.appendChild(el('span', { style: 'margin-left:8px;font-weight:600' },
          '⚠ rate is $0 — this entry will not bill'));
      }
    } else if (!hasRate) {
      // Non-billing role with rate unset: tell them to flag it without exposing dollar amounts.
      rateLine.style.color = 'var(--red)';
      rateLine.textContent = '⚠ Your billing rate is not set for this matter — ask an admin to configure it so your time bills correctly.';
    }
    // Else (rate hidden by perms AND configured): show nothing.
  }
  async function refreshRate() {
    const mid = getCurrentMatterId();
    if (!mid) {
      currentRate = null; hasRate = false;
      hoursInput.step = hoursStepFor(firmDefaultIncMinutes());
      updateRateLine();
      return;
    }
    const seq = ++rateFetchSeq;
    try {
      const r = await api('/api/me/rate?matterId=' + encodeURIComponent(mid));
      if (seq !== rateFetchSeq) return;  // a newer fetch superseded this one
      currentRate = (typeof r.rate === 'number') ? r.rate : null;
      hasRate = !!r.hasRate;
      if (r.incrementMinutes) hoursInput.step = hoursStepFor(r.incrementMinutes);
      updateRateLine();
    } catch {
      // leave previous values intact on failure — better than wiping a valid display
    }
  }
  // Timer to display in this form. New entries get a fresh 0:00 — adopting an
  // unrelated running timer would make a brand-new card pre-populate elapsed time.
  function matchingTimer() {
    const mid = getCurrentMatterId();
    if (!mid) return null;
    if (isNew) return createdTimerId ? Timer.list.find(x => String(x.id) === String(createdTimerId)) || null : null;
    return Timer.list.find(x => x.matterId === mid) || null;
  }

  function renderTimerBox() {
    timerBox.innerHTML = '';
    if (defaults.fromTimerId) {
      const stoppedTimer = Timer.list.find(x => String(x.id) === String(defaults.fromTimerId));
      const elapsed = stoppedTimer ? stoppedTimer.elapsedSeconds || 0 : 0;
      timerBox.appendChild(el('div', { class: 'tf-timer-empty' },
        elapsed ? `Stopped timer · ${fmtClock(elapsed)} elapsed — hours prefilled, edit if needed.` : 'Stopped timer'));
      return;
    }
    const matterId = getCurrentMatterId();
    const running = matchingTimer();
    if (!matterId) {
      timerBox.appendChild(el('div', { class: 'tf-timer-empty' }, 'Pick a matter to start a timer.'));
      return;
    }
    if (!running) {
      const startBtn = el('button', {
        class: 'tf-timer-main idle',
        title: 'Start timer for this matter',
        onclick: async (e) => {
          e.preventDefault();
          if (isNew) {
            // Force a brand-new timer row — server pauses any others; UI stays at 0:00 → tick.
            const tj = await api('/api/timers', { method: 'POST', body: { matterId, description: descTextarea.value || '' } });
            createdTimerId = tj.id;
            await refreshTimer();
            toast('Timer started');
          } else {
            await startTimerForMatter(matterId, descTextarea.value || '');
          }
          renderTimerBox();
        },
        html: TIMER_ICONS.play,
      });
      timerBox.appendChild(el('div', { class: 'tf-timer-wrap' }, [
        startBtn,
        el('div', { class: 'tf-timer-label' }, [
          el('div', { class: 'tf-timer-time' }, '00:00'),
          el('div', { class: 'tf-timer-sub' }, 'Start timer'),
        ]),
      ]));
    } else {
      const main = el('button', {
        class: 'tf-timer-main ' + (running.running ? 'running' : 'paused'),
        title: running.running ? 'Pause' : 'Resume',
        onclick: async (e) => {
          e.preventDefault();
          if (running.running) await pauseTimer(running.id);
          else await resumeTimer(running.id);
          renderTimerBox();
        },
        html: running.running ? TIMER_ICONS.pause : TIMER_ICONS.play,
      });
      const stopBtn = el('button', {
        class: 'tf-timer-stop',
        title: 'Stop & save',
        onclick: (e) => { e.preventDefault(); openTimerStopModal(running.id); },
        html: TIMER_ICONS.stop,
      });
      timerBox.appendChild(el('div', { class: 'tf-timer-wrap' }, [
        main,
        stopBtn,
        el('div', { class: 'tf-timer-label' }, [
          el('div', { class: 'tf-timer-time' }, fmtClock(running.elapsedSeconds || 0)),
          el('div', { class: 'tf-timer-sub' }, running.running ? 'Running — tap to pause' : 'Paused — tap to resume'),
        ]),
      ]));
    }
  }

  const body = el('div', { style: 'min-height:440px;display:flex;flex-direction:column;gap:4px' }, [
    timerBox,
    el('div', { class: 'form-row' }, [
      el('div', { class: 'field' }, [ el('label', {}, 'Date'), el('input', { name: 'date', type: 'date', value: toDateInput(t.date) || toDateInput(defaults.date) || todayDateInput() }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Start time (optional)'), el('input', { name: 'startTime', type: 'time', step: '900', value: t.start_time || defaults.startTime || '' }) ]),
      el('div', { class: 'field' }, [ el('label', {}, 'Hours'), hoursInput ]),
    ]),
    picker,
    rateLine,
    el('div', { class: 'field', style: 'flex:1;display:flex;flex-direction:column' }, [
      el('label', {}, 'Description'),
      descTextarea,
    ]),
    el('div', { class: 'checkbox-row' }, [
      el('input', { type: 'checkbox', name: 'billable', id: 'billable-cb', ...(t.billable !== 0 ? { checked: 'checked' } : {}) }),
      el('label', { for: 'billable-cb' }, 'Billable'),
    ]),
  ]);
  renderTimerBox();
  refreshRate();

  // Keep the time-card timer visualization in sync with the topbar widget.
  const unsub = onTimerChange(renderTimerBox);

  const save = async () => {
    const d = {};
    $$('input[name=date], input[name=startTime], input[name=hours], textarea[name=description], input[name=billable]', body).forEach(i => {
      d[i.name] = i.type === 'checkbox' ? i.checked : i.value;
    });
    const { matterId } = picker.getValues();
    d.matterId = matterId;
    d.minutes = Math.round(parseFloat(d.hours || 0) * 60);
    delete d.hours;
    if (!d.matterId || !d.minutes) return toast('Matter and hours required', true);
    if (isNew) await api('/api/time', { method: 'POST', body: d });
    else       await api('/api/time/' + t.id, { method: 'PUT', body: d });
    unsub();
    if (defaults.fromTimerId) {
      try { await api('/api/timers/' + defaults.fromTimerId, { method: 'DELETE' }); } catch {}
      removeTimerLocal(defaults.fromTimerId);
      saveTimerCache();
      renderTimerWidget();
      notifyTimerChange();
    }
    toast('Saved'); closeModal(); navigate('time');
  };
  openModal(isNew ? 'New time entry' : 'Edit time entry', body, el('div', {}, [
    !isNew ? el('button', { class: 'btn btn-danger btn-sm', onclick: async () => { if (!confirm('Delete?')) return; await api('/api/time/' + t.id, { method: 'DELETE' }); unsub(); toast('Deleted'); closeModal(); navigate('time'); } }, 'Delete') : null,
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { unsub(); closeModal(); } }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: save }, 'Save'),
  ]));
}

// ─────────────────────────────────────────────────────────────────────────
// TIMER WIDGET (persistent topbar) — multi-timer
// ─────────────────────────────────────────────────────────────────────────
const Timer = { list: [], interval: null, subs: new Set(), fromCache: false };
const TIMER_CACHE_KEY = 'crm_timers_cache_v1';

function timerById(id) { return Timer.list.find(x => String(x.id) === String(id)); }
function notifyTimerChange() { Timer.subs.forEach(fn => { try { fn(); } catch(e) {} }); }
function onTimerChange(fn) { Timer.subs.add(fn); return () => Timer.subs.delete(fn); }

// Snapshot the in-memory timer list to localStorage after every successful
// server interaction. If the server is briefly unreachable on a page reload,
// initTimer() falls back to this cache and advances running clocks by the
// elapsed wall-clock since cachedAt — so a refresh during a deploy doesn't
// "lose" the running timer.
function saveTimerCache() {
  try {
    localStorage.setItem(TIMER_CACHE_KEY, JSON.stringify({
      cachedAt: Date.now(),
      list: Timer.list.map(t => ({ ...t })),
    }));
  } catch(e) { /* quota, private mode, etc. — best effort */ }
}
function loadTimerCache() {
  try {
    const raw = localStorage.getItem(TIMER_CACHE_KEY);
    if (!raw) return null;
    const snap = JSON.parse(raw);
    if (!snap || !Array.isArray(snap.list)) return null;
    const driftSec = Math.max(0, Math.floor((Date.now() - (snap.cachedAt || 0)) / 1000));
    return snap.list.map(t => t.running
      ? { ...t, elapsedSeconds: (t.elapsedSeconds || 0) + driftSec }
      : t);
  } catch(e) { return null; }
}

async function initTimer() {
  Timer.fromCache = false;
  try {
    Timer.list = await api('/api/timers') || [];
    saveTimerCache();
  } catch(e) {
    const cached = loadTimerCache();
    if (cached && cached.length) {
      Timer.list = cached;
      Timer.fromCache = true;
      toast('Showing cached timers — reconnecting…', true);
    } else {
      Timer.list = [];
    }
  }
  renderTimerWidget();
  notifyTimerChange();
  // Tick every 1s to update clocks; refetch from server every 30s for drift correction.
  clearInterval(Timer.interval);
  Timer.interval = setInterval(() => {
    let anyRunning = false;
    for (const t of Timer.list) {
      if (t.running) { t.elapsedSeconds = (t.elapsedSeconds || 0) + 1; anyRunning = true; }
    }
    if (anyRunning) { renderTimerWidget(true); notifyTimerChange(); }
  }, 1000);
  setInterval(refreshTimer, 30000);
}

async function refreshTimer() {
  try {
    Timer.list = await api('/api/timers') || [];
    if (Timer.fromCache) { Timer.fromCache = false; toast('Reconnected'); }
    saveTimerCache();
    renderTimerWidget();
    notifyTimerChange();
  } catch(e) { /* keep showing what we have — next tick will retry */ }
}

function fmtClock(sec) {
  const s = Math.max(0, Math.floor(sec));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
  return `${m}:${String(r).padStart(2,'0')}`;
}

function renderTimerWidget(clockOnly=false) {
  const w = $('#timer-widget');
  if (!w) return;
  if (clockOnly) {
    // Fast path: update each pill's clock text in place.
    w.querySelectorAll('[data-timer-id]').forEach(node => {
      const t = timerById(node.getAttribute('data-timer-id'));
      const clock = node.querySelector('.t-clock');
      if (t && clock) clock.textContent = fmtClock(t.elapsedSeconds || 0);
    });
    return;
  }
  w.innerHTML = '';
  // Always show the "Start timer" chip so users can add another concurrent timer.
  w.appendChild(el('button', { class: 'timer-pill idle', onclick: openTimerStartModal, title: 'Start a new timer' }, [
    el('span', { class: 't-icon', html: TIMER_ICONS.timer }),
    el('span', {}, Timer.list.length ? '+ Timer' : 'Start timer'),
  ]));
  for (const t of Timer.list) w.appendChild(buildTimerPill(t));
}

function buildTimerPill(t) {
  const metaText = (t.clientName ? t.clientName + ' · ' : '') + (t.matterName || '');
  const hasMatter = !!t.matterId;
  return el('div', {
    class: 'timer-pill ' + (t.running ? 'running' : 'paused'),
    'data-timer-id': String(t.id),
  }, [
    el('div', { class: 't-info' }, [
      el('span', { class: 'dot' }),
      el('span', { class: 't-clock' }, fmtClock(t.elapsedSeconds || 0)),
      hasMatter
        ? el('span', { class: 't-meta', title: (t.clientName||'') + ' — ' + (t.matterName||'') }, metaText)
        : el('button', {
            class: 't-meta',
            style: 'background:none;border:none;padding:0;color:var(--gold);cursor:pointer;text-decoration:underline;font:inherit',
            title: 'Assign client & matter',

      t.running

      el('button', { class: 't-btn', title: 'Edit / switch matter', html: TIMER_ICONS.edit, onclick: () => openTimerEditModal(t.id) }),

// Keep old pill-render name for any lingering callers.
const renderTimerPill = renderTimerWidget;

function upsertTimerLocal(tj) {
  if (!tj) return;
  const i = Timer.list.findIndex(x => String(x.id) === String(tj.id));
  if (i >= 0) Timer.list[i] = tj; else Timer.list.unshift(tj);
}
function removeTimerLocal(id) {
  Timer.list = Timer.list.filter(x => String(x.id) !== String(id));
}

async function pauseTimer(id) {
  const tj = await api('/api/timers/' + id + '/pause', { method: 'POST' });
  upsertTimerLocal(tj); saveTimerCache(); renderTimerWidget(); notifyTimerChange();
}
// Resume auto-pauses every other running timer server-side, so refetch the full
// list to reflect the state of every pill.
async function resumeTimer(id) {
  await api('/api/timers/' + id + '/resume', { method: 'POST' });
  await refreshTimer();
}

// Starts a new timer for a matter. If a timer already exists for that matter,
// resumes it (if paused) rather than creating a duplicate. Only one timer runs
// at a time — the server auto-pauses any others — so we refetch the full list.
async function startTimerForMatter(matterId, description) {
  if (!matterId) return toast('No matter on this entry', true);
  const existing = Timer.list.find(x => x.matterId === matterId);
  if (existing) {
    if (!existing.running) {
      await api('/api/timers/' + existing.id + '/resume', { method: 'POST' });
      toast('Timer resumed');
    } else {
      toast('Timer already running for this matter');
    }
    await refreshTimer();
    return existing;
  }
  await api('/api/timers', { method: 'POST', body: { matterId, description: description || '' } });
  toast('Timer started');
  await refreshTimer();
  return Timer.list.find(x => x.matterId === matterId) || null;
}

async function openTimerStartModal() {
  const matters = await api('/api/matters?status=active');
  const picker = matters.length ? clientMatterPicker(matters) : null;
  const descInput = el('input', { name: 'description', placeholder: 'e.g. Reviewing Acme NDA' });
  const body = el('div', {}, [
    el('div', { style: 'font-size:12px;color:var(--text-muted);margin-bottom:10px' },
      'Client and matter are optional — start the clock now and fill them in later.'),
    picker || el('div', { class: 'card', style: 'background:var(--gold-bg);border:1px solid var(--gold);padding:10px;margin-bottom:10px;font-size:13px' },
      'No active matters yet — the timer will start blank. Create a matter and assign it before stopping.'),
    el('div', { class: 'field' }, [ el('label', {}, 'What are you working on? (optional)'), descInput ]),
  ]);
  const start = async () => {
    const matterId = picker ? picker.getValues().matterId : null;
    if (matterId) {
      await startTimerForMatter(matterId, descInput.value);
    } else {
      await api('/api/timers', { method: 'POST', body: { description: descInput.value || '' } });
      toast('Timer started');
      await refreshTimer();
    }
    closeModal();
  };
  openModal('Start timer', body, el('div', {}, [
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: start }, 'Start'),
  ]));
}

async function openTimerEditModal(id) {
  const t = timerById(id);
  if (!t) return;
  const matters = await api('/api/matters?status=active');
  const picker = clientMatterPicker(matters, { selectedMatterId: t.matterId });
  const descInput = el('input', { name: 'description', value: t.description || '' });
  const body = el('div', {}, [
    picker,
    el('div', { class: 'field' }, [ el('label', {}, 'Description'), descInput ]),
  ]);
  const save = async () => {
    const { matterId } = picker.getValues();
    const tj = await api('/api/timers/' + id, { method: 'PATCH', body: { matterId, description: descInput.value } });
    upsertTimerLocal(tj); saveTimerCache();
    toast('Updated'); closeModal(); renderTimerWidget(); notifyTimerChange();
  };
  const discard = async () => {
    if (!confirm('Discard timer without saving?')) return;
    await api('/api/timers/' + id, { method: 'DELETE' });
    removeTimerLocal(id); saveTimerCache();
    toast('Discarded'); closeModal(); renderTimerWidget(); notifyTimerChange();
  };
  openModal('Edit timer', body, el('div', {}, [
    el('button', { class: 'btn btn-danger btn-sm', onclick: discard }, 'Discard'),
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn btn-ghost btn-sm', onclick: closeModal }, 'Cancel'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: save }, 'Save'),
  ]));
}

async function openTimerStopModal(id) {
  const t = timerById(id);
  if (!t) return;

  // Pause immediately so the clock stops while the user fills out the form.
  if (t.running) {
    try {
      const tj = await api('/api/timers/' + id + '/pause', { method: 'POST' });
      upsertTimerLocal(tj); saveTimerCache();
      renderTimerWidget();
    } catch {}
  }

  const tNow = timerById(id) || t;
  const inc = tNow.incrementMinutes || 6;
  const elapsed = tNow.elapsedSeconds || 0;
  const minutesRounded = Math.max(inc, Math.ceil((elapsed / 60) / inc) * inc);
  const hours = (minutesRounded / 60).toFixed(2);

  const matters = await api('/api/matters?status=active');
  if (!matters.length && !tNow.matterId) {
    return toast('Create a matter first, then stop the timer', true);
  }

  openTimeForm(null, matters, {
    matterId:     tNow.matterId || null,
    hours,
    description:  tNow.description || '',
    fromTimerId:  id,
  });
}

        el('td', {}, m?.client_name || '—'),
        el('td', {}, matterCell),
        el('td', {}, cat),
        el('td', {}, e.description || '—'),
        el('td', { class: 'num' }, fmt.money(e.amount)),
        el('td', {}, e.billable ? '✓' : '—'),
        el('td', {}, receiptCell),
        el('td', {}, el('span', { class: 'badge badge-status-' + e.status }, e.status)),
      ]);
    })),
  ]));
}

const RECEIPT_ACCEPT = 'application/pdf,image/jpeg,image/png,image/gif,image/webp,image/heic,image/heif';
const RECEIPT_MAX_BYTES = 10 * 1024 * 1024;

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = String(r.result || '');
      const i = s.indexOf(',');
      resolve(i >= 0 ? s.slice(i + 1) : s);
    };
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

// Resizes / re-encodes a logo image so it fits the invoice layout (max 1200px
// on the long edge) and the server's size cap (~1.5 MB). PNG sources keep
// PNG on the first try to preserve transparency; if that's still too big, we
// fall through to JPEG with a white background (acceptable for an invoice
// header). Files already small enough are passed through untouched. Returns
// { mime, data } where data is base64 (no data: prefix), matching the server's
// /api/firm/logo body shape.
async function compressLogoForUpload(file) {
  const TARGET_BYTES = 1.5 * 1024 * 1024;
  const normalizeMime = (m) => (m === 'image/jpg') ? 'image/jpeg' : m;
  if (file.size <= TARGET_BYTES) {
    return { mime: normalizeMime(file.type), data: await readFileAsBase64(file) };
  }
  const url = URL.createObjectURL(file);
  let img;
  try {
    img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('Could not decode image'));
      i.src = url;
    });
  } finally { URL.revokeObjectURL(url); }

  const sourceIsPng = file.type === 'image/png';
  let maxDim = 1200, quality = 0.92;
  for (let attempt = 0; attempt < 6; attempt++) {
    const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    // PNG keeps transparency only on the first attempt; fall through to JPEG
    // (with a white backdrop) on subsequent attempts since PNG re-encoding
    // rarely shrinks photographic logos.
    const tryPng = sourceIsPng && attempt === 0;
    if (!tryPng) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
    ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(resolve => {
      if (tryPng) canvas.toBlob(resolve, 'image/png');
      else canvas.toBlob(resolve, 'image/jpeg', quality);
    });
    if (blob && blob.size <= TARGET_BYTES) {
      return { mime: tryPng ? 'image/png' : 'image/jpeg', data: await readFileAsBase64(blob) };
    }
    maxDim = Math.max(300, Math.floor(maxDim * 0.8));
    quality = Math.max(0.55, quality - 0.07);
  }
  throw new Error('Could not compress logo to fit — try a smaller image');
}

async function uploadReceipt(expenseId, file) {
  if (file.size > RECEIPT_MAX_BYTES) throw new Error(`${file.name}: file too large (max 10 MB)`);
  const dataBase64 = await readFileAsBase64(file);
  return api(`/api/expenses/${expenseId}/attachments`, {
    method: 'POST',
    body: { filename: file.name, mimeType: file.type || 'application/octet-stream', dataBase64 },
  });
}

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}
