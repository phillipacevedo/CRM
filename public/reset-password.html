<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — CRM</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:linear-gradient(135deg,#0f1f3d,#1a2f55);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;margin:0}
.card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:420px;padding:36px}
h1{color:#0f1f3d;margin-bottom:8px}
p{color:#5a5850;margin-bottom:20px;font-size:14px}
label{display:block;font-size:11px;font-weight:700;color:#5a5850;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
input{width:100%;padding:10px 12px;border:1.5px solid #e2e0d8;border-radius:8px;font-size:14px;outline:none;margin-bottom:16px;box-sizing:border-box}
button{width:100%;padding:11px;background:#0f1f3d;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.err{background:#fce8e8;color:#b83232;padding:10px;border-radius:6px;font-size:13px;margin-bottom:16px;display:none}
.ok{background:#e6f4ec;color:#1a7a4a;padding:10px;border-radius:6px;font-size:13px;margin-bottom:16px;display:none}
.show{display:block}
</style>
</head>
<body>
<div class="card">
  <h1>Reset password</h1>
  <p>Enter a new password for your CRM account.</p>
  <div id="err" class="err"></div>
  <div id="ok"  class="ok"></div>
  <form id="f">
    <label>New password (min 8)</label>
    <input id="pw" type="password" required>
    <button type="submit">Reset password</button>
  </form>
</div>
<script>
const token = new URLSearchParams(location.search).get('token');
if (!token) { document.getElementById('err').textContent = 'Missing token'; document.getElementById('err').classList.add('show'); }
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await fetch('/api/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ token, newPassword: document.getElementById('pw').value }) });
  const d = await r.json();
  if (!r.ok) { document.getElementById('err').textContent = d.error || 'Reset failed'; document.getElementById('err').classList.add('show'); return; }
  document.getElementById('ok').textContent = 'Password updated. Redirecting…'; document.getElementById('ok').classList.add('show');
  setTimeout(() => window.location.href = '/app', 800);
});
</script>
</body>
</html>
